<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Natty · Repas</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/natty-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
.top button{background:none;border:none;display:flex;align-items:center;justify-content:center;color:var(--icon-mut);cursor:pointer;padding:0}
body{overflow-x:hidden}

/* ══ HERO : le plat déborde au-dessus de la carte ══ */
.hero{position:relative;margin-top:88px;background:var(--metal-white);border-radius:var(--r-xl);
  box-shadow:var(--sh-metal-light);padding:96px 20px 20px;overflow:visible}
.hero-dish{position:absolute;top:-104px;left:50%;transform:translateX(-50%);
  z-index:3;line-height:1;font-size:172px;
  filter:drop-shadow(0 22px 26px rgba(16,16,18,.28));animation:floatDish 6s ease-in-out infinite}
/* Photo détourée (PNG transparent) : même débordement que l'emoji */
.hero-dish img{display:block;width:190px;height:190px;object-fit:contain}
/* Repli sans détourage : la photo est cadrée, elle ne déborde plus mais la
   mise en page reste identique. */
.hero-dish.framed img{width:170px;height:170px;object-fit:cover;border-radius:50%;
  border:5px solid var(--bg);box-shadow:0 14px 30px rgba(16,16,18,.22)}
.hero-dish.framed{filter:none}
@keyframes floatDish{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
.leaf{position:absolute;z-index:5;font-size:32px;filter:drop-shadow(0 8px 10px rgba(16,16,18,.2));
  animation:floatLeaf 5.4s ease-in-out infinite}
.leaf.l1{top:-44px;left:-10px;transform:rotate(-24deg)}
.leaf.l2{top:56px;right:-14px;transform:rotate(18deg);animation-delay:.6s}
.leaf.l3{top:-6px;right:34px;font-size:23px;transform:rotate(-8deg);animation-delay:.3s}
@keyframes floatLeaf{0%,100%{translate:0 0}50%{translate:0 -8px}}

.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-title{font-size:23px;font-weight:900;line-height:1.14;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-time{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  color:var(--muted);white-space:nowrap;margin-top:3px}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px}
.hero-macros{display:flex;gap:8px;margin-top:14px}
.hero-macros .mp{flex:1;background:var(--card);border-radius:16px;padding:9px 0;
  text-align:center;font-weight:800;font-size:13px;box-shadow:var(--nm-in)}
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:12px}
.hero-kcal{flex-shrink:0}
.hero-kcal .k{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hero-kcal .v{font-size:21px;font-weight:900;margin-top:2px;white-space:nowrap}
.hero-act{display:flex;align-items:center;gap:8px;flex-shrink:0}
.heart-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:none;
  box-shadow:var(--nm-so),var(--nm-bright);font-size:17px;cursor:pointer;flex-shrink:0}
.cta{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;
  border-radius:26px;padding:11px 7px 11px 16px;font-family:inherit;font-weight:800;
  font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:4px 6px 14px rgba(20,20,22,.28)}
.cta:active{transform:scale(.97)}
.cta .plus{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}

/* ══ Ma semaine : carte noire métallisée ══ */
.week-panel{background:var(--metal-black);border-radius:var(--r-lg);box-shadow:var(--sh-metal);
  padding:18px 16px 16px;margin-top:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px}
.sec-head .sec-title{margin:0;color:#fff}
.sec-note{font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.45)}
.week-row{display:flex;gap:9px}
.week-card{flex:1;position:relative;background:rgba(255,255,255,0.06);border-radius:18px;
  padding:32px 5px 11px;text-align:center;overflow:visible;cursor:pointer;transition:transform .18s ease}
.week-card.on{transform:translateY(-3px)}
.week-dish{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:46px;line-height:1;
  filter:drop-shadow(0 9px 11px rgba(0,0,0,.4))}
.week-dish img{display:block;width:54px;height:54px;object-fit:cover;border-radius:50%;border:3px solid #1c1d21}
.week-name{font-size:9.5px;font-weight:800;line-height:1.25;min-height:23px;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.week-kcal{font-size:8.5px;font-weight:600;color:rgba(255,255,255,0.45);margin-top:5px}
.week-check{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;font-size:9px;display:none;align-items:center;
  justify-content:center;font-weight:800}
.week-card.on .week-check{display:flex}

/* ══ Panneaux ingrédients / préparation ══ */
.panel{background:var(--metal-white);border-radius:var(--r-lg);box-shadow:var(--sh-metal-light);padding:18px;margin-top:16px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.panel-title{font-size:15.5px;font-weight:900}
.panel-title span{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:6px}
.panel-link{font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}
.ingr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ingr{position:relative;background:var(--card);border-radius:15px;padding:12px 4px 9px;
  text-align:center;cursor:pointer;transition:opacity .18s ease;box-shadow:var(--nm-in)}
.ingr .em{font-size:25px;line-height:1}
.ingr .nm{font-size:8.5px;font-weight:700;line-height:1.2;margin-top:6px}
.ingr .qt{font-size:8px;color:var(--muted);margin-top:2px}
.ingr .tick{position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;font-size:9px;display:flex;align-items:center;
  justify-content:center;font-weight:800}
.ingr.off{opacity:.4}
.ingr.off .tick{background:#d3d3d8}
/* ══ Découvrir ══ */
.discover-row{display:flex;gap:12px}
.discover-card{flex:1;background:var(--metal-white);box-shadow:var(--sh-metal-light);border-radius:var(--r-lg);
  padding:18px 10px 22px;text-align:center;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:14px}
.discover-card .em{font-size:34px}
.discover-card .t{font-weight:700;font-size:11.5px;line-height:1.25}

.toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,14px);background:var(--ink);
  color:#fff;border-radius:18px;padding:12px 20px;font-size:12.5px;font-weight:700;opacity:0;
  transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:600;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 0}

/* ══ Garde-manger : ce que l'utilisateur a chez lui ══ */
/* Le plat du hero déborde de 104 px vers le haut : on lui laisse la place. */
#gmWrap .panel{margin-bottom:26px}
.gm-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.gm-act{background:var(--card);border:none;border-radius:15px;padding:11px 2px 9px;font-family:inherit;
  font-size:9.5px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:6px;box-shadow:var(--nm-in);line-height:1.15;text-align:center}
.gm-act:active{transform:scale(.96)}
.gm-act .em{font-size:20px}
.gm-saisie{display:none;gap:8px;margin-bottom:13px}
.gm-saisie.on{display:flex}
.gm-saisie input{flex:1;min-width:0;background:var(--bg);border:1px solid #e3e3e8;border-radius:14px;
  padding:11px 13px;font-family:inherit;font-size:13px;color:var(--ink)}
.gm-saisie button{background:var(--ink);color:#fff;border:none;border-radius:14px;padding:0 16px;
  font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.gm-etat{display:none;font-size:12.5px;color:var(--muted);text-align:center;padding:8px 0 12px}
.gm-etat.on{display:block}
.gm-etat .sp{display:inline-block;width:14px;height:14px;border:2px solid #dcdce2;border-top-color:var(--ink);
  border-radius:50%;animation:gmSpin .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes gmSpin{to{transform:rotate(360deg)}}
.gm-vide{font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center;padding:2px 4px 4px}
.gm-gen{width:100%;margin-top:14px;background:var(--ink);color:#fff;border:none;border-radius:var(--r-full);
  padding:14px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;
  box-shadow:4px 6px 14px rgba(20,20,22,.28)}
.gm-gen:disabled{opacity:.3;box-shadow:none;cursor:default}
.gm-note{font-size:10.5px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.4}
/* Croix de retrait sur une pastille du garde-manger */
.ingr .del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--bg);
  border:none;color:var(--muted);font-size:9px;line-height:1;cursor:pointer;box-shadow:var(--nm-soft);
  display:flex;align-items:center;justify-content:center;padding:0}
/* Ingrédient de recette absent du garde-manger : à acheter */
.ingr.buy .tick{background:var(--amber)}

/* Réglage du nombre de repas voulus pour la semaine. Masqué tant que la page
   n'a pas confirmé qu'elle affiche bien la semaine (et non un repas précis
   ouvert via ?id=). */
.nbbar{display:none;align-items:center;justify-content:space-between;margin:4px 0 18px}
.nbbar-lbl{font-size:14px;font-weight:600;color:var(--muted)}
.nbbar-ctl{display:flex;align-items:center;gap:6px;background:var(--card);
  border-radius:var(--r-full);padding:4px}
.nbbar-ctl button{width:32px;height:32px;border:none;border-radius:50%;
  background:#fff;color:var(--ink);font-size:19px;font-weight:600;line-height:1;
  cursor:pointer;box-shadow:var(--nm-soft)}
.nbbar-ctl button:active{transform:scale(.94)}
.nbbar-ctl button:disabled{opacity:.35;cursor:default;box-shadow:none}
.nbbar-ctl span{min-width:24px;text-align:center;font-size:16px;font-weight:700}
</style>
</head>
<body>

<div class="top">
  <button id="backBtn" aria-label="Retour">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a href="profil.html" aria-label="Profil">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</div>

<!-- Le réglage 1-7 a disparu : la génération hebdomadaire produit 2 recettes. Le compteur reste affiché, en lecture seule. -->
<div class="wrap">
  <div class="nbbar" id="nbbar">
    <span class="nbbar-lbl">Repas de la semaine</span>
    <div class="nbbar-ctl"><span id="nbVal">2</span></div>
  </div>
</div>

<div class="wrap" id="gmWrap"></div>

<div class="wrap" id="content">
  <div class="empty">Chargement…</div>
</div>

<!-- Déclenchés depuis les boutons du garde-manger : le .click() reste dans le
     geste utilisateur, sinon iOS refuse d'ouvrir la caméra. -->
<input type="file" id="gmCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gmGal" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<script src="/assets/core.js"></script>
<script src="/assets/reco.js"></script>
<script src="/assets/garde-manger.js"></script>
<script src="/assets/minijeux.js"></script>
<!-- Suivre une recette retire ses ingrédients du garde-manger (voir brancher()). -->
<script>
/* ═══ État ═══ */
var PLATS = [];        // plats affichés (recommandations, ou repas ciblé par ?id=)
var actif = 0;         // index du plat au hero
var suivies = {};      // recettes que l'utilisateur a choisi de suivre
var ingrOff = {};      // ingrédients décochés du plat courant

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

/* ═══ Normalisation ═══
   Deux origines possibles pour un plat :
   - une recette recommandée par NattyReco   {nom, pourquoi, temps_min, macros, ingredients, steps}
   - un repas réel de la table meals         {name, photo_url, meal_ingredients}
   On les ramène à une forme unique pour que le rendu n'ait qu'un seul cas. */

var EMOJIS = ['🍛','🐟','🍲','🥗','🍝','🍜'];
// Les recettes conseillées par NattyReco n'ont pas de vraie photo (pas encore
// photographiées). En attendant, on fait tourner quelques photos de plats
// réelles et détourées plutôt que de retomber sur un simple emoji.
var DEMO_PHOTOS = [
  { hero:'/assets/img/plat-demo1-hero.png', week:'/assets/img/plat-demo1-week.png' },
  { hero:'/assets/img/plat-demo2-hero.png', week:'/assets/img/plat-demo2-week.png' }
];

function depuisRecette(r, i){
  var m = r.macros || {};
  return {
    nom: r.nom || 'Recette',
    desc: r.pourquoi || '',
    temps: r.temps_min ? r.temps_min + ' min' : '',
    kcal: Math.round(m.kcal || 0),
    p: Math.round(m.p || 0), g: Math.round(m.g || 0), l: Math.round(m.l || 0),
    emoji: EMOJIS[i % EMOJIS.length],
    photo: DEMO_PHOTOS[i % DEMO_PHOTOS.length].hero,
    photoWeek: DEMO_PHOTOS[i % DEMO_PHOTOS.length].week,
    ingr: (r.ingredients || []).map(function(x){ return { em:x.em||'🥄', nm:x.nom||'', qt:x.qte||'' }; }),
    steps: (r.steps || []).map(function(s){ return { em:s.em||'👉', t:s.t||'', tip:s.tip||'' }; })
  };
}

function depuisRepas(meal){
  var mac = Natty.calcMac(meal.meal_ingredients);
  return {
    nom: meal.name || 'Repas',
    desc: '',
    temps: '',
    kcal: mac.c || 0, p: mac.p || 0, g: mac.g || 0, l: mac.l || 0,
    emoji: '🍽️',
    photo: meal.photo_url || null,
    ingr: (meal.meal_ingredients || []).map(function(x){
      return { em:'🥄', nm:x.name||'', qt:x.quantity_g ? x.quantity_g+' g' : '' };
    }),
    steps: []
  };
}

/* ═══ Rendu ═══ */

// Une photo n'est utilisable en débordement que si elle est détourée (PNG
// transparent). Sinon on la cadre : la mise en page tient toujours.
function estDetouree(url){ return /\.png($|\?)/i.test(url || ''); }

function heroVisuel(d){
  if (d.photo){
    var framed = estDetouree(d.photo) ? '' : ' framed';
    return '<div class="hero-dish'+framed+'"><img src="'+esc(d.photo)+'" alt=""></div>';
  }
  return '<div class="hero-dish">'+d.emoji+'</div>';
}

function render(){
  var d = PLATS[actif];
  if (!d){
    document.getElementById('content').innerHTML =
      '<div class="empty">Aucune recette à afficher pour le moment.</div>' + blocDecouvrir();
    brancherDecouvrir();
    return;
  }

  var suivie = !!suivies[actif];
  var html = ''
    + '<div class="hero">'
      + heroVisuel(d)
      + '<span class="leaf l1">🌿</span><span class="leaf l2">🌿</span><span class="leaf l3">🌶️</span>'
      + '<div class="hero-head">'
        + '<div class="hero-title">'+esc(d.nom)+'</div>'
        + (d.temps ? '<div class="hero-time">🕐 '+esc(d.temps)+'</div>' : '')
      + '</div>'
      + (d.desc ? '<div class="hero-desc">'+esc(d.desc)+'</div>' : '')
      + '<div class="hero-macros">'
        + '<div class="mp">🥩 '+(d.p||'–')+'g</div>'
        + '<div class="mp">🌾 '+(d.g||'–')+'g</div>'
        + '<div class="mp">🥑 '+(d.l||'–')+'g</div>'
      + '</div>'
      + '<div class="hero-foot">'
        + '<div class="hero-kcal"><div class="k">Total</div><div class="v">'+(d.kcal||'–')+' Kcal</div></div>'
        + '<div class="hero-act">'
          + '<button class="heart-btn" id="heartBtn">🤍</button>'
          + '<button class="cta" id="ctaBtn">'+(suivie?'Recette suivie':'Suivre cette recette')+' <span class="plus">'+(suivie?'✓':'+')+'</span></button>'
        + '</div>'
      + '</div>'
    + '</div>';

  if (PLATS.length > 1){
    html += '<div class="week-panel">'
         +  '<div class="sec-head"><span class="sec-title">Ma semaine</span>'
         +  '<span class="sec-note">'+PLATS.length+' recettes conseillées</span></div>'
         +  '<div class="week-row">' + PLATS.map(function(x,i){
              var weekImg = x.photoWeek || x.photo;
              var vis = weekImg ? '<img src="'+esc(weekImg)+'" alt="">' : x.emoji;
              return '<div class="week-card'+(i===actif?' on':'')+'" data-i="'+i+'">'
                + '<div class="week-check">✓</div>'
                + '<div class="week-dish">'+vis+'</div>'
                + '<div class="week-name">'+esc(x.nom)+'</div>'
                + '<div class="week-kcal">'+(x.kcal||'–')+' kcal</div>'
                + '</div>';
            }).join('') + '</div>'
         +  '</div>';
  }

  if (d.ingr.length){
    var actifs = d.ingr.length - Object.keys(ingrOff).length;
    // Quand le garde-manger est rempli, on distingue ce qu'il faut acheter.
    // Le test est fait ici plutôt qu'en se fiant au champ "dispo" renvoyé par
    // l'IA : la liste a pu changer depuis la génération.
    var gmOn = typeof NattyGardeManger !== 'undefined' && NattyGardeManger.nbItems() > 0;
    var manque = d.ingr.map(function(x){ return gmOn && !NattyGardeManger.contient(x.nm); });
    var nbAchat = manque.filter(Boolean).length;
    html += '<div class="panel">'
      + '<div class="panel-head"><div class="panel-title">Ingrédients <span>('+actifs+'/'+d.ingr.length
      + (nbAchat ? ' · '+nbAchat+' à acheter' : '')+')</span></div>'
      + '<div class="panel-link" id="ingrEdit">Modifier</div></div>'
      + '<div class="ingr-grid">' + d.ingr.map(function(x,i){
          return '<div class="ingr'+(ingrOff[i]?' off':'')+(manque[i]?' buy':'')+'" data-i="'+i+'">'
            + '<div class="tick">'+(manque[i]?'+':'✓')+'</div><div class="em">'+x.em+'</div>'
            + '<div class="nm">'+esc(x.nm)+'</div>'
            + (x.qt ? '<div class="qt">'+esc(x.qt)+'</div>' : '')
            + '</div>';
        }).join('') + '</div></div>';
  }

  html += blocDecouvrir();
  document.getElementById('content').innerHTML = html;
  brancher();
}

function blocDecouvrir(){
  return '<div class="sec-title">Découvrir</div>'
    + '<div class="discover-row">'
      + '<div class="discover-card" data-jeu="monde"><div class="t">Recettes du Monde</div><div class="em">🌍</div></div>'
      + '<div class="discover-card" data-jeu="potager"><div class="t">Ingrédients</div><div class="em">🌱</div></div>'
      + '<div class="discover-card" data-jeu="aleatoire"><div class="t">Aléatoire</div><div class="em">🎲</div></div>'
    + '</div>';
}

function brancherDecouvrir(){
  document.querySelectorAll('.discover-card').forEach(function(c){
    c.addEventListener('click', function(){ NattyMiniJeux.ouvrir(c.dataset.jeu); });
  });
}

// Une recette choisie à la fin d'un mini-jeu remonte ici : elle prend la
// tête de la liste et s'affiche dans le hero.
window.NattyOnRecetteSuivie = async function(r){
  if (!r) return;
  var d = depuisRecette(r, PLATS.length);
  PLATS.unshift(d);
  actif = 0; ingrOff = {};
  suivies = {}; suivies[0] = true;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
  // Suivie depuis un mini-jeu : même geste, donc même consommation
  // du garde-manger que par le bouton du hero.
  var retires = [];
  if (window.NattyGardeManger) {
    try {
      await NattyGardeManger.charger();
      retires = await NattyGardeManger.consommer(d.ingr);
    } catch (e) {}
  }
  toast(retires.length
    ? '✓ ' + d.nom + ' — ' + retires.length + (retires.length > 1 ? ' ingrédients retirés' : ' ingrédient retiré') + ' du garde-manger'
    : '✓ ' + d.nom + ' — recette suivie');
};

function brancher(){
  var cta = document.getElementById('ctaBtn');
  if (cta) cta.addEventListener('click', async function(){
    var passeEnSuivie = !suivies[actif];
    var d = PLATS[actif];
    suivies[actif] = passeEnSuivie;
    render();
    if (!passeEnSuivie) { toast('Recette retirée'); return; }

    /* Suivre une recette consomme ses ingrédients : ils sortent du
       garde-manger, sinon les recommandations suivantes repartiraient
       d'un stock déjà cuisiné. charger() est idempotent, on ne paie la
       lecture que si l'utilisateur suit vraiment une recette.
       Le garde-manger n'est jamais bloquant : si le module manque ou
       échoue, la recette est suivie quand même. */
    var retires = [];
    if (window.NattyGardeManger) {
      try {
        await NattyGardeManger.charger();
        retires = await NattyGardeManger.consommer(d.ingr);
      } catch (e) {}
    }
    toast(retires.length
      ? '✓ ' + d.nom + ' — ' + retires.length + (retires.length > 1 ? ' ingrédients retirés' : ' ingrédient retiré') + ' du garde-manger'
      : '✓ ' + d.nom + ' — recette suivie');
  });

  var heart = document.getElementById('heartBtn');
  if (heart) heart.addEventListener('click', function(){
    var on = this.textContent.trim() === '❤️';
    this.textContent = on ? '🤍' : '❤️';
    toast(on ? 'Retiré des favoris' : '❤️ Ajouté aux favoris');
  });

  document.querySelectorAll('.week-card').forEach(function(el){
    el.addEventListener('click', function(){
      actif = +el.dataset.i; ingrOff = {}; render();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });

  document.querySelectorAll('.ingr').forEach(function(el){
    el.addEventListener('click', function(){
      var i = +el.dataset.i;
      if (ingrOff[i]) delete ingrOff[i]; else ingrOff[i] = 1;
      render();
    });
  });

  var edit = document.getElementById('ingrEdit');
  if (edit) edit.addEventListener('click', function(){ toast('Touche un ingrédient pour le retirer'); });

  brancherDecouvrir();
}

/* ═══ Garde-manger ═══
   Ce que l'utilisateur a chez lui, rempli par scan (courses, ticket,
   photo) ou saisie. C'est la base de la génération de recettes : le
   prompt de NattyReco reçoit cette liste (voir assets/reco.js). */

var gmType = 'courses';   // type du scan en cours, pour le prompt

function gmEtat(msg, spin){
  var e = document.getElementById('gmEtat');
  if (!e) return;
  e.classList.toggle('on', !!msg);
  e.innerHTML = msg ? ((spin ? '<span class="sp"></span>' : '') + esc(msg)) : '';
}

function rendreGardeManger(){
  var w = document.getElementById('gmWrap');
  if (!w) return;
  var items = NattyGardeManger.liste();

  var corps = items.length
    ? '<div class="ingr-grid">' + items.map(function(x, i){
        return '<div class="ingr" data-gmi="' + i + '">'
          + '<button class="del" data-gmdel="' + i + '" aria-label="Retirer">✕</button>'
          + '<div class="em">' + esc(x.em || '🥄') + '</div>'
          + '<div class="nm">' + esc(x.nom) + '</div>'
          + (x.qt || x.qte ? '<div class="qt">' + esc(x.qte || x.qt) + '</div>' : '')
          + '</div>';
      }).join('') + '</div>'
    : '<div class="gm-vide">Scanne tes courses ou ton ticket de caisse : tes recettes de la semaine partiront de ce que tu as déjà.</div>';

  w.innerHTML = '<div class="panel">'
    + '<div class="panel-head">'
      + '<div class="panel-title">Mon garde-manger <span>(' + items.length + ')</span></div>'
      + (items.length ? '<div class="panel-link" id="gmVider">Tout vider</div>' : '')
    + '</div>'
    + '<div class="gm-acts">'
      + '<button class="gm-act" data-gm="courses"><span class="em">🛒</span>Mes courses</button>'
      + '<button class="gm-act" data-gm="ticket"><span class="em">🧾</span>Ticket</button>'
      + '<button class="gm-act" data-gm="galerie"><span class="em">🖼️</span>Une photo</button>'
      + '<button class="gm-act" data-gm="saisie"><span class="em">✏️</span>Saisir</button>'
    + '</div>'
    + '<div class="gm-saisie" id="gmSaisie">'
      + '<input id="gmInput" type="text" placeholder="poulet, riz 500 g, brocoli…" autocomplete="off">'
      + '<button id="gmAdd">Ajouter</button>'
    + '</div>'
    + '<div class="gm-etat" id="gmEtat"></div>'
    + corps
    + '<button class="gm-gen" id="gmGen"' + (items.length ? '' : ' disabled') + '>'
      + 'Générer mes repas avec ces ingrédients</button>'
    + (NattyGardeManger.estSynchronise() ? ''
        : '<div class="gm-note">Liste gardée sur cet appareil uniquement.</div>')
    + '</div>';

  brancherGardeManger();
}

function brancherGardeManger(){
  document.querySelectorAll('.gm-act').forEach(function(b){
    b.addEventListener('click', function(){
      var mode = b.dataset.gm;
      if (mode === 'saisie'){
        var z = document.getElementById('gmSaisie');
        z.classList.toggle('on');
        if (z.classList.contains('on')) document.getElementById('gmInput').focus();
        return;
      }
      if (mode === 'galerie'){ gmType = 'auto'; document.getElementById('gmGal').click(); return; }
      gmType = mode;                                   // 'courses' | 'ticket'
      document.getElementById('gmCam').click();        // appel synchrone : ouvre la caméra
    });
  });

  var add = document.getElementById('gmAdd');
  if (add) add.addEventListener('click', gmAjoutSaisie);
  var inp = document.getElementById('gmInput');
  if (inp) inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') gmAjoutSaisie(); });

  document.querySelectorAll('[data-gmdel]').forEach(function(b){
    b.addEventListener('click', async function(){
      await NattyGardeManger.retirer(+b.dataset.gmdel);
      rendreGardeManger();
    });
  });

  var vider = document.getElementById('gmVider');
  if (vider) vider.addEventListener('click', async function(){
    await NattyGardeManger.vider();
    rendreGardeManger();
    toast('Garde-manger vidé');
  });

  var gen = document.getElementById('gmGen');
  if (gen) gen.addEventListener('click', gmGenerer);
}

async function gmAjoutSaisie(){
  var inp = document.getElementById('gmInput');
  var trouves = NattyGardeManger.depuisTexte(inp.value);
  if (!trouves.length){ toast('Rien à ajouter'); return; }
  await NattyGardeManger.ajouter(trouves);
  rendreGardeManger();
  toast(trouves.length + (trouves.length > 1 ? ' ingrédients ajoutés' : ' ingrédient ajouté'));
}

async function gmScan(file){
  gmEtat(gmType === 'ticket' ? 'Lecture du ticket…' : 'Lecture de la photo…', true);
  try{
    var trouves = await NattyGardeManger.scanner(file, gmType);
    if (!trouves.length){
      gmEtat('Aucun aliment reconnu. Reprends la photo, ou saisis-les à la main.');
      return;
    }
    await NattyGardeManger.ajouter(trouves);
    rendreGardeManger();
    toast(trouves.length + (trouves.length > 1 ? ' ingrédients ajoutés' : ' ingrédient ajouté'));
  }catch(e){
    gmEtat('Lecture impossible. Réessaie, ou saisis les ingrédients à la main.');
  }
}

/* Régénère la semaine en partant du garde-manger. Le contenu du prompt est
   assemblé par NattyReco : ici on ne fait que déclencher et réafficher. */
/* Une seule génération pour toute la semaine, et elle a lieu dans Suivi, en
   même temps que les conseils (un unique appel Claude produit les deux).
   Ces deux boutons n'appellent donc plus l'IA : ils y conduisent. Le
   garde-manger n'est pas perdu au passage — NattyReco.chargerProfil() le
   relit, donc le stock alimente bien le prompt de la génération. */
function versGenerationHebdo(){
  var q = (typeof Natty !== 'undefined' && Natty.qs) ? Natty.qs() : '';
  location.href = 'suivi.html' + q + (q ? '&' : '?') + 'gen=1';
}
async function gmGenerer(){ versGenerationHebdo(); }

async function genererMaintenant(){ versGenerationHebdo(); }

(async function(){
  if (!Natty.requireAuth()) return;

  // Le garde-manger s'affiche avant les recettes : c'est lui qui les alimente,
  // et il reste visible même quand la semaine est vide ou en cours de génération.
  await NattyGardeManger.charger();
  rendreGardeManger();
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');

  try{
    // ?id= : on affiche ce repas précis (comportement historique conservé).
    if (id){
      var raw = await Natty.sbFetch('meals?id=eq.'+id+'&select=*');
      if (raw && raw.length){
        var meal = raw[0];
        meal.meal_ingredients = await Natty.sbFetch('meal_ingredients?meal_id=eq.'+meal.id+'&select=*');
        PLATS = [depuisRepas(meal)];
        render();
        return;
      }
    }

    await NattyReco.chargerNbRepas();   // préférence partagée entre appareils
    var barre = document.getElementById('nbbar');
    if (barre) barre.style.display = 'flex';
    afficherNb(NattyReco.nbRepas());

    SEMAINE = await NattyReco.recettesDeLaSemaine(NattyReco.NB_MAX);
    rendreSemaine();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">Impossible de charger les recettes.</div>';
  }
})();
</script>

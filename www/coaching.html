<style>

.rdv-hero{display:block;position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:3/4;margin-top:8px;background:#101014;cursor:pointer}
.rdv-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.rdv-hero .badge{position:absolute;top:16px;right:16px;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:13px;letter-spacing:.3px;padding:9px 16px;border-radius:999px;z-index:2;white-space:nowrap}
.rdv-hero .ttl{position:absolute;left:20px;right:20px;bottom:26px;color:#fff;font-weight:900;font-size:27px;line-height:1.15;letter-spacing:-.3px;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.35);z-index:2}

.cal-card{background:var(--card);border-radius:var(--r-lg);padding:14px 16px 8px;margin-top:16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-arrow{width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:15px}
.cal-title{font-weight:700;font-size:13px;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);margin-top:10px}
.cal-col{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:10px}
.cal-dname{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-dnum{font-size:13px;font-weight:700;color:var(--ink);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-col.today .cal-dnum{background:var(--ink);color:var(--on-ink)}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--ink);margin-top:1px}
.cal-dot.empty{visibility:hidden}

.msg-list{display:flex;flex-direction:column;gap:10px}
.msg-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer}
.msg-av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.msg-body{flex:1;min-width:0}
.msg-from{font-weight:700;font-size:13px}
.msg-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.msg-time{font-size:11px;color:var(--muted);flex:none}

/* Conseils de la semaine — l'illustration porte le message, une phrase suffit */
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adv-card{background:var(--card);border-radius:var(--r-lg);padding:18px 14px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.adv-card.wide{grid-column:1 / -1}
.adv-em{font-size:40px;line-height:1}
.adv-card.wide .adv-em{font-size:46px}
.adv-title{font-weight:800;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.adv-line{font-size:13.5px;font-weight:700;line-height:1.35;color:var(--ink)}
.adv-week{font-size:11px;color:var(--muted);margin:-4px 0 12px}

/* Liste de courses — déduite des repas de la semaine, pas générée à part :
   elle reste ainsi toujours cohérente avec ce qu'affiche repas.html. */
.crs-note{font-size:11px;color:var(--muted);margin:-4px 0 12px}

/* Aliments à privilégier — une rangée qui défile, pas une grille : ils sont 12
   à 18 selon la génération, et empilés ils repousseraient la liste de courses
   (le seul contenu de cet écran qu'on vient vraiment chercher) hors de vue. */
.alim-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px;margin:0 -20px;
  padding-left:20px;padding-right:20px;-webkit-overflow-scrolling:touch}
.alim-row::-webkit-scrollbar{display:none}
.alim-chip{flex:none;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);
  border-radius:16px;padding:10px 13px;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .22s cubic-bezier(.22,1,.36,1),border-color .22s,transform .22s}
.alim-chip:active{transform:scale(.97)}
.alim-chip .ac-em{font-size:21px;line-height:1;flex:none}
.alim-chip .ac-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.alim-chip .ac-nom{font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.alim-chip .ac-ap{font-size:10px;color:var(--muted);white-space:nowrap}
.alim-chip .ac-plus{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-left:2px}
/* Ajouté : la pastille se remplit d'encre. C'est le seul état à distinguer —
   « dans mes courses » ou pas. */
.alim-chip.on{background:var(--ink);border-color:var(--ink)}
.alim-chip.on .ac-nom{color:var(--on-ink)}
.alim-chip.on .ac-ap{color:var(--on-ink);opacity:.62}
.alim-chip.on .ac-plus{background:rgba(127,127,140,.28);color:var(--on-ink)}
</style>

<!-- Le journal des séances : le panneau ci-dessus, et le plein écran
     (calendrier + saisie) qu'il ouvre. C'est aussi lui que le bilan du soir
     interroge pour rendre le muscle et la graisse exacts. -->
<script src="/assets/seance.js"></script>
<!-- ⚠️ Le garde-manger doit être chargé PARTOUT où une génération peut être
     lancée. `assets/generation.js` demande « on part de ton garde-manger ? »
     derrière un `if (window.NattyGardeManger)` : sans le module, la question
     est silencieusement sautée, et l'option n'existait donc que depuis
     l'écran Repas — le seul qui le chargeait. -->
<!-- Le matériel de cuisine : la question posée une seule fois, avant la
     première génération. Chargé partout où generation.js l'est — c'est lui
     qui pose la question, depuis n'importe lequel de ces écrans. -->
<script src="/assets/materiel.js"></script>
<script src="/assets/garde-manger.js"></script>
<!-- Cet écran ne génère rien : il lit. Le module est chargé pour deux raisons —
     reprendre l'écran d'attente si une génération est en cours ailleurs, et
     proposer de la lancer quand la semaine est encore vide. -->
<script src="/assets/generation.js"></script>
<script>
var weekOffset = 0;

function getWeekStart(off){
  var d = new Date(), day = d.getDay();
  d.setDate(d.getDate() - day + (day===0?-6:1) + off*7);
  d.setHours(0,0,0,0);
  return d;
}

async function loadRdv(){
  var rdvs = [];
  try{ rdvs = await Natty.sbFetch('rdv?user_id=eq.'+Natty.USER_ID+'&order=date_rdv.asc&select=*'); }catch(e){}
  var now = new Date();
  var upcoming = rdvs.filter(function(r){ return r.statut==='confirme' && new Date(r.date_rdv) >= now; });
  var next = upcoming[0];
  var labels = {onboarding:'Rendez-vous onboarding', suivi:'Rendez-vous de suivi'};
  if (next){
    var d = new Date(next.date_rdv);
    // ⚠️ Les abréviations françaises portent leurs accents : « fevr. » et « aout »
    //    se lisent comme des fautes de frappe, pas comme des abréviations.
    var MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    document.getElementById('rdvBadge').textContent = d.getDate()+' '+MOIS[d.getMonth()]+' '+(next.heure||'');
    document.getElementById('rdvTitle').textContent = labels[next.type_rdv] || 'Consultation';
  } else {
    document.getElementById('rdvBadge').textContent = 'À programmer';
    document.getElementById('rdvTitle').textContent = 'Rendez-vous onboarding';
  }
  renderWeek(rdvs);
}

function renderWeek(rdvs){
  var lu = getWeekStart(weekOffset), di = new Date(lu); di.setDate(lu.getDate()+6);
  // ⚠️ PAS de coupe à trois lettres : « 10 aou - 16 aou 2026 » se lit comme un bug
  //    d'affichage. Les abréviations françaises usuelles ont un point, et les mois
  //    courts s'écrivent en entier.
  var MC=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  document.getElementById('wkTitle').textContent = lu.getDate()+' '+MC[lu.getMonth()]+' - '+di.getDate()+' '+MC[di.getMonth()]+' '+di.getFullYear();
  var today = new Date(); today.setHours(0,0,0,0);
  var jN = ['Lu','Ma','Me','Je','Ve','Sa','Di'], html = '';
  for (var i=0;i<7;i++){
    var j = new Date(lu); j.setDate(lu.getDate()+i);
    var isToday = j.getTime()===today.getTime();
    var ds = j.getFullYear()+'-'+String(j.getMonth()+1).padStart(2,'0')+'-'+String(j.getDate()).padStart(2,'0');
    var hasRdv = (rdvs||[]).some(function(r){ return r.date_rdv && r.date_rdv.indexOf(ds)===0 && r.statut==='confirme'; });
    html += '<div class="cal-col'+(isToday?' today':'')+'">'
      + '<div class="cal-dname">'+jN[i]+'</div>'
      + '<div class="cal-dnum">'+j.getDate()+'</div>'
      + '<div class="cal-dot'+(hasRdv?'':' empty')+'"></div>'
      + '</div>';
  }
  document.getElementById('calGrid').innerHTML = html;
}

async function loadMessages(){
  var list = document.getElementById('msgList');
  var msgs = [];
  try{ msgs = await Natty.sbFetch('messages?user_id=eq.'+Natty.USER_ID+'&order=created_at.desc&limit=8'); }catch(e){}
  if (!msgs.length){
    list.innerHTML = '<div class="empty">Pas encore de messages. Appuyez pour démarrer la conversation.</div>';
    list.addEventListener('click', function(){ Natty.goto('chat.html'); });
    list.style.cursor = 'pointer';
    return;
  }
  list.innerHTML = msgs.map(function(m){
    var d = new Date(m.created_at);
    var time = d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
    var from = m.expediteur === 'client' ? 'Vous' : 'Votre nutritionniste';
    var txt = (m.contenu||'').replace(/</g,'&lt;');
    return '<div class="msg-card">'
      + '<div class="msg-av">'+(m.expediteur==='client'?'🙂':'🧑‍⚕️')+'</div>'
      + '<div class="msg-body"><div class="msg-from">'+from+'</div><div class="msg-prev">'+txt+'</div></div>'
      + '<div class="msg-time">'+time+'</div>'
      + '</div>';
  }).join('');
  list.querySelectorAll('.msg-card').forEach(function(el){
    el.addEventListener('click', function(){ Natty.goto('chat.html'); });
  });
}

// Conseils hebdo — mêmes colonnes que profil_conseils utilisées par suivi.html.
// NB : contrairement à ce qu'indiquait ce commentaire, liste_courses_json et
// recettes_json existent bien en base (vérifié). On ne les sélectionne
// simplement pas ici, faute d'usage sur cet écran.
var ADV_FIELDS = [
  { k:'conseil_points_forts', em:'⭐', t:'Points forts', wide:true },
  { k:'conseil_amelioration', em:'🎯', t:'À améliorer',  wide:true },
  { k:'conseil_prot',         em:'🥩', t:'Protéines' },
  { k:'conseil_gluc',         em:'🌾', t:'Glucides' },
  { k:'conseil_lip',          em:'🥑', t:'Lipides' },
  { k:'conseil_cal',          em:'⚡', t:'Calories' }
];

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Les conseils générés font plusieurs phrases. Ici on n'en garde qu'une :
// l'illustration porte le message, la phrase le précise. Le détail complet
// reste disponible dans l'overlay profil de l'écran Suivi.
function unePhrase(txt, max){
  var t = (txt||'').trim().replace(/\s+/g,' ');
  if(!t) return '';
  max = max || 95;
  // Première phrase — on évite de couper sur les décimales ("1,5 g") et
  // les abréviations courantes en fin de mot.
  var m = t.match(/^[^.!?]*[.!?]/);
  var s = m ? m[0].trim() : t;
  if(s.length > max){
    var cut = s.lastIndexOf(' ', max);
    s = s.slice(0, cut > 40 ? cut : max).trim() + '…';
  }
  return s.replace(/[.!?]$/,'');
}

async function loadConseils(){
  var list = document.getElementById('advList');
  var weekEl = document.getElementById('advWeek');
  var rows = [];
  try{
    rows = await Natty.sbFetch('profil_conseils?user_id=eq.'+Natty.USER_ID
      + '&order=generated_at.desc&limit=1'
      + '&select=' + ADV_FIELDS.map(function(f){return f.k;}).join(',') + ',semaine,generated_at');
  }catch(e){}
  var c = rows && rows.length ? rows[0] : null;
  if (!c){
    weekEl.textContent = '';
    list.innerHTML = '<div class="empty">Tes conseils personnalisés apparaîtront ici dès leur première génération.</div>';
    return;
  }
  if (c.semaine){
    var d = new Date(c.semaine + 'T00:00:00');
    var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    weekEl.textContent = 'Semaine du ' + d.getDate() + ' ' + MOIS[d.getMonth()];
  }
  var html = ADV_FIELDS.filter(function(f){ return c[f.k]; }).map(function(f){
    return '<div class="adv-card'+(f.wide?' wide':'')+'" title="'+esc(c[f.k])+'">'
      + '<div class="adv-em">'+f.em+'</div>'
      + '<div class="adv-title">'+f.t+'</div>'
      + '<div class="adv-line">'+esc(unePhrase(c[f.k], f.wide?110:70))+'</div>'
      + '</div>';
  }).join('');
  list.innerHTML = html || '<div class="empty">Aucun conseil disponible pour cette semaine.</div>';
}

document.getElementById('rdvHero').addEventListener('click', function(e){
  e.preventDefault();
  Natty.goto('chat.html');
});
document.getElementById('wkPrev').addEventListener('click', function(){ weekOffset--; loadRdv(); });
document.getElementById('wkNext').addEventListener('click', function(){ weekOffset++; loadRdv(); });

/* ═══ Liste de courses ═══
   Déduite des repas de la semaine plutôt que générée par un appel séparé :
   pas d'attente, et la liste correspond toujours exactement aux plats
   affichés dans repas.html (nombre de repas voulus compris). */

// "120 g" → {n:120, u:'g'} ; "1/2" ou "une pincée" → null (non sommable).
// L'unité doit être alphabétique, sinon "1/2" serait lu comme 1 unité "/2"
// et réécrit "1 /2".
function crsParseQte(q){
  var m = String(q || '').trim().match(/^([\d]+(?:[.,][\d]+)?)\s*(.*)$/);
  if (!m) return null;
  var u = m[2].trim().toLowerCase();
  if (u && !/^[a-zà-ÿ.\s]+$/i.test(u)) return null;
  return { n: parseFloat(m[1].replace(',', '.')), u: u };
}

function crsFormatNombre(n){
  return (Math.round(n * 10) / 10).toString().replace('.', ',');
}

function crsAgreger(recettes){
  var par = {};
  (recettes || []).forEach(function(r){
    (r.ingredients || []).forEach(function(i){
      var nom = (i.nom || '').trim();
      if (!nom) return;
      var cle = nom.toLowerCase();
      if (!par[cle]) par[cle] = { em: i.em || '🥄', nom: nom, qtes: [] };
      if (i.qte) par[cle].qtes.push(String(i.qte).trim());
    });
  });

  return Object.keys(par).map(function(cle){
    var it = par[cle];
    var parsees = it.qtes.map(crsParseQte);
    var unites = {};
    var sommable = parsees.length > 0 && parsees.every(function(p){
      if (!p) return false;
      unites[p.u] = 1;
      return true;
    }) && Object.keys(unites).length === 1;

    var qte;
    if (sommable){
      var total = parsees.reduce(function(s, p){ return s + p.n; }, 0);
      qte = crsFormatNombre(total) + (parsees[0].u ? ' ' + parsees[0].u : '');
    } else {
      // Unités mélangées ou quantités non chiffrées : on juxtapose plutôt que
      // d'inventer un total faux.
      qte = it.qtes.filter(function(v, i, a){ return a.indexOf(v) === i; }).join(' + ');
    }
    return { em: it.em, nom: it.nom, qte: qte };
  }).sort(function(a, b){ return a.nom.localeCompare(b.nom, 'fr'); });
}

function crsCle(){
  return 'natty_courses_' + Natty.USER_ID + '_' + NattyReco.lundiCourant();
}

/* ═══ Aliments à privilégier ═══
   Ils sortent de la MÊME génération que les conseils et les recettes
   (`conseils_json.plats_macro[].aliments`, voir api/_generation.js) : un aliment
   « protéines » n'a de sens que s'il découle du conseil protéines écrit le même
   jour. Aucun appel supplémentaire à l'IA, une lecture.

   ⚠️ ET ILS MÈNENT QUELQUE PART. Un aliment touché entre dans la liste de
   courses juste en dessous — même clé localStorage que le détail d'une macro
   dans suivi.html (`NattyListe.basculerExtra`). Sans ça, la rangée serait un
   affichage de plus : on lit « privilégiez le thon », on touche, et il ne se
   passe rien. */

var _crsItems = null;        // les ingrédients déduits des recettes, gardés pour
                             // remonter la liste sans la recharger depuis la base
var _crsRecettes = 0;

function alimAjoute(nom){
  return window.NattyListe && NattyListe.contientExtra
    ? NattyListe.contientExtra(Natty.USER_ID, nom) : false;
}

async function loadAliments(){
  var bloc = document.getElementById('alimBlock');
  var row  = document.getElementById('alimRow');
  var note = document.getElementById('alimNote');
  var alims = [];
  try { alims = await NattyReco.alimentsSemaine(); } catch(e){}

  // Rien à privilégier : on masque le titre AUSSI. Une section vide avec son
  // en-tête laisse croire qu'un contenu n'a pas chargé.
  if (!alims.length){ bloc.style.display = 'none'; return; }

  bloc.style.display = '';
  note.textContent = 'Touchez-en un pour l’ajouter à votre liste de courses.';
  row.innerHTML = alims.map(function(a, i){
    return '<button class="alim-chip' + (alimAjoute(a.nom) ? ' on' : '') + '" type="button" data-i="' + i + '">'
      + '<span class="ac-em">' + crsEsc(a.em) + '</span>'
      + '<span class="ac-txt"><span class="ac-nom">' + crsEsc(a.nom) + '</span>'
      + (a.apport ? '<span class="ac-ap">' + crsEsc(a.apport) + '</span>' : '') + '</span>'
      + '<span class="ac-plus">' + (alimAjoute(a.nom) ? '✓' : '+') + '</span>'
      + '</button>';
  }).join('');

  // data-* + addEventListener : un onclick inline avec un nom d'aliment
  // apostrophé casse la syntaxe (règle §9 #8 de CLAUDE.md).
  [].slice.call(row.querySelectorAll('.alim-chip')).forEach(function(b){
    b.addEventListener('click', function(){
      var a = alims[+b.dataset.i];
      var ajoute = NattyListe.basculerExtra(Natty.USER_ID, a.nom, a.em);
      b.classList.toggle('on', ajoute);
      b.querySelector('.ac-plus').textContent = ajoute ? '✓' : '+';
      NattyListe.toast(ajoute ? '🛒 ' + a.nom + ' ajouté à vos courses'
                              : a.nom + ' retiré de vos courses');
      peindreCourses();     // la liste juste en dessous doit bouger tout de suite
    });
  });
}

function crsEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Les ingrédients des recettes, plus les aliments ajoutés à la main, en UNE
   liste. Deux listes séparées auraient obligé à lire deux fois et à copier deux
   fois — or on fait ses courses une seule fois. Un ajout qui figure déjà dans
   une recette n'est pas répété. */
function crsAvecExtras(items){
  var ex = (window.NattyListe && NattyListe.extras) ? NattyListe.extras(Natty.USER_ID) : [];
  var out = (items || []).slice();
  ex.forEach(function(x){
    var n = String(x.nom || '').toLowerCase().trim();
    if (!n) return;
    if (out.some(function(i){ return String(i.nom||'').toLowerCase().trim() === n; })) return;
    out.push({ em: x.emoji || '🛒', nom: x.nom, qte: '' });
  });
  return out.sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr'); });
}

/* Remonte la liste depuis ce qu'on a déjà en mémoire, sans requête. Appelé à
   chaque bascule d'un aliment : recharger la base pour un geste local ferait
   clignoter la liste et perdrait les cases cochées le temps de l'aller-retour. */
function peindreCourses(){
  var list = document.getElementById('crsList');
  var note = document.getElementById('crsNote');
  var items = crsAvecExtras(_crsItems || []);

  if (!items.length){ afficherCoursesVides(list, note); return; }

  var nEx = items.length - (_crsItems || []).length;
  note.textContent = (_crsRecettes
      ? 'Pour ' + (_crsRecettes === 1 ? 'ton repas' : 'tes ' + _crsRecettes + ' repas') + ' de la semaine'
      : 'Vos aliments à privilégier')
    + (nEx > 0 ? ' · ' + nEx + ' ajouté' + (nEx > 1 ? 's' : '') + ' à la main' : '');

  var lu = new Date(NattyReco.lundiCourant() + 'T00:00:00');
  var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août',
              'septembre','octobre','novembre','décembre'];
  NattyListe.monter(list, items, {
    cle: crsCle(),
    titre: 'Liste de courses Natty',
    sousTitre: 'semaine du ' + lu.getDate() + ' ' + MOIS[lu.getMonth()],
    vide: 'Aucun ingrédient à afficher.'
  });
}

function afficherCoursesVides(list, note){
  note.textContent = '';
  // Un écran vide qui ne dit pas comment le remplir laisse l'utilisateur
  // attendre quelque chose qui ne viendra jamais tout seul.
  list.innerHTML = '<div class="empty" style="text-align:center">'
    + 'Ta liste se déduit de tes recettes de la semaine.<br>'
    + '<button id="crsGen" style="margin-top:14px;padding:13px 22px;background:var(--ink,#1a1a2e);'
    + 'color:var(--on-ink,#fff);border:none;border-radius:14px;font-family:Inter,sans-serif;font-size:14px;'
    + 'font-weight:700;cursor:pointer;">✨ Générer ma semaine</button></div>';
  var b = document.getElementById('crsGen');
  if (b) b.addEventListener('click', function(){
    if (!window.NattyGeneration) return;
    b.disabled = true;
    NattyGeneration.lancer().then(function(row){
      if (row) loadCourses(); else b.disabled = false;
    });
  });
}

async function loadCourses(){
  var list = document.getElementById('crsList');
  var note = document.getElementById('crsNote');
  var recettes = [];
  try {
    await NattyReco.chargerNbRepas();   // même préférence que repas.html
    recettes = await NattyReco.recettesDeLaSemaine(NattyReco.nbRepas());
  } catch(e){}

  /* ⚠️ PAS DE SORTIE ANTICIPÉE ICI. Avant, l'absence de recettes affichait
     l'invitation à générer et rendait la main : les aliments ajoutés à la main
     n'étaient alors visibles nulle part, et le « + » de la rangée du dessus ne
     menait à rien. `peindreCourses()` tranche à partir de la liste RÉELLE —
     recettes plus ajouts — et ne montre l'invitation que si les deux sont vides.
     Même correctif que dans l'overlay de suivi.html. */
  _crsRecettes = (recettes && recettes.length) || 0;
  _crsItems = _crsRecettes ? crsAgreger(recettes) : [];
  peindreCourses();
}

/* Génération terminée ailleurs : conseils, aliments et liste se remplissent
   d'eux-mêmes — la rangée d'aliments n'existe qu'après une génération. */
document.addEventListener('natty:conseils-prets', function(){
  loadConseils(); loadCourses(); loadAliments();
});

/* Arrivée depuis « Voir mes conseils » (suivi.html) : on descend jusqu'à la
   section. Le défilement est fait APRÈS le chargement, pas au `hashchange`
   natif du navigateur : à l'ouverture, « Conseils de la semaine » n'est encore
   qu'une ligne « Chargement… », donc le saut natif viserait une position que
   le contenu déplace aussitôt — on se retrouverait au milieu du chat. */
function allerAuxConseils() {
  if (window.location.hash !== '#conseils') return;
  var el = document.getElementById('conseils');
  if (!el) return;
  /* ⚠️ NI `scrollIntoView`, NI `behavior:'smooth'`, et les deux ont une raison
     mesurée :
     • le lissé n'avance que sur des images peintes — mesuré dans un cadre non
       rendu, `scrollY` ne bouge PAS d'un pixel, alors que le saut instantané
       arrive à destination. Une arrivée sur un écran qu'on n'a pas encore lu
       n'a de toute façon rien à gagner à défiler sous les yeux ;
     • `block:'start'` colle le titre à y=0, donc SOUS la barre `.top`, qui est
       `sticky` et mesure 54 px : on atterrirait sur un titre invisible. */
  var y = el.getBoundingClientRect().top + window.scrollY - 66;
  window.scrollTo(0, Math.max(0, y));
}

(async function(){
  if (!Natty.requireAuth()) return;
  /* Le panneau des séances part SANS `await` et hors du `Promise.all` : il lit
     d'abord le localStorage, donc il se peint tout de suite, et sa requête
     n'a aucune raison de retarder le rendez-vous ou la liste de courses. */
  if (window.NattySeance) NattySeance.monterPanneau('seaWrap');
  await Promise.all([loadRdv(), loadMessages(), loadConseils(), loadCourses(), loadAliments()]);
  allerAuxConseils();
})();
</script>

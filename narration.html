/* ═══════════════════════════════════════════════════════════
   TRANSITIONS DE THÈME — 7 mises en scène, jamais la même
   deux fois de suite. Chacune amène le titre autrement.
   ═══════════════════════════════════════════════════════════ */
var TR_ORDER=['knife','pan','liquid','iris','fall','steam','shatter'],trCount=0;
function playTransition(kind,kicker,title,univ,done){
  var v=UNIVERS[univ]||UNIVERS.nutrition;
  var wrap=document.createElement('div');wrap.className='tr';
  wrap.style.background=v.bg;wrap.style.color=v.ink;
  var lab='<div class="tr-label {CLS}"><div class="tr-kicker" style="color:'+v.accent+'">'+kicker+'</div>'
        +'<div class="tr-title">'+title+'</div></div>';
  var body='',dur=2000;

  if(kind==='knife'){          /* couteau qui tranche un citron vert */
    body='<div class="tr-knife">🔪</div>'
      +'<div class="tr-half tr-halfL">🍈</div><div class="tr-half tr-halfR">🍈</div>';
    for(var j=0;j<9;j++){var ang=(Math.PI*2*j/9),d2=60+Math.random()*70;
      body+='<div class="tr-juice" style="--jx:'+(Math.cos(ang)*d2)+'px;--jy:'+(Math.sin(ang)*d2-20)+'px;animation-delay:'+(.6+Math.random()*.15)+'s"></div>'}
    lab=lab.replace('{CLS}','tr-zoom');dur=2100;
  }
  else if(kind==='pan'){       /* poêle + flamme + fumée qui révèle */
    body='<div class="tr-smoke"></div><div class="tr-pan">🍳</div><div class="tr-flame">🔥</div>';
    lab=lab.replace('{CLS}','tr-fade');dur=2200;
  }
  else if(kind==='liquid'){    /* le nouveau thème monte comme un liquide */
    wrap.style.background=v.ink;wrap.style.color=v.bg;
    body='<div class="tr-liquid" style="background:'+v.bg+'">'
        +'<svg class="tr-wave" viewBox="0 0 240 26" preserveAspectRatio="none"><path d="M0 14 Q30 2 60 14 T120 14 T180 14 T240 14 V26 H0Z" fill="'+v.bg+'"/></svg>'
        +'</div>';
    lab=lab.replace('{CLS}','tr-rise');lab=lab.replace('tr-label','tr-label').replace('color:'+v.accent,'color:'+v.accent);
    dur=2100;
  }
  else if(kind==='iris'){      /* obturateur photo qui s'ouvre */
    wrap.style.background='transparent';
    body='<div class="tr-iris" style="background:'+v.bg+'"></div>'
        +'<div class="tr-ring" style="border-color:'+v.accent+'"></div>'
        +'<div class="tr-ring" style="border-color:'+v.accent+';animation-delay:.18s"></div>';
    lab=lab.replace('{CLS}','tr-spread');dur=2000;
  }
  else if(kind==='fall'){      /* des ingrédients tombent et rebondissent */
    var ing=['🥕','🧄','🌿','🍅','🧅','🌶️','🫒','🍋'];
    for(var k=0;k<8;k++){
      body+='<div class="tr-drop" style="left:'+(8+k*11+Math.random()*5)+'%;--rot:'+(Math.random()*90-45)+'deg;animation-delay:'+(k*.075)+'s">'+ing[k]+'</div>'}
    lab=lab.replace('{CLS}','tr-bounce');dur=2100;
  }
  else if(kind==='steam'){     /* nuage de vapeur qui balaie l'écran */
    body='<div class="tr-steam"></div>';
    lab=lab.replace('{CLS}','tr-blur');dur=2200;
  }
  else {                       /* shatter : l'ancien écran éclate en tuiles */
    for(var c=0;c<4;c++)for(var rw=0;rw<6;rw++){
      body+='<div class="tr-tile" style="left:'+(c*25)+'%;top:'+(rw*16.7)+'%;width:25%;height:16.7%;background:'+v.bg
        +';--tx:'+((c-1.5)*90+(Math.random()*40-20))+'px;--ty:'+((rw-2.5)*80+(Math.random()*40-20))+'px;--tr:'+(Math.random()*120-60)
        +'deg;animation-delay:'+(Math.random()*.25)+'s"></div>'}
    lab=lab.replace('{CLS}','tr-pop');dur=1950;
  }

  wrap.innerHTML=body+lab;
  document.body.appendChild(wrap);
  /* signature sonore de la transition, dans le ton du nouvel univers */
  try{
    if(kind==='knife'){tone(1400,.05,.16,'square');setTimeout(function(){tone(320,.28,.2,'sine')},640)}
    else if(kind==='pan'){tone(180,.4,.22,'sine');setTimeout(function(){tone(v.base,.5,.14,'sine')},600)}
    else if(kind==='liquid'){for(var q=0;q<5;q++)(function(q){setTimeout(function(){tone(220+q*90,.22,.11,'sine')},q*160)})(q)}
    else if(kind==='iris'){tone(v.base*2,.16,.14,'sine');setTimeout(function(){tone(v.base,.4,.12,'sine')},180)}
    else if(kind==='fall'){for(var q2=0;q2<6;q2++)(function(q2){setTimeout(function(){tone(300+Math.random()*260,.07,.11,'triangle')},q2*80)})(q2)}
    else if(kind==='steam'){tone(120,.9,.16,'sine')}
    else {tone(90,.5,.24,'sine');setTimeout(function(){tone(v.base,.35,.14,'sine')},260)}
  }catch(e){}
  vib(univ==='defi'?[40,70,40]:[14,50,14]);
  setTimeout(function(){
    wrap.style.transition='opacity .42s ease';wrap.style.opacity='0';
    setTimeout(function(){wrap.remove()},440);
    done&&done();
  },dur);
}


/* mode "substantiel" : reward/say/choice héritent, seuls flash(=apprentissage),
   game*(=jeu/cuisine) et defi* comptent comme de vrais blocs d'activité */
/* mets nutrition:1 si tu veux aussi annoncer les retours en mode apprentissage */
var K_ANNOUNCE_MODES={jeu:1, cuisine:1, defi:1, nutrition:0};
function k_modeOf(b,i){
  if(!b)return null;
  var t=b.type;
  if(t&&t.indexOf('defi')===0)return 'defi';
  if(t==='gameCook'||t==='gameSear')return 'cuisine';
  if(t&&t.indexOf('game')===0)return 'jeu';
  if(t==='bmr'||t==='saveurAnim')return 'jeu';
  if(t==='flash'||t==='macros')return 'nutrition';
  /* reward / say / choice / chapter : neutres → héritent du dernier mode */
  return null;
}

var k_lastMode=null;   /* dernier mode annoncé */
function k_renderBeat(b,nu){
  applyUnivers(nu);
  sWhoosh();
  var old=current;
  var pair=ANIM[b.anim||'slide'];
  if(old){var oa=ANIM[old._anim||'slide'];old.classList.remove(oa[0]);old.classList.add(oa[1]);setTimeout(function(){if(old.parentNode)old.remove()},520)}
  render(b,pair);
  document.getElementById('back').classList.toggle('on',idx>0);
  markSegs();
}
function go(){
  /* le focus natif d'un bouton cliqué juste avant peut forcer un scroll interne du body
     (overflow:hidden bloque la scrollbar mais pas le scrollTop programmatique) : on le
     neutralise à chaque transition de beat, sinon le header et l'écran carte se décalent. */
  document.body.scrollTop=0;
  if(idx>maxIdx)maxIdx=idx;
  progEcrire();
  var b=STORY[idx];
  var nu=univFor(b,idx);

  /* changement de CHAPITRE → séquence kinetic (titre animé) puis on enchaîne */
  if(b.type==='chapter'&&!b._seen){
    b._seen=true;
    k_clearCurrent();
    k_lastMode=nu;
    applyUnivers(nu);markSegs();
    k_playSeq(k_chapterSeq(chapterNo(idx),b.label,nu),function(){ nextBeat(); });
    return;
  }

  /* changement de MODE → annonce kinetic courte, puis dispatch du beat */
  var realMode=k_modeOf(b,idx);
  if(realMode && realMode!==k_lastMode && k_lastMode!==null && b.type!=='chapter'
     && K_ANNOUNCE_MODES[realMode] && !b._modeAnn){
    b._modeAnn=true;
    k_lastMode=realMode;
    k_clearCurrent();
    applyUnivers(nu);
    k_playSeq(k_modeSeq(realMode,b),function(){ k_dispatch(b,nu); });
    return;
  }
  if(realMode) k_lastMode=realMode;
  k_dispatch(b,nu);
}
function k_clearCurrent(){
  var old=current;
  if(old){old.style.transition='opacity .3s';old.style.opacity='0';setTimeout(function(){if(old.parentNode)old.remove()},320);current=null}
}
/* dispatch d'un beat : les explications passent en kinetic, le reste en render normal */
function k_dispatch(b,nu){
  /* séquence cinématique explicite (b.cine) ou 'say' auto-converti */
  if((b.cine || b.type==='say') && !b._kdone){
    b._kdone=true;
    k_clearCurrent();
    applyUnivers(nu);markSegs();
    document.getElementById('back').classList.toggle('on',idx>0);
    var seq = b.cine ? k_resolveCine(b.cine) : k_sayToSeq(b);
    k_playSeq(seq,function(){ nextBeat(); });
    return;
  }
  k_renderBeat(b,nu);
}
/* permet d'écrire des séquences cinématiques compactes ; ajoute un bouton final si absent */
function k_resolveCine(cine){
  var seq=cine.slice();
  var last=seq[seq.length-1];
  if(last && !last.btn){ last.hold=0; last.btn=last.cta||'Continuer'; }
  return seq;
}
function chapterNo(i){var n=0;for(var k=0;k<=i;k++)if(STORY[k].type==='chapter')n++;return n}
/* Le passage d'un palier au suivant est LE point de blocage du parcours : c'est
   ici, et nulle part ailleurs, qu'on refuse d'avancer tant que le jour n'a pas
   tourné. Toute autre façon d'arriver sur un beat (reprise, carte) doit donc
   respecter `palierOuvert` de son côté. */
function nextBeat(){
  if(idx>=STORY.length-1){openMap();return}
  if(auBordDuPalier()&&palierDe(idx+1)>palierOuvert){
    palierTermine(palierDe(idx));
    k_playSeq(k_demainSeq(palierDe(idx)),function(){ openMap(); });
    return;
  }
  idx++;go();
}

        var p=Math.min(1,(performance.now()-start)/s.wait);
        var sf=el.querySelector('#sf');if(sf)sf.style.width=(p*100)+'%';
        if(p<1){requestAnimationFrame(tick);}
        else{
          sDing();vib(30);
          el.querySelector('.sear-act').textContent=s.ready;
          var wz=el.querySelector('#wz');if(wz)wz.innerHTML='<button class="btn" id="ok">Continuer ✓</button>';

  }

/* ═══ JEU · CUISSON (barre à arrêter au bon moment) ═══ */
function renderCook(el,b){
  var p=0,running=true,raf2;
  function draw(){
    var stage=b.stages.slice().reverse().find(function(s){return p>=s.at;})||b.stages[0];
    el.innerHTML='<div class="g-name" style="font-size:20px">'+b.title+'</div><div class="cook-sub">'+b.subtitle+'</div>'
      +'<div class="cook-em">'+stage.em+'</div><div class="cook-stage">'+stage.l+'</div>'
      +'<div class="cook-track"><div class="cook-ideal" style="left:'+(b.ideal*100)+'%"></div><div class="cook-fill" id="cf" style="width:'+(p*100)+'%"></div></div>'
      +'<div class="cook-target">🎯 Vise : <b>'+b.target+'</b></div>'
      +'<div class="cta"><button class="btn" id="stop">Stop !</button></div>';
    el.querySelector('#stop').addEventListener('click',stop);
  }
  function loop(){
    if(!running)return;
    p+=0.006;
    var cf=el.querySelector('#cf');
    if(cf){cf.style.width=(p*100)+'%';
      var stage=b.stages.slice().reverse().find(function(s){return p>=s.at;});
      var se=el.querySelector('.cook-em'),sl=el.querySelector('.cook-stage');
      if(stage){if(se)se.textContent=stage.em;if(sl)sl.textContent=stage.l;}
    }
    if(p>=1){stop();return;}
    raf2=requestAnimationFrame(loop);
  }
  function stop(){
    if(!running)return;running=false;if(raf2)cancelAnimationFrame(raf2);
    var ecart=Math.abs(p-b.ideal),ok=ecart<=b.tol;
    if(ok){sOk();vib([30,40,60]);}else{sKo();vib(50);}
    el.innerHTML='<div class="end-em">'+(ok?'🎯':'😅')+'</div><div class="end-xp" style="font-size:26px">'+(ok?'Parfait !':'Presque !')+'</div>'
      +'<div class="end-l">'+(ok?'Ton '+b.target.toLowerCase()+' est réussi.':'Un peu '+(p>b.ideal?'trop cuit':'pas assez cuit')+'. Réessaie !')+'</div>'
      +'<div class="cta">'+(ok?'<button class="btn" id="nx">Continuer</button>':'<button class="btn ghost" id="rt">Réessayer</button>')+'</div>';
    if(ok)el.querySelector('#nx').addEventListener('click',function(){sTap();vib(18);nextBeat()});
    else el.querySelector('#rt').addEventListener('click',function(){sTap();p=0;running=true;draw();loop()});
  }
  draw();loop();
}

function renderPair(el,b){
  var i=0;

      var s0=sel[0],s1=sel[1];
      el.innerHTML='<div class="g-count">'+(i+1)+' / '+b.items.length+'</div>'
        +'<div class="g-name" style="font-size:18px;max-width:310px">'+it.goal+'</div>'

        +'<div class="al-slots">'
        +'<div class="al-slot">'+(s0?'<span>'+s0.em+'</span><small>'+s0.n+'</small>':'<span style="opacity:.4">?</span>')+'</div>'
        +'<div class="al-plus">+</div>'
        +'<div class="al-slot">'+(s1?'<span>'+s1.em+'</span><small>'+s1.n+'</small>':'<span style="opacity:.4">?</span>')+'</div>'
        +'</div>'
        +'<div class="al-grid">'+it.pool.map(function(o,k){

            return '<button class="al-it'+(on?' sel':'')+'" data-k="'+k+'"><span style="font-size:21px">'+o.em+'</span>'+o.n+'</button>'}).join('')+'</div>'
        +'<div class="cta"><button class="btn" id="av"'+(sel.length===2?'':' disabled')+'>Valider l\'accord</button></div>';
      el.querySelectorAll('.al-it').forEach(function(btn){btn.addEventListener('click',function(){
        var o=it.pool[+btn.dataset.k],p=sel.indexOf(o);
        if(p>-1)sel.splice(p,1); else if(sel.length<2)sel.push(o);
        sTap();vib(10);draw();
      })});
      if(sel.length===2)el.querySelector('#av').addEventListener('click',valider);
    }
    function valider(){
      var noms=sel.map(function(o){return o.n}).sort().join('|');
      var attendu=it.sol.slice().sort().join('|');
      var ok=noms===attendu;
      var bons=sel.filter(function(o){return it.sol.indexOf(o.n)>-1}).length;
      if(ok){sOk();vib([30,40,60])}else sKo();
      el.innerHTML='<div class="end-em">'+(ok?'🤝':bons===1?'🤏':'😬')+'</div>'
        +'<div class="end-xp" style="font-size:23px">'+(ok?'Accord parfait !':bons===1?'Un seul bon ingrédient':'Accord raté')+'</div>'
        +'<div class="end-l">La bonne combinaison : <b style="color:var(--ink)">'+it.sol.join(' + ')+'</b>. '+it.why+'</div>'
        +'<div class="cta"><button class="btn" id="an">'+(i<b.items.length-1?'Accord suivant':'Continuer')+'</button></div>';
      el.querySelector('#an').addEventListener('click',function(){sTap();vib(18);i++;i>=b.items.length?nextBeat():step()});
    }
    draw();
  }
  step();
}

function animNum(el,to,unit){if(!el)return;var t0=null;function a(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/800);el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+(unit?' '+unit:'');if(p<1)requestAnimationFrame(a)}requestAnimationFrame(a)}

/* ═══ TIER LIST — glisser les aliments directement dans les tiers ═══ */
function renderTier(el,b){
  var placed={};           /* nom -> clé de tier */
  var total=b.items.length;
  function draw(){
    var pool=b.items.filter(function(x){return !placed[x.n]});
    el.innerHTML='<div class="g-name" style="font-size:19px">'+b.title+'</div>'
      +'<div class="tier-sub">'+b.subtitle+'</div>'
      +'<div class="tl-wrap">'
      + b.tiers.map(function(t){
          var inside=b.items.filter(function(x){return placed[x.n]===t.k});
          return '<div class="tl-tier"><div class="tl-badge" style="background:'+t.c+'">'+t.k+'</div>'
            +'<div class="tl-drop" data-k="'+t.k+'">'
            + inside.map(function(x){return '<span class="tl-chip"><span class="e">'+x.em+'</span>'+x.n+'</span>'}).join('')
            +'</div></div>'}).join('')
      +'</div>'
      +'<div class="tl-pool" id="tlPool">'
      + pool.map(function(x,k){return '<div class="tl-item" data-n="'+x.n+'"><span class="e">'+x.em+'</span>'+x.n+'</div>'}).join('')
      +'</div>'
      + (pool.length? '<div class="tl-hint">glisse chaque aliment dans un tier</div>'
                    : '<div class="cta"><button class="btn" id="tv">Valider mon classement</button></div>');

    if(!pool.length){
      el.querySelector('#tv').addEventListener('click',function(){sTap();vib(18);correction()});
      return;
    }
    el.querySelectorAll('.tl-item').forEach(function(it){ bindDrag(it) });
  }

  function bindDrag(it){
    /* Écoute pointermove/pointerup sur document (pas sur `it`) : ne dépend pas de
       setPointerCapture, qui peut échouer silencieusement selon le navigateur et
       laisser le ghost bloqué à l'écran sans jamais déclencher le dépôt. */
    it.addEventListener('pointerdown',function(ev){
      ev.preventDefault();
      var pid=ev.pointerId;
      it.classList.add('drag');vib(8);
      var ghost=it.cloneNode(true);ghost.className='tl-item tl-ghost';
      ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
      document.body.appendChild(ghost);

      function onMove(e){
        if(e.pointerId!==pid)return;
        ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
        el.querySelectorAll('.tl-drop').forEach(function(d){
          var r=d.getBoundingClientRect();
          var hot=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
          d.classList.toggle('hot',hot);
        });
      }
      function finish(e,commit){
        if(e.pointerId!==pid)return;
        document.removeEventListener('pointermove',onMove);
        document.removeEventListener('pointerup',onUp);
        document.removeEventListener('pointercancel',onCancel);
        it.classList.remove('drag');
        if(ghost.parentNode)ghost.remove();
        if(!commit)return;
        var dropped=null;
        el.querySelectorAll('.tl-drop').forEach(function(d){
          d.classList.remove('hot');
          var r=d.getBoundingClientRect();
          if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)dropped=d.dataset.k;
        });
        if(dropped){placed[it.dataset.n]=dropped;sTap();vib(16);burst(e.clientX,e.clientY,['✨'])}
        draw();
      }
      function onUp(e){finish(e,true)}
      function onCancel(e){finish(e,false)}
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp);
      document.addEventListener('pointercancel',onCancel);
    });
  }

  function correction(){
    var good=0;b.items.forEach(function(x){if(placed[x.n]===b.sol[x.n])good++});
    var parfait=good===total;
    el.innerHTML='<div class="end-em">'+(parfait?'🏆':good>=total-1?'👏':'👍')+'</div>'
      +'<div class="end-xp" style="font-size:26px">'+good+' / '+total+'</div><div class="end-l">bien classés</div>'
      +'<div class="tl-wrap" style="margin-top:16px">'
      + b.tiers.map(function(t){
          var vrais=b.items.filter(function(x){return b.sol[x.n]===t.k});
          return '<div class="tl-tier"><div class="tl-badge" style="background:'+t.c+'">'+t.k+'</div>'
            +'<div class="tl-drop">'+vrais.map(function(x){
                var bon=placed[x.n]===t.k;
                return '<span class="tl-chip" style="'+(bon?'':'opacity:.55')+'"><span class="e">'+x.em+'</span>'+x.n+(bon?' ✓':'')+'</span>'}).join('')
            +'</div></div>'}).join('')
      +'</div>'
      +'<div class="mv-note">le classement correct</div>'
      +'<div class="cta"><button class="btn" id="tn">Continuer</button></div>';
    parfait?sOk():sDing();vib([30,40]);
    el.querySelector('#tn').addEventListener('click',function(){sTap();vib(18);nextBeat()});
  }
  draw();
}

      +'  <img class="paint-base" id="pbase" src="'+photo+'" draggable="false">'
      +'  <img class="paint-fill" id="pfimg" src="'+photo+'" draggable="false">'
      +'  <div class="paint-line" id="pline"></div>'
      +' </div>'
      +' <div class="paint-pct" id="ppct">0<span style="font-size:24px">%</span></div>'
      +' <div class="paint-unit">'+(it.unit||'de sucre')+'</div>'
      +'</div>'
      +'<div class="cta"><button class="btn" id="pv" disabled>Valider mon estimation</button></div>';
    var base=el.querySelector('#pbase'),fimg=el.querySelector('#pfimg'),
        pct=el.querySelector('#ppct'),line=el.querySelector('#pline'),
        stage=el.querySelector('#pstage'),val=el.querySelector('#pv');
    var frac=0,drag=false,done=false,last=-1;
    function sync(){ fimg.style.width=base.clientWidth+'px'; }
    function apply(){var h=base.clientHeight||210;
      fimg.style.clipPath='inset('+((1-frac)*100)+'% 0 0 0)';
      pct.innerHTML=Math.round(frac*100)+'<span style="font-size:24px">%</span>';
      var topY=(1-frac)*h;line.style.top=topY+'px';line.style.opacity=frac>.02&&frac<.99?1:0;
      val.disabled=frac<=.01;var st=Math.floor(frac*20);if(st!==last){last=st;sTap();vib(4)}}
    function fromE(e){var r=base.getBoundingClientRect();var y=(e.touches?e.touches[0].clientY:e.clientY);frac=Math.max(0,Math.min(1,(r.bottom-y)/r.height));apply()}
    stage.addEventListener('pointerdown',function(e){if(done)return;drag=true;fromE(e)});
    window.addEventListener('pointermove',function(e){if(drag&&!done)fromE(e)});
    window.addEventListener('pointerup',function(){drag=false});
    if(base.complete)sync();else base.onload=sync;
    val.addEventListener('click',function(){
      if(done||frac<=.01)return;done=true;
      var guess=Math.round(frac*100),ok=Math.abs(guess-it.cible)<=(it.tol||12),target=it.cible/100,start=frac,t0=null;
      line.style.opacity=0;
      function anim(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/750);var e=p<1?p*p*(3-2*p):1;var cur=start+(target-start)*e;
        fimg.style.clipPath='inset('+((1-cur)*100)+'% 0 0 0)';pct.innerHTML=Math.round(cur*100)+'<span style="font-size:24px">%</span>';
        if(p<1)requestAnimationFrame(anim);else reveal(guess,ok)}
      requestAnimationFrame(anim);
    });
    function reveal(guess,ok){
      if(ok){sOk();vib([30,40,60])}else sKo();
      el.innerHTML='<div class="end-em">'+(ok?'🎯':'😮')+'</div><div class="end-xp" style="font-size:24px">'+(ok?'Bien vu !':'Tu as dit '+guess+'%')+'</div>'
        +'<div class="end-l">Vraie valeur : <b style="color:var(--ink)">'+it.cible+'%</b>. '+it.reveal+'</div>'
        +'<div class="cta"><button class="btn" id="cn">'+(i<b.items.length-1?'Suivant':'Continuer')+'</button></div>';
      el.querySelector('#cn').addEventListener('click',function(){sTap();vib(18);i++;i>=b.items.length?nextBeat():step()});
    }
  }
  step();
}

      sy.style.opacity=x>30?Math.min(1,x/110):0;sn.style.opacity=x<-30?Math.min(1,-x/110):0}

function renderPlatePhoto(el,b){
  var i=0,totErr=0;
  function step(){
    var it=b.items[i];
    var ingsHtml=(it.ings||[]).map(function(x){return '<div class="pm-ing"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('');
    el.innerHTML='<div class="g-count">'+(i+1)+' / '+b.items.length+'</div>'
      +'<div class="pm-card"><div class="pm-photo" style="background-image:url('+PH[it.ph]+')"></div>'
      +'<div class="pm-divider"><span></span>◆<span></span></div><div class="pm-title">'+it.n+'</div>'
      +'<div class="pm-ings">'+ingsHtml+'</div></div>'
      +'<div class="dial-q">Place le curseur : tu en manges ?</div>'
      +'<div class="dial" id="dial">'
      +'  <svg viewBox="0 0 240 140" width="240" height="140">'
      +'    <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">'
      +'      <stop offset="0" stop-color="#ff3b30"/><stop offset="0.5" stop-color="#ff9f0a"/><stop offset="1" stop-color="#34c759"/>'
      +'    </linearGradient></defs>'
      +'    <path d="M20 130 A100 100 0 0 1 220 130" fill="none" stroke="url(#dg)" stroke-width="16" stroke-linecap="round"/>'
      +'    <g id="needle"><line x1="120" y1="130" x2="120" y2="44" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>'
      +'      <circle cx="120" cy="130" r="11" fill="var(--ink)"/></g>'
      +'  </svg>'
      +'  <div class="dial-ends"><span>🚫 Je mange pas</span><span>Je mange 😋</span></div>'
      +'</div>'
      +'<div class="dial-val" id="dv">Glisse la jauge</div>'
      +'<div class="cta"><button class="btn" id="dok" disabled>Valider</button></div>'
      +'<div class="mv-crit" id="mvc"></div>';
    var val=null,dragging=false;
    var svg=el.querySelector('#dial svg'),needle=el.querySelector('#needle'),dv=el.querySelector('#dv'),ok=el.querySelector('#dok');
    function setFromEvent(ev){
      var r=svg.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height*(130/140);
      var x=(ev.touches?ev.touches[0].clientX:ev.clientX)-cx;
      var y=(ev.touches?ev.touches[0].clientY:ev.clientY)-cy;
      var ang=Math.atan2(-y,x); // 0=droite, pi=gauche
      if(ang<0)ang=0; if(ang>Math.PI)ang=Math.PI;
      val=Math.round((1-ang/Math.PI)*100); // gauche(pi)=0, droite(0)=100
      var a=Math.PI*(1-val/100);
      var nx=120+Math.cos(a)*86, ny=130-Math.sin(a)*86;
      needle.querySelector('line').setAttribute('x2',nx);
      needle.querySelector('line').setAttribute('y2',ny);
      dv.textContent=val+' / 100';
      ok.disabled=false;
      if(val%5===0)vib(4);
    }
    svg.addEventListener('pointerdown',function(e){dragging=true;setFromEvent(e)});
    window.addEventListener('pointermove',function(e){if(dragging)setFromEvent(e)});
    window.addEventListener('pointerup',function(){dragging=false});
    ok.addEventListener('click',function(){
      if(val===null)return;
      var err=Math.abs(val-it.score);totErr+=err;
      var good=err<=15;
      if(good){sOk();vib([30,40,60]);burst(120,120,['🎯'])}else sKo();
      // animer l'aiguille vers la vraie valeur
      var a=Math.PI*(1-it.score/100);
      needle.querySelector('line').setAttribute('x2',120+Math.cos(a)*86);
      needle.querySelector('line').setAttribute('y2',130-Math.sin(a)*86);
      needle.querySelector('line').setAttribute('stroke','#34c759');
      dv.innerHTML='Ta réponse : <b>'+val+'</b> · Idéal : <b style="color:var(--ink)">'+it.score+'</b>';
      ok.style.display='none';
      var c=el.querySelector('#mvc');
      c.innerHTML='<div class="dial-verdict '+(good?'g':'')+'">'+(good?'🎯 Bien vu ('+err+' d\'écart)':'😮 '+err+' points d\'écart')+'</div>'
        +it.crit.map(function(x){return '<div class="mv-line"><span class="mv-ic">'+x.ic+'</span><span class="mv-tx"><b>'+x.k+'</b> — '+x.t+'</span></div>'}).join('')
        +'<div class="cta"><button class="btn" id="mn">'+(i<b.items.length-1?'Plat suivant':'Voir mon score')+'</button></div>';
      c.classList.add('on');
      c.querySelector('#mn').addEventListener('click',function(){sTap();vib(18);i++;i>=b.items.length?fin():step()});
      setTimeout(function(){c.scrollIntoView&&c.scrollIntoView({behavior:'smooth',block:'nearest'})},200);
    });
  }
  function fin(){
    var moy=Math.round(totErr/b.items.length);
    var top=moy<=15;
    el.innerHTML='<div class="end-em">'+(top?'🍽️':'📊')+'</div>'
      +'<div class="end-xp" style="font-size:24px">'+moy+' pts d\'écart moyen</div>'
      +'<div class="end-l">'+(top?'Ton radar nutritionnel est calibré : tu sais placer un plat sans y réfléchir.':'Continue : plus tu t\'entraînes, plus ton estimation se rapproche du réel.')+'</div>'
      +'<div class="cta"><button class="btn" id="pf">Continuer</button></div>';
    top?sOk():sDing();vib([30,40]);
    el.querySelector('#pf').addEventListener('click',function(){sTap();vib(18);nextBeat()});
  }
  step();
}

/* Vérifie via Claude (vision) qu'une photo de défi correspond bien à la consigne.
   Échoue "ouvert" (cb(true)) si l'API est indisponible ou renvoie n'importe quoi —
   narration.html reste utilisable même sans réseau, la vérification est un plus. */
function k_verifyDefiPhoto(file,label,hint,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var b64=(e.target.result||'').split(',')[1];
    if(!b64){cb(true);return}
    var prompt='Vérifie si cette photo correspond bien à la consigne d\'un défi nutrition : "'+label+'" '
      +'(exemples typiques acceptés : '+hint+'). Sois tolérant : n\'importe quel aliment plausible de cette '
      +'catégorie compte, la photo n\'a pas besoin d\'être parfaite. '
      +'Réponds UNIQUEMENT avec du JSON valide, sans texte autour : '
      +'{"correspond":true,"raison":""} si ça correspond, ou '
      +'{"correspond":false,"raison":"explication courte et bienveillante en français, 1 phrase"} sinon.';
    /* ⚠️ `/api/claude` exige une session depuis août 2026 : c'était un proxy
       OUVERT vers l'API Anthropic payante. Ce fichier ne charge pas
       assets/core.js — il est volontairement autonome — donc on lit la session
       là où core.js l'écrit, en localStorage. Aucun rafraîchissement : un jeton
       périmé donne un 401 et, la vérification étant fail-open, la photo est
       acceptée. C'est voulu, pas un oubli : un défi ne doit pas se bloquer sur
       une histoire d'authentification. */
    var enT = {'Content-Type':'application/json'};
    try{
      var sess = JSON.parse(localStorage.getItem('natty_session')||'null');
      if(sess && sess.access_token) enT.Authorization = 'Bearer '+sess.access_token;
    }catch(e){}
    fetch(NARR_API+'/api/claude',{
      method:'POST',headers:enT,
      body:JSON.stringify({prompt:prompt,max_tokens:200,image:b64,media_type:file.type||'image/jpeg'})
    }).then(function(r){return r.json()}).then(function(d){
      if(!d||!d.text){cb(true);return}
      var json;
      try{ json=JSON.parse((d.text||'{}').replace(/```[a-z]*|```/g,'').trim()); }
      catch(err){ cb(true); return; }
      cb(json.correspond!==false, json.raison);
    }).catch(function(){ cb(true); });
  };
  reader.readAsDataURL(file);
}

/* sections dépliées : mémorisé d'une ouverture de carte à l'autre, sinon replier
   le palier qu'on vient d'ouvrir à chaque aller-retour serait exaspérant. */


function buildMap(){
  var r=document.getElementById('mrail');
  /* bilan par palier : bornes, nombre d'épreuves et XP (total / déjà gagné) */
  /* Borne des épreuves faites. `maxIdx` est le beat le plus loin ATTEINT, donc
     encore en cours : d'où le `<` strict. Sauf quand la journée nous a arrêtés au
     bord du palier — ce dernier beat-là a bien été joué, on n'a simplement pas pu
     franchir la marche. Sans ce +1, un palier terminé resterait à « 12/13 ». */
  var borne=(palierFinLe&&palierDe(maxIdx)===palierOuvert)?maxIdx+1:maxIdx;
  var bilan={};
  STORY.forEach(function(b,i){
    var p=palierDe(i),o=bilan[p]||(bilan[p]={premier:i,dernier:i,total:0,faits:0,xp:0,xpFaits:0});
    o.dernier=i;
    if(b.type!=='chapter'){o.total++;if(i<borne)o.faits++}
    if(b.type==='reward'&&b.xp){o.xp+=b.xp;if(i<borne)o.xpFaits+=b.xp}
  });
  var pCur=palierDe(idx),html='';
  PALIERS.forEach(function(P){
    var o=bilan[P.n];if(!o)return;
    var fini=borne>o.dernier;
    /* le déverrouillage ne dépend plus de la seule progression : un palier
       s'ouvre le lendemain du jour où le précédent a été bouclé (cf. progRollover). */
    var dispo=P.n<=palierOuvert;
    var etat=!dispo?'lock':(P.n===pCur&&!fini?'cur':(fini?'done':'todo'));
    var meta=etat==='lock'
        ?(P.n===palierOuvert+1&&palierFinLe?'Disponible demain ☀️':'Termine le palier '+(P.n-1)+' pour l\'ouvrir')
      :fini?('Terminé ✓ · '+o.xp+' XP')
      :o.faits?(o.faits+'/'+o.total+' épreuves · '+o.xpFaits+' XP')
      :(o.total+' épreuves · '+o.xp+' XP à gagner');
    var pct=o.total?Math.round(o.faits/o.total*100):0;
    /* Plus de liste d'épreuves : une carte par palier, et sa jauge. Ce que
       l'utilisateur veut savoir en ouvrant cet écran, c'est « où j'en suis »
       et « je reprends » — pas naviguer entre 121 vignettes. Le saut libre
       vers une épreuve précise disparaît donc avec la liste ; le retour (←)
       reste là pour revoir les étapes précédentes, sans perdre la progression. */
    html+='<div class="mpal '+etat+' open" data-palier="'+P.n+'">'
      +'<div class="mpal-hd">'
        +'<div class="mpal-em">'+(etat==='lock'?'🔒':P.em)+'</div>'
        +'<div class="mpal-txt"><div class="mpal-n">Palier '+P.n+'</div>'
          +'<div class="mpal-t">'+P.titre+'</div>'
          +'<div class="mpal-meta">'+meta+'</div>'
          +'<div class="mpal-jauge"><i style="width:'+pct+'%"></i></div></div>'
      +'</div>'
    +'</div>';
  });
  r.innerHTML=html;
}

function k_ac(){if(!k_AC)k_AC=new(window.AudioContext||window.webkitAudioContext)();if(k_AC.state==='suspended')k_AC.resume();return k_AC}
function k_tone(f,d,v,ty){try{var c=k_ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function k_sEnter(kind){
  if(kind==='through'||kind==='recede'){k_tone(300,.18,.12);k_tone(600,.14,.08)}
  else if(kind==='drop'||kind==='bounce'){k_tone(180,.12,.16,'triangle')}
  else if(kind==='pop'){k_tone(660,.06,.13,'square');k_tone(990,.05,.08,'square')}
  else if(kind==='glitch'){k_tone(120,.05,.14,'square');setTimeout(function(){k_tone(400,.05,.1,'square')},50)}
  else if(kind==='unblur'||kind==='blur'){k_tone(240,.4,.09,'sine')}
  else k_tone(420,.09,.1,'sine');
  if(navigator.vibrate)navigator.vibrate(kind==='drop'||kind==='bounce'?[12]:[6]);
}
function k_sSem(fx){
  if(fx==='burn'){k_tone(200,.5,.12,'sawtooth');setTimeout(function(){k_tone(340,.4,.09,'sawtooth')},120);setTimeout(function(){k_tone(180,.6,.07,'sawtooth')},260)}
  else if(fx==='flow'){for(var i=0;i<4;i++)(function(i){setTimeout(function(){k_tone(280+i*70,.3,.07,'sine')},i*90)})(i)}
  else if(fx==='beat'){k_tone(90,.14,.2,'sine');setTimeout(function(){k_tone(90,.14,.2,'sine')},380)}
  else if(fx==='flex'){k_tone(150,.3,.14,'square');setTimeout(function(){k_tone(230,.2,.1,'square')},220)}
  else if(fx==='freeze'){k_tone(1200,.5,.08,'triangle');setTimeout(function(){k_tone(1600,.4,.05,'triangle')},160)}
  else if(fx==='sparkle'){for(var j=0;j<5;j++)(function(j){setTimeout(function(){k_tone(900+Math.random()*600,.08,.06,'triangle')},j*70)})(j)}
  else if(fx==='energy'){k_tone(600,.06,.12,'sawtooth');setTimeout(function(){k_tone(1100,.05,.08,'square')},50)}
  else if(fx==='grow'){k_tone(200,.5,.1,'sine')}
  if(navigator.vibrate)navigator.vibrate(fx==='beat'?[14,180,14]:fx==='energy'?[8,8,8]:[10]);
}
function k_sFx(fx){
  if(fx==='hl'||fx==='hlO'){k_tone(150,.14,.16,'sine')}
  else if(fx==='hlY'){k_tone(880,.16,.1,'triangle')}
  else if(fx==='zoom'||fx==='stretch'){k_tone(520,.12,.1);k_tone(780,.1,.07)}
  else if(fx==='shake'||fx==='wobble'){k_tone(200,.08,.12,'square')}
  else if(fx==='cut'){ /* coup de lame : bruit blanc filtré bref + sifflement descendant */
    try{var c=k_ac(),t=c.currentTime;var b=c.createBuffer(1,c.sampleRate*.14,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    var s=c.createBufferSource();s.buffer=b;var f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2200;
    var g=c.createGain();g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
    var o=c.createOscillator(),g2=c.createGain();o.type='sine';o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(300,t+.13);
    g2.gain.setValueAtTime(.12,t);g2.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g2);g2.connect(c.destination);o.start(t);o.stop(t+.14);}catch(e){}
    if(navigator.vibrate)navigator.vibrate([8,20,8]);return;
  }
  if(navigator.vibrate)navigator.vibrate(10);
}

/* construit le HTML d'un plan à partir de ses tokens */
function k_buildContent(p){
  var wrap=document.createElement('div');
  var cls=p.size||'big';
  (p.lines||[p.content||[]]).forEach(function(line,li){
    var div=document.createElement('div');div.className=cls+(li>0?' line2':'');
    if(p.charfx)div.classList.add(p.charfx); // wave / stagger / dropin
    line.forEach(function(tok){
      if(tok.br){wrap.appendChild(div);div=document.createElement('div');div.className=cls+' line2';return}
      var span=document.createElement('span');
      if(tok.fx==='cut'){
        /* mot qui se scinde : deux moitiés + trait de coupe */
        span.className='cutfx';span.dataset.go='cut';
        var t=tok.t, mid=Math.ceil(t.length/2);
        span.innerHTML='<span class="ca">'+t.slice(0,mid)+'</span><span class="slash"></span><span class="cb">'+t.slice(mid)+'</span>';
        div.appendChild(span);return;
      }
      span.textContent=tok.t;
      if(tok.fx==='hl'||tok.fx==='hlY'||tok.fx==='hlO'){
        span.className=tok.fx;var bg=document.createElement('span');bg.className='bg';span.appendChild(bg);
        span.dataset.go=tok.fx;
      } else if(tok.fx){ span.className=tok.fx+'fx';
        if(['burn','flow','beat','flex','freeze','sparkle','energy','grow'].indexOf(tok.fx)>-1){ span.dataset.sem=tok.fx; }
      }
      if(tok.big)span.style.fontSize='1.5em';
      if(tok.accent)span.style.color='var(--accent)';
      div.appendChild(span);
    });
    wrap.appendChild(div);
  });
  if(p.charfx)wrap.querySelectorAll('.'+p.charfx).forEach(k_splitChars);
  if(p.sub){var s=document.createElement('div');s.className='k-sub';s.textContent=p.sub;wrap.appendChild(s);}
  return wrap;
}

    +'<rect x="72" y="132" width="56" height="12" rx="4" fill="var(--ink)"/></svg>';},

  /* FLAMME : calories qui brûlent */
  flame:function(){return '<svg viewBox="0 0 160 200" width="150" height="190">'
    +'<path d="M80 30 C110 70 120 90 120 120 A40 40 0 0 1 40 120 C40 96 54 84 62 66 C70 86 74 92 86 96 C96 92 92 66 80 30 Z" fill="var(--ink)">'
    +'<animate attributeName="d" dur="1.1s" repeatCount="indefinite" values="'
    +'M80 30 C110 70 120 90 120 120 A40 40 0 0 1 40 120 C40 96 54 84 62 66 C70 86 74 92 86 96 C96 92 92 66 80 30 Z;'
    +'M80 24 C104 72 124 88 124 122 A44 42 0 0 1 36 122 C36 92 58 88 60 62 C72 88 72 90 88 98 C100 92 96 62 80 24 Z;'
    +'M80 30 C110 70 120 90 120 120 A40 40 0 0 1 40 120 C40 96 54 84 62 66 C70 86 74 92 86 96 C96 92 92 66 80 30 Z"/></path>'
    +'<path d="M80 78 C92 96 96 108 96 122 A18 18 0 0 1 62 122 C62 110 68 104 72 96 C76 106 78 108 82 110 Z" fill="var(--bg)" opacity=".85"><animate attributeName="opacity" values=".6;.95;.6" dur="0.7s" repeatCount="indefinite"/></path></svg>';},

  /* TROIS MACROS : trois pastilles titrées qui apparaissent */
  macros:function(){return '<svg viewBox="0 0 300 150" width="280" height="150">'
    +['🥩 Protéines','🌾 Glucides','🥑 Lipides'].map(function(t,i){var x=30+i*90;return ''
      +'<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="'+(0.3+i*0.4)+'s" dur="0.5s" fill="freeze"/>'
      +'<circle cx="'+(x+30)+'" cy="55" r="34" fill="none" stroke="var(--ink)" stroke-width="3">'
      +'<animate attributeName="r" from="8" to="34" begin="'+(0.3+i*0.4)+'s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 1.2 0.4 1"/></circle>'
      +'<text x="'+(x+30)+'" y="62" font-size="26" text-anchor="middle">'+t.split(' ')[0]+'</text>'
      +'<text x="'+(x+30)+'" y="112" font-size="13" font-weight="800" text-anchor="middle" fill="var(--ink)">'+t.split(' ')[1]+'</text></g>';}).join('')
    +'</svg>';},

  /* ASSIETTE : cercle divisé en portions (règle de l'assiette) */
  plate:function(){return '<svg viewBox="0 0 200 200" width="190" height="190">'
    +'<circle cx="100" cy="100" r="80" fill="none" stroke="var(--ink)" stroke-width="4"/>'

    +'<path d="M100 100 L100 20 A80 80 0 0 0 30 140 Z" fill="var(--ink)" opacity=".28"><animate attributeName="opacity" values="0;.28" dur="0.6s" begin="0.3s" fill="freeze"/></path>'
    +'<line x1="100" y1="100" x2="100" y2="20" stroke="var(--ink)" stroke-width="3"/>'
    +'<line x1="100" y1="100" x2="30" y2="140" stroke="var(--ink)" stroke-width="3"/>'
    +'<line x1="100" y1="100" x2="170" y2="140" stroke="var(--ink)" stroke-width="3"/>'
    +'<text x="130" y="70" font-size="20">🥦</text><text x="60" y="150" font-size="20">🍗</text><text x="128" y="150" font-size="20">🍚</text></svg>';},

  /* TIER : trois rangs S/B/C qui se posent */
  tier:function(){return '<svg viewBox="0 0 200 170" width="190" height="170">'
    +[['S',30,'#34c759'],['B',80,'#ff9f0a'],['C',130,'#ff3b30']].map(function(r,i){return ''
      +'<g opacity="0" transform="translate(-40 0)"><animate attributeName="opacity" from="0" to="1" begin="'+(i*0.3)+'s" dur="0.4s" fill="freeze"/>'
      +'<animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" begin="'+(i*0.3)+'s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 1 0.3 1"/>'
      +'<rect x="24" y="'+r[1]+'" width="30" height="34" rx="7" fill="var(--ink)"/>'
      +'<text x="39" y="'+(r[1]+23)+'" font-size="18" font-weight="900" fill="var(--bg)" text-anchor="middle">'+r[0]+'</text>'
      +'<rect x="60" y="'+r[1]+'" width="116" height="34" rx="7" fill="var(--ink)" opacity=".12"/></g>';}).join('')
    +'</svg>';},

  /* PEINDRE : niveau qui monte (jauge de sucre/gras) */
  paint:function(){return '<svg viewBox="0 0 140 200" width="130" height="190">'
    +'<rect x="40" y="20" width="60" height="160" rx="16" fill="none" stroke="var(--ink)" stroke-width="4"/>'
    +'<clipPath id="kc"><rect x="40" y="20" width="60" height="160" rx="16"/></clipPath>'
    +'<g clip-path="url(#kc)"><rect x="40" y="180" width="60" height="160" fill="var(--ink)"><animate attributeName="y" values="180;60;110;60" keyTimes="0;0.45;0.72;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0.8 0.3 1;0.4 0 0.6 1;0.3 0.8 0.3 1"/></rect></g>'
    +'<text x="70" y="140" font-size="30" text-anchor="middle" fill="var(--bg)">%</text></svg>';}
};

function k_fxBg(p){
  if(p.ripple){var r=document.createElement('div');r.className='ripple';k_stage.appendChild(r);
    requestAnimationFrame(function(){r.classList.add('go')});setTimeout(function(){r.remove()},800)}
  if(p.streaks){for(var i=0;i<4;i++){(function(i){var s=document.createElement('div');s.className='streak';
    s.style.top=(20+i*20)+'%';s.style.left='0';s.style.setProperty('--w',(60+Math.random()*40)+'%');
    k_stage.appendChild(s);setTimeout(function(){s.classList.add('go');setTimeout(function(){s.remove()},500)},i*60)})(i)}}
}


function k_emitParticles(span,fx){
  var glyph=fx==='sparkle'?'\u2728':fx==='freeze'?'\u2744\uFE0F':fx==='flow'?'\uD83D\uDCA7':fx==='burn'?'\uD83D\uDD25':null;
  if(!glyph)return;
  var n=fx==='sparkle'?7:5;
  for(var i=0;i<n;i++){(function(i){
    var p=document.createElement('span');p.textContent=glyph;
    p.style.cssText='position:absolute;font-size:'+(10+Math.random()*10)+'px;pointer-events:none;z-index:5;opacity:0';
    span.style.position='relative';span.appendChild(p);
    var ang=(fx==='burn'||fx==='flow')?(-90+(Math.random()*40-20)):(Math.random()*360);
    var dist=30+Math.random()*40, rad=ang*Math.PI/180;
    var dx=Math.cos(rad)*dist, dy=(fx==='flow')?Math.abs(Math.sin(rad)*dist)+20:Math.sin(rad)*dist;
    p.animate([{opacity:0,transform:'translate(0,0) scale(.4)'},{opacity:1,offset:.3},{opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1)'}],
      {duration:900+Math.random()*400,delay:i*60,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(function(){p.remove()},1500);
  })(i)}
}
function k_showPlan(p){
  var el=document.createElement('div');el.className='plan';
  el.dataset.enter=p.enter||'rise';
  if(p.illo!==undefined||p.photo||p.svg){ el.appendChild(k_buildIllu(p)); }
  if(p.content||p.lines){ el.appendChild(k_buildContent(p)); }
  k_stage.appendChild(el);
  /* bouton d'action : UNIQUEMENT sur les frames qui en définissent un (p.btn).
     Ces frames n'auto-avancent pas → leur texte reste jusqu'au clic. */
  var ctaHost=document.getElementById('k_cta');
  if(p.btn){
    ctaHost.innerHTML='<button class="btn">'+p.btn+'</button>';
    ctaHost.classList.remove('on');   /* apparaît après l'animation */
    ctaHost.querySelector('.btn').addEventListener('click',function(e){
      e.stopPropagation();clearTimeout(k_timer);k_si=k_seq.length;k_step();
    });
  } else {
    ctaHost.classList.remove('on');ctaHost.innerHTML='';
  }
  k_fxBg(p);
  k_sEnter(p.enter||'rise');
  var dur=parseFloat(getComputedStyle(el).animationDuration)||1.6;
  setTimeout(function(){el.classList.add('settled')}, dur*1000+40);
  /* le bouton apparaît une fois la scène posée + effets de mots joués */
  if(p.btn){
    var btnDelay=Math.max((p.fxDelay||480)+700, dur*1000+300);
    setTimeout(function(){ if(k_currentEl===el){ document.getElementById('k_cta').classList.add('on'); } }, btnDelay);
  }
  /* déclenche les effets sur mots après l'entrée */
  var gos=el.querySelectorAll('[data-go]');
  gos.forEach(function(g,k){ setTimeout(function(){g.classList.add('go');k_sFx(g.dataset.go)}, (p.fxDelay||480)+k*260) });
  var sems=el.querySelectorAll('[data-sem]');
  sems.forEach(function(g,k){ setTimeout(function(){var fx=g.dataset.sem;k_sSem(fx);k_emitParticles(g,fx)}, (p.fxDelay||480)+k*200) });
  return el;
}

function k_clearPlan(el,outKind){
  if(!el)return;
  el.classList.remove('settled');
  el.classList.add(outKind||'out');
  setTimeout(function(){if(el.parentNode)el.remove()},650);
}

var k_currentEl=null;
function k_step(){
  if(k_si>=k_seq.length){k_playing=false;return}
  var p=k_seq[k_si];
  var prev=k_currentEl;
  if(prev)k_clearPlan(prev,'out-'+(p.outPrev||'')||'out');
  k_currentEl=k_showPlan(p);
  k_markDots();
  /* auto-avance fluide entre les frames ; SEULES les frames avec bouton attendent le clic */
  if(!p.btn && k_playing){ var hold=Math.max(p.hold||1800, 2400); k_timer=setTimeout(function(){ k_si++; k_step(); }, hold); }
}

function k_markDots(){
  k_dotsEl.innerHTML=k_seq.map(function(_,k){return '<div class="d'+(k===k_si?' on':'')+'"></div>'}).join('');
}

function k_play(id){
  clearTimeout(k_timer);
  k_seq=K_SEQS[id]||[];k_si=0;k_playing=true;
  k_stage.innerHTML='';k_currentEl=null;
  k_hintEl.textContent='tape pour accélérer';
  setTimeout(function(){k_hintEl.textContent=''},2400);
  k_step();
}
function k_replay(){k_play(0)}

/* ═══ PILOTE KINETIC pour la narration ═══ */
var K_RISE_EMOJIS=['🥑','🍅','🥦','🍗','🥚','🌾','🍎','🐟','🥕','🧀','🍌','🫐','🥔','🌽'];
var k_riseTimer=null;
function k_riseSpawn(){
  var host=document.getElementById('k_rise');if(!host)return;
  var e=document.createElement('span');e.className='em';
  e.textContent=K_RISE_EMOJIS[Math.floor(Math.random()*K_RISE_EMOJIS.length)];
  e.style.left=(Math.random()*100)+'%';
  var dur=6+Math.random()*5;
  e.style.animationDuration=dur+'s';
  e.style.fontSize=(20+Math.random()*26)+'px';
  e.style.setProperty('--r',((Math.random()*40)-20)+'deg');
  host.appendChild(e);
  setTimeout(function(){if(e.parentNode)e.remove()},dur*1000+200);
}
function k_riseStart(){ /* désactivé : plus d'emojis montants */ }
function k_riseStop(){ clearInterval(k_riseTimer);k_riseTimer=null; var h=document.getElementById('k_rise');if(h)h.innerHTML=''; }
var k_onDone=null;
function k_playSeq(seqArr,onDone){
  clearTimeout(k_timer);
  K_SEQS._live=seqArr;k_seq=seqArr;k_si=0;k_playing=true;k_onDone=onDone||null;
  var layer=document.getElementById('klayer');layer.classList.add('on');
  k_stage.innerHTML='';k_currentEl=null;
  k_step();
}
/* fin de séquence -> callback */
var _k_step_orig=k_step;
k_step=function(){
  if(k_si>=k_seq.length){k_playing=false;
    var layer=document.getElementById('klayer');
    k_riseStop();
    var cta=document.getElementById('k_cta');if(cta){cta.classList.remove('on');cta.innerHTML='';}
    if(k_currentEl)k_clearPlan(k_currentEl,'out-'+k_pick(K_OUTS));   /* la frame d'action sort proprement, sortie variée */
    setTimeout(function(){layer.classList.remove('on');k_stage.innerHTML='';k_currentEl=null;if(k_onDone){var f=k_onDone;k_onDone=null;f();}},620);
    return;
  }
  _k_step_orig();
};
/* tap pour accélérer + bouton passer */
(function(){
  var layer=document.getElementById('klayer');
  layer.addEventListener('click',function(e){
    /* on n'avance QUE via le bouton Suivant — plus de tap pour accélérer,
       ainsi rien ne disparaît tant que l'utilisateur n'a pas cliqué */
    return;
  });
})();
/* « Passer › » retiré : il sautait la fin de la séquence donc le beat entier, ce
   qui permettait d'expédier le palier du jour en quelques secondes — exactement
   ce que le rythme d'un palier par jour cherche à empêcher. */


/* ═══ SÉQUENCES KINETIC PAR MODE & CHAPITRE ═══ */
var K_MODE_META={
  nutrition:{emoji:'🍎', word:'APPRENDRE', tag:'Apprentissage',
    lines:[[{t:'On '},{t:'comprend',fx:'hl'}]]},
  jeu:{emoji:'🎮', word:'À TOI DE JOUER', tag:'Mini-jeu',
    lines:[[{t:'À '},{t:'toi',fx:'zoom'},{t:' de jouer'}]]},
  cuisine:{emoji:'🍳', word:'EN CUISINE', tag:'Cuisine',
    lines:[[{t:'En '},{t:'cuisine',fx:'hl'}]]},
  defi:{emoji:'🔥', word:'DÉFI', tag:'Défi',
    lines:[[{t:'Relève le '},{t:'défi',fx:'hlY'}]]}
};
var K_GAME_SVG={
  gameSwipe:'swipe', gameCan:'paint', gameFill:'gauge', gameBalance:'balance',
  gamePlate:'plate', gameTier:'tier', gameSear:'flame', gameCook:'flame',
  bmr:'flame', gameGuessMacro:'macros', gamePlateMacro:'plate', gameMeal:'plate',
  saveurAnim:'balance', gameSauce:'balance'
};
function k_modeSeq(mode,b){
  var m=K_MODE_META[mode]||K_MODE_META.nutrition;
  var svg = b && K_GAME_SVG[b.type];
  /* UNE seule scène de 3s : illustration animée + titre animé, puis redirection */
  return [{
    enter:'reveal', hold:3000,
    svg: svg||undefined, illo: svg?undefined:m.emoji, illoAnim:'float',
    size:'xl', content:[{t:m.word}], fxDelay:700
  }];
}
function k_chapterSeq(no,label,mode){
  return [{
    enter:'glide', hold:3200, size:'big',
    lines:[[{t:'Chapitre '+no}]], sub:label, fxDelay:600
  }];
}
/* fin de la journée : le palier est bouclé, le suivant attend demain.
   Frame à bouton → elle reste figée jusqu'au clic (cf. k_step), ce qui laisse le
   temps de lire ce qui arrive demain. */
function k_demainSeq(P){
  var suiv=PALIERS[P]; /* PALIERS est indexé de 0 : PALIERS[P] est bien le palier P+1 */
  return [{
    enter:'reveal', size:'big', illo:'🌙', illoAnim:'float',
    lines:[[{t:'Palier '+P+' '},{t:'terminé',fx:'hl'}]],
    sub: suiv ? ('Le palier '+(P+1)+' — '+suiv.titre+' — s\'ouvre demain. Une journée, un palier : c\'est ce qui fait tenir.')
              : 'Tu as tout terminé.',
    fxDelay:600, btn:'Voir ma progression'
  }];
}
/* ouverture d'une nouvelle journée. 2 s, calendrier, puis on enchaîne sur le
   chapitre — même forme qu'une annonce de chapitre, volontairement. */
function k_jourSeq(P){
  var p=PALIERS[P-1];
  return [{
    enter:'glide', hold:2000, size:'big', illo:'📅', illoAnim:'float',
    lines:[[{t:'Jour '+P}]], sub:p?p.titre:'', fxDelay:600
  }];
}
/* convertit un beat 'say' (titre + hl + sub + em) en mini-vidéo kinetic uniforme */
/* Pool d'entrées pour les beats 'say' : sobre et "clean", façon Apple keynote —
   pas de glitch/bounce/tunnel/squash ici (trop ludiques, réservés aux jeux/défis).
   k_pick() fait tourner la liste en rond à chaque appel : chaque 'say' consécutif
   varie, sans jamais rejouer deux fois la même entrée d'affilée. */
var K_ENTERS=['glide','parallax','reveal','rise','pop'];
var K_OUTS=['lift','settle','drop','slide','up'];
var k_entI=0;
function k_pick(arr){var v=arr[k_entI%arr.length];k_entI++;return v;}
function k_sayToSeq(b){
  /* UNE seule scène centrée : (emoji) + titre animé (+ sous-titre) + bouton en bas.
     Rien ne disparaît : le plan reste jusqu'au clic. */
  var titleTokens=[{t:b.title||''}];
  if(b.hl){ titleTokens=[{t:(b.title?b.title+' ':'')},{t:b.hl,fx:'hl'}]; }
  return [{
    enter:b.enter||k_pick(K_ENTERS), hold:0,
    illo: b.em||undefined, illoAnim:'float',
    size: (b.title && b.title.length>26)?'med':'big',
    lines:[titleTokens], sub:b.sub||undefined, fxDelay:850,
    btn:(b.cta||'Continuer')
  }];
}

/* ═══ DÉMARRAGE : lance le premier beat via go() (kinetic prêt) ═══
   L'intro cinématique ne se joue qu'à la toute première venue sur Défis.
   Ensuite on atterrit directement sur la carte des épreuves.
   On rend quand même le beat courant sous la carte, pour que la fermeture
   de la carte retombe sur un écran valide et non sur un stage vide. */
var NARR_SEEN_KEY='natty_narration_intro_vue';
function narrIntroDejaVue(){ try{ return localStorage.getItem(NARR_SEEN_KEY)==='1'; }catch(e){ return false; } }
function narrMarquerIntroVue(){ try{ localStorage.setItem(NARR_SEEN_KEY,'1'); }catch(e){} }

(function k_boot(){
  if(typeof k_stage==='undefined'||!document.getElementById('k_stage')){ return setTimeout(k_boot,30); }
  /* reprise là où on s'était arrêté ; borné à STORY au cas où le scénario aurait
     raccourci depuis la dernière visite (un idx périmé planterait go()) */
  var p=progLire();
  if(p){
    maxIdx=Math.max(0,Math.min(p.max|0,STORY.length-1));
    idx=Math.max(0,Math.min(p.idx|0,maxIdx));
    palierOuvert=Math.max(1,Math.min(p.ouvert|0||1,PALIERS.length));
    palierFinLe=p.finLe||null;
    xp=xpGagnes();
  }
  /* le jour a-t-il tourné depuis la dernière visite ? */
  var nouveauJour=progRollover();
  if(narrIntroDejaVue()){
    /* on repartait bloqué au bord d'un palier, et il vient de s'ouvrir : on
       franchit le pas nous-même et on annonce la journée, plutôt que de rendre
       à nouveau le dernier beat de la veille déjà joué. */
    if(nouveauJour&&auBordDuPalier()&&palierDe(idx+1)<=palierOuvert){
      idx++;progEcrire();
      k_playSeq(k_jourSeq(palierDe(idx)),function(){ go(); });
    } else {
      go();
      openMap();
    }
  } else {
    narrMarquerIntroVue();
    go();
  }
})();
</script>

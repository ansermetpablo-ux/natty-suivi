<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- ⚠️ `viewport-fit=cover` est OBLIGATOIRE pour que `env(safe-area-inset-*)`
     renvoie autre chose que 0. Sans lui, tout le calcul de safe-area du CSS
     ci-dessous est écrit… et sans effet : retour, carte et en-tête passaient
     sous la barre d'état de l'iPhone, donc inatteignables (constaté sur
     iPhone 17 Pro). Le correctif CSS existait déjà, il lui manquait ça. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Aucun zoom : ni pincée, ni double-tap (le <meta viewport> ne suffit pas,
     iOS l'ignore). Synchrone et dans le <head>, comme theme.js. -->
<script src="/assets/zoom.js"></script>
<meta name="theme-color" content="#ffffff">
<title>Natty · Parcours</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--bg:#fff;--ink:#0d0d0f;--muted:#8a8a92;--line:#ececf0;
  --so:6px 6px 16px rgba(174,174,192,.28),-6px -6px 16px rgba(255,255,255,.9);
  --green:#34c759;--red:#ff3b30;--amber:#ff9f0a}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;position:relative;height:100%}

/* ── décor animé de fond ── */
.bg-blobs{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:drift 14s ease-in-out infinite}
.blob.b1{width:280px;height:280px;background:#ffe8d6;top:-60px;left:-70px}
.blob.b2{width:240px;height:240px;background:#e3f3e8;bottom:-40px;right:-60px;animation-delay:-5s}
.blob.b3{width:200px;height:200px;background:#e9e6f7;top:40%;left:50%;animation-delay:-9s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-24px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.95)}}
.floaters{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.floater{position:absolute;font-size:26px;opacity:.18;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(320deg)}}

/* ── barre du haut ── */
/* height + padding-top intègrent la safe area : ce fichier est autonome et ne
   charge pas assets/style.css, il ne bénéficie donc pas du correctif commun.
   Sans ça, retour et carte passent sous l'encoche sur iPhone. */
.top{position:absolute;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top, 0px));padding:env(safe-area-inset-top, 0px) 18px 0;display:flex;align-items:center;gap:12px;z-index:10002}
.top-back{width:34px;height:34px;border-radius:50%;background:var(--bg);box-shadow:var(--so);border:none;font-size:15px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;pointer-events:none;transition:opacity .3s}
.top-back.on{opacity:1;pointer-events:auto}
.top-menu{width:34px;height:34px;border-radius:50%;background:var(--bg);box-shadow:var(--so);border:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-menu svg{width:18px;height:18px}
.segs{flex:1;display:flex;gap:4px}
.seg{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg{position:relative}
.seg .fill{height:100%;width:0%;background:var(--ink);border-radius:2px;transition:width .5s ease}
/* « Vous êtes ici » : la barre dit ce qui est acquis, ce trait dit où on lit. */
.seg .cur{position:absolute;top:-2px;width:2px;height:8px;border-radius:1px;background:var(--accent,#0a6ebd);transform:translateX(-1px);transition:left .5s ease;opacity:.9}
.top-map{width:34px;height:34px;border-radius:50%;background:var(--bg);box-shadow:var(--so);border:none;font-size:15px;cursor:pointer;flex-shrink:0}
.top-pal{height:34px;padding:0 12px;border-radius:99px;background:var(--bg);box-shadow:var(--so);border:none;font-family:'Inter',sans-serif;cursor:pointer;flex-shrink:0;display:flex;align-items:baseline;gap:1px}
.top-pal .tp-n{font-size:15px;font-weight:900;color:var(--ink)}
.top-pal .tp-s{font-size:11px;font-weight:800;color:var(--muted)}

/* ── scène ── */
.stage{position:absolute;inset:0;overflow:hidden;z-index:10}
.beat{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 34px 60px;text-align:center;will-change:transform,opacity}

/* transitions d'entrée/sortie variées (classe posée en JS) */
.beat.enter-slide{animation:enterSlide .55s cubic-bezier(.4,0,.2,1) both}
.beat.exit-slide{animation:exitSlide .5s cubic-bezier(.4,0,.2,1) both}
@keyframes enterSlide{from{transform:translateX(100%);opacity:.4}to{transform:translateX(0);opacity:1}}
@keyframes exitSlide{from{transform:translateX(0);opacity:1}to{transform:translateX(-100%);opacity:0}}
.beat.enter-zoom{animation:enterZoom .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes enterZoom{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.beat.exit-zoom{animation:exitZoom .4s ease both}
@keyframes exitZoom{from{transform:scale(1);opacity:1}to{transform:scale(1.25);opacity:0}}
.beat.enter-up{animation:enterUp .55s cubic-bezier(.34,1.4,.64,1) both}
@keyframes enterUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.beat.exit-up{animation:exitUp .4s ease both}
@keyframes exitUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}

/* entrées d'éléments en cascade */
.pop{opacity:0;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.9)}to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.32s}.d4{animation-delay:.46s}.d5{animation-delay:.6s}

/* narration */
.n-title{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.12}
.n-rule{width:54px;height:5px;background:var(--ink);border-radius:3px;margin:20px 0}
.n-sub{font-size:25px;font-weight:400;line-height:1.35;max-width:340px}
.n-hl{display:inline-block;background:var(--ink);color:#fff;padding:2px 16px;border-radius:12px;font-weight:800;animation:hlPop .5s cubic-bezier(.34,1.7,.5,1) both;animation-delay:.35s}
@keyframes hlPop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.n-em{font-size:70px;margin-top:20px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}

/* boutons */
.cta{position:relative;width:100%;max-width:340px;margin:26px auto 0;left:auto;right:auto;bottom:auto;z-index:1;display:flex;justify-content:center}
.btn{width:100%;padding:18px;background:var(--ink);color:#fff;border:none;border-radius:20px;font-family:'Inter',sans-serif;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 12px 30px rgba(13,13,15,.22);transition:transform .1s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:var(--so)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
.btn.ghost::after{background:linear-gradient(120deg,transparent,rgba(174,174,192,.18),transparent)}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}

/* choix */
.choices{display:flex;flex-direction:column;gap:15px;width:100%;max-width:360px;margin-top:34px}
.choice{width:100%;padding:22px;background:var(--ink);color:#fff;border:none;border-radius:20px;font-size:19px;font-weight:400;cursor:pointer;box-shadow:0 12px 26px rgba(13,13,15,.18);transition:transform .12s;line-height:1.3;font-family:'Inter',sans-serif}
.choice:active{transform:scale(.96)}
.choice b{font-weight:800}
.choice.chosen{animation:chosenPulse .5s ease}
@keyframes chosenPulse{0%{transform:scale(1)}50%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(13,13,15,.12)}100%{transform:scale(1)}}

/* macro reveal — les 3 icônes qui tombent en scène */
.macro-stage{display:flex;gap:16px;margin-top:10px}
.macro-orb{width:88px;height:88px;border-radius:26px;background:var(--bg);box-shadow:var(--so);display:flex;align-items:center;justify-content:center;font-size:44px;opacity:0}
.macro-orb.drop{animation:drop .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-120px) rotate(-30deg)}70%{opacity:1}100%{opacity:1;transform:translateY(0) rotate(0)}}
.macro-orb .em{animation:spin3d 3s ease-in-out infinite}
@keyframes spin3d{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}

/* flash card */
.fc-head{position:absolute;top:60px;left:34px;right:34px;font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.fc{width:100%;max-width:290px;aspect-ratio:3/4;perspective:1200px;cursor:pointer;margin-top:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.16)}
.fc-front{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.fc-front .fc-em{font-size:92px;animation:bob 2.8s ease-in-out infinite}
.fc-front .fc-name{font-size:23px;font-weight:800;margin-top:22px}
.fc-frontphoto{position:absolute;inset:0;background-size:cover;background-position:center}
.fc-frontphoto::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.85))}
.fc-nameover{position:absolute;bottom:44px;left:0;right:0;text-align:center;color:#fff;z-index:1;margin-top:0}
.fc-hintover{color:rgba(255,255,255,.7)!important}
.fc-back{transform:rotateY(180deg);background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 26px 40px}
.fc-photo{position:absolute;inset:0;background-size:cover;background-position:center;animation:kenburns 8s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
.fc-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.95) 84%)}
.fc-btitle{position:relative;z-index:1;font-size:26px;font-weight:900;letter-spacing:-.5px;color:#fff;text-transform:uppercase;line-height:1}
.fc-brule{position:relative;z-index:1;width:90px;height:2px;background:rgba(255,255,255,.9);margin:14px 0 12px}
.fc-bdesc{position:relative;z-index:1;font-size:15px;font-weight:400;color:rgba(255,255,255,.92);line-height:1.5;max-width:230px}
.fc-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);z-index:2}
.tap-ring{position:absolute;bottom:34px;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:50%;border:2px solid var(--ink);opacity:.5;animation:tapRing 1.6s ease-out infinite;pointer-events:none;z-index:3}
@keyframes tapRing{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.5);opacity:0}}

/* jeu tri */
.g-count{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.g-food{font-size:88px;margin-bottom:6px;animation:foodIn .45s cubic-bezier(.34,1.6,.5,1)}
@keyframes foodIn{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.g-name{font-size:22px;font-weight:800;margin-bottom:26px}
.g-opts{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.g-opt{padding:17px;background:var(--bg);box-shadow:var(--so);border:none;border-radius:16px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .1s;font-family:'Inter',sans-serif}
.g-opt:active{transform:scale(.97)}
.g-opt.ok{background:var(--green);color:#fff;box-shadow:none;animation:okShake .4s}
.g-opt.ko{background:var(--red);color:#fff;box-shadow:none;animation:koShake .4s}
@keyframes okShake{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes koShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* récompense */
.end-em{font-size:80px;animation:rewardPop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes rewardPop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.end-xp{font-size:46px;font-weight:900;letter-spacing:-2px;margin-top:14px}
.end-l{font-size:15px;color:var(--muted);margin-top:4px}

/* particules */
.particle{position:absolute;pointer-events:none;z-index:60;font-size:22px;animation:pFly .8s ease-out forwards}
@keyframes pFly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.4)}}
.confetti{position:fixed;top:-14px;width:9px;height:15px;z-index:70;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}

/* ── ANNONCE DÉFI : écran noir cinématographique ── */
.defi-announce{position:absolute;inset:0;background:#000;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;opacity:0;pointer-events:none}
.defi-announce.on{opacity:1;pointer-events:auto;animation:daIn .5s ease both}
.defi-announce.out{animation:daOut .5s ease both}
@keyframes daIn{from{opacity:0}to{opacity:1}}
@keyframes daOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.1)}}
.da-glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);animation:daGlow 3s ease-in-out infinite}
@keyframes daGlow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.25);opacity:1}}
.da-eyebrow{font-size:13px;font-weight:800;letter-spacing:4px;color:rgba(255,255,255,.5);text-transform:uppercase;opacity:0;animation:daUp .5s ease .15s forwards}
.da-em{font-size:96px;margin:18px 0;opacity:0;animation:daPop .6s cubic-bezier(.34,1.6,.5,1) .35s forwards}
@keyframes daPop{from{opacity:0;transform:scale(.3) rotate(-20deg)}to{opacity:1;transform:none}}
.da-title{font-size:38px;font-weight:900;letter-spacing:-1px;color:#fff;line-height:1.1;opacity:0;animation:daUp .55s cubic-bezier(.34,1.4,.6,1) .55s forwards}
.da-sub{font-size:17px;color:rgba(255,255,255,.6);margin-top:14px;max-width:320px;line-height:1.5;opacity:0;animation:daUp .55s ease .8s forwards}
@keyframes daUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.da-line{width:0;height:3px;background:#fff;border-radius:2px;margin:22px 0;animation:daLine .6s ease .7s forwards}
@keyframes daLine{to{width:64px}}
.da-cta{position:absolute;bottom:56px;left:34px;right:34px;opacity:0;animation:daUp .5s ease 1.15s forwards}
.da-cta button{width:100%;padding:18px;background:#fff;color:#000;border:none;border-radius:20px;font-family:'Inter',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:transform .1s}
.da-cta button:active{transform:scale(.97)}
.da-spark{position:absolute;font-size:18px;opacity:0;animation:daSpark 2.4s ease-in-out infinite}
@keyframes daSpark{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.8;transform:scale(1)}}

/* ── écran de défi (fond noir maintenu) ── */
.beat.defi-mode{background:#000;color:#fff}
.defi-badge{background:#fff;color:#000;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:800;position:absolute;top:64px;left:50%;transform:translateX(-50%)}
.defi-prog{display:flex;gap:12px;margin-top:52px;margin-bottom:8px}
.defi-prog .dp{width:38px;height:38px;border-radius:12px;background:#1c1c20;display:flex;align-items:center;justify-content:center;font-size:19px;opacity:.4;transition:all .3s}
.defi-prog .dp.cur{opacity:1;transform:scale(1.15);background:#2a2a30}
.defi-prog .dp.done{opacity:1;border:2px solid #fff}
.defi-target{font-size:82px;animation:bob 2.6s ease-in-out infinite}
.defi-label{font-size:22px;font-weight:900;letter-spacing:-.4px;margin-top:6px;color:#fff}
.defi-hint{font-size:14px;color:rgba(255,255,255,.55);margin-top:8px;max-width:300px;line-height:1.4}
.defi-shot{width:190px;height:190px;border-radius:24px;margin-top:18px;border:2px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.defi-shot.filled{border:none;animation:shotPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes shotPop{from{transform:scale(.85)}to{transform:scale(1)}}
.defi-shot img{width:100%;height:100%;object-fit:cover}
.shot-check{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.shot-check.err{background:#ff3b30;color:#fff}
.defi-shot .verifying{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:12px;font-weight:700}
.defi-spinner{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:defiSpin .7s linear infinite}
@keyframes defiSpin{to{transform:rotate(360deg)}}
.defi-retry-msg{font-size:13px;color:#ff6b6b;margin-top:12px;max-width:280px;line-height:1.4;font-weight:600;min-height:0}
.defi-btn{width:100%;padding:18px;background:#fff;color:#000;border:none;border-radius:20px;font-family:'Inter',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:transform .1s}
.defi-btn:active{transform:scale(.97)}
.defi-recap{display:flex;gap:12px;justify-content:center}
.defi-recap .dr{position:relative;width:92px;height:120px;border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.defi-recap .dr img{width:100%;height:100%;object-fit:cover}
.defi-recap .dr span{position:absolute;bottom:6px;left:6px;font-size:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}

/* ── feedback de choix ── */
.choice-fb{margin-top:22px;font-size:16px;font-weight:600;color:var(--ink);line-height:1.4;max-width:330px;opacity:0;transform:translateY(10px);transition:all .4s ease}
.choice-fb.on{opacity:1;transform:none}

/* ── jeu étiquette ── */
.lbl-card{width:100%;max-width:300px;border-radius:22px;overflow:hidden;box-shadow:var(--so);margin-bottom:18px}
.lbl-photo{width:100%;height:150px;background-size:cover;background-position:center;position:relative}
.lbl-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.lbl-vals{display:flex;justify-content:space-around;padding:12px 8px;background:var(--bg);font-size:13px;font-weight:800}
.lbl-vals span{color:var(--ink)}

/* ── jeu saisir (plaque vue de dessus) ── */
.sear-hob{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#2a2a30,#0d0d0f);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 4px 20px rgba(0,0,0,.6);margin-bottom:22px}
.sear-flame{position:absolute;font-size:30px;opacity:0;transition:opacity .4s;animation:flick .4s ease-in-out infinite}
.sear-flame.on{opacity:1}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.sear-pan{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#4a4a52,#26262e);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.sear-em{font-size:64px}
.sear-act{font-size:19px;font-weight:800;color:var(--ink);text-align:center;max-width:300px;margin-bottom:16px;min-height:48px}
.sear-wait{width:100%;max-width:260px}
.sear-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.sear-fill{height:100%;width:0%;background:var(--ink);border-radius:4px}

/* ── jeu cuisson (barre) ── */
.cook-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.cook-em{font-size:78px;animation:bob 2.6s ease-in-out infinite}
.cook-stage{font-size:17px;font-weight:800;margin:6px 0 18px}
.cook-track{position:relative;width:100%;max-width:300px;height:14px;border-radius:8px;background:var(--line);overflow:visible;box-shadow:var(--si,inset 2px 2px 5px rgba(174,174,192,.4))}
.cook-fill{height:100%;background:linear-gradient(90deg,#34c759,#ff9f0a,#ff3b30);border-radius:8px;width:0%}
.cook-ideal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px;z-index:2}
.cook-ideal::after{content:'🎯';position:absolute;top:-24px;left:-8px;font-size:15px}
.cook-target{font-size:14px;color:var(--muted);margin-top:16px}
.cook-target b{color:var(--ink)}

/* ── jeu reconnaître cuisson ── */
.guess-em{font-size:96px;margin-bottom:6px}

/* ── BMR ── */
.bmr-profile{font-size:13px;color:var(--muted);margin:8px 0 20px;font-weight:600}
.bmr-calc{width:100%;max-width:320px}
.bmr-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg);box-shadow:var(--so);border-radius:14px;margin-bottom:10px;font-size:14px;font-weight:600}
.bmr-row b{font-size:17px;font-weight:800}
.bmr-big{display:flex;flex-direction:column;align-items:center;padding:18px;background:var(--ink);border-radius:18px;color:#fff;margin-top:4px}
.bmr-big span{font-size:12px;opacity:.6;font-weight:600}
.bmr-big b{font-size:38px;font-weight:900;letter-spacing:-1px;margin:2px 0}
.bmr-big small{font-size:12px;opacity:.6}
.bmr-macros{display:flex;gap:12px;margin-top:16px;opacity:0;transform:translateY(14px);transition:all .5s}
.bmr-macros.show{opacity:1;transform:none}
.bmr-m{background:var(--bg);box-shadow:var(--so);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;min-width:72px}
.bmr-m-em{font-size:24px}
.bmr-m b{font-size:20px;font-weight:800;margin-top:4px}
.bmr-m small{font-size:11px;color:var(--muted)}

/* ── tier list ── */
.tier-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.tier-current{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.tier-food{font-size:70px;animation:foodIn .4s cubic-bezier(.34,1.6,.5,1)}
.tier-fname{font-size:18px;font-weight:800;margin-top:4px}
.tier-rows{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.tier-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg);border:2px solid;border-radius:16px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;transition:transform .1s}
.tier-row:active{transform:scale(.97)}
.tier-badge{width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}

/* ── assiette ── */
.plate-pie{width:150px;height:150px;border-radius:50%;box-shadow:var(--so);margin:14px 0 20px;transition:background .2s}
.plate-rows{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px}
.plate-row .plate-lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:5px}
.plate-row input{width:100%}

/* ── remplir macro ── */
.fill-gauge{width:100%;max-width:300px;margin:8px 0 18px}
.fill-gaugebar{position:relative;height:22px;border-radius:12px;background:var(--line);overflow:hidden;box-shadow:inset 2px 2px 5px rgba(174,174,192,.4)}
.fill-gaugefill{height:100%;background:linear-gradient(90deg,#ff6b35,#ff9500);border-radius:12px;transition:width .3s cubic-bezier(.34,1.4,.6,1)}
.fill-val{text-align:center;font-size:24px;font-weight:900;margin-top:10px;letter-spacing:-1px}
.fill-val small{font-size:14px;color:var(--muted);font-weight:600}
.fill-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
.fill-item{padding:10px 14px;background:var(--bg);box-shadow:var(--so);border:none;border-radius:14px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif}
.fill-item b{color:#ff6b35}

/* ── analyse repas ── */
.meal-why{margin-top:16px;font-size:14px;font-weight:600;color:var(--ink);max-width:320px;line-height:1.4;opacity:0;transition:opacity .4s}
.meal-why.on{opacity:1}

/* ── défi compose (fond noir) ── */
.cmp-diag{width:100%;max-width:320px;margin:44px 0 12px}
.cmp-bar{margin-bottom:9px}
.cmp-bh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#fff;margin-bottom:4px}
.cmp-track{height:12px;border-radius:6px;background:#1c1c20;overflow:hidden}
.cmp-fill{height:100%;border-radius:6px;transition:width .35s cubic-bezier(.34,1.4,.6,1)}
.cmp-cal{text-align:center;font-size:14px;font-weight:800;color:#fff;margin-top:8px}
.cmp-picked{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px;margin-bottom:10px;max-width:340px}
.cmp-chip{background:#2a2a30;color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.cmp-empty{color:rgba(255,255,255,.4);font-size:13px}
.cmp-pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:344px;max-height:150px;overflow-y:auto}
.cmp-item{padding:9px 12px;background:#1c1c20;border:none;border-radius:12px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;font-family:'Inter',sans-serif}
.cmp-manual{background:#fff;color:#000}

/* ── canette/steak : sujet détouré sur panneau BLANC, jauge épousant la forme ── */
.paint-sub{font-size:12.5px;color:var(--muted);margin:6px 0 12px;max-width:320px;line-height:1.5}
.paint-hero{background:#ffffff;border-radius:28px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin:2px auto 4px;display:inline-flex;flex-direction:column;align-items:center;width:fit-content;max-width:88%}
.paint-stage{position:relative;cursor:ns-resize;touch-action:none;line-height:0;display:block}
.paint-stage .paint-base{display:block;height:210px;width:auto;filter:grayscale(1) brightness(.82) contrast(1) opacity(.3)}
.paint-stage .paint-fill{position:absolute;left:0;top:0;height:210px;width:auto;filter:saturate(1.12);clip-path:inset(100% 0 0 0)}
.paint-line{position:absolute;left:-12px;right:-12px;height:3px;background:#111;box-shadow:0 0 10px rgba(0,0,0,.3);opacity:0;pointer-events:none;border-radius:2px;z-index:3}
.paint-pct{font-size:44px;font-weight:900;letter-spacing:-2px;margin:16px 0 2px;color:#111}
.paint-unit{font-size:11px;color:#999;font-weight:800;letter-spacing:.5px;text-transform:uppercase}

/* ── photo plat analyse ── */
.pp-photo{width:220px;height:150px;border-radius:20px;background-size:cover;background-position:center;box-shadow:var(--so);margin-bottom:16px}

/* ── devine macros (sliders) ── */
.gm-em{font-size:70px;margin-bottom:4px}
.pm-card{width:100%;max-width:300px;background:#141416;border-radius:22px;padding:12px 12px 14px;margin-bottom:14px;box-shadow:0 16px 40px rgba(0,0,0,.15)}
.pm-photo{width:100%;aspect-ratio:1;border-radius:16px;background-size:cover;background-position:center}
.pm-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 4px 2px;color:rgba(255,255,255,.7);font-size:10px}
.pm-divider span{flex:1;height:1.5px;background:rgba(255,255,255,.7)}
.pm-title{text-align:center;font-size:26px;font-weight:900;letter-spacing:-.5px;color:#fff;margin-top:4px}
.pm-ings{margin-top:10px;padding:0 6px}
.pm-ing{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px}
.pm-ing:last-child{border-bottom:none}
.pm-ing span{color:#c9c9d1}.pm-ing b{color:#fff}
.mc-chip{background:var(--bg);box-shadow:var(--so);border-radius:12px;padding:8px 13px;font-size:12px;font-weight:800;color:var(--ink)}
.gm-row{width:100%;max-width:310px;margin-top:12px;text-align:left}
.gm-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.gm-row input{width:100%}

/* ── animation saveurs ── */
.sav-ring{position:relative;width:240px;height:240px;margin:20px 0}
.sav-ring.spin{animation:savSpin 8s linear infinite}
@keyframes savSpin{to{transform:rotate(360deg)}}
.sav-node{position:absolute;width:60px;height:60px;border-radius:50%;background:var(--bg);box-shadow:var(--so);display:flex;flex-direction:column;align-items:center;justify-content:center;left:50%;top:50%;margin:-30px;opacity:0;transform:scale(.3);transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.sav-node span{font-size:24px}
.sav-node small{font-size:9px;font-weight:700;color:var(--muted)}
.sav-node.on{opacity:1;transform:scale(1)}
#sav0.on{transform:translate(0,-95px) scale(1)}
#sav1.on{transform:translate(90px,-30px) scale(1)}
#sav2.on{transform:translate(56px,78px) scale(1)}
#sav3.on{transform:translate(-56px,78px) scale(1)}
#sav4.on{transform:translate(-90px,-30px) scale(1)}
.sav-center{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px}
.sav-txt{font-size:16px;font-weight:600;color:var(--ink);max-width:300px;line-height:1.4;margin-top:10px}

/* ── créer une sauce ── */
.sauce-goal{font-size:16px;font-weight:800;color:var(--ink);margin:8px 0 14px;background:var(--bg);box-shadow:var(--so);padding:10px 18px;border-radius:99px}
.sauce-bowl{width:120px;height:120px;border-radius:50%;background:var(--bg);box-shadow:var(--si,inset 3px 3px 8px rgba(174,174,192,.4));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;font-size:26px;margin-bottom:16px}
.sauce-bowl small{font-size:11px;color:var(--muted)}
.sauce-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:330px}
.sauce-item{padding:9px 13px;background:var(--bg);box-shadow:var(--so);border:none;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;transition:transform .1s}
.sauce-item.sel{background:var(--ink);color:#fff;box-shadow:none}

/* ── balance supermarché ── */
.bal-goal{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:14px;max-width:320px;line-height:1.3}
.bal-screen{width:100%;max-width:300px;background:#0d0d0f;border-radius:18px;padding:16px;color:#fff;margin-bottom:14px}
.bal-base{font-size:15px;font-weight:700}
.bal-weight{font-size:32px;font-weight:900;letter-spacing:-1px;margin:6px 0}
.bal-weight small{font-size:13px;opacity:.5;font-weight:600}
.bal-added{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:26px}
.bal-chip{background:#2a2a30;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}
.bal-empty{opacity:.4;font-size:12px}
.bal-pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:330px}
.bal-item{padding:9px 12px;background:var(--bg);box-shadow:var(--so);border:none;border-radius:13px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif}

/* ── défi création ── */
.cr-input{width:100%;max-width:320px;padding:15px;border:2px solid #2a2a30;background:#1c1c20;color:#fff;border-radius:14px;font-family:'Inter',sans-serif;font-size:16px;text-align:center;margin-top:8px}
.cr-input::placeholder{color:rgba(255,255,255,.35)}
.cr-picked{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px;margin:12px 0;max-width:330px}
.cr-pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:330px}
.cr-gouts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:16px}
.cr-gout{padding:15px;background:#1c1c20;border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.cr-recap{background:#1c1c20;border-radius:18px;padding:18px;max-width:320px;margin-bottom:16px;text-align:center}
.cr-recap b{font-size:19px;color:#fff}
.cr-recap-ings{font-size:12px;color:rgba(255,255,255,.6);margin:8px 0;line-height:1.5}
.cr-recap-gout{display:inline-block;background:#2a2a30;color:#fff;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700}

/* MAP secours */
/* Même raison que `.top` : « Toutes les épreuves » et ses deux boutons
   collaient à la barre d'état. Le bas aussi, sinon le dernier palier finit
   sous la barre d'accueil. */
.map-screen{position:absolute;inset:0;background:var(--bg);z-index:10001;transform:translateY(100%);transition:transform .45s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:calc(58px + env(safe-area-inset-top, 0px)) 0 calc(104px + env(safe-area-inset-bottom, 0px))}
.map-screen.on{transform:translateY(0)}
/* La barre du haut (retour menu + progression) reste au-dessus de la carte et
   ne défile pas : plus besoin de remonter en haut pour revenir au menu. */
body.map-on .top{background:var(--bg)}
/* z-index au-dessus des sections de palier (2) : elles créent leur propre
   contexte d'empilement et passeraient sinon par-dessus le titre collant. */
/* Barre du bas, hors du flux : elle reste au même endroit pendant tout le
   scroll, comme la barre d'onglets de l'app. */
.map-foot{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:14px 22px calc(16px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.map-go{width:100%;padding:17px;border:none;border-radius:22px;background:var(--ink);color:var(--bg);
  font-family:'Inter',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.2px;cursor:pointer}
.map-go:active{transform:scale(.985)}
.map-hd{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:4px 22px 18px}
.map-hd h2{font-size:20px;font-weight:900}
.map-close{width:34px;height:34px;border-radius:50%;background:var(--bg);box-shadow:var(--so);border:none;font-size:15px;cursor:pointer}
.map-act{display:flex;align-items:center;gap:9px;flex-shrink:0}
/* remise à zéro en deux temps : `confirm()` natif est proscrit ici (rendu et
   blocage variables en WebView Capacitor, cf. portage mobile). */
.map-reset{height:34px;padding:0 12px;border-radius:99px;background:var(--bg);box-shadow:var(--so);border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.map-reset.arme{background:var(--red);color:#fff;box-shadow:none}
/* `column`, et plus `column-reverse` : le rail montait parce qu'on grimpait des
   épreuves une par une. Il n'y en a plus — on lit donc les paliers de 1 à 3, de
   haut en bas. Et le trait vertical qui reliait les vignettes n'a plus rien à
   relier. */
.mrail{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 0}
/* beat pas encore atteint : visible pour donner envie, mais pas cliquable */
.mlbl{font-size:10px;font-weight:700;color:var(--muted);margin-top:5px}

/* ── sections de PALIER dans la carte ──
   Le rail est en column-reverse (le parcours monte) : la section du palier 1 est
   donc en bas, et l'en-tête d'un palier — premier enfant dans le DOM — se pose
   sous ses épreuves, comme un portique qu'on franchit en grimpant. */
/* Plus de liste d'épreuves à faire grimper : les paliers se lisent dans
   l'ordre, de 1 à 3, de haut en bas. */
.mpal{position:relative;z-index:2;width:100%;display:flex;flex-direction:column}
.mpal-hd{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:14px 16px;padding:13px 15px;border:none;border-radius:20px;background:var(--bg);box-shadow:var(--so);font-family:'Inter',sans-serif;text-align:left;color:var(--ink)}
.mpal-em{width:44px;height:44px;flex-shrink:0;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;background:var(--line)}
.mpal-txt{flex:1;min-width:0}
.mpal-n{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mpal-t{font-size:15px;font-weight:800;line-height:1.25;margin-top:1px}
.mpal-meta{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
/* palier en cours : en négatif, comme le nœud courant du rail */
.mpal.cur>.mpal-hd{background:var(--ink);color:#fff}
.mpal.cur .mpal-em{background:rgba(255,255,255,.14)}
.mpal.cur .mpal-n,.mpal.cur .mpal-meta{color:rgba(255,255,255,.62)}
.mpal.done>.mpal-hd{border:2px solid var(--green);padding:11px 13px}
.mpal.todo>.mpal-hd{opacity:.62}
.mpal.lock>.mpal-hd{opacity:.45;cursor:default}
.mpal.lock .mpal-jauge{display:none}
.mpal.nope>.mpal-hd{animation:mpalNope .38s}
@keyframes mpalNope{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.mpal-jauge{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:7px}
.mpal.cur .mpal-jauge{background:rgba(255,255,255,.2)}
.mpal-jauge i{display:block;height:100%;border-radius:2px;background:var(--ink);transition:width .4s ease}
.mpal.cur .mpal-jauge i{background:#fff}
.mpal.done .mpal-jauge i{background:var(--green)}

/* ── TIER LIST glisser-déposer ── */
.tl-wrap{width:100%;max-width:340px}
.tl-tier{display:flex;align-items:stretch;gap:0;border-radius:14px;overflow:hidden;margin-bottom:9px;background:var(--bg);box-shadow:var(--so);min-height:66px}
.tl-badge{width:52px;flex-shrink:0;color:#fff;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tl-drop{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-content:center;transition:background .15s}
.tl-drop.hot{background:rgba(52,199,89,.14)}
.tl-chip{display:flex;align-items:center;gap:5px;background:var(--bg);box-shadow:var(--sx);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800;color:var(--ink)}
.tl-chip .e{font-size:16px}
.tl-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px;min-height:52px}
.tl-item{display:flex;align-items:center;gap:6px;background:var(--bg);box-shadow:var(--so);border-radius:13px;padding:9px 12px;font-size:13px;font-weight:800;color:var(--ink);cursor:grab;touch-action:none;transition:transform .12s}
.tl-item.drag{opacity:.35}
.tl-item .e{font-size:19px}
.tl-ghost{position:fixed;z-index:900;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 12px 28px rgba(0,0,0,.28)}
.tl-hint{font-size:12px;color:var(--muted);margin-top:6px}

/* ── SWIPE tinder ── */
.sw-deck{position:relative;width:100%;max-width:300px;height:390px;margin:6px 0 10px}
.sw-card{position:absolute;inset:0;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.18);touch-action:none;cursor:grab;display:flex;flex-direction:column}
.sw-photo{flex:1;background-size:cover;background-position:center;background-color:#eee}
.sw-info{padding:14px 16px 16px;background:#fff}
.sw-name{font-size:17px;font-weight:900;color:#111;letter-spacing:-.3px}
.sw-meta{font-size:12px;color:#777;margin-top:3px;line-height:1.4}
.sw-stamp{position:absolute;top:22px;font-size:22px;font-weight:900;padding:8px 14px;border-radius:12px;border:3px solid;opacity:0;transform:rotate(-12deg);transition:opacity .12s}
.sw-yes{left:18px;color:#34c759;border-color:#34c759}
.sw-no{right:18px;color:#ff3b30;border-color:#ff3b30;transform:rotate(12deg)}
.sw-btns{display:flex;gap:16px;justify-content:center;margin-top:4px}
.sw-btn{width:62px;height:62px;border-radius:50%;border:none;background:var(--bg);box-shadow:var(--so);font-size:26px;cursor:pointer;transition:transform .12s}
.sw-btn:active{transform:scale(.9)}
.sw-fb{margin-top:14px;font-size:13.5px;font-weight:600;color:var(--ink);max-width:300px;line-height:1.45;min-height:38px;opacity:0;transition:opacity .3s}
.sw-fb.on{opacity:1}
.sw-count{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:700}

/* ── VERDICT REPAS (bon / mauvais) ── */
.mv-btns{display:flex;gap:12px;width:100%;max-width:320px;margin-top:14px}
.mv-btn{flex:1;padding:16px 10px;border:none;border-radius:18px;background:var(--bg);box-shadow:var(--so);font-family:'Inter',sans-serif;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .1s}
.mv-btn:active{transform:scale(.97)}
.mv-btn.ok{background:#34c759;color:#fff;box-shadow:none}
.mv-btn.ko{background:#ff3b30;color:#fff;box-shadow:none}
.mv-crit{width:100%;max-width:320px;margin-top:14px;display:flex;flex-direction:column;gap:7px;opacity:0;transition:opacity .35s}
.mv-crit.on{opacity:1}
.mv-line{display:flex;align-items:flex-start;gap:9px;background:var(--bg);box-shadow:var(--sx);border-radius:12px;padding:9px 11px;text-align:left}
.mv-ic{font-size:15px;flex-shrink:0;margin-top:1px}
.mv-tx{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.4}
.mv-tx b{font-weight:900}
.mv-note{margin-top:10px;font-size:12px;color:var(--muted);font-weight:700}

/* ── ALLIAGE : choisir 2 ingrédients parmi 10 ── */
.al-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:330px;margin-top:8px}
.al-it{background:var(--bg);box-shadow:var(--so);border:2px solid transparent;border-radius:14px;padding:11px 4px;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:70px;justify-content:center;line-height:1.15;transition:transform .1s}
.al-it:active{transform:scale(.95)}
.al-it.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.al-it.ok{background:#34c759;color:#fff;border-color:transparent}
.al-it.ko{background:#ff3b30;color:#fff;border-color:transparent}
.al-slots{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px}
.al-slot{width:74px;height:74px;border-radius:18px;background:var(--bg);box-shadow:inset 3px 3px 8px rgba(174,174,192,.5),inset -2px -2px 6px rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:var(--muted)}
.al-slot small{font-size:9px;font-weight:800;margin-top:2px;color:var(--muted)}
.al-plus{font-size:20px;font-weight:900;color:var(--muted)}
.al-goal{font-size:13px;color:var(--muted);max-width:300px;line-height:1.45;margin-bottom:4px}

/* ── RÔLE DE L'INGRÉDIENT ── */
.rl-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.rl-tag.role{background:#e8f4ff;color:#0a6ebd}
.rl-tag.sos{background:#ffeceb;color:#c2352b}
.rl-tag.timing{background:#fff4e0;color:#b46b00}
.rl-hero{font-size:64px;line-height:1;margin:2px 0 8px;animation:foodIn .42s cubic-bezier(.34,1.6,.5,1)}
.rl-q{font-size:18px;font-weight:900;letter-spacing:-.3px;line-height:1.25;max-width:310px;margin-bottom:4px}
.rl-ctx{font-size:12.5px;color:var(--muted);max-width:300px;line-height:1.45;margin-bottom:14px}
.rl-opts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.rl-opt{padding:14px 15px;background:var(--bg);box-shadow:var(--so);border:none;border-radius:15px;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;line-height:1.3;transition:transform .1s}
.rl-opt:active{transform:scale(.98)}
.rl-opt.ok{background:#34c759;color:#fff;box-shadow:none}
.rl-opt.ko{background:#ff3b30;color:#fff;box-shadow:none}
.rl-why{margin-top:14px;font-size:13px;color:var(--ink);font-weight:600;max-width:320px;line-height:1.5;opacity:0;transition:opacity .35s}
.rl-why.on{opacity:1}

/* ── LIAISONS ENTRE ALIMENTS ── */
.li-pair{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 14px}
.li-food{width:88px;height:88px;border-radius:24px;background:var(--bg);box-shadow:var(--so);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.li-food span{font-size:34px;line-height:1}
.li-food small{font-size:9.5px;font-weight:900;color:var(--muted);text-align:center;padding:0 4px;line-height:1.1}
.li-bond{width:42px;height:3px;border-radius:2px;background:var(--muted);position:relative;opacity:.45}
.li-bond::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--muted);animation:bondPulse 1.6s ease infinite}
@keyframes bondPulse{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.25);opacity:1}}
.li-legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;max-width:330px}
.li-chip{background:var(--bg);box-shadow:var(--sx);border-radius:10px;padding:6px 10px;font-size:10.5px;font-weight:800;color:var(--muted)}

/* ═══════════ UNIVERS ═══════════ */
body{transition:background .6s ease,color .6s ease}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .7s ease}
body[data-u="base"]::before{opacity:0}
body[data-u="defi"]::before{opacity:0}
body[data-u="jeu"]::before{opacity:0}
body[data-u="defi"] .btn{background:var(--accent);color:#141414}
body[data-u="jeu"] .btn{background:#fff;color:#0d0d0f}
body[data-u="defi"] .beat{color:#fff}
body[data-u="jeu"] .beat{color:#fff}
.beat,.topbar{position:relative;z-index:1}

/* ═══════════ TRANSITIONS DE THÈME ═══════════ */
.tr{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
.tr-label{position:absolute;z-index:6;text-align:center;padding:0 28px;max-width:420px}
.tr-kicker{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;opacity:.65;margin-bottom:10px}
.tr-title{font-size:32px;font-weight:900;letter-spacing:-.8px;line-height:1.1}

/* — 1. COUTEAU & CITRON VERT — */
.tr-knife{position:absolute;font-size:82px;top:-140px;left:50%;transform:translateX(-50%) rotate(-18deg);z-index:5;animation:knifeDrop 1.05s cubic-bezier(.7,0,.85,1) forwards}
@keyframes knifeDrop{0%{top:-140px}62%{top:44%}72%{top:41%}100%{top:-160px;opacity:0}}
.tr-half{position:absolute;font-size:78px;top:50%;left:50%;z-index:4}
.tr-halfL{animation:halfL 1.5s .62s cubic-bezier(.2,.9,.3,1) forwards;clip-path:inset(0 50% 0 0);transform:translate(-50%,-50%)}
.tr-halfR{animation:halfR 1.5s .62s cubic-bezier(.2,.9,.3,1) forwards;clip-path:inset(0 0 0 50%);transform:translate(-50%,-50%)}
@keyframes halfL{to{transform:translate(-190%,-50%) rotate(-38deg);opacity:0}}
@keyframes halfR{to{transform:translate(90%,-50%) rotate(38deg);opacity:0}}
.tr-juice{position:absolute;top:50%;left:50%;width:9px;height:9px;border-radius:50%;background:#c9e265;z-index:5;animation:juice .8s .6s ease-out forwards}
@keyframes juice{to{transform:translate(var(--jx),var(--jy)) scale(.2);opacity:0}}
.tr-zoom{animation:trZoom 1.15s .78s cubic-bezier(.2,.9,.25,1) both}
@keyframes trZoom{0%{transform:scale(.14);opacity:0;filter:blur(6px)}55%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}

/* — 2. POÊLE, FLAMME & FUMÉE — */
.tr-pan{position:absolute;font-size:88px;left:-200px;top:52%;z-index:5;animation:panIn 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes panIn{0%{left:-200px;transform:rotate(-25deg)}45%{left:44%;transform:rotate(0)}70%{left:44%;transform:rotate(-9deg)}100%{left:44%;transform:rotate(0);opacity:0}}
.tr-flame{position:absolute;font-size:54px;left:50%;top:56%;transform:translateX(-50%);z-index:4;opacity:0;animation:flameUp 1.5s .5s ease-out forwards}
@keyframes flameUp{0%{opacity:0;transform:translateX(-50%) translateY(30px) scale(.4)}35%{opacity:1;transform:translateX(-50%) translateY(-14px) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-140px) scale(.5)}}
.tr-smoke{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.9) 32%,transparent 68%);z-index:3;opacity:0;animation:smokeSweep 1.7s .55s ease-out forwards}
@keyframes smokeSweep{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(2.4)}}
.tr-fade{animation:trFade 1s 1.1s ease both}
@keyframes trFade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* — 3. REMPLISSAGE LIQUIDE — */
.tr-liquid{position:absolute;left:0;right:0;bottom:0;height:0;z-index:3;animation:liquidRise 1.5s cubic-bezier(.5,0,.3,1) forwards}
@keyframes liquidRise{to{height:112%}}
.tr-wave{position:absolute;top:-22px;left:0;width:200%;height:26px;opacity:.55;animation:waveSlide 1.5s linear infinite}
@keyframes waveSlide{to{transform:translateX(-50%)}}
.tr-rise{animation:trRise 1.1s .75s cubic-bezier(.16,1,.3,1) both}
@keyframes trRise{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:none}}

/* — 4. IRIS / OBTURATEUR — */
.tr-iris{position:absolute;inset:0;z-index:3;animation:irisOpen 1.5s cubic-bezier(.7,0,.2,1) forwards}
@keyframes irisOpen{0%{clip-path:circle(0% at 50% 50%)}100%{clip-path:circle(150% at 50% 50%)}}
.tr-ring{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;border:2.5px solid;transform:translate(-50%,-50%);z-index:4;opacity:.5;animation:ringOut 1.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes ringOut{to{width:640px;height:640px;opacity:0;border-width:.5px}}
.tr-spread{animation:trSpread 1.1s .55s cubic-bezier(.16,1,.3,1) both}
@keyframes trSpread{0%{opacity:0;letter-spacing:14px;filter:blur(8px)}100%{opacity:1;letter-spacing:-.8px;filter:blur(0)}}

/* — 5. INGRÉDIENTS QUI TOMBENT — */
.tr-drop{position:absolute;font-size:40px;z-index:4;top:-70px;animation:ingDrop 1.5s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes ingDrop{0%{top:-70px;transform:rotate(0)}70%{top:56%;transform:rotate(var(--rot))}82%{top:50%}100%{top:53%;opacity:0;transform:rotate(var(--rot)) scale(.4)}}
.tr-bounce{animation:trBounce 1s .95s cubic-bezier(.34,1.56,.64,1) both}
@keyframes trBounce{0%{opacity:0;transform:scale(.3) translateY(-40px)}100%{opacity:1;transform:none}}

/* — 6. VAPEUR BALAYANTE — */
.tr-steam{position:absolute;inset:-25%;z-index:3;opacity:0;background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.96),transparent 62%),radial-gradient(ellipse at 72% 44%,rgba(255,255,255,.92),transparent 58%);animation:steamPass 2s ease-in-out forwards}
@keyframes steamPass{0%{opacity:0;transform:translateX(-60%) scale(1.1)}35%{opacity:1}100%{opacity:0;transform:translateX(60%) scale(1.3)}}
.tr-blur{animation:trBlur 1.3s .5s ease both}
@keyframes trBlur{0%{opacity:0;filter:blur(22px);transform:scale(1.12)}100%{opacity:1;filter:blur(0);transform:none}}

/* — 7. ÉCLATS / TUILES — */
.tr-tile{position:absolute;z-index:3;animation:tileOut 1.4s cubic-bezier(.5,0,.4,1) forwards}
@keyframes tileOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--tr)) scale(.4)}}
.tr-pop{animation:trPop 1s .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes trPop{0%{opacity:0;transform:scale(.5) rotate(-6deg)}100%{opacity:1;transform:none}}

/* jeu étiquettes v2 */
.lbl2{width:100%;max-width:340px;background:var(--bg);box-shadow:var(--so);border-radius:20px;padding:14px;margin-bottom:6px}
.lbl2-photo{width:100%;height:150px;border-radius:14px;background-size:cover;background-position:center;background-color:#eee}
.lbl2-name{font-size:16px;font-weight:900;color:var(--ink);margin-top:12px;letter-spacing:-.3px}
.lbl2-vals{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.lblv{display:flex;justify-content:space-between;background:var(--bg);box-shadow:var(--sx);border-radius:9px;padding:6px 9px;font-size:11.5px;color:var(--muted)}
.lblv b{color:var(--ink);font-weight:800}
.lbl2-ingr{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:10px;text-align:left;padding:8px 10px;background:var(--bg);box-shadow:inset 2px 2px 5px rgba(174,174,192,.4);border-radius:9px}
.lbl2-ingr b{color:var(--ink)}
.lbl2-q{font-size:15px;font-weight:800;color:var(--ink);margin:12px 0 8px}
.g-opts.col{flex-direction:column}
.g-opts.col .g-opt{width:100%;text-align:left}

/* jauge circulaire je mange / je mange pas */
.dial{margin:6px 0 4px;touch-action:none;cursor:pointer;user-select:none}
.dial-q{font-size:15px;font-weight:800;color:var(--ink);margin-top:6px}
.dial-ends{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-top:-6px;padding:0 4px}
.dial-val{font-size:15px;font-weight:800;color:var(--ink);margin:2px 0 10px}
.dial-verdict{font-size:15px;font-weight:900;color:#ff3b30;margin-bottom:10px}
.dial-verdict.g{color:#34c759}

/* ═══ KINETIC MOTION LAYER (scopé #klayer, DA uniforme N&B) ═══ */
#klayer{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:9999;background:#ffffff;display:none;overflow:hidden;perspective:1100px}
body[data-u="defi"] #klayer{background:#0f1014}
body[data-u="jeu"] #klayer{background:#0f1014}
#klayer .k-rise{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#klayer .k-rise .em{position:absolute;bottom:-60px;font-size:30px;opacity:0;will-change:transform,opacity;animation:k_riseUp linear forwards}
@keyframes k_riseUp{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:.5}88%{opacity:.5}100%{opacity:0;transform:translateY(-115vh) rotate(var(--r,20deg))}}
#klayer.on{display:block}
#klayer .stage{position:absolute;inset:0;z-index:10;overflow:hidden}
#klayer .plan{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 28px 150px;text-align:center;transform-style:preserve-3d;will-change:transform,opacity,filter}
#klayer .k-sub{font-size:20px;font-weight:600;color:var(--muted);margin-top:22px;line-height:1.35;max-width:340px;letter-spacing:0}
#klayer .k-dots{position:absolute;top:22px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:30;pointer-events:none}
#klayer .k-dots .d{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.3;transition:all .3s}
#klayer .k-dots .d.on{opacity:1;width:20px;border-radius:3px;background:var(--ink)}
#klayer .btn{padding:17px 32px;border:none;border-radius:20px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;cursor:pointer;color:var(--bg);background:var(--ink);box-shadow:0 12px 30px rgba(13,13,15,.22);opacity:1;min-width:240px;width:100%;max-width:360px}
#klayer .btn:active{transform:scale(.97)}
/* highlights uniformes : noir (hl) / jaune réservé au sens fort. hlO suit --ink pour rester N&B */
#klayer .hlO .bg{background:var(--ink)}
/* ── SORTIES de frames (le plan précédent disparaît proprement) ── */
/* Les animations de sortie réelles (k_o*) sont définies plus bas avec .plan.settled ;
   ce bloc ne fait que garder les plans sortants non cliquables pendant leur transition. */
#klayer .plan.out,#klayer .plan[class*="out-"]{pointer-events:none}
/* barre bouton fixe en bas — ne bouge jamais avec l'animation du plan */
#klayer .k-cta{position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 24px 42px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .4s ease,transform .4s ease}
#klayer .k-cta.on{opacity:1;transform:none;pointer-events:auto}
/* ── correctifs texte : surlignage plein, mots espacés, bouton visible ── */
#klayer .hl,#klayer .hlY,#klayer .hlO{display:inline-block;padding:0 .16em;margin:0 .04em;line-height:1.28}
#klayer .hl .bg,#klayer .hlY .bg,#klayer .hlO .bg{top:0;bottom:0;left:0;right:0;width:0;height:100%}
#klayer .hl.go .bg,#klayer .hlY.go .bg,#klayer .hlO.go .bg{animation:k_paint .38s cubic-bezier(.5,0,.2,1) forwards}
#klayer .big,#klayer .med,#klayer .xl{word-spacing:.06em}
#klayer .big span,#klayer .med span,#klayer .xl span{margin:0 .01em}
@keyframes k_btnIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#klayer .k-svg{display:flex;align-items:center;justify-content:center;margin-bottom:6px}
#klayer .k-svg.float{animation:k_fl 3s ease-in-out infinite}
#klayer .k-svg svg{overflow:visible}
#klayer .k-svg text{font-family:'Inter',sans-serif;fill:var(--ink)}
/* mot qui se scinde en deux (découpe) */
#klayer .cutfx{display:inline-block;position:relative}
#klayer .cutfx .ca,#klayer .cutfx .cb{display:inline-block}
#klayer .cutfx.go .ca{animation:k_cutL .5s cubic-bezier(.3,1,.4,1) forwards}
#klayer .cutfx.go .cb{animation:k_cutR .5s cubic-bezier(.3,1,.4,1) forwards}
@keyframes k_cutL{to{transform:translate(-14px,-4px) rotate(-7deg)}}
@keyframes k_cutR{to{transform:translate(14px,4px) rotate(7deg)}}
#klayer .cutfx .slash{position:absolute;left:50%;top:-10%;height:120%;width:2px;background:var(--ink);opacity:0;transform:translateX(-50%) scaleY(0)}
#klayer .cutfx.go .slash{animation:k_slash .3s ease forwards}
@keyframes k_slash{0%{opacity:0;transform:translateX(-50%) scaleY(0)}40%{opacity:1;transform:translateX(-50%) scaleY(1)}100%{opacity:0;transform:translateX(-50%) scaleY(1)}}
body[data-u="defi"] #klayer .hl .bg{background:#fff}
body[data-u="defi"] #klayer .hl{color:#0d0d0f}
body[data-u="jeu"] #klayer .hl .bg{background:#fff}
body[data-u="jeu"] #klayer .hl{color:#0d0d0f}
#klayer .xl{font-size:80px;font-weight:900;letter-spacing:-2px;line-height:1.04}#klayer .big{font-size:60px;font-weight:900;letter-spacing:-1.2px;line-height:1.08}#klayer .med{font-size:46px;font-weight:800;letter-spacing:-.6px;line-height:1.14}#klayer .sm{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.2;color:var(--muted)}#klayer .illubig{font-size:130px;line-height:1}#klayer .line2{margin-top:10px}#klayer [data-enter="rise"]{opacity:0;transform:translateY(64px);animation:k_eRise 1.6s cubic-bezier(.16,.62,.24,1) forwards}
@keyframes k_eRise{to{opacity:1;transform:none}}#klayer [data-enter="drop"]{opacity:0;transform:translateY(-90px) rotate(-6deg);animation:k_eDrop 1.7s cubic-bezier(.18,.8,.28,1) forwards}
@keyframes k_eDrop{to{opacity:1;transform:none}}#klayer [data-enter="through"]{opacity:0;transform:scale(7) translateZ(0);filter:blur(16px);animation:k_eThrough 1.8s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes k_eThrough{50%{opacity:1;filter:blur(2px)}to{opacity:1;transform:scale(1);filter:blur(0)}}#klayer [data-enter="recede"]{opacity:0;transform:scale(.04);filter:blur(7px);animation:k_eRecede 1.6s cubic-bezier(.18,.7,.26,1) forwards}
@keyframes k_eRecede{to{opacity:1;transform:scale(1);filter:blur(0)}}#klayer [data-enter="pop"]{opacity:0;transform:scale(.3);animation:k_ePop 1.3s cubic-bezier(.24,1.15,.4,1) forwards}
@keyframes k_ePop{to{opacity:1;transform:scale(1)}}#klayer [data-enter="squash"]{opacity:0;transform:scaleX(1.9) scaleY(.35);animation:k_eSquash 1.6s cubic-bezier(.2,.95,.34,1) forwards}
@keyframes k_eSquash{40%{opacity:1;transform:scaleX(.68) scaleY(1.34)}70%{transform:scaleX(1.12) scaleY(.9)}to{opacity:1;transform:scale(1)}}#klayer [data-enter="flip3d"]{opacity:0;transform:rotateY(88deg) translateX(70px);transform-origin:left center;animation:k_eFlip 1.7s cubic-bezier(.16,.62,.24,1) forwards}
@keyframes k_eFlip{to{opacity:1;transform:none}}#klayer [data-enter="skew"]{opacity:0;transform:skewX(-32deg) translateX(-70px);animation:k_eSkew 1.5s cubic-bezier(.16,.62,.24,1) forwards}

<script>

  /* ═══ CHAPITRE 4 — COMPOSER UN PLAT ═══ */

  /* ── Le rôle de chaque famille d'ingrédients ── */
  {type:'chapter',anim:'slide',univers:'cuisine',tr:'knife',label:'Le rôle de chaque ingrédient'},
  {type:'say',anim:'up',title:'Une recette, ce n\'est pas une liste.',sub:'Chaque ingrédient y remplit une fonction précise. Quand tu les connais, tu n\'as plus besoin de recette.',cta:'Découvrir'},

  {type:'flash',anim:'slide',em:'🧅',name:'La base aromatique',photo:PH.oignons,btitle:'Oignon, échalote, ail 🧅',
   desc:'Le socle de presque tous les plats du monde. On les fait suer doucement dans le gras AVANT tout le reste : 5 min, translucides, jamais brunis — sinon l\'amertume prend le dessus.'},
  {type:'flash',anim:'slide',em:'🌿',name:'Les herbes fraîches',photo:PH.basilic,btitle:'Les herbes fraîches 🌿',
   desc:'Persil, coriandre, basilic, ciboulette. Leurs arômes sont volatils : on les ajoute hors du feu ou dans les 30 dernières secondes. Cuites, il n\'en reste rien.'},
  {type:'flash',anim:'slide',em:'🌶️',name:'Les épices',photo:PH.curcuma,btitle:'Les épices 🌶️',
   desc:'L\'inverse des herbes : elles ont besoin de chaleur. Torréfie-les 1 min à sec ou dans l\'huile au début — la chaleur libère leurs huiles essentielles. C\'est le geste qui sépare un bon curry d\'un curry fade.'},
  {type:'flash',anim:'slide',em:'🫒',name:'Les matières grasses',photo:PH.huileOlive,btitle:'Huiles & beurre 🫒',
   desc:'Bien plus qu\'un lubrifiant : beaucoup de molécules de goût ne sont solubles que dans le gras. Sans matière grasse, les arômes ne se diffusent pas — le plat reste plat. Huile d\'olive à froid, huiles neutres pour saisir.'},
  {type:'flash',anim:'slide',em:'🍋',name:'Les acides',photo:PH.citron,btitle:'Vinaigre, citron, vin 🍋',
   desc:'Ils réveillent, tranchent le gras et donnent du relief. Un plat fade manque plus souvent d\'acidité que de sel. Toujours en toute fin, hors du feu : la chaleur les tue.'},
  {type:'flash',anim:'slide',em:'🧂',name:'Le sel',photo:PH.cumin,btitle:'Le sel 🧂',
   desc:'Il ne rend pas « salé » : il révèle. Il amplifie la perception du sucré et masque l\'amertume. À doser par petites touches tout au long de la cuisson, jamais en une fois à la fin.'},

  {type:'say',anim:'zoom',title:'Un',hl:'petit jeu',em:'🎯',cta:'Jouer'},
  {type:'gameRole',anim:'up',title:'À quoi ça sert ?',items:[
    {mode:'role',em:'🧅',q:'Pourquoi fait-on suer oignon et ail EN PREMIER ?',
     opts:['Pour construire la base aromatique du plat','Pour les rendre croquants','Pour gagner du temps de cuisson','Pour absorber le gras'],r:0,
     why:'C\'est la fondation : leurs sucres se libèrent lentement et parfument toute la matière grasse, qui parfumera ensuite tout le reste. Sauter cette étape, c\'est bâtir sans fondations.'},
    {mode:'sos',em:'🍅',q:'Ta sauce tomate est trop acide. Que fais-tu ?',
     opts:['Ajouter du sel','Une pointe de sucre, ou une carotte râpée','Rallonger à l\'eau','Plus de tomate'],r:1,
     why:'Le sucré neutralise l\'acidité. Une demi-cuillère suffit, ou mieux : une carotte, dont le sucre naturel fait le même travail sans qu\'on le remarque. L\'eau, elle, diluerait tout le goût.'},
    {mode:'timing',em:'🌿',q:'Quand ajoutes-tu la coriandre fraîche ?',
     opts:['Dès le début avec l\'oignon','À mi-cuisson','Hors du feu, juste avant de servir','Pendant le mijotage'],r:2,
     why:'Les arômes des herbes fraîches sont volatils : ils s\'évaporent à la chaleur. Trente secondes de trop et tu as payé pour rien.'},
    {mode:'sos',em:'🌶️',q:'Ton curry est bien trop piquant. Le meilleur réflexe ?',
     opts:['Ajouter de l\'eau','Yaourt, crème ou lait de coco','Ajouter du sel','Laisser reposer'],r:1,
     why:'La capsaïcine (le piquant) est soluble dans le gras, pas dans l\'eau. Un produit laitier la capture littéralement : c\'est pourquoi le raïta accompagne les plats indiens.'},
    {mode:'role',em:'🧀',q:'Quel rôle joue le parmesan dans une sauce ?',
     opts:['Il apporte de l\'umami et du corps','Il apporte de l\'acidité','Il apporte du croquant','Il apporte des fibres'],r:0,
     why:'Le parmesan est une bombe d\'umami — la cinquième saveur. Il donne cette impression de plat mijoté longtemps. Même effet avec le soja, l\'anchois, le champignon séché ou le concentré de tomate.'},
    {mode:'timing',em:'🥩',q:'Tu vas saisir un steak. Quand le sales-tu ?',
     opts:['Juste avant, ou bien 40 min avant','Uniquement dans l\'assiette','Pendant la cuisson','Jamais'],r:0,
     why:'Deux fenêtres marchent : immédiatement avant (le sel n\'a pas le temps de faire sortir l\'eau) ou 40 min avant (la saumure est réabsorbée). Entre les deux, la surface est humide et la viande bout au lieu de dorer.'},
    {mode:'sos',em:'🧂',q:'Ton plat est trop salé. La bonne correction ?',
     opts:['Beaucoup d\'eau','Un féculent + un trait d\'acide','Du sucre','Rien, c\'est perdu'],r:1,
     why:'Une pomme de terre ou du riz absorbe et surtout dilue la concentration, pendant que l\'acide détourne la perception. L\'eau seule diluerait aussi tout le reste du goût.'},
    {mode:'role',em:'🌰',q:'Pourquoi ajouter des noix concassées sur un plat ?',
     opts:['Pour le croquant et le contraste de texture','Pour l\'acidité','Pour épaissir','Pour saler'],r:0,
     why:'Un plat mou d\'un bout à l\'autre ennuie la bouche. Le contraste de texture relance l\'attention à chaque bouchée : c\'est un levier de plaisir gratuit, et il apporte de bons lipides.'},
    {mode:'sos',em:'🥣',q:'Ta vinaigrette se sépare en deux couches. Que fais-tu ?',
     opts:['Plus d\'huile','Une pointe de moutarde','Plus de vinaigre','Tu la chauffes'],r:1,
     why:'La moutarde est un émulsifiant : ses molécules tiennent ensemble l\'huile et le vinaigre qui, seuls, se repoussent. Le jaune d\'œuf et le miel jouent le même rôle.'},
    {mode:'role',em:'🍋',q:'Ton plat est fade alors que tu as déjà bien salé. Il manque quoi ?',
     opts:['Encore du sel','De l\'acidité','Du sucre','De l\'eau'],r:1,
     why:'L\'erreur la plus répandue en cuisine. Au-delà d\'un certain point, le sel ne fait plus rien : c\'est l\'acide qui donne le relief. Un filet de citron sauve plus de plats qu\'une pincée de sel.'}
  ]},

  {type:'flash',anim:'slide',em:'🍯',name:'Le sucré en cuisine salée',photo:PH.miel,btitle:'Le sucre 🍯',
   desc:'Miel, sucre, fruits secs : une pointe corrige une acidité trop vive et favorise la caramélisation. Bien dosé, on ne le perçoit jamais comme sucré — on perçoit juste un plat mieux équilibré.'},
  {type:'flash',anim:'slide',em:'🍄',name:'L\'umami',photo:PH.champignon,btitle:'La cinquième saveur 🍄',
   desc:'Parmesan, sauce soja, champignon, anchois, concentré de tomate, miso. L\'umami donne le corps et la sensation de « longuement mijoté ». C\'est le raccourci des chefs pour donner de la profondeur en 2 minutes.'},
  {type:'flash',anim:'slide',em:'🥦',name:'Les légumes',photo:PH.legumes,btitle:'Les légumes 🥦',
   desc:'Volume, fibres, couleur, vitamines. Ils remplissent l\'assiette pour très peu de calories : c\'est le levier de satiété le plus puissant. Varie les couleurs — chaque pigment correspond à une famille d\'antioxydants.'},
  {type:'flash',anim:'slide',em:'🍚',name:'Les féculents',photo:PH.patesCompletes,btitle:'Les féculents 🍚',
   desc:'L\'énergie et la satiété longue. Complets de préférence : plus de fibres, digestion plus lente, moins de coup de barre. Ils portent aussi la sauce — un plat sans support est vite écœurant.'},
  {type:'flash',anim:'slide',em:'🥛',name:'Les produits laitiers',photo:PH.parmesan,btitle:'Crème, yaourt, fromage 🥛',
   desc:'Ils arrondissent, lient et adoucissent. Leur caséine neutralise le piquant, leur gras porte les arômes. Le yaourt permet une sauce onctueuse pour cinq fois moins de calories que la crème.'},

  {type:'say',anim:'up',title:'Tu connais les rôles.',sub:'Reste à comprendre ce qui relie deux aliments entre eux. Il n\'existe que quatre mécanismes.',cta:'Les voir'},
  {type:'gameLiaison',anim:'up',title:'Les liaisons',
   kinds:[{t:'Pont aromatique',d:'ils partagent les mêmes molécules'},
     {t:'Contraste',d:'ils s\'opposent et se répondent'},
     {t:'Liant',d:'l\'un tient l\'autre, texture'},
     {t:'Tampon',d:'l\'un corrige l\'excès de l\'autre'}],
   items:[
    {a:{em:'🍅',n:'Tomate'},b:{em:'🌿',n:'Basilic'},r:0,
     why:'<b>Pont aromatique.</b> Ils partagent des composés volatils quasi identiques — et poussent à la même saison, sous le même soleil. La règle du « ce qui pousse ensemble va ensemble » a une base chimique.'},
    {a:{em:'🧀',n:'Chèvre'},b:{em:'🍯',n:'Miel'},r:1,
     why:'<b>Contraste.</b> L\'acidité et le sel du fromage frais contre la douceur du miel. Aucun point commun : c\'est justement l\'écart qui crée le plaisir, chaque bouchée relance l\'autre.'},
    {a:{em:'🥄',n:'Moutarde'},b:{em:'🫒',n:'Huile'},r:2,
     why:'<b>Liant.</b> La moutarde est un émulsifiant : elle force l\'huile et l\'eau du vinaigre à cohabiter. Sans elle, ta vinaigrette se sépare en trente secondes.'},
    {a:{em:'🌶️',n:'Piment'},b:{em:'🥛',n:'Yaourt'},r:3,
     why:'<b>Tampon.</b> Le gras du yaourt capture la capsaïcine et éteint le feu. C\'est un correcteur, pas un accord de goût : le raïta indien n\'existe que pour ça.'},
    {a:{em:'🐟',n:'Saumon'},b:{em:'🍋',n:'Citron'},r:1,
     why:'<b>Contraste.</b> L\'acidité tranche le gras du poisson et l\'allège en bouche. C\'est le principe universel : à chaque fois qu\'un aliment est riche, cherche un acide.'},
    {a:{em:'🍄',n:'Champignon'},b:{em:'🧀',n:'Parmesan'},r:0,
     why:'<b>Pont aromatique.</b> Les deux sont saturés de glutamate. Mis ensemble, l\'umami ne s\'additionne pas : il se multiplie. C\'est le secret d\'un risotto qui a du corps.'},
    {a:{em:'🥚',n:'Jaune d\'œuf'},b:{em:'🥛',n:'Crème'},r:2,
     why:'<b>Liant.</b> Les protéines du jaune coagulent en chauffant et épaississent la crème : c\'est l\'appareil à quiche, la carbonara, la crème anglaise. Au-delà de 85 °C, ça tranche.'},
    {a:{em:'🍫',n:'Chocolat'},b:{em:'🧂',n:'Fleur de sel'},r:1,
     why:'<b>Contraste.</b> Le sel masque l\'amertume du cacao et amplifie la perception du sucré. Une pincée transforme un dessert plat en dessert qui a du relief.'},
    {a:{em:'🍖',n:'Porc'},b:{em:'🍎',n:'Pomme'},r:1,
     why:'<b>Contraste.</b> L\'acidité et le sucre du fruit coupent le gras de la viande. Toutes les cuisines l\'ont trouvé : porc-pomme, canard-orange, jambon-melon.'},
    {a:{em:'🍚',n:'Riz'},b:{em:'🫘',n:'Lentilles'},r:0,
     why:'<b>Pont nutritionnel.</b> Ici l\'accord n\'est pas gustatif mais protéique : la céréale et la légumineuse se complètent en acides aminés. Ensemble, elles valent une protéine animale.'}
  ]},

/* ═══ PALIERS ═══
   Les trois grands blocs du parcours. Un palier s'ouvre sur le premier `chapter`
   qui porte `palier:N` ; tout ce qui suit en hérite en remontant — même règle que
   `univFor` pour l'univers. Un chapitre non tagué reste donc dans le palier courant,
   et les beats d'intro (avant le premier chapitre) retombent sur le palier 1. */
var PALIERS=[
  {n:1,em:'🍳',titre:'Cuisiner et se nourrir',sub:'Macros, étiquettes, cuissons, composition d\'un plat'},
  {n:2,em:'🎯',titre:'Répondre à ses propres besoins',sub:'Calculer ses cibles et les atteindre chaque jour'},
  {n:3,em:'🌟',titre:'Reconnaître et créer',sub:'Estimer les quantités à l\'œil, inventer ses recettes'}
];
function palierDe(i){for(var k=i;k>=0;k--){if(STORY[k]&&STORY[k].palier)return STORY[k].palier}return 1}

/* ═══ MOTEUR ═══ */
var stage=document.getElementById('stage');
var idx=0,xp=0,current=null;

/* ═══ PROGRESSION ═══
   Sauvegardée sur l'appareil : sans elle le parcours repartait du premier beat
   à chaque ouverture, et les trois paliers réapparaissaient « à venir ».
   `maxIdx` = le beat le plus loin atteint. C'est LUI qui fait foi pour les
   épreuves faites, les XP gagnés et le déverrouillage — pas `idx`, qui recule
   dès qu'on revient en arrière ou qu'on saute depuis la carte. */
var PROG_KEY='natty_narration_progres';
var maxIdx=0;

/* ─── UN PALIER PAR JOUR ───
   `palierOuvert` = le palier le plus haut où l'on a le droit d'entrer.
   `palierFinLe`  = le jour (AAAA-MM-JJ) où ce palier a été terminé ; tant qu'il
   est nul, le palier est encore en cours et rien ne bloque — la limite porte sur
   le passage au palier SUIVANT, pas sur le temps passé dans le palier du jour.
   Le lendemain, `progRollover()` échange l'un contre l'autre. Un seul palier
   peut donc s'ouvrir par journée, même après une semaine d'absence. */
var palierOuvert=1,palierFinLe=null;
/* date locale, pas `toISOString()` qui bascule en UTC : à 23 h à Paris il aurait
   déjà donné le lendemain, et le palier suivant se serait ouvert une heure trop tôt. */
function jourCourant(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function progLire(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||null}catch(e){return null}}
function progEcrire(){try{localStorage.setItem(PROG_KEY,JSON.stringify({idx:idx,max:maxIdx,ouvert:palierOuvert,finLe:palierFinLe}))}catch(e){}}
/* efface aussi le drapeau d'intro : « recommencer » doit rejouer la cinématique d'ouverture */
function progEffacer(){try{localStorage.removeItem(PROG_KEY);localStorage.removeItem(NARR_SEEN_KEY)}catch(e){}}
/* comparaison de chaînes ISO, et `>` strict : une horloge remise en arrière ne
   débloque rien, et repasser plusieurs fois dans la journée n'ouvre qu'un palier. */
function progRollover(){
  if(!palierFinLe||palierOuvert>=PALIERS.length)return false;
  if(jourCourant()>palierFinLe){palierOuvert++;palierFinLe=null;progEcrire();return true}
  return false;
}
function palierTermine(P){if(P===palierOuvert&&!palierFinLe){palierFinLe=jourCourant();progEcrire()}}
/* vrai quand le beat suivant ouvre un palier auquel on n'a pas encore droit */
function auBordDuPalier(){var s=idx+1;return s<STORY.length&&palierDe(s)>palierDe(idx)}
/* les XP se recalculent depuis `maxIdx` au lieu de s'accumuler : revoir une
   récompense déjà obtenue ne doit pas la compter une seconde fois. */
function xpGagnes(){var s=0;for(var i=0;i<maxIdx&&i<STORY.length;i++){var b=STORY[i];if(b.type==='reward'&&b.xp)s+=b.xp}return s}

/* barre du haut : progression globale fluide (robuste quel que soit le nb de chapitres) */
function buildSegs(){document.getElementById('segs').innerHTML='<div class="seg" style="flex:1"><div class="fill" id="globalFill"></div><i class="cur" id="globalCur"></i></div>'}
/* ⚠️ La barre suivait `idx` : revenir en arrière la vidait, donc « le retour
   retirait la progression » (constaté par Pablo). Une progression, par
   définition, ne se perd pas parce qu'on relit une notion. Elle suit donc
   `maxIdx` — le point le plus loin atteint — et la position courante n'est plus
   qu'un repère par-dessus. */
function markSegs(){
  var n=Math.max(1,STORY.length-1);
  var f=document.getElementById('globalFill');
  if(f)f.style.width=Math.round(Math.max(maxIdx,idx)/n*100)+'%';
  var c=document.getElementById('globalCur');
  if(c)c.style.left=Math.round(idx/n*100)+'%';
  var pn=document.getElementById('palN');
  if(pn)pn.textContent=palierDe(idx);
}

    r.setProperty('--u-dur','.55s');r.setProperty('--u-ease','cubic-bezier(.22,.61,.36,1)');
  }
  U=u;document.body.dataset.u=theme;
}
function univFor(b,i){
  if(!b)return U;
  if(b.type&&b.type.indexOf('defi')===0)return 'defi';
  if(b.type&&b.type.indexOf('game')===0)return 'jeu';
  if(b.type==='reward')return 'defi';
  if(b.univers)return b.univers;
  /* hérite du dernier chapitre rencontré en remontant */
  for(var k=i;k>=0;k--){if(STORY[k].type==='chapter'&&STORY[k].univers)return STORY[k].univers}
  return 'nutrition';
}

function tone(f,d,v,type){var c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type=type||UNIVERS[U].wave;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}

/* ============ À PLANIFIER — les commandes attribuées, pas encore
   rattachées à une session (demande de Pablo en cours de session,
   25/09/2026) ============
   Le flux « bloc Test produit » (instancierBloc) crée sa session en même
   temps que le bloc. Mais la VRAIE vie quotidienne de Natty n'a pas de
   bloc du tout : ce sont les commandes hebdomadaires (abonnements +
   unité), attribuées à des recettes dans « Commandes » (session 05), qui
   doivent pouvoir être sélectionnées et lancées en session — exactement
   ce que fait admin-production.js au quotidien (CLAUDE.md §3), mais côté
   sélection seulement : la profondeur du mapping reste la version simple
   tranchée plus haut, pas le PERT. */
async function vAPlanifier(){
 const r=await sbTry('bons_commande?statut=neq.annule&session_id=is.null&select=id,jour_livraison,nb_repas,notes,type');
 const bons=r.ok?r.data:[];
 if(!bons.length)return'';
 const bonIds=bons.map(b=>b.id);
 const at=await sbTry('bons_attributions?bon_id=in.('+bonIds.join(',')+')&select=bon_id,recette_id,nb_portions');
 const attrs=at.ok?at.data:[];
 const attribues=new Set(attrs.map(a=>a.bon_id));
 const bonsAttribues=bons.filter(b=>attribues.has(b.id)&&b.jour_livraison);
 if(!bonsAttribues.length)return'';
 const recIds=[...new Set(attrs.map(a=>a.recette_id))];
 const recR=await sbTry('recettes?id=in.('+recIds.join(',')+')&select=id,nom');
 const nomRecette={};(recR.ok?recR.data:[]).forEach(x=>nomRecette[x.id]=x.nom);
 const parJour={};
 bonsAttribues.forEach(b=>{
  (parJour[b.jour_livraison]=parJour[b.jour_livraison]||{bons:[],parRecette:{}}).bons.push(b);
 });
 attrs.forEach(a=>{
  const b=bons.find(x=>x.id===a.bon_id);if(!b||!parJour[b.jour_livraison])return;
  const pr=parJour[b.jour_livraison].parRecette;
  pr[a.recette_id]=(pr[a.recette_id]||0)+a.nb_portions;
 });
 const jours=Object.keys(parJour).sort();
 return `<div class="sect"><h2>À planifier</h2><span>${bonsAttribues.length} commande${bonsAttribues.length>1?'s':''} attribuée${bonsAttribues.length>1?'s':''}, pas encore en session</span></div>
 <div class="card lift" style="margin-bottom:18px"><div class="list">${jours.map(j=>{
  const d=parJour[j];
  const recap=Object.entries(d.parRecette).map(([id,n])=>esc(nomRecette[id]||'?')+' × '+n).join(', ');
  return `<div class="li"><input type="checkbox" class="ap-jour" data-jour="${j}" style="width:18px;height:18px;flex:0 0 auto">
  <div class="grow"><b style="font-weight:500">${fd(j)} · ${d.bons.length} commande${d.bons.length>1?'s':''}</b><div class="meta">${recap}</div></div></div>`;
 }).join('')}</div>
 <div class="foot" style="justify-content:flex-end;margin-top:12px"><button class="btn sm primary" data-planifier-session>Planifier la session de production →</button></div></div>`;
}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-planifier-session]'))planifierSessionDepuisSelection();
});

 if(!cases.length){toast('Coche au moins un jour');return}
 const jours=cases.map(c=>c.dataset.jour).sort();
 const jourSession=jours[0]; // la session se date sur le premier jour choisi ; « ajustable à la main » ensuite (créneau, jour) comme le reste du module.
 const r=await sbTry('bons_commande?statut=neq.annule&session_id=is.null&jour_livraison=in.('+jours.join(',')+')&select=id');
 const candidats=(r.ok?r.data:[]).map(b=>b.id);
 if(!candidats.length){toast('Rien à planifier');return}
 // Seuls les bons ATTRIBUÉS entrent dans la session — la liste ne
 // proposait que ceux-là (§ vAPlanifier), un bon sans recette qui
 // partagerait le même jour ne doit pas être happé en silence : il
 // resterait sans mapping et disparaîtrait pourtant de « À planifier »
 // (filtrée sur session_id is null), donc invisible jusqu'à ce que

 const session=sr[0];
 await sb('bons_commande?id=in.('+bonIds.join(',')+')',{method:'PATCH',body:JSON.stringify({session_id:session.id})});
 S.sessions.push({id:session.id,bloc_id:null,type:'production',statut_reservation:'a_reserver'});
 toast(bonIds.length+' commande(s) planifiée(s) — génération du mapping…');
 await genererMapping(session.id);

/* Génère (ou régénère) le mapping d'une session depuis les recettes du
   bloc : une ligne par étape de fiche technique (phase='production'),
   plus une ligne par (bon, recette) pour l'assemblage à la portion. Les
   étapes déjà FAITES sont conservées telles quelles — un régénérer ne
   doit pas effacer un travail déjà accompli, seulement recalculer ce qui
   reste (spec §4.1 : « recalculé à chaque changement de volumes »). */
async function genererMapping(sessionId){
 const s=(await sbTry('crm_sessions?id=eq.'+sessionId+'&select=*')).data?.[0];
 if(!s){toast('Session introuvable');return}
 const existantes=await sbTry('crm_session_etapes?session_id=eq.'+sessionId+'&select=id,statut');
 const aGarder=(existantes.ok?existantes.data:[]).filter(x=>x.statut==='fait').length;
 if(existantes.ok&&existantes.data.length&&!confirm('Regénérer le mapping ? '+(aGarder?aGarder+' étape(s) déjà faite(s) seront conservées, ':'')+'le reste est recalculé.'))return;
 if(existantes.ok)for(const x of existantes.data)if(x.statut!=='fait')await sb('crm_session_etapes?id=eq.'+x.id,{method:'DELETE'});

 // Deux flux mènent à une session : « Test produit » (bloc_id) ou la
 // planification normale depuis les commandes attribuées de la semaine
 // (session_id, § plus bas). Une session n'a jamais les deux à la fois.
 const filtreBons=s.bloc_id?'bloc_id=eq.'+s.bloc_id:'session_id=eq.'+sessionId;
 const bons=await sbTry('bons_commande?'+filtreBons+'&statut=neq.annule&select=id');
 const bonIds=(bons.ok?bons.data:[]).map(b=>b.id);
 if(!bonIds.length){toast('Aucun bon de commande pour cette session — attribue des recettes d’abord.');return}
 await precacheLibBons(bonIds);
 const attrs=await sbTry('bons_attributions?bon_id=in.('+bonIds.join(',')+')&select=bon_id,recette_id,nb_portions');
 const lignes=attrs.ok?attrs.data:[];
 const recIds=[...new Set(lignes.map(l=>l.recette_id))];
 if(!recIds.length){toast('Aucune recette attribuée à ces commandes.');return}

 const [etapesR,recR]=await Promise.all([
  sbTry('recettes_etapes?recette_id=in.('+recIds.join(',')+')&phase=eq.production&select=*&order=numero.asc'),
  sbTry('recettes?id=in.('+recIds.join(',')+')&select=id,nom')
 ]);
 const etapesFiche=etapesR.ok?etapesR.data:[];
 const nomRecette={};(recR.ok?recR.data:[]).forEach(r=>nomRecette[r.id]=r.nom);

 let ordre=0,nCrees=0;
 for(const recId of recIds){
  const etapesDeCetteRecette=etapesFiche.filter(x=>x.recette_id===recId);
  if(!etapesDeCetteRecette.length)continue;
  // Durée réelle moyenne des sessions passées sur CETTE étape — filtrée
  // sur `etape_source_id` (référence exacte à la ligne de la fiche), pas
  // sur le texte du titre : celui stocké ici porte le nom de la recette
  // en préfixe (`titre` plus bas), différent de `et.titre` seul — un
  // filtre par titre ne matcherait donc jamais. C'est toute
  // « l'amélioration des estimations » (§4.1).
  const numeroVersId={};
  for(const et of etapesDeCetteRecette){
   const hist=await sbTry('crm_session_etapes?etape_source_id=eq.'+et.id+'&statut=eq.fait&select=duree_reelle_min&limit=5&order=created_at.desc');
   const mesures=(hist.ok?hist.data:[]).map(x=>x.duree_reelle_min).filter(Boolean);
   const duree=mesures.length?Math.round(mesures.reduce((a,b)=>a+b,0)/mesures.length):(et.duree_min||10);
   const r=await sb('crm_session_etapes',{method:'POST',body:JSON.stringify({
    session_id:sessionId,recette_id:recId,etape_source_id:et.id,phase:'production',
    titre:(nomRecette[recId]||'')+' — '+et.titre,poste:et.poste||et.geste||'—',
    ordre:ordre++,duree_prevue_min:duree
   })});
   numeroVersId[et.numero]=r[0].id;nCrees++;
  }
  // Dépendances traduites : `recettes_etapes.depend_de` porte des
  // `numero` DANS la fiche, cette table porte des uuid propres à CETTE
  // session — traduction après coup, une fois tous les numéros connus.
  for(const et of etapesDeCetteRecette){
   const deps=(et.depend_de||[]).map(n=>numeroVersId[n]).filter(Boolean);
   if(deps.length)await sb('crm_session_etapes?id=eq.'+numeroVersId[et.numero],{method:'PATCH',body:JSON.stringify({depend_de:deps})});
  }
 }
 // Assemblage : une ligne par (bon, recette) — peser la portion de CE
 // client. Les instructions générales de dressage restent dans la fiche
 // (phase='assemblage' de recettes_etapes), lues à l'affichage plutôt que
 // dupliquées ici, cf. la note sur la profondeur du mapping.
 for(const l of lignes){
  await sb('crm_session_etapes',{method:'POST',body:JSON.stringify({
   session_id:sessionId,recette_id:l.recette_id,bon_id:l.bon_id,phase:'assemblage',
   titre:(nomRecette[l.recette_id]||'Recette')+' — '+libBonId(l.bon_id),
   poste:'assemblage',ordre:ordre++,duree_prevue_min:3
  })});
  nCrees++;
 }
 toast(nCrees+' étape(s) générée(s)');
 ouvrirSessionDetail(sessionId);
}
/* libBon() attend un objet bon déjà chargé — ici on n'a que son id
   (bons_attributions ne renvoie pas les notes). Un aller simple suffit,
   la génération n'est pas un chemin critique en latence. */
const _libBonCache={};
function libBonId(bonId){return _libBonCache[bonId]||'ce bon'}
async function precacheLibBons(bonIds){
 if(!bonIds.length)return;
 const r=await sbTry('bons_commande?id=in.('+bonIds.join(',')+')&select=id,notes,type');
 (r.ok?r.data:[]).forEach(b=>_libBonCache[b.id]=libBon(b));
}

/* §4.2 : « la mission passe en attente de confirmation jusqu'au clic
   Confirmée ». L'envoi de la demande (actionReserverCuisine) marque déjà
   la TÂCHE faite — « la demande a été envoyée » — cette fonction-ci
   ferme la boucle sur la SESSION : « la cuisine a répondu oui ». Les deux
   sont volontairement distincts : marquer la tâche « à revoir » quand la
   session n'est pas confirmée redirait la même chose deux fois. */
function majSessionLocale(id,patch){const s=S.sessions.find(x=>x.id===id);if(s)Object.assign(s,patch)}
async function confirmerReservation(sessionId){
 await sb('crm_sessions?id=eq.'+sessionId,{method:'PATCH',body:JSON.stringify({statut_reservation:'confirmee'})});
 majSessionLocale(sessionId,{statut_reservation:'confirmee'});
 toast('Cuisine confirmée');
 ouvrirSessionDetail(sessionId);
 render();
}

/* Durée totale estimée d'un mapping, pour le créneau de
   actionReserverCuisine : max sur les postes (ils travaillent en
   parallèle), somme des étapes DANS un même poste (elles s'enchaînent).
   Approximation assumée, pas un chemin critique façon PERT — voir la
   note de profondeur en tête de cette section. `null` si pas encore
   généré : actionReserverCuisine retombe alors sur son ancien calcul
   (somme des temps de fiche), pour rester utilisable avant génération. */
async function dureeMappingSession(sessionId){
 const r=await sbTry('crm_session_etapes?session_id=eq.'+sessionId+'&phase=eq.production&select=poste,duree_prevue_min,duree_reelle_min');
 return r.ok?minutesDepuisEtapes(r.data):null;
}
/* Le calcul pur, séparé pour que Finance le fasse sur TOUTES les sessions
   en une seule requête (tableau d'Opérationnel) sans le recopier. */
function minutesDepuisEtapes(rows){
 if(!rows||!rows.length)return null;
 const parPoste={};
 rows.forEach(e=>{const p=e.poste||'—';parPoste[p]=(parPoste[p]||0)+(e.duree_reelle_min||e.duree_prevue_min||0)});
 return Math.max(0,...Object.values(parPoste));
}
/* Extrait d'actionReserverCuisine (§4.2) pour que le panneau Finance
   (§ Opérationnel) parte du MÊME calcul que la réservation réelle, plutôt
   que d'en recopier une variante — c'est exactement le défaut qui a fait
   diverger api/_nutrition.js de core.js dans l'app principale (CLAUDE.md).
   30 min de marge, arrondi à l'heure pleine (« toute heure entamée due »,
   spec §1). */
const MARGE_CUISINE_MIN=30;
function heuresDepuisMinutes(minutes){return Math.max(1,Math.ceil((minutes+MARGE_CUISINE_MIN)/60))}

/* ---- Vue tablette plein écran ---- */
let TAB_SESSION=null,TAB_PHASE='production';
async function ouvrirTablette(sessionId){
 // #tablette est partagé avec la vue livreur (session 07) : fermer
 // l'autre avant d'ouvrir celle-ci, sinon son minuteur réécrirait ce
 // plein écran par-dessus à son prochain battement.
 fermerVueLivreur();
 TAB_SESSION=sessionId;TAB_PHASE='production';
 $('#tablette').classList.add('on');
 await rendreTablette();
}
function fermerTablette(){$('#tablette').classList.remove('on');TAB_SESSION=null}
async function rendreTablette(){
 if(!TAB_SESSION)return;
 const [sR,eR]=await Promise.all([
  sbTry('crm_sessions?id=eq.'+TAB_SESSION+'&select=*'),
  sbTry('crm_session_etapes?session_id=eq.'+TAB_SESSION+'&select=*&order=ordre.asc')
 ]);
 const s=(sR.ok?sR.data:[])[0];const etapes=eR.ok?eR.data:[];
 if(!s){fermerTablette();return}
 const dansPhase=etapes.filter(e=>e.phase===TAB_PHASE);
 const chrono=s.demarree_le?chronoTexte(s):'—';
 const restant=s.demarree_le&&s.creneau_fin?tempsRestantTexte(s):null;
 $('#tablette').innerHTML=`
 <div class="tab-head">
  <button class="tab-close" data-tab-fermer aria-label="Fermer">×</button>
  <h1>${fd(s.jour)} — ${s.type==='mise_en_place'?'Mise en place':'Production'}</h1>
  <div class="tab-chrono ${restant&&restant.classe||''}">${restant?restant.texte:chrono}</div>
 </div>
 <div class="tab-phases">
  <button class="${TAB_PHASE==='production'?'on':''}" data-tab-phase="production">Par recette (${etapes.filter(e=>e.phase==='production').length})</button>
  <button class="${TAB_PHASE==='assemblage'?'on':''}" data-tab-phase="assemblage">Par bon — assemblage (${etapes.filter(e=>e.phase==='assemblage').length})</button>
 </div>
 <div class="tab-list">${dansPhase.map(tabCard).join('')||'<div class="empty">Rien dans cette phase.</div>'}</div>`;
 if(TAB_TIMER)clearInterval(TAB_TIMER);
 TAB_TIMER=setInterval(()=>{
  if(!$('#tablette').classList.contains('on')){clearInterval(TAB_TIMER);return}
  const el=$('.tab-chrono');if(!el||!s.demarree_le)return;
  const rr=s.creneau_fin?tempsRestantTexte(s):null;
  el.textContent=rr?rr.texte:chronoTexte(s);
  el.className='tab-chrono '+(rr&&rr.classe||'');
 },1000);
}
let TAB_TIMER=null;
function chronoTexte(s){
 const sec=Math.max(0,Math.floor((Date.now()-new Date(s.demarree_le).getTime())/1000));
 return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
function tempsRestantTexte(s){
 const [h,m]=s.creneau_fin.split(':').map(Number);
 const fin=new Date(s.jour+'T'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':00');
 const secRestant=Math.floor((fin.getTime()-Date.now())/1000);
 const neg=secRestant<0,abs=Math.abs(secRestant);
 const texte=(neg?'-':'')+String(Math.floor(abs/60)).padStart(2,'0')+':'+String(abs%60).padStart(2,'0');
 return{texte,classe:neg?'bad':abs<600?'warn':''};
}
function tabCard(e){
 let btn;
 if(e.statut==='fait')btn=`<span class="tab-btn done">✓ ${e.duree_reelle_min||'?'} min</span>`;
 else if(e.statut==='en_cours')btn=`<button class="tab-btn done" data-fin-etape="${e.id}">Terminer</button>`;
 else btn=`<button class="tab-btn go" data-debut-etape="${e.id}">Commencer</button>`;
 return `<div class="tab-card ${e.statut==='fait'?'fait':e.statut==='en_cours'?'encours':''}"><div class="grow"><div class="titre">${esc(e.titre)}</div><div class="sub">${esc(e.poste||'')}${e.assigne?' · '+esc(nomDe(e.assigne)):''}</div></div><div class="duree">${e.duree_prevue_min||'?'} min</div>${btn}</div>`;
}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-tab-fermer]')){fermerTablette();return}
 const tp=e.target.closest('[data-tab-phase]');
 if(tp){TAB_PHASE=tp.dataset.tabPhase;rendreTablette();return}
});

/* État de l'interface Production : la fenêtre affichée (4 semaines à partir
   d'un lundi) et les jours cochés pour la liste de courses. La sélection
   survit aux changements de fenêtre : on peut cocher un jour cette semaine,
   avancer d'un mois, en cocher un autre, et générer une liste qui couvre
   les deux. */
const PROD={debut:null,sel:new Set(),bonsParJour:{}};
const PROD_SEMAINES=4;
/* Date LOCALE — jamais toISOString() : entre 00 h et 02 h à Paris, elle rend
   la veille (voir CLAUDE.md, « Quel jour sommes-nous »). */
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lundiLocal(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
const PROD_STATUTS={a_attribuer:['bad','À attribuer'],attribue:['info','Attribué'],en_production:['warn','En production'],livre:['ok','Livré'],annule:['','Annulé']};
const chipStatut=s=>{const l=PROD_STATUTS[s]||['',s];return `<span class="chip ${l[0]}">${esc(l[1])}</span>`};
/* Les bons de commande ne portent pas de nom de client : les commandes
   saisies à la main le rangent en première ligne des notes. */
const libBon=b=>{const n=(b.notes||'').split('\n')[0].trim();return n||(b.type==='abonnement'?'Abonnement':b.type==='unite'?'Commande à l’unité':'Commande')};

/* ---- Grammes ⇄ pièces, pour la liste de courses ET la fiche technique ----
   On achète des œufs, pas des grammes d'œuf : à côté du poids, on veut savoir
   combien de pièces ça fait. `NattyUnites` (assets/unites.js) porte déjà le
   poids d'une pièce pour ~70 aliments courants — pas une seconde table à
   tenir à jour, la même que celle qui sert au client dans le `+`. */
function pieceCompte(nom,g){
 if(!window.NattyUnites||!(g>0))return null;
 try{
  if(!NattyUnites.estPiece(nom))return null;
  const n=NattyUnites.quantite(g,'u',nom);
  return n?{n,lib:NattyUnites.libelle('u',nom,n)}:null;
 }catch(e){return null}
}
function pieceTxt(nom,g){const p=pieceCompte(nom,g);return p?' (≈ '+p.n.toLocaleString('fr-FR')+' '+p.lib+')':''}
function pieceHtml(nom,g){const p=pieceCompte(nom,g);return p?' <span style="color:#8e8e99;font-weight:400">(≈ '+p.n.toLocaleString('fr-FR')+' '+esc(p.lib)+')</span>':''}

   </div>`;

 }

/* ---- Saisir / modifier une commande ----
   Une commande = une ligne `bons_commande` + ses `bons_attributions`
   (recette × portions). Les attributions sont réécrites à l'enregistrement,
   en CONSERVANT `facteur` et `kcal_portion` des recettes qui restent : c'est
   admin.html qui les calcule (grammage par client), les effacer ferait
   retomber la liste de courses sur la fiche standard sans prévenir. */

/* ============ Fiche technique de production (PDF imprimable) ============
   Ouverte depuis une commande (bon_commande) : on choisit LES RECETTES de
   cette commande à produire, et un poste pour filtrer la fiche à une seule
   station. Deux recettes cochées → leurs étapes se mélangent, regroupées par
   poste puis dans l'ordre — même principe que `genererMapping()` plus haut
   (crm_session_etapes), sans écriture en base : imprimer n'a pas d'effet de
   bord, donc pas de ligne de session à créer pour ça.

   La fiche ne s'arrête pas à la commande de départ : elle couvre TOUTES les
   commandes du même jour de livraison qui demandent la ou les recettes
   choisies (la cuisine produit un lot une fois, pas une fois par client), et
   se termine par la répartition — même logique que la phase `assemblage` de
   `genererMapping()` : une ligne par (bon, recette), les grammes de CE
   client. Sans jour de livraison, la fiche ne couvre que la commande seule.

   Précision : chaque étape porte son geste, sa quantité (calculée sur le
   TOTAL du lot, mot à mot contre `recettes_ingredients` — jamais en
   sous-chaîne, sinon « ail » se retrouverait dans « volaille »), sa
   consigne complète, durée/température/découpe quand la fiche les donne, et
   le savoir général du geste (NattySavoir, assets/admin-savoir.js — le même
   contenu que « Détails » dans l'écran-par-écran d'admin.html, chargé ici
   pour ne pas le récrire). */
const GESTES_TITRE_DABORD=['melanger','assaisonner','mixer','dresser'];
function savoirPourEtape(e){
 if(!window.NattySavoir)return'';
 const cands=(GESTES_TITRE_DABORD.indexOf(e.geste)>-1?[e.titre,e.aliment]:[e.aliment,e.titre]).filter(Boolean);
 if(!cands.length)return'';
 try{return NattySavoir.html(e.geste,cands)||''}catch(err){return''}
}
function normFt(s){return ' '+String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()+' '}
/* Mot à mot, jamais en sous-chaîne — la même règle que `core.js` et
   `assets/unites.js` : un ingrédient de la fiche compte s'il porte TOUS les
   mots d'un des groupes séparés par virgule de `aliment` (« carottes,
   oignons »), en mots ENTIERS. */
function motsCorrespondent(aliment,ingredientNom){
 const n=normFt(ingredientNom);
 return String(aliment||'').split(',').map(s=>s.trim()).filter(Boolean).some(m=>{
  const mots=normFt(m).trim().split(' ').filter(Boolean);
  return mots.length&&mots.every(w=>n.indexOf(' '+w+' ')>-1);
 });
}
function quantitesEtape(etape,ingredientsRecette,totalEq,baseNbPortions){
 if(!etape.aliment||!totalEq)return[];
 const base=baseNbPortions||1;
 return ingredientsRecette.filter(i=>i.recette_id===etape.recette_id&&motsCorrespondent(etape.aliment,i.ingredient_nom))
  .map(i=>({nom:i.ingredient_nom,g:(+i.quantite_g||0)*totalEq/base}));
}
const fmtG=g=>esc((g<10?Math.round(g*10)/10:Math.round(g)).toLocaleString('fr-FR'))+' g';

async function ouvrirFicheTechnique(bonId){

 const attrR=await sbTry('bons_attributions?bon_id=eq.'+bonId+'&select=recette_id,nb_portions,facteur,kcal_portion');
 const attrs=attrR.ok?attrR.data:[];
 if(!attrs.length){toast('Aucune recette attribuée à cette commande');return}
 const recIds=[...new Set(attrs.map(a=>a.recette_id))];
 const recR=await sbTry('recettes?id=in.('+recIds.join(',')+')&select=id,nom,nb_portions');
 const nomRec={};(recR.ok?recR.data:[]).forEach(r=>nomRec[r.id]=r.nom);
 const etR=await sbTry('recettes_etapes?recette_id=in.('+recIds.join(',')+')&phase=eq.production&select=poste,geste');
 const postes=[...new Set((etR.ok?etR.data:[]).map(e=>(e.poste||e.geste||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
 modal(`<h2>Fiche technique de production</h2>
 <p class="muted" style="margin:-4px 0 10px;font-size:12.5px">${esc(libBon(bon))}${bon.jour_livraison?' · livraison '+esc(fd(bon.jour_livraison)):' · sans date de livraison'}</p>
 <div class="form">

   <div style="display:grid;gap:6px;margin-top:4px">${recIds.map(id=>{

    return `<label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" class="ft-rec" value="${id}" checked style="width:16px;height:16px;flex:0 0 auto"> <span>${esc(nomRec[id]||'?')} <span class="muted">· ${a?a.nb_portions:0} portion(s) pour cette commande</span></span></label>`;
   }).join('')}</div>
   ${recIds.length>1?'<p class="muted" style="font-size:11.5px;margin:6px 0 0">Deux recettes cochées → la fiche mélange leurs étapes, regroupées par poste.</p>':''}
  </label>
  <label>Poste<select id="ftPoste"><option value="">Tous les postes</option>${postes.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></label>
  <p class="muted" style="font-size:11.5px;margin:4px 0 0">${bon.jour_livraison?`La fiche couvre aussi les autres commandes du ${esc(fd(bon.jour_livraison))} qui demandent ces recettes — le lot se produit une fois, la répartition par commande est à la fin.`:`Cette commande n'a pas de date de livraison : la fiche ne couvrira qu'elle.`}</p>

 $('#ftGo').onclick=()=>{
  const sel=[...document.querySelectorAll('.ft-rec:checked')].map(c=>c.value);
  if(!sel.length){toast('Coche au moins une recette');return}

async function genererFicheTechnique(bon,recIdsSel,nomRec,posteFiltre){
 closeAll();toast('Préparation de la fiche…');
 const jour=bon.jour_livraison;
 const bonsR=jour
  ?await sbTry('bons_commande?jour_livraison=eq.'+jour+'&statut=neq.annule&select=id,notes,type,nb_repas,adresse')
  :{ok:true,data:[bon]};
 const bonsScope=(bonsR.ok&&bonsR.data.length)?bonsR.data:[bon];
 const bonIds=bonsScope.map(b=>b.id);
 const attR=await sbTry('bons_attributions?bon_id=in.('+bonIds.join(',')+')&recette_id=in.('+recIdsSel.join(',')+')&select=bon_id,recette_id,nb_portions,facteur,kcal_portion');
 const attrsScope=attR.ok?attR.data:[];
 if(!attrsScope.length){toast('Aucune attribution trouvée pour ces recettes');return}
 const recR=await sbTry('recettes?id=in.('+recIdsSel.join(',')+')&select=id,nom,nb_portions,temps_prep_min,temps_cuisson_min');
 const fiches={};(recR.ok?recR.data:[]).forEach(r=>fiches[r.id]=r);
 const [ingR,etR,asmR]=await Promise.all([
  sbTry('recettes_ingredients?recette_id=in.('+recIdsSel.join(',')+')&select=*'),
  sbTry('recettes_etapes?recette_id=in.('+recIdsSel.join(',')+')&phase=eq.production&select=*&order=numero.asc'),
  sbTry('recettes_etapes?recette_id=in.('+recIdsSel.join(',')+')&phase=eq.assemblage&select=*&order=numero.asc')
 ]);
 const ingredients=ingR.ok?ingR.data:[];
 let etapes=etR.ok?etR.data:[];
 const etapesAssemblage=asmR.ok?asmR.data:[];
 if(posteFiltre)etapes=etapes.filter(e=>(e.poste||e.geste||'').trim()===posteFiltre);
 if(!etapes.length){toast(posteFiltre?'Aucune étape sur ce poste pour ces recettes':'Aucune étape de production dans ces fiches');return}
 const totalPortionsEq={};
 attrsScope.forEach(a=>{totalPortionsEq[a.recette_id]=(totalPortionsEq[a.recette_id]||0)+a.nb_portions*(+a.facteur||1)});
 const ordreRec={};recIdsSel.forEach((id,i)=>ordreRec[id]=i);
 etapes.sort((a,b)=>{
  const pa=(a.poste||a.geste||'—').trim()||'—',pb=(b.poste||b.geste||'—').trim()||'—';
  return pa.localeCompare(pb,'fr')||(ordreRec[a.recette_id]-ordreRec[b.recette_id])||((a.numero||0)-(b.numero||0));
 });
 const bonsConcernes=bonsScope.filter(b=>attrsScope.some(a=>a.bon_id===b.id));
 imprimerFicheTechnique({bon,bonsConcernes,recIdsSel,fiches,nomRec,ingredients,etapes,etapesAssemblage,attrsScope,totalPortionsEq,posteFiltre,jour});
}

function imprimerFicheTechnique(ctx){
 const {bonsConcernes,recIdsSel,fiches,nomRec,ingredients,etapes,etapesAssemblage,attrsScope,totalPortionsEq,posteFiltre,jour}=ctx;
 const w=window.open('','_blank');
 if(!w){toast('Fenêtre bloquée par le navigateur');return}
 const plusieurs=recIdsSel.length>1;
 const specs=e=>{
  const out=[];
  if(e.duree_min)out.push('⏱ '+e.duree_min+' min');
  if(e.temperature_c)out.push('🌡 '+e.temperature_c+' °C');
  if(e.decoupe)out.push('🔪 '+esc(e.decoupe));
  if(e.passif)out.push('⏳ Attente — le cuisinier peut enchaîner ailleurs');
  if(e.depend_de&&e.depend_de.length)out.push('↳ après l’étape n°'+e.depend_de.join(', n°'));
  return out.join(' · ');
 };
 const blocEtape=e=>{
  const qtes=quantitesEtape(e,ingredients,totalPortionsEq[e.recette_id]||0,(fiches[e.recette_id]||{}).nb_portions);
  const specsTxt=specs(e);
  return `<div class="etape">
   <div class="etape-head"><span class="num">N°${e.numero||'?'}</span><b>${esc(e.titre||'')}</b>${plusieurs?`<span class="tag">${esc(nomRec[e.recette_id]||'?')}</span>`:''}${e.geste?`<span class="tag">${esc(e.geste)}</span>`:''}</div>
   ${qtes.length?`<div class="qte">${qtes.map(q=>fmtG(q.g)+' '+esc(q.nom)+pieceHtml(q.nom,q.g)).join(' + ')}</div>`:''}
   ${e.description?`<p class="desc">${esc(e.description)}</p>`:''}
   ${specsTxt?`<div class="specs">${specsTxt}</div>`:''}
   ${savoirPourEtape(e)}
  </div>`;
 };
 let corps='',dernierPoste=null;
 etapes.forEach(e=>{
  const poste=(e.poste||e.geste||'—').trim()||'—';
  if(poste!==dernierPoste){corps+=`<h3>${esc(poste)}</h3>`;dernierPoste=poste}
  corps+=blocEtape(e);
 });
 const dressage=recIdsSel.filter(id=>etapesAssemblage.some(e=>e.recette_id===id)).map(id=>
  `<h4>${esc(nomRec[id]||'?')}</h4><ol>${etapesAssemblage.filter(e=>e.recette_id===id).map(e=>`<li>${esc(e.titre||'')}${e.description?' — '+esc(e.description):''}</li>`).join('')}</ol>`
 ).join('');
 const rep=attrsScope.slice().sort((a,b)=>{
  const ba=bonsConcernes.find(x=>x.id===a.bon_id),bb=bonsConcernes.find(x=>x.id===b.bon_id);
  return (ba?libBon(ba):'').localeCompare(bb?libBon(bb):'','fr')||(nomRec[a.recette_id]||'').localeCompare(nomRec[b.recette_id]||'','fr');
 }).map(a=>{
  const b=bonsConcernes.find(x=>x.id===a.bon_id);
  const fiche=fiches[a.recette_id]||{};
  const base=fiche.nb_portions||1;
  const eq=a.nb_portions*(+a.facteur||1);
  const lignesIng=ingredients.filter(i=>i.recette_id===a.recette_id).map(i=>{
   const g=(+i.quantite_g||0)*eq/base;
   return `<tr><td>${esc(i.ingredient_nom)}</td><td>${fmtG(g)}${pieceHtml(i.ingredient_nom,g)}</td></tr>`;
  }).join('');
  return `<div class="commande-bloc"><h4>${b?esc(libBon(b)):'Commande'} — ${esc(nomRec[a.recette_id]||'?')}</h4>
  <p class="muted-p">${a.nb_portions} portion${a.nb_portions>1?'s':''}${a.facteur&&+a.facteur!==1?' · facteur ×'+(+a.facteur).toFixed(2):''}${b&&b.adresse?' · '+esc(b.adresse):''}</p>
  ${lignesIng?`<table>${lignesIng}</table>`:'<p class="muted-p">Ingrédients non saisis pour cette recette.</p>'}
  </div>`;
 }).join('');
 const titreRecettes=recIdsSel.map(id=>esc(nomRec[id]||'?')).join(' + ');
 w.document.write(`<!doctype html><meta charset="utf-8"><title>Fiche technique — ${titreRecettes}</title>
 <style>

/* ---- Liste de courses des jours sélectionnés ----
   Même source que la production : les attributions des commandes de ces
   jours, × les ingrédients de chaque fiche ramenés à une portion. Le
   `facteur` posé par admin.html (portion ajustée à la cible calorique du
   client) est appliqué quand il existe — sinon la fiche standard. Les
   commandes annulées sont écartées, et celles sans recette sont COMPTÉES à
   part : une liste qui les ignorerait sans le dire serait fausse en silence. */
async function listeCoursesJours(jours){
 if(!jours.length){toast('Cochez au moins un jour');return}
 const r=await sbTry('bons_commande?jour_livraison=in.('+jours.join(',')+')&statut=neq.annule&select=id,nb_repas,jour_livraison');
 const bons=r.ok?r.data:[];
 const titre=jours.length===1?fd(jours[0]):`${jours.length} jours · ${fd(jours[0])} → ${fd(jours[jours.length-1])}`;
 if(!bons.length){modal(`<h2>Liste de courses</h2><div class="empty">Aucune commande sur ces jours.</div><div class="foot"><button class="btn" type="button" data-close>Fermer</button></div>`);return}
 const at=await sbTry('bons_attributions?bon_id=in.('+bons.map(b=>b.id).join(',')+')&select=bon_id,recette_id,nb_portions,facteur');
 const attrs=at.ok?at.data:[];
 const avecRecette=new Set(attrs.map(a=>a.bon_id));
 const sansRecette=bons.filter(b=>!avecRecette.has(b.id));
 const recIds=[...new Set(attrs.map(a=>a.recette_id))];
 const [ing,rb]=recIds.length?await Promise.all([
  sbTry('recettes_ingredients?recette_id=in.('+recIds.join(',')+')&select=recette_id,ingredient_nom,quantite_g,unite'),
  sbTry('recettes?id=in.('+recIds.join(',')+')&select=id,nom,nb_portions')
 ]):[{ok:true,data:[]},{ok:true,data:[]}];
 const fiche={};(rb.ok?rb.data:[]).forEach(x=>fiche[x.id]=x);
 const portionsEq={},portions={};
 attrs.forEach(a=>{portionsEq[a.recette_id]=(portionsEq[a.recette_id]||0)+a.nb_portions*(+a.facteur||1);portions[a.recette_id]=(portions[a.recette_id]||0)+a.nb_portions});
 const total={};
 (ing.ok?ing.data:[]).forEach(i=>{
  const base=(fiche[i.recette_id]&&fiche[i.recette_id].nb_portions)||1;
  const q=(+i.quantite_g||0)*(portionsEq[i.recette_id]||0)/base;
  const unite=(i.unite||'g').trim();
  const cle=String(i.ingredient_nom||'').trim().toLowerCase()+'|'+unite;
  if(!total[cle])total[cle]={nom:String(i.ingredient_nom||'').trim(),unite,q:0,rec:new Set()};
  total[cle].q+=q;total[cle].rec.add(i.recette_id);
 });
 // §4.1 : « le stock disponible est déduit de la liste de courses ».
 // Rapprochement par NOM EXACT (insensible à la casse) seulement — pas de
 // correspondance floue, sur le même principe que `contient()` d'
 // assets/garde-manger.js dans l'app : une correspondance approximative
 // ferait disparaître un ingrédient de la liste à tort, ce qui coûte
 // plus cher qu'une redondance visible. Uniquement pour g/kg — stocks_mp
 // n'a qu'une colonne `quantite_kg`, comparer à des ml ou des pièces
 // n'aurait pas de sens.
 const stockR=await sbTry('stocks_mp?statut=eq.disponible&select=ingredient_nom,quantite_kg');
 const stockKg={};
 (stockR.ok?stockR.data:[]).forEach(s=>{
  const cle=String(s.ingredient_nom||'').trim().toLowerCase();
  stockKg[cle]=(stockKg[cle]||0)+(+s.quantite_kg||0);
 });
 const lignes=Object.values(total).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
 lignes.forEach(l=>{
  const u=l.unite.toLowerCase();
  if(u!=='g'&&u!=='kg')return;
  const dispo=stockKg[l.nom.toLowerCase()];
  if(!dispo)return;
  const qKg=u==='kg'?l.q:l.q/1000;
  const dejaKg=Math.min(dispo,qKg);
  l.dejaEnStockKg=dejaKg;
  l.q=Math.max(0,qKg-dejaKg)*(u==='kg'?1:1000);
 });
 const fmt=l=>{const u=l.unite.toLowerCase();if((u==='g'||u==='ml')&&l.q>=1000)return(Math.round(l.q/100)/10).toLocaleString('fr-FR')+' '+(u==='g'?'kg':'L');return(l.q<10?Math.round(l.q*10)/10:Math.round(l.q)).toLocaleString('fr-FR')+' '+l.unite};
 /* Le poids ne dit pas combien acheter : on achète des œufs, pas 660 g d'œuf.
    Seulement pour g/kg — un litre de lait ne se compte pas à la pièce. */
 const gEq=l=>{const u=l.unite.toLowerCase();return u==='kg'?l.q*1000:u==='g'?l.q:0};
 const sansFiche=recIds.filter(id=>!(ing.ok?ing.data:[]).some(i=>i.recette_id===id));
 const texte=`Liste de courses — ${titre}\n`+lignes.map(l=>`- ${l.nom} : ${fmt(l)}${pieceTxt(l.nom,gEq(l))}`).join('\n');
 modal(`<h2>Liste de courses</h2>
 <p class="muted" style="margin:-4px 0 10px;font-size:12.5px">${esc(titre)} · ${bons.length} commande${bons.length>1?'s':''} · ${recIds.map(id=>esc((fiche[id]||{}).nom||'?')+' × '+portions[id]).join(', ')||'aucune recette'}</p>
 ${sansRecette.length?`<div class="exbar"><span class="chip bad">${sansRecette.length}</span><span>commande${sansRecette.length>1?'s':''} sans recette attribuée (${sansRecette.reduce((s,b)=>s+b.nb_repas,0)} repas) — non comptée${sansRecette.length>1?'s':''} dans cette liste.</span></div>`:''}
 ${sansFiche.length?`<div class="exbar"><span class="chip warn">${sansFiche.length}</span><span>recette${sansFiche.length>1?'s':''} sans ingrédients saisis : ${sansFiche.map(id=>esc((fiche[id]||{}).nom||'?')).join(', ')}.</span></div>`:''}
 <div class="list" style="max-height:50vh;overflow:auto">${lignes.map(l=>`<div class="li"><div class="grow">${esc(l.nom)}${l.rec.size>1?` <span class="muted" style="font-size:11.5px">· ${l.rec.size} recettes</span>`:''}${l.dejaEnStockKg?` <span class="muted" style="font-size:11.5px">· ${(Math.round(l.dejaEnStockKg*10)/10).toLocaleString('fr-FR')} kg déjà en stock déduits</span>`:''}</div><span class="num">${l.q<=0?'<span class="chip ok">en stock</span>':esc(fmt(l))+pieceHtml(l.nom,gEq(l))}</span></div>`).join('')||'<div class="empty">Rien à calculer.</div>'}</div>
 <div class="foot" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" type="button" data-close>Fermer</button>${lignes.length?'<button class="btn" type="button" id="lcPrint">Imprimer</button><button class="btn primary" type="button" id="lcCopy">Copier</button>':''}</div>`);
 $('#lcCopy')?.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(texte);toast('Liste copiée')}
  catch(e){const t=document.createElement('textarea');t.value=texte;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Liste copiée')}
 });
 $('#lcPrint')?.addEventListener('click',()=>{
  const w=window.open('','_blank');if(!w){toast('Fenêtre bloquée par le navigateur');return}
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Liste de courses</title><style>body{font:14px system-ui,sans-serif;margin:28px}h1{font-size:18px}td{padding:5px 10px;border-bottom:1px solid #ddd}td:last-child{text-align:right;white-space:nowrap}</style><h1>Liste de courses — ${esc(titre)}</h1><table>${lignes.map(l=>`<tr><td>☐ ${esc(l.nom)}</td><td>${esc(fmt(l))}${pieceHtml(l.nom,gEq(l))}</td></tr>`).join('')}</table>`);
  w.document.close();w.focus();w.print();
 });
}

/* ============ PAGE D'UNE ACTIVITÉ ============
   Chaque activité a une liste de VUES, dans l'ordre où elles apparaissent
   dans son sous-menu (barre latérale). Une activité SANS entrée dans VUES
   reçoit les cinq vues génériques (Aperçu/Tâches/Sous-projets/Schéma/Drive)
   — c'est ce que `vuesDe()` rend automatiquement, donc AUCUNE régression
   pour Finance/Partenariat/Développement tant qu'elles n'ont pas leur
   propre liste : elles restent exactement ce qu'elles étaient. Commercial
   et Production ont leurs vues propres + une dernière vue « Gestion » qui
   regroupe encore les cinq génériques (rien n'est perdu, juste déplacé) —
   « aucun chemin ne doit mener vers admin.html » : chaque vue est native. */
const VUES={
 commercial:[['pipeline','Pipe des ventes','commercial'],['profils','Profils','documents'],['comptes','Comptes & contacts','rh'],['emailing','Emailing & phoning','mail'],['prospection','Base de prospection','funnel'],['gestion','Gestion','projet']],
 production:[['dashboard','Tableau de bord','dash'],['commandes','Commandes','logistique'],['calendrier','Calendrier','calendar'],['stocks','Stocks','stocks'],['production','Production','production'],['livraison','Livraison','livraison'],['gestion','Gestion','projet']],
 logistique:[['tournees','Tournées','logistique'],['commandes','Commandes','livraison'],['gestion','Gestion','projet']],
 // Opérationnel vit sous « Financement » (demande de Pablo, 26/09) : c'est là
 // qu'il le cherche ; « Finance » redevient une activité générique.
 financement:[['operationnel','Opérationnel','finance'],['gestion','Gestion','projet']]

async function vGestionInterne(cle,tachesAct){

 const onglets=[['apercu','Aperçu'],['taches','Tâches',tachesAct.filter(t=>!t.routine&&t.statut!=='fait').length],['projets','Sous-projets',projets.length],['schema','Schéma',blocs.length],['drive','Drive',docs.length]];

/* ============ INTERFACE COMMERCIALE — pipeline (schéma en colonnes) ============
   Un « deal » EST un `crm_projets` de l'activité commercial — pas une seconde
   table de contacts/deals inventée sans spécification : c'est le même objet
   que « Sous-projets », donc il porte déjà responsable, échéance, description,
   ET son propre schéma de blocs (`vSchema('projet:'+id,…)`, sur sa page dédiée).
   Faire glisser une carte ne fait QUE changer son étape ; l'ouvrir (clic) mène
   à cette même page, où le schéma du deal est éditable comme n'importe quel
   projet — c'est là « la fonctionnalité de schéma » demandée pour le pipeline,
   réutilisée plutôt que dupliquée (une deuxième version aurait divergé de la
   première à la moindre retouche, cf. CLAUDE.md sur ce piège précis). */
/* §4.3 feature 4 : les 8 étapes par défaut de la spec + « Perdu ». Les
   profils portent leur PROPRE séquence recommandée (sequence_pipeline,
   affichée sur leur fiche playbook) mais le kanban partagé reste sur
   CETTE séquence commune — plusieurs jeux de colonnes selon le deal
   affiché rendraient le tableau incomparable d'une carte à l'autre.
   Voir la note de 0013_commercial_fondations.sql §1. */
/* ============ Relances (§4.3 feature 5) ============
   « Règle par profil (délai sans réponse, nombre maximum, message type) ;
   la file des relances à faire crée des missions ; arrêt automatique si
   le contact répond. » La règle se configure sur le profil
   (`ouvrirProfilDetail`, déjà écrit) — ce qui manquait, et qui faisait
   planter tout l'écran Pipeline (`verifierRelances` était appelée sans
   jamais avoir été définie), c'est le moteur qui la fait vivre.

   Basé sur `crm_messages` (canal email) uniquement : une « relance » est
   un rappel qu'on attend une réponse à un EMAIL, pas à n'importe quelle
   ligne de suivi (un appel loggé n'attend pas de réponse de la même
   façon). Le dernier email SORTANT du deal donne le point de départ ; un
   email ENTRANT plus récent que lui vaut réponse — arrêt immédiat.

   Idempotent par construction, pas par verrou : une relance déjà EN
   ATTENTE (`action_cle='relance_commerciale'`, statut ≠ fait) n'est
   jamais recréée, donc rappeler cette fonction à chaque ouverture de
   l'écran (c'est ce que fait `vInterfaceCommercial`) ne double rien. */
async function verifierRelances(){
 const deals=S.projets.filter(p=>p.activite==='commercial'&&p.profil_id&&p.etape_pipeline!=='perdu'&&p.etape_pipeline!=='client_recurrent');
 if(!deals.length)return 0;
 const profilIds=[...new Set(deals.map(d=>d.profil_id))];
 const reglesR=await sbTry('crm_relance_regles?profil_id=in.('+profilIds.join(',')+')&actif=eq.true&select=*');
 const regleParProfil={};
 (reglesR.ok?reglesR.data:[]).forEach(r=>{if(!regleParProfil[r.profil_id])regleParProfil[r.profil_id]=r});
 const dealsAvecRegle=deals.filter(d=>regleParProfil[d.profil_id]);
 if(!dealsAvecRegle.length)return 0;
 const dealIds=dealsAvecRegle.map(d=>d.id);
 const [msgR,tachesR]=await Promise.all([
  sbTry('crm_messages?projet_id=in.('+dealIds.join(',')+')&canal=eq.email&select=projet_id,sens,created_at&order=created_at.asc'),
  sbTry('crm_taches?projet_id=in.('+dealIds.join(',')+')&action_cle=eq.relance_commerciale&select=id,projet_id,statut,created_at')
 ]);
 const messages=msgR.ok?msgR.data:[];
 const toutesRelances=tachesR.ok?tachesR.data:[];
 let cree=0;
 for(const deal of dealsAvecRegle){
  const regle=regleParProfil[deal.profil_id];
  const msgsDeal=messages.filter(m=>m.projet_id===deal.id);
  const relancesDeal=toutesRelances.filter(t=>t.projet_id===deal.id);
  const pendante=relancesDeal.find(t=>t.statut!=='fait');
  const dernierSortant=msgsDeal.filter(m=>m.sens==='sortant').slice(-1)[0];
  if(!dernierSortant){
   // aucun email sortant retrouvé (deal jamais contacté, ou fil supprimé) :
   // une relance encore en attente n'a plus de raison d'être.
   if(pendante)await annulerRelance(pendante,'aucun email sortant retrouvé pour ce deal');
   continue;
  }
  const aRepondu=msgsDeal.some(m=>m.sens==='entrant'&&new Date(m.created_at)>new Date(dernierSortant.created_at));
  if(aRepondu){
   if(pendante)await annulerRelance(pendante,'le contact a répondu');
   continue;
  }
  if(pendante)continue; // déjà proposée, pas la peine d'en créer une seconde
  if(relancesDeal.length>=regle.nb_max)continue; // plafond de la règle atteint
  const joursDepuis=(Date.now()-new Date(dernierSortant.created_at).getTime())/86400000;
  if(joursDepuis<regle.delai_jours)continue; // pas encore l'heure
  const r=await sb('crm_taches',{method:'POST',body:JSON.stringify({
   activite:'commercial',projet_id:deal.id,titre:'Relance — '+deal.nom,
   description:regle.gabarit||('Aucune réponse depuis '+Math.floor(joursDepuis)+' jour(s) — relancer le contact.'),
   priorite:'moyenne',statut:'a_faire',action_cle:'relance_commerciale',cree_par:'Automatique'
  })});
  if(r&&r[0])S.taches.push(r[0]);
  cree++;
 }
 return cree;
}
async function annulerRelance(tache,raison){
 await sb('crm_taches?id=eq.'+tache.id,{method:'PATCH',body:JSON.stringify({statut:'fait',description:'Annulée automatiquement — '+raison})});
 const t=S.taches.find(x=>x.id===tache.id);if(t){t.statut='fait';t.description='Annulée automatiquement — '+raison}
}

const PIPELINE_ETAPES=[['premier_contact','Premier contact'],['decouverte','Découverte'],['degustation','Dégustation'],['proposition','Proposition'],['test','Test'],['negociation','Négociation'],['signature','Signature'],['client_recurrent','Client récurrent'],['perdu','Perdu']];
async function vInterfaceCommercial(){
 const nRelances=await verifierRelances();
 const deals=S.projets.filter(p=>p.activite==='commercial');
 return `<p class="muted" style="font-size:12.5px;margin:0 0 14px">Glissez une carte pour changer son étape — un suivi de l'étape actuelle est demandé avant de faire avancer un deal. Cliquez une carte pour l'ouvrir (fiche, playbook, suivi, schéma, tâches).${nRelances?` <b>${nRelances} relance(s)</b> créée(s) dans les tâches — voir « Toutes les tâches ».`:''}</p>
 <div class="kanban" id="pipelineWrap">${PIPELINE_ETAPES.map(([k,l])=>{
  const col=deals.filter(d=>(d.etape_pipeline||'premier_contact')===k);
  return `<div class="kanban-col" data-etape="${k}"><h4>${esc(l)} <span class="chip">${col.length}</span></h4>${col.map(dealCard).join('')||'<div class="empty" style="font-size:11px;padding:10px">—</div>'}</div>`;
 }).join('')}</div>

 <button class="btn" data-new="projet" data-activite="commercial">+ Prospect / client</button>`;
}
function dealCard(p){

}
let PIPELINE_DRAG=null;
function wirePipelineIfPresent(){
 const wrap=$('#pipelineWrap');if(!wrap)return;
 wrap.addEventListener('dragstart',e=>{
  const c=e.target.closest('[data-deal]');if(!c)return;
  PIPELINE_DRAG=c.dataset.deal;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';
 });
 wrap.addEventListener('dragend',e=>{const c=e.target.closest('[data-deal]');if(c)c.classList.remove('dragging')});
 wrap.querySelectorAll('.kanban-col').forEach(col=>{
  col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
  col.addEventListener('dragleave',()=>col.classList.remove('over'));
  col.addEventListener('drop',async e=>{
   e.preventDefault();col.classList.remove('over');
   if(!PIPELINE_DRAG)return;
   const etape=col.dataset.etape,id=PIPELINE_DRAG;PIPELINE_DRAG=null;
   const p=S.projets.find(x=>x.id===id);if(!p)return;
   const etapeActuelle=p.etape_pipeline||'premier_contact';
   if(etape===etapeActuelle)return;
   // §4.3 feature 5 : « passage à l'étape suivante bloqué tant que le
   // minimum n'est pas rempli » — au moins UN suivi loggé à l'étape
   // ACTUELLE. Ne s'applique qu'en AVANÇANT (index qui grandit) : revenir
   // en arrière pour corriger une erreur, ou marquer « Perdu », n'a pas à
   // exiger un suivi qu'on est justement en train de rattraper.
   const iActuelle=PIPELINE_ETAPES.findIndex(x=>x[0]===etapeActuelle);
   const iCible=PIPELINE_ETAPES.findIndex(x=>x[0]===etape);
   if(iCible>iActuelle&&etape!=='perdu'){
    const su=await sbTry('crm_suivi_etapes?projet_id=eq.'+id+'&etape=eq.'+etapeActuelle+'&select=id&limit=1');
    if(!su.ok||!su.data.length){
     toast('Ajoute un suivi de « '+(PIPELINE_ETAPES[iActuelle]||[])[1]+' » avant de faire avancer ce deal');
     ouvrirNouveauSuivi(id,etapeActuelle);
     return;
    }
   }
   await sb('crm_projets?id=eq.'+id,{method:'PATCH',body:JSON.stringify({etape_pipeline:etape})});
   p.etape_pipeline=etape;
   render();
   // §4.3 feature 7 : passage à « Test » → propose le bloc Test produit,
   // pré-rempli avec la fiche. Suggère, n'enchaîne pas tout seul — même
   // philosophie que evaluerReglesApresBascule() pour le moteur de
   // règles générique (§3.3 : « déterministe », pas « automatique sans
   // validation »).
   if(etape==='test'&&confirm('Deal passé à « Test » — proposer le bloc Test produit avec le lieu et l’effectif de la fiche ?')){
    ouvrirNouveauBloc({activite:'commercial',projet:id,prefill:{lieu:p.lieu_livraison,nb_beneficiaires:p.effectif}});
   }
  });
 });
 wrap.addEventListener('click',e=>{const c=e.target.closest('[data-deal]');if(c)go('projet:'+c.dataset.deal)});
}

/* ============ COMMERCIAL — Base de prospection, Comptes & contacts,
   Emailing & phoning ============
   Base de prospection ne recrée aucune donnée : c'est le pipeline filtré
   sur son premier stade — avancer un deal se fait toujours depuis Pipe des
   ventes, il n'y a qu'un seul endroit qui décide de l'étape. Comptes &
   contacts et Emailing & phoning sont natifs (crm_contacts/crm_interactions,
   migration 0008) — un contact optionnellement rattaché à un deal, et son
   fil d'interactions (email envoyé, appel passé), consultable par contact
   ou dans un flux unique toutes personnes confondues. */
function vCommercialProspection(){
 const prospects=S.projets.filter(p=>p.activite==='commercial'&&(p.etape_pipeline||'premier_contact')==='premier_contact');
 return `<p class="muted" style="font-size:12.5px;margin:0 0 14px">Les deals encore au stade « Premier contact » du pipeline. Faites-les avancer depuis <b>Pipe des ventes</b>.</p>
 <div class="grid g3">${prospects.map(projetCard).join('')||'<div class="empty">Aucun prospect pour l’instant — « + Prospect / client » dans le pipeline.</div>'}</div>`;
}
async function vCommerciauxContacts(){
 const r=await sbTry('crm_contacts?select=*,crm_projets(nom)&order=created_at.desc');
 if(!r.ok)return `<div class="exbar"><span class="chip bad">Illisible</span><span>Impossible de lire <span class="mono">crm_contacts</span> — session d'équipe requise, ou table absente.</span></div>`;

/* ============ IMPORT DE CONTACTS (Excel/CSV) — demandé par Pablo en
   cours de session 12 ============
   Colonnes reconnues, dans n'importe quel ordre, par en-tête (insensible
   aux accents/casse) : nom (ou prénom+nom séparés), entreprise, email,
   téléphone, linkedin, instagram. Tout le reste de la ligne est ignoré
   plutôt que de faire échouer l'import — un fichier fourni par quelqu'un
   d'autre a rarement exactement les colonnes attendues.
   SheetJS est chargé à la demande (~1 Mo) : aucune autre page du CRM
   n'a besoin de lire un .xlsx, l'imposer à chaque chargement coûterait
   à tout le monde pour une fonctionnalité utilisée occasionnellement. */
let SHEETJS_PROMESSE=null;
function chargerSheetJS(){
 if(window.XLSX)return Promise.resolve();
 if(SHEETJS_PROMESSE)return SHEETJS_PROMESSE;
 SHEETJS_PROMESSE=new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=resolve;s.onerror=()=>reject(new Error('Échec du chargement de la bibliothèque de lecture Excel'));
  document.head.appendChild(s);
 });
 return SHEETJS_PROMESSE;
}
/* Parseur CSV minimal mais correct sur les guillemets (un champ peut
   contenir une virgule ou un retour à la ligne s'il est entre "…", avec
   "" pour un guillemet littéral — RFC 4180). Suffisant pour un export de
   tableur ; pas un parseur généraliste. */
function parserCSV(texte){
 const lignes=[];let ligne=[],champ='',dansGuillemets=false;
 for(let i=0;i<texte.length;i++){
  const c=texte[i];
  if(dansGuillemets){
   if(c==='"'){if(texte[i+1]==='"'){champ+='"';i++}else dansGuillemets=false}
   else champ+=c;
  }else if(c==='"')dansGuillemets=true;
  else if(c===','){ligne.push(champ);champ=''}
  else if(c==='\n'||c==='\r'){
   if(c==='\r'&&texte[i+1]==='\n')i++;
   ligne.push(champ);champ='';lignes.push(ligne);ligne=[];
  }else champ+=c;
 }
 if(champ||ligne.length){ligne.push(champ);lignes.push(ligne)}
 return lignes.filter(l=>l.some(c=>c.trim()));
}
const normaliserEntete=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const ALIAS_COLONNES={
 nom:['nom','name','nom complet','full name'],
 prenom:['prenom','prénom','first name','firstname'],
 nomFamille:['nom de famille','last name','lastname','surname'],
 entreprise:['entreprise','societe','société','company','organisation'],
 email:['email','e-mail','mail','courriel','adresse email','adresse mail'],
 telephone:['telephone','téléphone','tel','tél','phone','numero de telephone'],
 linkedin:['linkedin','lien linkedin','linkedin url','profil linkedin'],
 instagram:['instagram','insta','compte insta','compte instagram']
};
function mapperEntetes(entetes){
 const idx={};
 entetes.forEach((e,i)=>{
  const n=normaliserEntete(e);
  for(const[cle,alias]of Object.entries(ALIAS_COLONNES))if(alias.includes(n)&&!(cle in idx))idx[cle]=i;
 });
 return idx;
}
function ouvrirImportContacts(){

  try{
   let tableau;
   if(/\.csv$/i.test(file.name)){
    tableau=parserCSV(await file.text());
   }else{
    await chargerSheetJS();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const feuille=wb.Sheets[wb.SheetNames[0]];
    tableau=XLSX.utils.sheet_to_json(feuille,{header:1,raw:false,defval:''});
   }
   if(!tableau.length){$('#impApercu').innerHTML='<div class="exbar"><span class="chip bad">Vide</span><span>Aucune ligne lue dans ce fichier.</span></div>';return}
   const entetes=tableau[0];

   const dejaEmails=new Set((dejaR.ok?dejaR.data:[]).map(c=>(c.email||'').toLowerCase()).filter(Boolean));
   const vus=new Set();
   lignesImport=tableau.slice(1).map(row=>{
    const val=cle=>(cle in idx?String(row[idx[cle]]||'').trim():'');
    // Une colonne « Prénom » ET une colonne « Nom » désignent le prénom et
    // le NOM DE FAMILLE, pas un nom complet — même si l'en-tête « Nom »
    // seul matche l'alias `nom` (défaut : nom complet en une colonne).
    // Sans ce test, un fichier à deux colonnes perdait le prénom : `val('nom')`
    // rendait déjà la valeur (le nom de famille), donc le `||` ne
    // regardait jamais `prenom`.
    const nom=('prenom' in idx)?[val('prenom'),val('nom')||val('nomFamille')].filter(Boolean).join(' '):(val('nom')||val('nomFamille'));

   <div class="tbl-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>Nom</th><th>Entreprise</th><th>Email</th><th>Statut</th></tr></thead><tbody>${lignesImport.slice(0,200).map(l=>`<tr><td>${esc(l.nom)}</td><td>${esc(l.entreprise||'—')}</td><td>${esc(l.email||'—')}</td><td>${l.statut==='ok'?'<span class="chip ok">à importer</span>':l.statut==='doublon'?'<span class="chip warn">doublon</span>':'<span class="chip bad">vide</span>'}</td></tr>`).join('')}</tbody></table></div>`;

 };

/* Fusionne crm_interactions (log rapide d'appel/autre — 5f0f647) et
   crm_messages (le contenu réel d'un échange email, threadé — session
   12) en UN SEUL fil trié par date : c'est « la boîte unifiée » (§4.3
   feature 4), les deux tables continuant de répondre chacune à leur
   usage propre (voir 0014_commercial_echanges.sql § pourquoi). */
function fusionnerFil(interactions,messages){
 const a=interactions.map(i=>({date:i.created_at,type:'interaction',data:i}));
 const b=messages.map(m=>({date:m.created_at,type:'message',data:m}));
 return[...a,...b].sort((x,y)=>new Date(y.date)-new Date(x.date));
}
function filItemHtml(item,{avecContact}={}){
 if(item.type==='interaction'){
  const i=item.data;
  const nomContact=avecContact?esc((i.crm_contacts||{}).nom||'Contact supprimé')+(i.resultat?' — '+esc(i.resultat):''):(i.type==='email'?'✉️ Email':i.type==='appel'?'📞 Appel':'Autre')+(i.resultat?' — '+esc(i.resultat):'');
  return `<div class="li ${avecContact?'c':''}" ${avecContact?`data-open-contact="${i.contact_id}"`:''}><span class="dot ${i.type==='email'?'info':i.type==='appel'?'ok':''}"></span><div class="grow"><b style="font-weight:500">${nomContact}</b>${i.note?`<div style="white-space:pre-wrap;font-size:12.5px;margin-top:2px">${esc(i.note)}</div>`:''}<div class="meta">${i.type==='email'?'✉️ Email':i.type==='appel'?'📞 Appel':'Autre'} · ${new Date(i.created_at).toLocaleString('fr-FR')}${i.auteur?' · '+esc(i.auteur):''}</div></div></div>`;
 }
 const m=item.data;
 const titre=avecContact?esc((m.crm_contacts||{}).nom||m.destinataire_email||m.expediteur_email||'Contact inconnu'):esc(m.sujet||(m.sens==='sortant'?'Email envoyé':'Email reçu'));
 // data-open-contact seulement si on a un contact à ouvrir : un message
 // pas encore rattaché (email entrant d'une adresse inconnue, feature 3)
 // ne doit pas paraître cliquable pour ne rien faire.
 const clic=avecContact&&m.contact_id?`data-open-contact="${m.contact_id}"`:'';
 return `<div class="li ${clic?'c':''}" ${clic}><span class="dot ${m.sens==='entrant'?'info':'ok'}">${m.sens==='entrant'&&!m.lu?'●':''}</span><div class="grow"><b style="font-weight:500">${m.sens==='sortant'?'↗ ':'↙ '}${titre}</b>${m.sujet&&avecContact?`<div style="font-size:12px;color:var(--muted)">${esc(m.sujet)}</div>`:''}${m.contenu?`<div style="white-space:pre-wrap;font-size:12.5px;margin-top:2px;max-height:60px;overflow:hidden">${esc(m.contenu.slice(0,220))}${m.contenu.length>220?'…':''}</div>`:''}<div class="meta">✉️ Email · ${new Date(m.created_at).toLocaleString('fr-FR')}${m.auteur?' · '+esc(m.auteur):''}${!m.lu&&m.sens==='entrant'?' · <span style="color:var(--blue)">non lu</span>':''}</div></div></div>`;
}

}

/* ============ COMMERCIAL — Bloc de suivi par étape (§4.3 feature 5-6)
   Une interaction commerciale = une ligne crm_suivi_etapes, rattachée à
   l'étape du pipeline où elle a eu lieu, plus les arguments utilisés
   avec leur verdict (crm_suivi_arguments) — c'est CE geste qui
   incrémente les compteurs de crm_profil_arguments (feature 6).
   ⚠️ Le compteur est écrit en LU-PUIS-ÉCRIT (valeur en cache + 1), pas
   par un `+1` SQL atomique côté base — PostgREST ne fait pas d'écriture
   incrémentale sans fonction RPC dédiée, que ce module n'a pas. Deux
   suivis du MÊME argument, soumis à quelques millisecondes d'écart,
   perdraient un incrément (l'écriture la plus tardive écraserait la
   première). Accepté sciemment : improbable dans une équipe de six sur
   un même deal, pas verrouillé en base pour éviter d'ajouter une
   fonction juste pour ce cas. */
async function ouvrirNouveauSuivi(projetId,etapeDefaut){
 const p=S.projets.find(x=>x.id===projetId);if(!p)return;
 const profil=profilDe(p.profil_id);
 const ar=profil?await sbTry('crm_profil_arguments?profil_id=eq.'+profil.id+'&select=*&order=created_at.asc'):{ok:true,data:[]};
 const arguments_=ar.ok?ar.data:[];
 const etape=etapeDefaut||p.etape_pipeline||'premier_contact';
 modal(`<h2>Bloc de suivi — ${esc(p.nom)}</h2>
 <div style="margin-bottom:10px"><button type="button" class="btn sm ghost" id="btnDepuisNotes">🤖 Remplir depuis des notes (IA)</button>
  <div id="zoneNotes" class="hide" style="margin-top:8px">
   <textarea class="inp" id="notesIA" placeholder="Colle ici tes notes de RDV ou l'email reçu — l'IA propose un remplissage, à corriger avant d'enregistrer." style="min-height:110px"></textarea>
   <div style="display:flex;justify-content:flex-end;margin-top:6px"><button type="button" class="btn sm primary" id="btnAnalyserNotes">Analyser</button></div>
  </div>
  <div id="blocPropose" class="hide" style="margin-top:8px;display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:var(--r-md);border:1px dashed var(--blue);color:var(--blue);font-size:12.5px;background:var(--blue-bg)"></div>
 </div>
 <form class="form" id="suiviForm">
  <div class="two"><label>Étape<select id="sv1">${PIPELINE_ETAPES.map(([k,l])=>`<option value="${k}" ${k===etape?'selected':''}>${esc(l)}</option>`).join('')}</select></label><label>Date<input class="inp" id="sv2" type="date" value="${isoLocal(new Date())}"></label></div>
  <div class="two"><label>Canal<select id="sv3">${opt(['email','téléphone','visio','présentiel','autre'])}</select></label><label>Interlocuteur<input class="inp" id="sv4"></label></div>
  <label>Verbatims<textarea class="inp" id="sv5" placeholder="Ce qui a été dit, mot pour mot si possible"></textarea></label>
  <label>Besoins exprimés<textarea class="inp" id="sv6"></textarea></label>
  <label>Objections rencontrées<textarea class="inp" id="sv7"></textarea></label>
  ${arguments_.length?`<label>Arguments utilisés<div style="display:grid;gap:6px">${arguments_.map(a=>`<div class="two" style="align-items:center"><span style="font-size:13px">${esc(a.argument)}</span><select class="inp sv-verdict" data-arg="${a.id}" data-arg-nom="${esc(a.argument)}"><option value="">Non utilisé</option><option value="porte">A porté</option><option value="neutre">Neutre</option><option value="rejete">Rejeté</option></select></div>`).join('')}</div></label>`
   :`<p class="muted" style="font-size:12px">${profil?'Ce profil n’a aucun argument enregistré — ajoutez-en depuis Profils pour en suivre l’efficacité.':'Ce deal n’a pas de profil — aucun argument à suivre.'}</p>`}
  <div class="two"><label>Prochaine action<input class="inp" id="sv8"></label><label>Échéance<input class="inp" id="sv9" type="date"></label></div>
  <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary" type="submit">Enregistrer le suivi</button></div>
 </form>`);
 $('#btnDepuisNotes').onclick=()=>$('#zoneNotes').classList.toggle('hide');
 /* §4.3 feature 7 : « proposition de bloc de suivi… validée ou corrigée
    avant enregistrement. Jamais d'envoi automatique. » — l'IA REMPLIT le
    formulaire déjà ouvert, elle n'enregistre rien elle-même : le bouton
    « Enregistrer le suivi » reste le seul geste qui écrit en base, et
    reste celui qu'on vient d'utiliser ailleurs dans ce fichier. Les
    arguments proposés sont bornés au catalogue RÉEL du profil (passé
    dans le prompt) — jamais un argument inventé par le modèle. */
 $('#btnAnalyserNotes').onclick=async()=>{
  const notes=$('#notesIA').value.trim();
  if(!notes){toast('Colle d’abord des notes');return}
  const btn=$('#btnAnalyserNotes');btn.disabled=true;btn.textContent='Analyse…';
  try{
   const catalogue=arguments_.map(a=>a.argument);
   /* §4.3 feature 8, ajoutée à la MÊME analyse plutôt qu'un second appel :
      « dans un compte rendu, l'IA peut proposer un bloc (par exemple Test
      produit) avec paramètres pré-remplis, soumis à l'aperçu du moteur. »
      Le modèle ne propose QUE s'il repère un vrai signal (dégustation,
      test produit, date et lieu évoqués) — `proposer:false` par défaut,
      jamais forcé à vrai pour un rendez-vous ordinaire. Et « soumis à
      l'aperçu du moteur » est tenu au pied de la lettre : le clic n'ouvre
      que le formulaire `ouvrirNouveauBloc`, qui passe de toute façon par
      `ouvrirApercuBloc` avant la moindre écriture — rien n'est créé ici. */
   const prompt=`Tu aides un commercial à résumer des notes de rendez-vous en un bloc de suivi CRM structuré.
Notes brutes :
"""
${notes}
"""
Catalogue d'arguments connus pour ce profil (utilise UNIQUEMENT ces libellés exacts, n'en invente aucun) :
${catalogue.length?catalogue.map(a=>'- '+a).join('\n'):'(aucun argument connu)'}

Réponds UNIQUEMENT avec un objet JSON, sans texte autour, de cette forme exacte :
{"canal":"email|téléphone|visio|présentiel|autre|null","interlocuteur":"string|null","verbatims":"string|null","besoins":"string|null","objections":"string|null","prochaine_action":"string|null","echeance":"YYYY-MM-DD|null","arguments":[{"argument":"libellé EXACT du catalogue","verdict":"porte|neutre|rejete"}],"bloc_propose":{"proposer":true|false,"raison":"string|null","lieu":"string|null","nb_beneficiaires":"number|null"}}
Ne mets "bloc_propose.proposer" à true QUE si les notes évoquent clairement l'organisation d'un test produit ou d'une dégustation à venir (pas un simple rendez-vous de suivi).`;
   const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+jetonStaff()},body:JSON.stringify({prompt,max_tokens:900})});
   const data=await res.json().catch(()=>({}));
   if(!res.ok||!data.text)throw new Error(data.error||'réponse vide');
   const m=data.text.match(/\{[\s\S]*\}/);
   if(!m)throw new Error('réponse IA illisible');
   const prop=JSON.parse(m[0]);
   if(prop.canal&&[...$('#sv3').options].some(o=>o.value===prop.canal))$('#sv3').value=prop.canal;
   if(prop.interlocuteur)$('#sv4').value=prop.interlocuteur;
   if(prop.verbatims)$('#sv5').value=prop.verbatims;
   if(prop.besoins)$('#sv6').value=prop.besoins;
   if(prop.objections)$('#sv7').value=prop.objections;
   if(prop.prochaine_action)$('#sv8').value=prop.prochaine_action;
   if(prop.echeance&&/^\d{4}-\d{2}-\d{2}$/.test(prop.echeance))$('#sv9').value=prop.echeance;
   (prop.arguments||[]).forEach(a=>{
    const sel=[...document.querySelectorAll('.sv-verdict')].find(s=>s.dataset.argNom===a.argument);
    if(sel&&['porte','neutre','rejete'].includes(a.verdict))sel.value=a.verdict;
   });
   const bp=prop.bloc_propose;
   if(bp&&bp.proposer){
    $('#blocPropose').classList.remove('hide');
    $('#blocPropose').innerHTML=`<span>📦 Ces notes évoquent un test produit${bp.raison?' — '+esc(bp.raison):''}.</span><button type="button" class="btn sm" id="btnProposerBloc" style="margin-left:auto;flex:0 0 auto">Proposer le bloc →</button>`;
    $('#btnProposerBloc').onclick=()=>{
     closeAll();
     ouvrirNouveauBloc({projet:projetId,prefill:{lieu:bp.lieu||null,nb_beneficiaires:bp.nb_beneficiaires||null}});
    };
   }else{
    $('#blocPropose').classList.add('hide');
   }
   $('#zoneNotes').classList.add('hide');
   toast('Formulaire pré-rempli — à relire avant d’enregistrer');
  }catch(err){toast('Échec de l’analyse : '+String(err.message||err).slice(0,120))}
  btn.disabled=false;btn.textContent='Analyser';
 };
 $('#suiviForm').onsubmit=async e=>{
  e.preventDefault();
  const body={projet_id:projetId,etape:$('#sv1').value,date:$('#sv2').value||isoLocal(new Date()),canal:$('#sv3').value||null,interlocuteur:$('#sv4').value||null,verbatims:$('#sv5').value||null,besoins:$('#sv6').value||null,objections:$('#sv7').value||null,prochaine_action:$('#sv8').value||null,echeance:$('#sv9').value||null,cree_par:STAFF_NOM};
  const r=await sb('crm_suivi_etapes',{method:'POST',body:JSON.stringify(body)});
  const suivi=r[0];
  const verdicts=[...document.querySelectorAll('.sv-verdict')].map(s=>({argId:s.dataset.arg,verdict:s.value})).filter(x=>x.verdict);
  for(const v of verdicts){
   await sb('crm_suivi_arguments',{method:'POST',body:JSON.stringify({suivi_id:suivi.id,profil_argument_id:v.argId,verdict:v.verdict})});
   const arg=arguments_.find(a=>a.id===v.argId);if(!arg)continue;
   const patch={[v.verdict]:arg[v.verdict]+1};
   await sb('crm_profil_arguments?id=eq.'+v.argId,{method:'PATCH',body:JSON.stringify(patch)});
  }
  closeAll();toast('Suivi enregistré'+(verdicts.length?' — '+verdicts.length+' argument(s) comptabilisé(s)':''));render();
 };
}

/* ============ Fiche client + playbook + suivi (§4.3 feature 3, 5) —
   greffée sur la page projet générique plutôt que réécrite à part :
   toute la mécanique Schéma/Tâches/Drive au-dessus lui est déjà commune,
   seule la partie « ce qui rend un deal différent d'un projet ordinaire »
   est spécifique. */
async function vFicheCommerciale(p){
 const profil=profilDe(p.profil_id);
 const su=await sbTry('crm_suivi_etapes?projet_id=eq.'+p.id+'&select=*&order=date.desc,created_at.desc');
 const suivis=su.ok?su.data:[];
 const etapeLabel=(PIPELINE_ETAPES.find(x=>x[0]===p.etape_pipeline)||[,p.etape_pipeline])[1];
 return `<div class="sect"><h2>Fiche client</h2><span>${etapeLabel||'Étape non définie'}</span></div>
 <div class="grid g2" style="align-items:start;margin-bottom:18px">

/* Commandes (Logistique) — lit les VRAIES tables de production, pas de
   doublon. Chaque ligne ouvre l'attribution native (partagée avec
   Production → Commandes) : pas de renvoi vers admin.html. */
async function vCommandesLogistique(){
 const r=await sbTry('bons_commande?select=id,user_id,type,nb_repas,jour_livraison,statut,semaine&order=jour_livraison.asc.nullslast&limit=100');
 if(!r.ok)return `<div class="exbar"><span class="chip bad">Illisible</span><span>Impossible de lire <span class="mono">bons_commande</span> — session d'équipe requise, ou table absente.</span></div>`;
 const bons=r.data;

 const attribues=bons.filter(b=>b.statut==='attribue'||b.statut==='en_production').length;
 const livres=bons.filter(b=>b.statut==='livre').length;

 <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Repas</th><th>Semaine</th><th>Livraison</th><th>Statut</th></tr></thead><tbody>${bons.slice(0,30).map(b=>`<tr class="rowc" data-edit-bon="${b.id}"><td><span class="chip">${esc(b.type)}</span></td><td class="num">${b.nb_repas}</td><td>${b.semaine?fd(b.semaine):'—'}</td><td>${b.jour_livraison?fd(b.jour_livraison):'<span class="chip bad">sans date</span>'}</td><td><span class="chip ${(lab[b.statut]||['',''])[0]}">${(lab[b.statut]||['',b.statut])[1]}</span></td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">Aucun bon</td></tr>'}</tbody></table></div>`;

/* ============ SESSION 07 — LOGISTIQUE : ÉTIQUETTES, TOURNÉES, RANGEMENT
   (docs/crm-sessions/07-logistique.md, docs/crm-spec.md §4 feature 2-5) ============
   Étiquette, rangement et tournée se suivent : un bon devient un colis
   étiqueté, les colis se rangent dans l'ordre de la tournée, la tournée
   les livre. Une tournée par jour, ses arrêts groupés par ADRESSE
   identique (§4.2 : « un lieu B2B regroupe tous ses bons en un seul
   arrêt » — bons_commande n'a pas de colonne B2B à part, le
   regroupement par adresse le couvre sans en inventer une).

   La vue livreur RÉUTILISE le plein écran de la tablette cuisine
   (#tablette, .tab-*, session 06) : même besoin — grosse typographie,
   fort contraste, pilotable au doigt, une seule chose affichée à la
   fois — donc le même CSS plutôt qu'un second jeu de règles qui
   diverge à la première retouche (règle 44 du dépôt Natty). Un état
   dédié (LIVR_TOURNEE, pas TAB_SESSION) évite toute confusion entre
   les deux plein écran, qu'on ne peut de toute façon jamais avoir
   ouverts en même temps. */

async function vLogistiqueTournees(){
 const r=await sbTry('crm_tournees?select=*&order=jour.desc&limit=60');
 const tournees=r.ok?r.data:[];
 return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm primary" data-nouvelle-tournee>+ Tournée</button></div>
 <div class="grid g3">${tournees.map(tourneeCard).join('')||'<div class="empty">Aucune tournée. Les commandes prêtes à livrer se planifient depuis « + Tournée ».</div>'}</div>`;
}
function tourneeCard(t){
 const lab={a_preparer:['','à préparer'],confirmee:['ok','confirmée'],en_cours:['warn','en cours'],terminee:['ok','terminée']}[t.statut]||['',t.statut];
 return `<div class="card lift click" data-ouvrir-tournee="${t.id}"><h3>${fd(t.jour)} <span class="chip ${lab[0]}">${lab[1]}</span></h3>
 <p class="sub">${t.creneau_debut.slice(0,5)}–${t.creneau_fin.slice(0,5)}${t.livreur?' · '+esc(nomDe(t.livreur)):' · livreur à assigner'}</p></div>`;
}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-nouvelle-tournee]')){ouvrirNouvelleTournee();return}
 const ot=e.target.closest('[data-ouvrir-tournee]');
 if(ot){ouvrirTourneeDetail(ot.dataset.ouvrirTournee);return}
});

/* Les jours proposés sont ceux qui ont des commandes prêtes à livrer et
   PAS ENCORE dans une tournée (arret_id is null) — même filtre que « À
   planifier » côté Production, même raison : ne rien happer en silence.
   « Prêtes » = attribuées et pas annulées, peu importe le statut exact
   (a_attribuer inclus : une commande peut être livrable sans que
   l'attribution soit le sujet ici, contrairement à la session de
   production). */
async function ouvrirNouvelleTournee(){
 const r=await sbTry('bons_commande?statut=neq.annule&arret_id=is.null&jour_livraison=not.is.null&select=jour_livraison');
 const bons=r.ok?r.data:[];
 const parJour={};bons.forEach(b=>parJour[b.jour_livraison]=(parJour[b.jour_livraison]||0)+1);
 const jours=Object.keys(parJour).sort();
 if(!jours.length){toast('Aucune commande avec une date de livraison, pas encore en tournée.');return}
 modal(`<h2>Nouvelle tournée</h2><form class="form" id="tourneeForm">
  <label>Jour<select id="tj1">${jours.map(j=>`<option value="${j}">${fd(j)} · ${parJour[j]} commande(s)</option>`).join('')}</select></label>
  <div class="two"><label>Créneau — arrivée<input class="inp" id="tj2" type="time" value="11:00"></label><label>Fin<input class="inp" id="tj3" type="time" value="13:00"></label></div>
  <label>Livreur<select id="tj4"><option value="">À assigner</option>${S.staff.map(s=>`<option value="${s.user_id}">${esc(s.nom)}</option>`).join('')}</select></label>
  <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary" type="submit">Créer la tournée</button></div>
 </form>`);
 $('#tourneeForm').onsubmit=async e=>{
  e.preventDefault();
  closeAll();
  await creerTourneeDepuisJour($('#tj1').value,$('#tj2').value,$('#tj3').value,$('#tj4').value||null);
 };
}
async function creerTourneeDepuisJour(jour,debut,fin,livreur){
 const r=await sbTry('bons_commande?statut=neq.annule&arret_id=is.null&jour_livraison=eq.'+jour+'&select=id,adresse,contact_nom,contact_tel');
 const bons=r.ok?r.data:[];
 if(!bons.length){toast('Rien à livrer ce jour-là');return}
 const tr=await sb('crm_tournees',{method:'POST',body:JSON.stringify({jour,creneau_debut:debut,creneau_fin:fin,livreur})});
 const tournee=tr[0];
 // Regroupement par adresse exacte (recadrée, insensible à la casse) —
 // c'est le seul signal dont on dispose pour « même lieu ».
 const parAdresse={};
 bons.forEach(b=>{
  const cle=String(b.adresse||'').trim().toLowerCase()||'(sans adresse)';
  (parAdresse[cle]=parAdresse[cle]||{adresse:b.adresse||'Sans adresse',bonIds:[]}).bonIds.push(b.id);
 });
 const adresses=Object.values(parAdresse);
 let ordre=0;
 for(const a of adresses){
  const ar=await sb('crm_tournee_arrets',{method:'POST',body:JSON.stringify({tournee_id:tournee.id,ordre:ordre++,adresse:a.adresse})});
  await sb('bons_commande?id=in.('+a.bonIds.join(',')+')',{method:'PATCH',body:JSON.stringify({arret_id:ar[0].id})});
 }
 toast('Tournée créée — '+adresses.length+' arrêt(s), '+bons.length+' commande(s)');
 render();
 ouvrirTourneeDetail(tournee.id);
}

 <div class="foot" style="justify-content:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:16px">

  <button class="btn sm ghost" data-etiquettes="${id}">🏷️ Étiquettes</button>
  <button class="btn sm ghost" data-plan-rangement="${id}">📦 Plan de rangement</button>
  <button class="btn sm primary" data-ouvrir-vue-livreur="${id}">📱 Vue livreur</button>
 </div>
 <div class="sect"><h2 style="font-size:15px">Arrêts, dans l'ordre de tournée</h2></div>
 <div class="list">${arrets.map((a,i)=>arretLi(a,i,arrets.length,bonsParArret[a.id]||[])).join('')||'<div class="empty">Aucun arrêt.</div>'}</div>`);

function arretLi(a,i,total,bons){

 <div class="grow"><b style="font-weight:500">${esc(a.adresse)}</b><div class="meta">${bons.length} commande(s) · ${nbColis} colis${contacts.length?' · '+contacts.map(esc).join(', '):''}</div></div>

/* Réordonnancement MANUEL (§4.3 : « manuel au départ ») — échange le
   `ordre` avec le voisin, pas de renumérotation globale : deux PATCH
   suffisent, et l'ordre relatif de tous les autres arrêts est intact. */
async function deplacerArret(id,sens){
 const r=await sbTry('crm_tournee_arrets?id=eq.'+id+'&select=tournee_id,ordre');
 const a=(r.ok?r.data:[])[0];if(!a)return;
 const tous=await sbTry('crm_tournee_arrets?tournee_id=eq.'+a.tournee_id+'&select=id,ordre&order=ordre.asc');
 const liste=tous.ok?tous.data:[];
 const idx=liste.findIndex(x=>x.id===id);
 const voisinIdx=idx+sens;
 if(voisinIdx<0||voisinIdx>=liste.length)return;
 const voisin=liste[voisinIdx];
 await Promise.all([
  sb('crm_tournee_arrets?id=eq.'+id,{method:'PATCH',body:JSON.stringify({ordre:voisin.ordre})}),
  sb('crm_tournee_arrets?id=eq.'+voisin.id,{method:'PATCH',body:JSON.stringify({ordre:a.ordre})})
 ]);
 ouvrirTourneeDetail(a.tournee_id);
}
/* « Proposition simple par proximité » (§4.3) — tri alphabétique sur
   l'adresse, RIEN d'autre : aucun service de géocodage/itinéraire n'est
   branché sans l'accord explicite de Pablo (spec, à la lettre). Deux
   adresses de la même rue se retrouvent souvent voisines dans un tri
   alphabétique parce que les noms de rue se répètent dans le texte —
   un heuristique honnête, pas un calcul d'itinéraire. */
async function trierParProximite(tourneeId){
 const r=await sbTry('crm_tournee_arrets?tournee_id=eq.'+tourneeId+'&select=id,adresse');
 const arrets=(r.ok?r.data:[]).sort((a,b)=>a.adresse.localeCompare(b.adresse,'fr'));
 for(let i=0;i<arrets.length;i++)await sb('crm_tournee_arrets?id=eq.'+arrets[i].id,{method:'PATCH',body:JSON.stringify({ordre:i})});
 toast('Trié par ordre alphabétique d’adresse — à ajuster à la main si besoin');
 ouvrirTourneeDetail(tourneeId);
}
async function confirmerTournee(id){
 await sb('crm_tournees?id=eq.'+id,{method:'PATCH',body:JSON.stringify({statut:'confirmee'})});
 toast('Tournée confirmée');
 ouvrirTourneeDetail(id);render();
}

/* ---- Étiquettes (§4.1) — une par bon, imprimable par lot. Le format
   même popup+window.print() que la liste de courses (session 05) : déjà
   éprouvé, pas de nouvelle mécanique d'impression à inventer.
   ⚠️ La date limite et les consignes sont un FORMAT PROPOSÉ (la spec
   l'invite explicitement : « format à me proposer ») — la durée de
   conservation en toutes lettres (3 jours) est un placeholder à
   confirmer avec Francis, pas une règle métier vérifiée ailleurs dans
   ce dépôt. Aucun allergène n'est affiché : rien dans le schéma actuel
   ne les porte au niveau d'une recette, mieux vaut l'absence visible
   qu'une case cochée à tort. */
async function ouvrirEtiquettes(tourneeId){
 const [tr,ar]=await Promise.all([
  sbTry('crm_tournees?id=eq.'+tourneeId+'&select=*'),
  sbTry('crm_tournee_arrets?tournee_id=eq.'+tourneeId+'&select=id,ordre,adresse&order=ordre.asc')
 ]);
 const t=(tr.ok?tr.data:[])[0];if(!t)return;
 const arrets=ar.ok?ar.data:[];
 const arretIds=arrets.map(a=>a.id);
 if(!arretIds.length){toast('Aucun arrêt à étiqueter');return}
 const br=await sbTry('bons_commande?arret_id=in.('+arretIds.join(',')+')&select=id,arret_id,nb_repas,notes,type,contact_nom');

function wireSchemaIfPresent(){
 const wrap=$('#schemaWrap');if(!wrap)return;
 dessinerLiens(wrap);
 const btnLink=$('#btnLinkMode');if(btnLink)btnLink.onclick=()=>{LINK_MODE=!LINK_MODE;LINK_FROM=null;render()};
 attacherDragPositionnable(wrap,'.sblock',(bl,x,y)=>sauverPositionBloc(bl.dataset.bloc,x,y));
 wrap.addEventListener('click',e=>{
  const del=e.target.closest('[data-del-bloc]');
  if(del){e.stopPropagation();supprimerBloc(del.dataset.delBloc);return}
  const bl=e.target.closest('.sblock');
  if(!bl)return;
  if(Date.now()-DERNIER_DRAG_TS<150)return;   // c'était un glisser, pas un clic
  if(LINK_MODE){e.stopPropagation();clicBlocPourLien(bl.dataset.bloc,wrap);return}
  const b=trouverBloc(bl.dataset.bloc);
  if(b&&b.modele_id)ouvrirDetailBlocModele(bl.dataset.bloc);
  else ouvrirEditionBloc(bl.dataset.bloc);
 });

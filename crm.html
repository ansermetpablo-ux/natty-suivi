<!doctype html>
<html lang="fr">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natty CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ═══ Jetons — même langage visuel que le mockup "Natty OS" validé par Pablo ═══ */
:root{
  --bg:#ffffff;--card:#ececef;--panel:#f6f6f8;--ink:#101014;--on-ink:#ffffff;--muted:#85858f;--line:#e8e8ee;
  --green:#34c759;--amber:#ff9f0a;--red:#ff3b30;--blue:#0a84ff;--violet:#8e5cf7;
  --green-bg:rgba(52,199,89,.12);--amber-bg:rgba(255,159,10,.14);--red-bg:rgba(255,59,48,.11);--blue-bg:rgba(10,132,255,.1);--violet-bg:rgba(142,92,247,.12);
  --r-xl:30px;--r-lg:22px;--r-md:16px;--r-sm:11px;--r-full:999px;
  --nm-soft:0 8px 22px rgba(20,20,30,.07);--nm-pop:0 18px 50px rgba(20,20,30,.18);
  --metal:radial-gradient(130% 65% at 12% -10%,rgba(255,255,255,.11) 0%,rgba(255,255,255,0) 42%),linear-gradient(135deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 28%),linear-gradient(165deg,#0c0d0f 0%,#050506 55%,#000 100%);
  --sh-metal:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.3);
  --metal-ink:#f4f4f7;--metal-mut:#9a9aa6;--scrim:rgba(10,10,14,.38);
  --f:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e0e11;--card:#1f1f26;--panel:#16161b;--ink:#f4f4f7;--on-ink:#0e0e11;--muted:#8e8e99;--line:#2a2a32;--green:#32d74b;--amber:#ffb340;--red:#ff453a;--blue:#409cff;--violet:#a98bff;--nm-soft:0 8px 24px rgba(0,0,0,.5);--nm-pop:0 18px 50px rgba(0,0,0,.6);--metal:radial-gradient(130% 65% at 12% -10%,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 42%),linear-gradient(165deg,#25262c 0%,#18191d 55%,#101114 100%);--scrim:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e0e11;--card:#1f1f26;--panel:#16161b;--ink:#f4f4f7;--on-ink:#0e0e11;--muted:#8e8e99;--line:#2a2a32;--green:#32d74b;--amber:#ffb340;--red:#ff453a;--blue:#409cff;--violet:#a98bff;--nm-soft:0 8px 24px rgba(0,0,0,.5);--nm-pop:0 18px 50px rgba(0,0,0,.6);--metal:radial-gradient(130% 65% at 12% -10%,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 42%),linear-gradient(165deg,#25262c 0%,#18191d 55%,#101114 100%);--scrim:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono)}.muted{color:var(--muted)}
a{color:inherit}
[hidden]{display:none!important}

/* ═══ Connexion ═══ */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{width:min(380px,100%);background:var(--bg);border-radius:var(--r-xl);box-shadow:var(--nm-pop);padding:32px 28px;border:1px solid var(--line)}
.logincard .logo{width:52px;height:52px;border-radius:16px;background:var(--metal);box-shadow:var(--sh-metal);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;margin-bottom:16px}
.logincard h1{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
.logincard p.sub{color:var(--muted);margin:0 0 22px;font-size:13px}
.logincard input{width:100%;margin-bottom:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:11px 13px}
.loginerr{color:var(--red);font-size:12.5px;min-height:16px;margin:2px 0 10px}

/* ═══ App shell ═══ */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg);z-index:12}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--metal);box-shadow:var(--sh-metal);display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.brand b{font-size:16px;letter-spacing:-.02em;display:block}.brand small{color:var(--muted);font-size:11.5px}
.navscroll{flex:1;overflow-y:auto;padding:4px 12px 12px}
.ngroup{margin-top:10px}
.ngroup>div{padding:8px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;user-select:none;border-radius:var(--r-sm)}
.ngroup>div:hover{color:var(--ink)}
.ngroup>div svg{width:11px;height:11px;flex:none;stroke:currentColor;fill:none;stroke-width:2.6;transition:transform .15s}
.ngroup.closed>div svg{transform:rotate(-90deg)}
.ngroup.closed .nitem{display:none}
.nitem{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);text-align:left;font-weight:500;color:var(--muted)}
.nitem svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nitem:hover{background:var(--panel);color:var(--ink)}
.nitem[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nitem .b{margin-left:auto;font-size:10.5px;font-family:var(--mono);min-width:20px;text-align:center;padding:1px 6px;border-radius:var(--r-full);background:var(--card);color:var(--muted)}
.nitem .b.r{background:var(--red);color:#fff}
.nitem[aria-current="page"] .b{background:rgba(255,255,255,.18);color:inherit}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.av.dk{background:var(--ink);color:var(--on-ink)}.av.lg{width:52px;height:52px;border-radius:16px;font-size:17px}
.side-foot .who{min-width:0;flex:1}.side-foot .who b{display:block;font-size:13px}.side-foot .who small{color:var(--muted)}
.side-foot .out{border:0;background:var(--card);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}
.side-foot .out svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px clamp(16px,3vw,32px)}
.ib.menu-btn{display:none}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.crumb b{color:var(--ink)}
.spacer{flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:var(--card);border-radius:var(--r-full);padding:8px 14px;color:var(--muted);width:260px;max-width:100%}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bg);padding:1px 6px;border-radius:6px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;flex:none;position:relative}
.ib .dotn{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:0;border-radius:var(--r-full);padding:9px 16px;font-weight:600;background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
main{padding-block:22px 80px;padding-inline:clamp(16px,3vw,32px);min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.ph h1{font-size:25px;letter-spacing:-.03em;margin:0;line-height:1.15;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .b{font-size:10.5px;font-family:var(--mono);background:var(--card);padding:1px 6px;border-radius:var(--r-full)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border-radius:var(--r-lg);padding:18px;min-width:0}
.card.lift{background:var(--bg);box-shadow:var(--nm-soft);border:1px solid var(--line)}
.card.click{cursor:pointer;transition:transform .12s}.card.click:hover{transform:translateY(-2px)}
.card h3{margin:0 0 3px;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.metal{background:var(--metal);box-shadow:var(--sh-metal);color:var(--metal-ink)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:8px 0 3px;line-height:1}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .foot{font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:var(--r-full);background:var(--card);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-full);background:var(--card);color:var(--muted);white-space:nowrap;border:0}
.chip.ok{background:var(--green-bg);color:var(--green)}.chip.warn{background:var(--amber-bg);color:var(--amber)}.chip.bad{background:var(--red-bg);color:var(--red)}.chip.info{background:var(--blue-bg);color:var(--blue)}.chip.vi{background:var(--violet-bg);color:var(--violet)}.chip.ink{background:var(--ink);color:var(--on-ink)}
.sect{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sect h2{margin:0;font-size:17px;letter-spacing:-.02em}.sect span{color:var(--muted);font-size:12.5px}
.exbar{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:var(--r-md);border:1px dashed var(--red);color:var(--red);font-size:12.5px;margin-bottom:14px;background:var(--red-bg)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--panel)}
tr:last-child td{border-bottom:0}
tbody tr.rowc{cursor:pointer}tbody tr.rowc:hover td{background:var(--panel)}
.who{display:flex;align-items:center;gap:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:inline-flex;background:var(--card);border-radius:var(--r-full);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:var(--r-full);padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--nm-soft)}
select,.inp{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:8px 11px;min-width:0}
select.pill{border:0;background:var(--card);border-radius:var(--r-full);font-weight:600;font-size:12.5px;padding:7px 12px}
.inp.search{border-radius:var(--r-full);background:var(--card);border:0;padding:8px 14px;width:220px;max-width:100%}
textarea.inp{width:100%;min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.c{cursor:pointer}.li.c:hover{background:var(--panel);margin-inline:-10px;padding-inline:10px;border-radius:10px}
.li .grow{flex:1;min-width:0}.li .meta{font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--muted)}
.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}.dot.info{background:var(--blue)}.dot.vi{background:var(--violet)}
.check{width:20px;height:20px;border-radius:7px;border:1.8px solid var(--line);flex:none;display:grid;place-items:center;background:var(--bg);padding:0;margin-top:1px}
.check[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.check[aria-checked="true"]::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-ink);border-bottom:2px solid var(--on-ink);transform:rotate(-45deg) translate(1px,-1px)}
.li.done b{text-decoration:line-through;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:16px;color:var(--muted);font-size:12.5px;text-align:center}
.prog{display:flex;align-items:center;gap:8px;font-size:12px}
.prog .bar{flex:1;margin:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
/* Drawer / modal / palette */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .25s ease;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dh{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.dh h2{margin:4px 0 2px;font-size:20px;letter-spacing:-.02em}
.x{border:0;background:var(--card);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;flex:none;margin-left:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--nm-pop);z-index:32;padding:22px;transition:.18s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h2{margin:0 0 4px;font-size:18px}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form .inp,.form select,.form textarea{width:100%;font-weight:400}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--nm-pop);z-index:33;display:none;overflow:hidden}
.pal.on{display:block}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:none;outline:none}
.pal .res{max-height:52vh;overflow-y:auto;padding:6px}
.pal .r{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}
.pal .r.sel,.pal .r:hover{background:var(--panel)}
.pal .r small{margin-left:auto;color:var(--muted);font-size:11.5px}
.pal .gh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px 2px;font-weight:600}
.pop{position:fixed;z-index:34;background:var(--bg);border:1px solid var(--line);box-shadow:var(--nm-pop);border-radius:var(--r-md);padding:6px;min-width:220px;display:none}
.pop.on{display:block}
.pop button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 11px;border-radius:9px;text-align:left}
.pop button:hover{background:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:var(--r-full);font-weight:600;font-size:13px;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Vue tablette (session 06) — grosse typographie, fort contraste,
   pilotable au doigt mains occupées. z-index 38 : au-dessus du drawer/
   modal (31/32), en dessous du toast (40) pour que les confirmations
   restent lisibles par-dessus. */
.tablette{position:fixed;inset:0;z-index:38;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tablette.on{display:flex}
.tab-head{display:flex;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab-head h1{font-size:22px;margin:0;flex:1 1 auto;min-width:0}
.tab-chrono{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
.tab-chrono.warn{color:var(--amber)}
.tab-chrono.bad{color:var(--red)}
.tab-close{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tab-phases{display:flex;gap:10px;padding:14px 24px}
.tab-phases button{flex:1;padding:16px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:600;cursor:pointer}
.tab-phases button.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.tab-list{flex:1;overflow-y:auto;padding:8px 24px 32px;display:flex;flex-direction:column;gap:12px}
.tab-card{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--nm-soft,none)}
.tab-card.fait{opacity:.5}
.tab-card.encours{outline:3px solid var(--amber)}
.tab-card .grow{min-width:0}
.tab-card .titre{font-size:19px;font-weight:600;line-height:1.3}
.tab-card .sub{font-size:14px;color:var(--muted);margin-top:4px}
.tab-card .duree{font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab-btn{flex:0 0 auto;padding:14px 22px;border-radius:var(--r-md);border:0;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab-btn.go{background:var(--ink);color:var(--on-ink)}
.tab-btn.done{background:var(--green);color:#fff}
.tab-btn.wait{background:var(--panel);color:var(--muted)}
.hide{display:none!important}

/* ═══ Accueil : carrousel des échéances ═══ */
.hero-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.hero-card{scroll-snap-align:start;flex:0 0 auto;width:230px;background:var(--metal);box-shadow:var(--sh-metal);color:var(--metal-ink);border-radius:var(--r-lg);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.hero-card .hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero-card .hc-act{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--metal-mut);font-weight:700}
.hero-card .hc-days{font-size:24px;font-weight:700;letter-spacing:-.02em}
.hero-card .hc-days small{font-size:12px;font-weight:600;color:var(--metal-mut)}
.hero-card b{font-size:13.5px;line-height:1.3;font-weight:600}
.hero-card.urgent{box-shadow:var(--sh-metal),0 0 0 2px var(--red)}

/* ═══ Accueil : grille des activités ═══ */
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.acttile{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;box-shadow:var(--nm-soft);text-align:left}
.acttile:hover{transform:translateY(-2px);transition:transform .12s}
.acttile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.acttile .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acttile b{font-size:15px}
.acttile .cnt{font-size:12px;color:var(--muted)}
.acttile .cnt b{font-size:12px;color:var(--ink)}

/* ═══ Accueil : scénario global (lanes par activité) ═══ */
.lane{margin-bottom:16px}
.lane-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:8px}
.lane-h .dot{margin:0;width:10px;height:10px}
.lane-items{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.litem{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:var(--r-full);padding:5px 12px 5px 5px;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.litem:hover{border-color:var(--line)}
.litem .lcheck{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--line);flex:none;background:var(--bg)}
.litem .lcheck:hover{border-color:var(--green);background:var(--green-bg)}
.litem .ld{color:var(--muted);font-size:11px}
.lane-add{border:1.5px dashed var(--line);border-radius:var(--r-full);padding:5px 14px;font-size:12.5px;color:var(--muted);background:none}
.lane-add:hover{color:var(--ink);border-color:var(--ink)}

/* ═══ Routine hero ═══ */
.routine{background:var(--metal);box-shadow:var(--sh-metal);color:var(--metal-ink);border-radius:var(--r-lg);padding:18px;margin-bottom:20px}
.routine h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.routine .li{border-bottom-color:rgba(255,255,255,.12)}
.routine .li .meta{color:var(--metal-mut)}
.routine .check{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.routine .check[aria-checked="true"]{background:var(--green);border-color:var(--green)}

/* ═══ Schéma éditable (blocs, glisser, relier) ═══ */
.schema-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.schema-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background-color:var(--panel);background-image:radial-gradient(circle,var(--line) 1.2px,transparent 1.2px);background-size:22px 22px;min-height:440px;overflow:hidden;touch-action:none}
.schema-wrap.linking{cursor:crosshair}
.schema-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.schema-svg line{stroke:var(--muted);stroke-width:1.6}
.schema-svg .lienhit{stroke:transparent;stroke-width:14px;pointer-events:auto;cursor:pointer}
.sblock{position:absolute;width:150px;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--nm-soft);cursor:grab;user-select:none}
.sblock:active{cursor:grabbing}
.sblock.selected{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.sblock .sb-ic{width:26px;height:26px;border-radius:8px;background:var(--card);display:grid;place-items:center;margin-bottom:7px;color:var(--ink)}
.sblock .sb-ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.sblock b{font-size:12.5px;display:block;line-height:1.25}
.sblock .sb-due{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:4px}
.sblock .sb-del{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg);align-items:center;justify-content:center;font-size:12px;line-height:1;display:none}
.sblock:hover .sb-del{display:flex}
.schema-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}

/* ═══ RH : calendrier hebdomadaire (heures + réunions + tâches) ═══ */
.rhcal-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;flex-wrap:wrap}
.rhcal-nav b{font-weight:600}
.rhcal{display:flex;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.rhcal-hcol{width:40px;flex:none;padding-top:56px}
.rhcal-hourrow{height:44px;font-size:9.5px;color:var(--muted);padding:2px 4px;box-sizing:border-box;border-top:1px solid var(--line)}
.rhcal-days{display:flex;flex:1;min-width:0}
.rhcal-day{flex:1;min-width:96px}
.rhcal-day+.rhcal-day{border-left:1px solid var(--line)}
.rhcal-daylabel{padding:8px 6px;font-size:11.5px;font-weight:700;text-align:center;border-bottom:1px solid var(--line)}
.rhcal-daylabel span{color:var(--muted);font-weight:500;margin-left:3px}
.rhcal-daylabel.today{color:var(--blue)}
.rhcal-allday{min-height:24px;padding:4px 4px 6px;display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid var(--line)}
.rhcal-chip{font-size:9.5px;padding:2px 5px;border-radius:5px;background:var(--card);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhcal-track{position:relative;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 44px)}
.rhcal-evt{position:absolute;border-radius:7px;padding:3px 6px;color:#fff;font-size:10.5px;overflow:hidden;cursor:pointer;box-sizing:border-box}
.rhcal-evt b{display:block;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.rhcal-evt small{display:block;font-size:9px;opacity:.85}
@media (max-width:900px){.rhcal{overflow-x:auto}.rhcal-days{min-width:760px}}

/* ═══ Interface d'activité : onglet « vue » (custom) + onglet « Gestion » (ancien système) ═══ */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kanban-col{flex:0 0 236px;background:var(--panel);border-radius:var(--r-lg);padding:12px;min-height:120px}
.kanban-col.over{outline:2px dashed var(--blue);outline-offset:-2px}
.kanban-col h4{margin:0 0 10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kanban-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--nm-soft)}
.kanban-card:active{cursor:grabbing}
.kanban-card.dragging{opacity:.35}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:min(290px,86vw);transform:translateX(-100%);transition:transform .22s;box-shadow:var(--nm-pop);padding-top:env(safe-area-inset-top,0px)}
  .side.on{transform:none}
  .ib.menu-btn{display:grid}
  .g3,.g2{grid-template-columns:1fr}
  .searchbtn{width:auto}.searchbtn span,.searchbtn kbd{display:none}
}
@media (max-width:540px){.g4{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}.form .two{grid-template-columns:1fr}.topbar .btn span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pcal-wrap{overflow-x:auto;margin-bottom:12px}
.pcal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px;min-width:700px}
.pcal-t{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
.pcal-sem{grid-column:1/-1;margin-top:6px}
.pcal-wk{border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);padding:2px 4px;cursor:pointer}
.pcal-wk:disabled{cursor:default;opacity:.5}.pcal-wk:not(:disabled):hover{color:var(--ink)}
.pcal-j{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);display:flex;flex-direction:column;min-height:96px;overflow:hidden}
.pcal-j.vide{background:var(--panel)}
.pcal-j.auj{border-color:var(--ink)}
.pcal-j.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:var(--green-bg)}
.pcal-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0}
.pcal-h .dot{margin-top:0}
.pcal-ck{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.pcal-ck input{width:15px;height:15px;margin:0;accent-color:var(--green)}
.pcal-b{flex:1;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:4px 8px 8px;display:flex;flex-direction:column;gap:2px;cursor:pointer;font-size:12.5px}
.pcal-b:hover{background:var(--card)}
.pcal-rx{font-size:11.5px;line-height:1.3;color:var(--muted)}
.pcal-plus{margin:auto;color:var(--muted);font-size:18px;opacity:0}
.pcal-b:hover .pcal-plus{opacity:1}
.pcal-bar{display:none}
.pcal-bar.on{display:flex;position:sticky;bottom:12px;z-index:5;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-md);background:var(--bg);box-shadow:var(--nm-pop);border:1px solid var(--line);margin-bottom:14px;font-size:13px}
.bon-l{display:grid;grid-template-columns:1fr 76px auto;gap:6px;align-items:center}
</style>

     module, jamais recopié) : le poids d'une pièce pour la liste de courses

   une page par activité (tâches de routine, tâches, sous-projets,
   drive, schéma de blocs éditable et reliable), et pour Logistique
   un aperçu des bons de commande réels.

   Même auth que admin.html : Supabase Auth + table `staff`
   (natty_staff.sql), même clé de session localStorage — se
   connecter une fois sur l'un ouvre l'autre sans redemander.

   `meal_photos` n'est pas pensé pour des livrables (PDF, tableurs) —
   fonctionne en pratique via `/auto/upload` (Cloudinary détecte le type),
   mais un preset dédié `crm_documents` serait plus propre : à créer dans
   Cloudinary → Settings → Upload → Add upload preset (Unsigned, Resource
   type: Auto) si celui-ci s'avère trop restrictif à l'usage. */
const CLOUDINARY_CLOUD='dujji1s6g';

const STAFF_SESSION_KEY='natty_staff_session';
let STAFF_SESSION=null,STAFF_ROLE=null,STAFF_NOM='',STAFF_DOMAINES=[];

function lireStaffSession(){try{const s=JSON.parse(localStorage.getItem(STAFF_SESSION_KEY)||'null');return(s&&s.access_token)?s:null}catch(e){return null}}
function ecrireStaffSession(s){STAFF_SESSION=s;try{s?localStorage.setItem(STAFF_SESSION_KEY,JSON.stringify(s)):localStorage.removeItem(STAFF_SESSION_KEY)}catch(e){}}
STAFF_SESSION=lireStaffSession();
function jetonStaff(){return(STAFF_SESSION&&STAFF_SESSION.access_token)||SB_KEY}

async function sb(path,options={}){
  const res=await fetch(SB_URL+'/rest/v1/'+path,{...options,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+jetonStaff(),'Content-Type':'application/json','Prefer':'return=representation',...(options.headers||{})}});
  const text=await res.text();
  if(!res.ok)throw new Error(text);
  return text?JSON.parse(text):[];
}
/* Une table qui n'existe pas encore (natty_crm.sql pas exécuté) ne doit
   jamais planter l'écran en silence — elle doit le DIRE (règle du dépôt). */
let SCHEMA_MANQUANT=false;
async function sbTry(path,options){
  try{return{ok:true,data:await sb(path,options)}}
  catch(e){const msg=(e&&e.message)||String(e);const manque=/PGRST205|42P01|does not exist|relation .* does not exist/i.test(msg);if(manque)SCHEMA_MANQUANT=true;return{ok:false,err:msg,manque}}
}

/* ============ OUTILS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const fd=d=>{if(!d)return'—';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})};
const own=o=>o?esc(o):'<span class="muted">À attribuer</span>';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300)}

const TODAY=new Date();TODAY.setHours(0,0,0,0);
function joursInfo(echeance){
  if(!echeance)return{j:null,label:'sans échéance',cls:''};
  const x=new Date(echeance+'T00:00:00');const j=Math.round((x-TODAY)/86400000);
  let label;if(j<0)label=Math.abs(j)+' j de retard';else if(j===0)label="aujourd'hui";else if(j===1)label='demain';else label='dans '+j+' j';
  const cls=j<0?'bad':j<=3?'warn':'';
  return{j,label,cls};
}

function can(cle){
 if(cle==='dash'||cle==='taches'||cle==='rh'||cle==='projets')return true;
 if(cle.startsWith('projet:')){const p=S.projets.find(x=>x.id===cle.slice(7));return p?can(p.activite):false}
 const r=ROLES[STAFF_ROLE];if(!r)return false;
 if(r.toutes)return true;
 if(r.acces&&r.acces.includes(cle))return true;
 // Un associé cumule un ou plusieurs domaines (spec §3.2) — son rôle seul
 // ('associe') ne donne accès à rien, c'est staff.domaines qui décide.
 return(STAFF_DOMAINES||[]).includes(cle);
}

let S={taches:[],projets:[],staff:[],sessions:[],profils:[],tarifs:[]};
let SCHEMA_CACHE={};   // {portee: {blocs:[...], liens:[...]}} — portee = activité ('commercial') ou 'projet:<id>'

async function chargerBase(){
 const [t,p,st,se,pf,ta]=await Promise.all([
  sbTry('crm_taches?select=*&order=echeance.asc.nullslast'),
  sbTry('crm_projets?select=*&order=echeance.asc.nullslast'),
  sbTry('staff?select=user_id,nom,role,statut&actif=eq.true'),
  sbTry('crm_sessions?select=id,bloc_id,type,statut_reservation'),
  sbTry('crm_profils_types?select=*&order=nom.asc'),
  sbTry('crm_tarifs?select=*')
 ]);
 S.taches=t.ok?t.data:[];
 S.projets=p.ok?p.data:[];
 S.staff=st.ok?st.data:[];
 S.sessions=se.ok?se.data:[];
 S.profils=pf.ok?pf.data:[];
 S.tarifs=ta.ok?ta.data:[];
}
/* Un tarif métier lu depuis crm_tarifs (§ Finance, 0016_finance_operationnel.sql)
   — jamais en dur, la spec l'exige (§3.3). `defaut` ne sert que si la table
   est vide ou la clé absente (avant exécution de la migration), pour ne pas
   planter un calcul qui tournait déjà. */
function tarif(cle,defaut){
 const t=S.tarifs.find(x=>x.cle===cle);
 return t?+t.valeur:defaut;
}
function profilDe(id){return S.profils.find(x=>x.id===id)}
async function chargerSchemaPortee(portee,filtreSQL){
 if(SCHEMA_CACHE[portee])return SCHEMA_CACHE[portee];
 const [b,l]=await Promise.all([sbTry('crm_schema_blocs?'+filtreSQL+'&select=*'),sbTry('crm_schema_liens?select=*')]);
 const blocs=b.ok?b.data:[];
 const ids=new Set(blocs.map(x=>x.id));
 const liens=l.ok?l.data.filter(x=>ids.has(x.bloc_source)&&ids.has(x.bloc_cible)):[];
 SCHEMA_CACHE[portee]={blocs,liens};
 return SCHEMA_CACHE[portee];
}
/* Le schéma d'une ACTIVITÉ ne montre que ce qui n'appartient à AUCUN
   projet précis (projet_id is null) — sinon un bloc de projet s'afficherait
   deux fois : ici, et sur la page de son projet. */
function chargerSchema(cle){return chargerSchemaPortee(cle,'activite=eq.'+cle+'&projet_id=is.null')}
function chargerSchemaProjet(id){return chargerSchemaPortee('projet:'+id,'projet_id=eq.'+id)}
async function chargerDocs(cle){
 if(DOCS_CACHE[cle])return DOCS_CACHE[cle];
 const r=await sbTry('crm_documents?activite=eq.'+cle+'&select=*&order=created_at.desc');
 DOCS_CACHE[cle]=r.ok?r.data:[];
 return DOCS_CACHE[cle];
}
/* Le Drive de l'activité « Documents » : TOUS les documents, quelle que
   soit l'activité où ils ont été ajoutés — une tâche, un projet ou une
   activité quelconque. Un document se range tout seul ici, sans geste de
   plus : il n'est jamais recopié, c'est la même ligne `crm_documents` lue
   sans le filtre `activite=eq.…`. */
let DOCS_TOUS_CACHE=null;
async function chargerTousDocuments(){
 if(DOCS_TOUS_CACHE)return DOCS_TOUS_CACHE;
 const r=await sbTry('crm_documents?select=*&order=created_at.desc&limit=500');
 DOCS_TOUS_CACHE=r.ok?r.data:[];
 return DOCS_TOUS_CACHE;
}
function peopleOptions(sel){

 return `<option value="">À attribuer</option>`+noms.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
}
/* RH a besoin du vrai user_id (destinataire des notifications, membre des
   tables RH) — `peopleOptions` ne donne qu'un nom d'affichage, suffisant
   pour `porteur` (un texte libre) mais pas pour retrouver un compte. */
function nomDe(userId){const s=S.staff.find(x=>x.user_id===userId);return s?s.nom:'—'}

/* ============ NAVIGATION ============
   La barre latérale est un accordéon : chaque section (Pilotage, puis une
   par activité) se déroule sur son chevron, et pour une activité, cliquer
   l'EN-TÊTE navigue aussi vers sa vue par défaut — dérouler et arriver sont
   le même geste, pas deux. Les enfants d'une section sont ses VUES
   (`vuesDe()`, définie plus bas avec vActivite) : pour Commercial et
   Production, ses vues propres ; pour les autres, les cinq génériques
   (Aperçu/Tâches/Sous-projets/Schéma/Drive). */
let NAV_EXPANDED={pilotage:true};
/* Un seul menu déroulant ouvert à la fois (demande de Pablo, 26/09) :
   ouvrir une section replie toutes les autres. Les pages de Pilotage
   (accueil, tâches, RH, projets, page d'un projet) appartiennent au
   groupe « pilotage ». */
function groupeDe(id){return ACT_BY_CLE[id]?id:'pilotage'}
function ouvrirSeulGroupe(cle){
 NAV_EXPANDED={pilotage:false};
 ACTIVITES.forEach(a=>NAV_EXPANDED[a.cle]=false);
 NAV_EXPANDED[cle]=true;
}
function badges(){
 const b={taches:S.taches.filter(t=>t.statut!=='fait').length};
 ACTIVITES.forEach(a=>{b[a.cle]=S.taches.filter(t=>t.activite===a.cle&&t.statut!=='fait').length});
 document.querySelectorAll('.nitem').forEach(n=>{
  const e=n.querySelector('.b');if(!e)return;
  const cle=n.dataset.m,vue=n.dataset.vue;
  const montre=!vue||vue===vueParDefaut(cle);
  const v=montre?b[cle]:0;
  e.textContent=v||'';e.classList.toggle('hide',!v);
 });
}
function renderNav(){
 const items=[['dash','Accueil','dash'],['taches','Toutes les tâches','taches'],['rh','RH','rh'],['projets','Projets','projet']].filter(([id])=>can(id));
 const acts=ACTIVITES.filter(a=>can(a.cle));
 $('#nav').innerHTML=
  groupeHtml('pilotage','Pilotage',items.map(([id,l,ic])=>navBtn(id,l,ic)).join('')) +
  acts.map(a=>groupeHtml(a.cle,a.nom,vuesDe(a.cle).map(([vid,l,ic])=>navBtn(a.cle,l,ic,vid)).join(''))).join('');
 badges();
}
function groupeHtml(cle,label,inner){
 const ouvert=NAV_EXPANDED[cle]!=null?NAV_EXPANDED[cle]:CUR===cle;
 return `<div class="ngroup ${ouvert?'':'closed'}"><div data-ghead="${cle}">${esc(label)}<svg viewBox="0 0 24 24">${ICON.chevron}</svg></div>${inner}</div>`;
}
function navBtn(id,label,icon,vue){
 const actif=vue?(CUR===id&&(SUB['vue-'+id]||vueParDefaut(id))===vue):(CUR===id);
 return `<button class="nitem" data-m="${id}" ${vue?`data-vue="${esc(vue)}"`:''} ${actif?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICON[icon]}</svg><span>${esc(label)}</span><em class="b hide"></em></button>`;
}
$('#nav')?.addEventListener('click',e=>{
 const gh=e.target.closest('[data-ghead]');
 if(gh){
  const cle=gh.dataset.ghead;
  if(cle==='pilotage'||cle===CUR){
   // Déjà sur cette page (ou Pilotage, jamais une page en soi) : une
   // simple bascule, pas une navigation — sinon go() reposerait aussitôt
   // NAV_EXPANDED à `true` et la section ne pourrait jamais se refermer.
   const ouvertAvant=NAV_EXPANDED[cle]!=null?NAV_EXPANDED[cle]:(cle==='pilotage');
   if(ouvertAvant)NAV_EXPANDED[cle]=false;else ouvrirSeulGroupe(cle);
   renderNav();
  }else{
   SUB['vue-'+cle]=vueParDefaut(cle);
   go(cle);   // go() déplie la section qu'on rejoint
  }
  return;
 }
 const n=e.target.closest('.nitem');
 if(n){
  if(n.dataset.vue)SUB['vue-'+n.dataset.m]=n.dataset.vue;
  if(n.dataset.m==='financement')FIN_DETAIL=null;   // revenir au tableau d'Opérationnel depuis une page de détail
  go(n.dataset.m);
  $('#side').classList.remove('on');
 }
});
function go(id){
 if(!can(id)){toast("Ce rôle n'a pas accès à cette activité");return}
 LINK_MODE=false;LINK_FROM=null;   // le mode « relier » ne doit pas survivre à un changement de page
 CUR=id;
 ouvrirSeulGroupe(groupeDe(id));   // la section qu'on rejoint se déplie, les autres se replient
 renderNav();
 render();
 window.scrollTo(0,0);
 try{localStorage.setItem('natty_crm_cur',id)}catch(e){}
}

async function vDash(){
 const urgentes=S.taches.filter(t=>can(t.activite)&&t.statut!=='fait'&&t.echeance).sort((a,b)=>a.echeance.localeCompare(b.echeance));
 const heros=urgentes.slice(0,10);

 let body='';
 if(tb.cur==='projets')body=vAccueilProjets();

 return ph(`Bonjour ${esc(STAFF_NOM||'')}`,`${TODAY.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · ${urgentes.length} échéance${urgentes.length>1?'s':''} en cours`,`<button class="btn primary" data-new="projet">+ Projet</button>`)+
 `<div id="notifsAccueil"></div>`+
 (heros.length?`<div class="hero-carousel">${heros.map(heroCard).join('')}</div>`:`<div class="empty">Aucune échéance en cours. Les tâches avec une date arrivent ici.</div>`)+

   branchés à rien : c'est ce chantier qui leur donne leur rendu. */
function vGrilleActivites(){

function activiteTile(a){

async function notifsNonLues(){

/* Le mapping général : TOUS les projets, toutes activités confondues, sur
   un seul canevas glissable — pour voir d'un coup d'œil où en est chaque
   initiative. Positionnable comme les blocs de schéma, mais sans liens :
   ici on situe, le détail des relations vit dans le schéma DE CHAQUE projet. */

function groupesTaches(list){
 const ordreP={haute:0,moyenne:1,basse:2};
 const todayStr=TODAY.toISOString().slice(0,10);
 const grp=[
  ['En retard',t=>t.statut!=='fait'&&t.echeance&&t.echeance<todayStr],
  ['Cette semaine',t=>t.statut!=='fait'&&t.echeance&&t.echeance>=todayStr&&(new Date(t.echeance)-TODAY)<7*864e5],
  ['Plus tard',t=>t.statut!=='fait'&&(!t.echeance||(new Date(t.echeance)-TODAY)>=7*864e5)],
  ['Terminées',t=>t.statut==='fait']
 ];
 return grp.map(([l,f])=>{
  const ts=list.filter(f).sort((a,b)=>(ordreP[a.priorite]??1)-(ordreP[b.priorite]??1)||(a.echeance||'9999').localeCompare(b.echeance||'9999'));
  return ts.length?`<div class="sect"><h2>${l}</h2><span>${ts.length}</span></div><div class="card lift"><div class="list">${ts.map(taskLi).join('')}</div></div>`:'';
 }).join('')||'<div class="empty">Aucune tâche</div>';
}
function taskLi(t){

/* ============ RH — disponibilités, réunions, manquements (§4.4 de la
   spec) ============
   Chargée à la demande (comme le schéma ou le drive d'une activité), pas
   dans chargerBase() : cinq tables de plus à chaque connexion pour un
   onglet qu'on ne visite pas forcément. */
let RH_CACHE=null;
async function chargerRH(force){
 if(RH_CACHE&&!force)return RH_CACHE;
 const [d,r,p,m,rg]=await Promise.all([
  sbTry('indisponibilites?select=*&order=created_at.desc'),
  sbTry('reunions?select=*&order=date_debut.desc'),
  sbTry('participations?select=*'),
  sbTry('manquements?select=*&order=constate_le.desc'),
  sbTry('regles_presence?select=*')
 ]);
 const regles={};(rg.ok?rg.data:[]).forEach(x=>regles[x.cle]=x.valeur);
 RH_CACHE={dispos:d.ok?d.data:[],reunions:r.ok?r.data:[],participations:p.ok?p.data:[],manquements:m.ok?m.data:[],regles};
 return RH_CACHE;
}
/* Rien n'est en dur (règle explicite de la spec, §9) : un délai, la liste
   des motifs ou le périmètre des rôles concernés se lisent TOUJOURS ici,
   jamais recopiés en constante. */
function regle(cle,def){const r=RH_CACHE&&RH_CACHE.regles;return(r&&cle in r)?r[cle]:def}

/* jour_semaine est 0=lundi..6=dimanche (ISO, voir 0003_rh.sql) — pas la
   convention JS (0=dimanche). La parité de semaine ISO est ce qui porte
   le rythme d'alternance (une semaine de cours, une en entreprise). */
function isoWeekNumber(d){
 const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
 const jour=(x.getUTCDay()+6)%7;
 x.setUTCDate(x.getUTCDate()-jour+3);
 const j1=new Date(Date.UTC(x.getUTCFullYear(),0,4));
 return 1+Math.round((x-j1)/(7*864e5));
}
function estIndisponible(membre,d){
 const jourISO=(d.getDay()+6)%7;
 const dStr=d.toISOString().slice(0,10);
 const parite=isoWeekNumber(d)%2===0?'paire':'impaire';
 return(RH_CACHE.dispos||[]).some(x=>{
  if(x.membre!==membre)return false;
  if(x.type==='ponctuelle')return dStr>=x.date_debut&&dStr<=(x.date_fin||x.date_debut);
  if(x.jour_semaine!=null&&x.jour_semaine!==jourISO)return false;
  if(x.parite_semaine&&x.parite_semaine!==parite)return false;
  return true;
 });
}
function lundiSemaine(offset){
 const d=new Date(TODAY);
 d.setDate(d.getDate()-(d.getDay()+6)%7+(offset||0)*7);
 return d;
}

/* Calendrier hebdomadaire : heures détaillées pour les réunions (elles ont
   un horaire réel), bande « toute la journée » pour les tâches (elles n'ont
   qu'une date — leur inventer une heure serait mentir). Semaine glissante,
   comme `vRHDispos()` juste en dessous, mais avec sa propre navigation. */
let RH_CAL_OFFSET=0;
const RHCAL_H0=7,RHCAL_H1=20,RHCAL_ROWH=44;
function vRHCalendrier(){
 const lundi=lundiSemaine(RH_CAL_OFFSET);
 const jours=[...Array(7)].map((_,i)=>{const d=new Date(lundi);d.setDate(d.getDate()+i);return d});
 const noms=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
 const heures=[...Array(RHCAL_H1-RHCAL_H0)].map((_,i)=>RHCAL_H0+i);
 return `<div class="rhcal-nav"><button class="btn sm ghost" id="rhcalPrev">← Semaine précédente</button><b>${fd(jours[0].toISOString().slice(0,10))} → ${fd(jours[6].toISOString().slice(0,10))}</b><button class="btn sm ghost" id="rhcalNext">Semaine suivante →</button>${RH_CAL_OFFSET!==0?`<button class="btn sm" id="rhcalToday">Aujourd’hui</button>`:''}</div>
 <div class="rhcal">
  <div class="rhcal-hcol">${heures.map(h=>`<div class="rhcal-hourrow">${h}h</div>`).join('')}</div>
  <div class="rhcal-days">${jours.map(d=>rhcalDayCol(d,noms)).join('')}</div>
 </div>
 <p class="muted" style="font-size:12px;margin-top:10px">Les blocs colorés sont les réunions, à leur horaire réel. Les puces en haut de chaque jour sont les tâches à échéance ce jour-là — elles n'ont pas d'heure précise.</p>`;
}
function rhcalDayCol(d,noms){
 const dStr=d.toISOString().slice(0,10);
 const estAujourdhui=dStr===TODAY.toISOString().slice(0,10);
 const reunions=RH_CACHE.reunions.filter(r=>r.statut!=='annulee'&&r.date_debut.slice(0,10)===dStr);
 const taches=S.taches.filter(t=>can(t.activite)&&t.statut!=='fait'&&t.echeance===dStr);
 const colH=(RHCAL_H1-RHCAL_H0)*RHCAL_ROWH;
 return `<div class="rhcal-day">
  <div class="rhcal-daylabel ${estAujourdhui?'today':''}">${noms[(d.getDay()+6)%7]} <span>${d.getDate()}</span></div>
  <div class="rhcal-allday">${taches.map(t=>`<span class="rhcal-chip" data-open-tache="${t.id}" title="${esc(t.titre)}">${esc(t.titre)}</span>`).join('')}</div>
  <div class="rhcal-track" style="height:${colH}px">${empilerCreneaux(reunions).map(([r,lane,n])=>rhcalEvt(r,lane,n)).join('')}</div>
 </div>`;
}
/* Range en « lanes » les réunions qui se chevauchent (algo glouton par
   intervalles), pour que deux réunions à la même heure ne se recouvrent
   pas à l'écran au lieu de se partager la largeur de la colonne. */
function empilerCreneaux(list){
 const items=list.map(r=>({r,s:new Date(r.date_debut),e:new Date(r.date_fin||(new Date(r.date_debut).getTime()+30*60000))})).sort((a,b)=>a.s-b.s);
 const finLane=[];
 items.forEach(it=>{
  let lane=finLane.findIndex(fin=>fin<=it.s);
  if(lane===-1){lane=finLane.length;finLane.push(it.e)}else finLane[lane]=it.e;
  it.lane=lane;
 });
 const total=Math.max(1,finLane.length);
 return items.map(it=>[it.r,it.lane,total]);
}
function rhcalEvt(r,lane,nLanes){
 const s=new Date(r.date_debut),e=new Date(r.date_fin||(s.getTime()+30*60000));
 const startMin=Math.max(0,(s.getHours()-RHCAL_H0)*60+s.getMinutes());
 const endMin=Math.min((RHCAL_H1-RHCAL_H0)*60,(e.getHours()-RHCAL_H0)*60+e.getMinutes());
 const top=startMin/60*RHCAL_ROWH;
 const height=Math.max(20,(endMin-startMin)/60*RHCAL_ROWH);
 const w=100/nLanes,left=lane*w;
 return `<div class="rhcal-evt" data-open-reunion="${r.id}" style="top:${top}px;height:${height}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px);background:${r.organisateur===STAFF_SESSION.user_id?'var(--blue)':'var(--violet)'}"><b>${esc(r.titre)}</b><small>${s.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div>`;
}

 const or=e.target.closest('[data-open-reunion]');
 if(or){SUB.rh='reunions';render();}
});

function participantsDe(reunionId){return RH_CACHE.participations.filter(p=>p.evenement_type==='reunion'&&p.evenement_id===reunionId)}
function vRHReunions(){
 const moi=STAFF_SESSION.user_id;
 const list=[...RH_CACHE.reunions].sort((a,b)=>b.date_debut.localeCompare(a.date_debut));
 const avenir=list.filter(r=>r.statut!=='annulee'&&new Date(r.date_debut)>=TODAY);
 const passees=list.filter(r=>r.statut==='annulee'||new Date(r.date_debut)<TODAY);

 ${passees.slice(0,15).map(r=>reunionCard(r,moi)).join('')||'<div class="empty">Aucune réunion passée.</div>'}`;

function reunionCard(r,moi){
 const parts=participantsDe(r.id);
 const mine=parts.find(p=>p.membre===moi);
 const passee=new Date(r.date_debut)<new Date();
 const lab={invite:['','En attente'],confirme:['ok','Confirmé'],decline:['bad','Décliné'],tentative:['warn','Peut-être']};
 return `<div class="card lift" style="margin-bottom:12px">
  <h3>${esc(r.titre)} ${r.statut==='annulee'?'<span class="chip bad">Annulée</span>':''}</h3>
  <p class="sub">${fd(r.date_debut.slice(0,10))} · ${new Date(r.date_debut).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}${r.lieu?' · '+esc(r.lieu):''} · organisée par ${esc(nomDe(r.organisateur))}</p>
  ${r.description?`<p style="margin:0 0 10px">${esc(r.description)}</p>`:''}
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${parts.map(p=>`<span class="chip ${(lab[p.statut]||['',''])[0]}">${esc(nomDe(p.membre))} · ${(lab[p.statut]||['',p.statut])[1]}</span>`).join('')}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   ${r.statut!=='annulee'&&mine&&mine.statut!=='decline'&&mine.statut!=='confirme'&&!passee?`<button class="btn sm" data-repondre="${mine.id}:confirme">Confirmer ma présence</button><button class="btn sm ghost" data-repondre="${mine.id}:decline">Décliner</button>`:''}
   ${r.statut!=='annulee'&&r.organisateur===moi&&passee?`<button class="btn sm ghost" data-constater="${r.id}">Constater les présences</button>`:''}
   ${r.statut!=='annulee'&&r.organisateur===moi&&!passee?`<button class="btn sm ghost" data-annuler-reunion="${r.id}">Annuler</button>`:''}
  </div>
 </div>`;
}

  <label>Participants<div class="grid g2" style="gap:6px">${S.staff.filter(s=>s.user_id!==STAFF_SESSION.user_id).map(s=>`<label style="flex-direction:row;align-items:center;gap:8px;font-weight:400"><input type="checkbox" class="rfpart" value="${s.user_id}" style="width:auto"> ${esc(s.nom)}</label>`).join('')||'<span class="muted">Personne d’autre dans l’équipe</span>'}</div></label>

 $('#reunionForm').onsubmit=async e=>{e.preventDefault();closeAll();await creerReunion()};

/* La notification envoyée à chaque invité porte un `uid` STABLE (dérivé de
   la réunion + du destinataire, pas de la notification elle-même) : c'est
   ce qui permet à `annulerReunion()` de réutiliser le même `uid` avec une
   `sequence` supérieure et de mettre à jour l'événement déjà accepté,
   plutôt que d'en créer un second dans le calendrier de la personne. */
async function appelNotification(body){
 try{
  const res=await fetch('/api/notifications',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+jetonStaff()},body:JSON.stringify(body)});
  return await res.json();
 }catch(e){return null}
}
async function creerReunion(){
 const titre=$('#rf1').value,description=$('#rf2').value||null;
 const dateStr=$('#rf3').value,heureStr=$('#rf4').value,duree=+$('#rf5').value||30;
 const lieu=$('#rf6').value||null;
 const membres=[...document.querySelectorAll('.rfpart:checked')].map(c=>c.value);
 const dateDebut=new Date(dateStr+'T'+heureStr+':00');
 const dateFin=new Date(dateDebut.getTime()+duree*60000);
 const r=await sb('reunions',{method:'POST',body:JSON.stringify({titre,description,organisateur:STAFF_SESSION.user_id,date_debut:dateDebut.toISOString(),date_fin:dateFin.toISOString(),lieu,statut:'confirmee'})});
 const reunion=r[0];RH_CACHE.reunions.unshift(reunion);
 const moiPart=await sb('participations',{method:'POST',body:JSON.stringify({evenement_type:'reunion',evenement_id:reunion.id,membre:reunion.organisateur,statut:'confirme',confirme_le:new Date().toISOString()})});
 RH_CACHE.participations.push(moiPart[0]);
 for(const membre of membres){
  const part=await sb('participations',{method:'POST',body:JSON.stringify({evenement_type:'reunion',evenement_id:reunion.id,membre,statut:'invite'})});

  if(r2&&r2.notification)await sb('participations?id=eq.'+part[0].id,{method:'PATCH',body:JSON.stringify({notification_id:r2.notification.id})});
 }
 toast(membres.length?'Réunion créée, invitations envoyées':'Réunion créée');render();
}
/* Décliner À TEMPS n'est pas un manquement ; décliner sous le délai en est
   un — la personne s'était engagée puis prévient trop tard (§4.4). */
async function repondreParticipation(id,statut){
 const p=RH_CACHE.participations.find(x=>x.id===id);if(!p)return;
 const reunion=RH_CACHE.reunions.find(r=>r.id===p.evenement_id);
 const patch={statut,confirme_le:new Date().toISOString()};
 if(statut==='decline')patch.heure_prevenance=new Date().toISOString();
 await sb('participations?id=eq.'+id,{method:'PATCH',body:JSON.stringify(patch)});
 Object.assign(p,patch);
 if(statut==='decline'&&reunion){
  const delaiH=regle('delai_prevenance_heures',24);
  const heuresRestantes=(new Date(reunion.date_debut)-new Date())/36e5;
  if(heuresRestantes<delaiH)await creerManquementSiEligible(p);
 }
 toast(statut==='confirme'?'Présence confirmée':'Réunion déclinée');render();
}
async function annulerReunion(id){
 if(!confirm('Annuler cette réunion ? Une annulation sera envoyée aux participants.'))return;
 const r=RH_CACHE.reunions.find(x=>x.id===id);if(!r)return;
 const seq=r.ics_sequence+1;
 await sb('reunions?id=eq.'+id,{method:'PATCH',body:JSON.stringify({statut:'annulee',ics_sequence:seq})});
 r.statut='annulee';r.ics_sequence=seq;
 for(const p of participantsDe(id).filter(x=>x.membre!==r.organisateur)){
  await appelNotification({destinataire:p.membre,objet_type:'reunion',objet_id:id,titre:'Annulée : '+r.titre,canal:'popup+email',date_debut:r.date_debut,date_fin:r.date_fin,uid:'reunion-'+id+'-'+p.membre+'@natty-nutrition.com',sequence:seq,annule:true});
 }
 toast('Réunion annulée');render();
}

async function marquerPresence(id,valeur){
 const p=RH_CACHE.participations.find(x=>x.id===id);if(!p)return;
 if(valeur==='present'){
  await sb('participations?id=eq.'+id,{method:'PATCH',body:JSON.stringify({heure_arrivee:new Date().toISOString()})});
  p.heure_arrivee=new Date().toISOString();
  toast('Marqué présent');
 }else{
  // Manquement seulement si la personne AVAIT CONFIRMÉ (§4.4) : une
  // invitation jamais répondue n'engageait à rien.
  if(p.statut==='confirme')await creerManquementSiEligible(p);
  toast(p.statut==='confirme'?'Absence notée — manquement créé si éligible':'Absence notée');
 }
 ouvrirConstat(p.evenement_id);
}
/* Le périmètre (quels statuts de `staff` sont soumis au suivi des
   manquements) est un point ouvert de la spec §9, rendu paramétrable
   plutôt que tranché ici — voir `regles_presence.perimetre_manquements`. */
async function creerManquementSiEligible(p){
 const membre=S.staff.find(s=>s.user_id===p.membre);
 const perimetre=regle('perimetre_manquements',['associe']);
 if(!membre||!membre.statut||!perimetre.includes(membre.statut))return;
 const m=await sb('manquements',{method:'POST',body:JSON.stringify({participation_id:p.id,statut:'a_justifier'})});
 RH_CACHE.manquements.unshift(m[0]);
}

/* ---- Manquements : justifier, décider, contester ---- */
function manquementsAMoi(){
 const moi=STAFF_SESSION.user_id;
 return(RH_CACHE.manquements||[]).filter(m=>{
  const p=RH_CACHE.participations.find(x=>x.id===m.participation_id);
  return p&&p.membre===moi&&m.statut==='a_justifier'&&!m.motif;
 });
}
function manquementsADecider(){
 const moi=STAFF_SESSION.user_id;
 return(RH_CACHE.manquements||[]).filter(m=>{
  if(m.statut!=='a_justifier'||!m.motif||m.decideur)return false;
  const p=RH_CACHE.participations.find(x=>x.id===m.participation_id);
  if(!p||p.membre===moi)return false;
  const r=RH_CACHE.reunions.find(x=>x.id===p.evenement_id);
  return !r||r.organisateur!==moi;   // jamais l'organisateur de l'événement
 });
}
function mesManquementsDecides(){
 const moi=STAFF_SESSION.user_id;
 return(RH_CACHE.manquements||[]).filter(m=>{
  const p=RH_CACHE.participations.find(x=>x.id===m.participation_id);
  return p&&p.membre===moi&&['justifie','non_justifie','conteste'].includes(m.statut);
 });
}
function contexteManquement(m){
 const p=RH_CACHE.participations.find(x=>x.id===m.participation_id);
 const r=p&&RH_CACHE.reunions.find(x=>x.id===p.evenement_id);
 return{p,r,titre:r?r.titre:'Événement',date:r?fd(r.date_debut.slice(0,10)):'—'};
}

/* ============ MOTEUR MISSIONS / BLOCS / RÈGLES (§3.3, §5, §6) ============
   Un bloc AD HOC reste 1 bloc = 1 tâche (crm_schema_blocs.tache_id, déjà
   là). Un bloc INSTANCIÉ DEPUIS UN MODÈLE est le nouveau cas : 1 bloc,
   N tâches (crm_taches.bloc_id), générées à des dates = date de référence
   + décalage du modèle, avec de vraies dépendances. */
let MODELES_CACHE=null;
async function chargerModeles(){
 if(MODELES_CACHE)return MODELES_CACHE;
 const [m,t]=await Promise.all([sbTry('crm_modeles_blocs?select=*'),sbTry('crm_modeles_bloc_taches?select=*&order=ordre.asc')]);
 const modeles=m.ok?m.data:[];const taches=t.ok?t.data:[];
 MODELES_CACHE=modeles.map(md=>({...md,taches:taches.filter(x=>x.modele_id===md.id)}));
 return MODELES_CACHE;
}
function lundiDe(dateStr){
 const d=new Date(dateStr+'T00:00:00');
 d.setDate(d.getDate()-(d.getDay()+6)%7);
 /* Date locale : toISOString() rendait le DIMANCHE à Paris (minuit local = 22 h UTC la veille). */
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Best-effort : une seule personne porte ce rôle ou ce domaine → on la
   propose ; sinon (personne, ou plusieurs) « à attribuer » — l'aperçu
   laisse corriger avant de confirmer (règle 1, §3.3). Deviner entre deux
   porteurs possibles serait pire qu'un champ vide. */
function resoudrePorteur(role){
 if(!role)return null;
 const m=S.staff.filter(s=>s.role===role||(s.domaines||[]).includes(role));
 return m.length===1?m[0].nom:null;
}
function calculerApercu(modele,dateReference,parametres){
 const base=new Date(dateReference+'T00:00:00');
 return modele.taches.map(mt=>{
  const d=new Date(base);d.setDate(d.getDate()+mt.decalage_jours);
  return{cle:mt.cle,titre:mt.titre,activite:mt.activite,echeance:d.toISOString().slice(0,10),role:mt.role,porteur:resoudrePorteur(mt.role),depend_de_cle:mt.depend_de_cle||[],action_cle:mt.action_cle};
 });
}
/* Règle 2, §3.3 : plafond de production (350 plats/semaine), disponibilité
   RH (réutilise assets déjà posés par le module RH). Trésorerie et
   créneau cuisine ne sont pas vérifiables ICI — annoncé, pas simulé
   (§7 : « ne pas inventer »). Le créneau se calcule à la réservation
   (voir actionReserverCuisine), une fois le menu choisi. */
async function controlerCapacite(parametres,apercu){
 const alertes=[];
 const nbPlats=Math.round((+parametres.nb_beneficiaires||0)*(+parametres.plats_par_personne||1));
 const derniere=apercu[apercu.length-1];
 if(nbPlats&&derniere){
  const lundiSem=lundiDe(derniere.echeance);
  const r=await sbTry('bons_commande?semaine=eq.'+lundiSem+'&statut=neq.annule&select=nb_repas');
  const dejaPrevus=(r.ok?r.data:[]).reduce((s,b)=>s+(b.nb_repas||0),0);
  if(dejaPrevus+nbPlats>350)alertes.push({type:'bad',texte:`Plafond de production : ${dejaPrevus} plat(s) déjà prévu(s) la semaine du ${fd(lundiSem)} + ${nbPlats} de ce bloc = ${dejaPrevus+nbPlats}, au-dessus de 350.`});
 }
 await chargerRH();
 apercu.forEach(m=>{
  if(!m.porteur)return;
  const row=S.staff.find(s=>s.nom===m.porteur);
  if(row&&estIndisponible(row.user_id,new Date(m.echeance+'T00:00:00')))
   alertes.push({type:'warn',texte:`${m.porteur} est déclaré·e indisponible le ${fd(m.echeance)} (${m.titre}).`});
 });
 alertes.push({type:'info',texte:"Trésorerie et créneau cuisine : pas encore vérifiés automatiquement ici — le créneau se calcule à la réservation une fois le menu choisi, la trésorerie dépend du chantier Finances (hors périmètre aujourd'hui)."});
 return alertes;
}

function ouvrirNouveauBloc(ctx){
 chargerModeles().then(modeles=>{
  if(!modeles.length){toast('Aucun modèle de bloc en base');return}
  modal(`<h2>Nouveau bloc depuis un modèle</h2><form class="form" id="blocModeleForm">
   <label>Modèle<select id="bm1">${modeles.map(m=>`<option value="${m.id}">${esc(m.nom)}</option>`).join('')}</select></label>
   <p class="muted" id="bmDesc" style="font-size:12.5px;margin:-4px 0 0"></p>
   <div id="bmParams"></div>
   <label>Date de référence (le « J » du modèle — la date de livraison pour Test produit)<input class="inp" id="bmDateRef" type="date" required></label>
   <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary" type="submit">Voir l'aperçu →</button></div>
  </form>`);
  // §4.3 feature 7 : « propose le bloc Test produit pré-rempli avec les
  // données de la fiche » — ctx.prefill (posé par le pipeline Commercial
  // au passage à l'étape « Test ») écrase la valeur par défaut du
  // paramètre quand les deux portent la même clé (lieu, nb_beneficiaires
  // — celles que le modèle « Test produit » attend, 0004_modele_test_
  // produit.sql). Sans effet sur un bloc ouvert autrement (ctx.prefill
  // absent, le comportement d'avant reste identique).
  const rendre=()=>{
   const m=modeles.find(x=>x.id===$('#bm1').value);
   $('#bmDesc').textContent=m.description||'';
   const prefill=(ctx&&ctx.prefill)||{};
   $('#bmParams').innerHTML=(m.parametres||[]).map(p=>{
    const val=(p.cle in prefill&&prefill[p.cle]!=null&&prefill[p.cle]!=='')?prefill[p.cle]:p.defaut;
    if(p.type==='choix')return `<label>${esc(p.label)}<select id="bp_${p.cle}">${p.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
    return `<label>${esc(p.label)}<input class="inp" id="bp_${p.cle}" type="${p.type==='nombre'?'number':'text'}" value="${val??''}" ${p.requis?'required':''}></label>`;
   }).join('');
  };
  $('#bm1').onchange=rendre;rendre();
  $('#blocModeleForm').onsubmit=async e=>{
   e.preventDefault();
   const m=modeles.find(x=>x.id===$('#bm1').value);
   const parametres={};
   for(const p of(m.parametres||[])){
    const el=$('#bp_'+p.cle);
    if(p.requis&&!el.value){toast(p.label+' est requis');return}
    parametres[p.cle]=p.type==='nombre'?+el.value:el.value;
   }
   const dateRef=$('#bmDateRef').value;
   if(!dateRef){toast('La date de référence est requise');return}
   closeAll();
   await ouvrirApercuBloc(m,dateRef,parametres,ctx);
  };
 });
}
async function ouvrirApercuBloc(modele,dateRef,parametres,ctx){
 let apercu=calculerApercu(modele,dateRef,parametres);
 const alertes=await controlerCapacite(parametres,apercu);
 const couleur=t=>t==='bad'?['var(--red)','var(--red-bg)']:t==='warn'?['var(--amber)','var(--amber-bg)']:['var(--blue)','var(--blue-bg)'];
 const rendre=()=>{
  modal(`<h2>Aperçu — ${esc(modele.nom)}</h2>
   <p class="muted" style="font-size:13px;margin:0 0 10px">${apercu.length} tâche${apercu.length>1?'s':''} seront créées, datées et — quand un seul membre porte ce rôle — attribuées. Retirez une ligne avant de confirmer si besoin.</p>
   ${alertes.map(a=>{const[c,bg]=couleur(a.type);return `<div class="exbar" style="border-color:${c};color:${c};background:${bg}">${esc(a.texte)}</div>`}).join('')}
   <div class="list">${apercu.map((m,i)=>`<div class="li"><div class="grow"><b style="font-weight:500">${esc(m.titre)}</b><div class="meta">${fd(m.echeance)} · ${esc((ACT_BY_CLE[m.activite]||{}).nom||m.activite)} · ${own(m.porteur)}</div></div><button class="btn sm ghost" type="button" data-retirer-apercu="${i}">Retirer</button></div>`).join('')||'<div class="empty">Plus aucune tâche à créer.</div>'}</div>
   <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary" id="btnConfirmerBloc" type="button" ${apercu.length?'':'disabled'}>Créer le bloc et ${apercu.length} tâche${apercu.length>1?'s':''}</button></div>`);
 };
 rendre();
 $('#modal').onclick=e=>{
  const r=e.target.closest('[data-retirer-apercu]');
  if(r){apercu.splice(+r.dataset.retirerApercu,1);rendre();return}
  const c=e.target.closest('#btnConfirmerBloc');
  if(c){closeAll();instancierBloc(modele,dateRef,parametres,apercu,ctx)}
 };
}
async function instancierBloc(modele,dateRef,parametres,apercu,ctx){
 const rBloc=await sb('crm_schema_blocs',{method:'POST',body:JSON.stringify({
  activite:modele.activite_defaut,projet_id:ctx.projet||null,titre:modele.nom+' — '+fd(dateRef),
  categorie:'jalon',echeance:dateRef,statut:'a_venir',modele_id:modele.id,parametres,date_reference:dateRef,
  cout_previsionnel:{matiere:null,cuisine:null,livraison:null,total:null},
  x:10+Math.random()*60,y:10+Math.random()*55
 })});
 const bloc=rBloc[0];
 const idParCle={};
 for(const m of apercu){
  const r=await sb('crm_taches',{method:'POST',body:JSON.stringify({
   activite:m.activite,projet_id:ctx.projet||null,titre:m.titre,porteur:m.porteur||null,
   echeance:m.echeance,priorite:'moyenne',bloc_id:bloc.id,action_cle:m.action_cle||null
  })});
  idParCle[m.cle]=r[0].id;S.taches.push(r[0]);
 }
 for(const m of apercu){
  for(const dep of m.depend_de_cle){
   if(!idParCle[dep])continue;   // dépendance retirée de l'aperçu : pas recréée
   await sb('crm_taches_dependances',{method:'POST',headers:{Prefer:'return=minimal,resolution=ignore-duplicates'},body:JSON.stringify({tache_id:idParCle[m.cle],depend_de_id:idParCle[dep]})});

/* Annulation d'un bloc instancié : supprime ses tâches (et leurs
   dépendances, en cascade côté base) et le bloc lui-même — ce qui
   supprime aussi en cascade ses sessions et son menu. Les bons de
   commande, eux, ne sont pas en cascade (`on delete set null`) : on les
   retire explicitement, ce sont des bons synthétiques créés pour CE
   bloc, pas des commandes réelles d'un client. */
async function annulerBlocModele(blocId){
 const b=trouverBloc(blocId);if(!b)return;
 if(!confirm('Annuler « '+b.titre+' » ? Ses tâches, sessions, menu et bons de commande seront supprimés.'))return;
 const ts=tachesDuBloc(blocId);
 for(const t of ts)await sb('crm_taches?id=eq.'+t.id,{method:'DELETE'});
 await sb('bons_commande?bloc_id=eq.'+blocId,{method:'DELETE'});
 await sb('crm_schema_blocs?id=eq.'+blocId,{method:'DELETE'});
 S.taches=S.taches.filter(t=>t.bloc_id!==blocId);
 const portee=Object.keys(SCHEMA_CACHE).find(c=>(SCHEMA_CACHE[c].blocs||[]).some(x=>x.id===blocId));
 if(portee)delete SCHEMA_CACHE[portee];
 toast('Bloc annulé');closeAll();badges();render();
}
function tacheBlocLi(t,depsList,ts){
 const mesDeps=depsList.filter(d=>d.tache_id===t.id).map(d=>ts.find(x=>x.id===d.depend_de_id)).filter(Boolean);
 const enAttenteDe=mesDeps.filter(d=>d.statut!=='fait');
 // §4.2 : « tant que la cuisine n'est pas confirmée, les missions
 // dépendantes s'affichent en alerte » — distinct de enAttenteDe : la
 // demande peut être envoyée (dépendance cochée « fait ») sans que la
 // cuisine ait pour autant répondu oui, et l'alerte doit tenir jusque-là.
 const cuisineDep=mesDeps.find(d=>d.action_cle==='reserver_cuisine'&&d.objet_type==='session');
 const cuisineNonConfirmee=cuisineDep&&(S.sessions.find(x=>x.id===cuisineDep.objet_id)||{}).statut_reservation!=='confirmee';
 return `<div class="li ${t.statut==='fait'?'done':''}"><button class="check" role="checkbox" aria-checked="${t.statut==='fait'}" data-tdone="${t.id}" aria-label="Terminer"></button>
 <div class="grow"><b style="font-weight:500">${esc(t.titre)}</b><div class="meta">${fd(t.echeance)} · ${own(t.porteur)}${enAttenteDe.length?' · <span style="color:var(--amber)">en attente : '+enAttenteDe.map(d=>esc(d.titre)).join(', ')+'</span>':''}${cuisineNonConfirmee?' · <span style="color:var(--amber)">cuisine pas encore confirmée</span>':''}${t.necessite_revision?' · <span style="color:var(--red)">à revoir</span>':''}</div></div>
 ${t.action_cle&&ACTIONS_MISSION[t.action_cle]?`<button class="btn sm ${t.action_faite?'ghost':''}" data-action-mission="${t.id}:${t.action_cle}">${ACTIONS_MISSION[t.action_cle].label}</button>`:''}
 </div>`;
}
/* Règle 3, §3.3 : décaler un bloc recale TOUTES ses tâches (et ses
   sessions) du même delta — les décalages du modèle sont relatifs à la
   date de référence, pas les uns aux autres, donc un simple delta global
   suffit à tout recaler d'un coup. Une tâche dont l'action a déjà été
   exécutée passe en « à revoir » plutôt que d'être silencieusement
   redatée comme si de rien n'était. */
async function decalerBloc(blocId,nouvelleDate){
 const b=trouverBloc(blocId);if(!b||!nouvelleDate||!b.date_reference)return;
 if(b.date_reference===nouvelleDate){toast('Même date — rien à recalculer');return}
 const deltaJours=Math.round((new Date(nouvelleDate)-new Date(b.date_reference))/864e5);
 const ts=tachesDuBloc(blocId);
 for(const t of ts){
  if(!t.echeance)continue;
  const d=new Date(t.echeance+'T00:00:00');d.setDate(d.getDate()+deltaJours);
  const patch={echeance:d.toISOString().slice(0,10)};
  if(t.action_faite)patch.necessite_revision=true;
  await sb('crm_taches?id=eq.'+t.id,{method:'PATCH',body:JSON.stringify(patch)});
  Object.assign(t,patch);
 }
 await sb('crm_schema_blocs?id=eq.'+blocId,{method:'PATCH',body:JSON.stringify({date_reference:nouvelleDate,echeance:nouvelleDate})});
 b.date_reference=nouvelleDate;b.echeance=nouvelleDate;
 const sess=await sbTry('crm_sessions?bloc_id=eq.'+blocId+'&select=*');
 for(const s of(sess.ok?sess.data:[])){
  const d=new Date(s.jour+'T00:00:00');d.setDate(d.getDate()+deltaJours);
  await sb('crm_sessions?id=eq.'+s.id,{method:'PATCH',body:JSON.stringify({jour:d.toISOString().slice(0,10)})});
 }
 toast('Bloc décalé de '+(deltaJours>0?'+':'')+deltaJours+' jour(s) — toutes les tâches recalculées');
 closeAll();badges();render();
}

/* ---- Actions en un clic (§3.3 : « éventuellement une action en un

const ACTIONS_MISSION={
 reserver_cuisine:{label:'Réserver la cuisine',run:id=>actionReserverCuisine(id)},
 envoyer_kit_com:{label:'Composer le message',run:id=>actionMessageSimple(id)},

/* Le créneau se calcule EN PRIORITÉ depuis le mapping minuté réel de la
   session (session 06, `crm_session_etapes` — le max par poste, voir
   dureeMappingSession) : c'est la vraie durée de travail, poste par
   poste, pas une simple somme des temps de fiche. Si le mapping n'a pas
   encore été généré, repli sur l'ancien calcul (somme prep+cuisson du
   menu) — la fiche technique EST le temps de la session en mode
   traiteur (production « en masse par recette », pas à la portion) : on
   ne multiplie donc PAS par le nombre de plats, ce serait inventer un
   facteur d'échelle que rien ne documente. §4.1 : durée + marge de
   sécurité, arrondie à l'heure pleine. */
async function actionReserverCuisine(tacheId){
 const t=S.taches.find(x=>x.id===tacheId);if(!t)return;
 const sessions=await sbTry('crm_sessions?bloc_id=eq.'+t.bloc_id+'&type=eq.production&select=*');
 const session=(sessions.ok?sessions.data:[])[0];
 if(!session){toast('Aucune session de production liée à ce bloc');return}
 const dureeMapping=await dureeMappingSession(session.id);
 let minutes,manqueMenu=false,source;
 if(dureeMapping!=null){minutes=dureeMapping;source='mapping'}
 else{
  const menusR=await sbTry('crm_menus?bloc_id=eq.'+t.bloc_id+'&select=*');
  const menu=(menusR.ok?menusR.data:[])[0];
  minutes=90;manqueMenu=true;
  if(menu){
   const mr=await sbTry('crm_menu_recettes?menu_id=eq.'+menu.id+'&select=recette_id');
   const ids=(mr.ok?mr.data:[]).map(x=>x.recette_id);
   if(ids.length){
    const rec=await sbTry('recettes?id=in.('+ids.join(',')+')&select=temps_prep_min,temps_cuisson_min');
    if(rec.ok&&rec.data.length){minutes=rec.data.reduce((s,r)=>s+(r.temps_prep_min||0)+(r.temps_cuisson_min||0),0);manqueMenu=false}
   }
  }
  source='menu';
 }
 const heures=heuresDepuisMinutes(minutes);
 const heureFin=String(9+heures).padStart(2,'0')+':00';
 const explication=source==='mapping'
  ?`Estimé depuis le mapping minuté de la session (le poste le plus chargé) + ${MARGE_CUISINE_MIN} min de marge, arrondi à l'heure pleine. Génère/régénère le mapping si les volumes ont changé.`
  :manqueMenu?"Le menu n'est pas encore composé — créneau par défaut, à ajuster."
  :`Estimé depuis ${minutes} min de préparation/cuisson du menu + ${MARGE_CUISINE_MIN} min de marge (mapping pas encore généré, calcul moins précis).`;
 // §9 session « bloc Test produit » feature 3 : conflit de créneau
 // cuisine avec une AUTRE session déjà réservée (envoyée ou confirmée)
 // le même jour. Vérifié sur le créneau PROPOSÉ par défaut — si la
 // personne change les heures dans le formulaire, elle ajuge elle-même
 // (§7 : « ne pas inventer » — on annonce un conflit connu, on ne le
 // recalcule pas en direct à chaque frappe pour un module aussi simple).
 const autres=await sbTry('crm_sessions?jour=eq.'+session.jour+'&id=neq.'+session.id+'&statut_reservation=in.(envoyee,confirmee)&select=id,type,creneau_debut,creneau_fin');
 const conflit=(autres.ok?autres.data:[]).find(s=>s.creneau_debut&&s.creneau_fin&&s.creneau_debut<heureFin&&'09:00'<s.creneau_fin);
 const alerteConflit=conflit?`<div class="exbar" style="margin:-4px 0 10px"><span class="chip bad">Conflit</span><span>Une autre session (${conflit.type==='mise_en_place'?'mise en place':'production'}) est déjà réservée ce jour-là, ${conflit.creneau_debut.slice(0,5)}–${conflit.creneau_fin.slice(0,5)} — la cuisine ne peut recevoir deux sessions en même temps.</span></div>`:'';
 modal(`<h2>Réserver la cuisine</h2>
  ${alerteConflit}
  <p class="muted" style="font-size:13px">${explication}</p>
  <form class="form" id="cuisineForm">
   <div class="two"><label>Date<input class="inp" id="cf1" type="date" value="${session.jour}" required></label><label>Nombre de personnes<input class="inp" id="cf2" type="number" value="4" required></label></div>
   <div class="two"><label>Arrivée<input class="inp" id="cf3" type="time" value="09:00" required></label><label>Fin<input class="inp" id="cf4" type="time" value="${heureFin}" required></label></div>
   <label>Note (optionnel)<textarea class="inp" id="cf5"></textarea></label>
   <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button type="button" class="btn" id="cfSms">Ouvrir un SMS</button><button class="btn primary" type="submit">Envoyer par email</button></div>
  </form>`);
 const texteSms=()=>`Réservation cuisine — ${fd($('#cf1').value)}, ${$('#cf3').value}–${$('#cf4').value}, ${$('#cf2').value} personnes.`;
 // §4.2 : le lien sms: est une option à part entière, pas seulement un
 // repli sur l'échec de l'email — « Email… SMS : lien sms:… » sont deux
 // canaux offerts, l'un n'attend pas que l'autre échoue.
 $('#cfSms').onclick=async()=>{
  window.open('sms:?body='+encodeURIComponent(texteSms()));
  await sb('crm_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({creneau_debut:$('#cf3').value,creneau_fin:$('#cf4').value,nb_personnes:+$('#cf2').value,statut_reservation:'envoyee',message_envoye_le:new Date().toISOString()})});
  await marquerActionFaite(tacheId);
  closeAll();toast('SMS ouvert');render();
 };
 $('#cuisineForm').onsubmit=async e=>{
  e.preventDefault();
  const body={action:'reserver_cuisine',date:$('#cf1').value,heure_debut:$('#cf3').value,heure_fin:$('#cf4').value,nb_personnes:+$('#cf2').value,note:$('#cf5').value||undefined};
  closeAll();
  let data={},ok=false;
  try{

  }catch(err){}
  if(ok&&data.ok){
   await sb('crm_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({creneau_debut:body.heure_debut,creneau_fin:body.heure_fin,nb_personnes:body.nb_personnes,statut_reservation:'envoyee',message_envoye_le:new Date().toISOString()})});
   await marquerActionFaite(tacheId);
   const cout=heures*tarif('tarif_cuisine_h',30);   // § Finance : tarif éditable dans crm_tarifs, plus 30 en dur
   const bloc=trouverBloc(t.bloc_id);
   if(bloc){

    bloc.cout_previsionnel=nouveauCp;
   }
   toast('Demande envoyée par email — reste à confirmer une fois la réponse reçue');
  }else if(data.degrade){
   // §4.2 : la config email manque → repli SMS, composé côté client.
   window.open('sms:?body='+encodeURIComponent(texteSms()));
   await sb('crm_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({creneau_debut:body.heure_debut,creneau_fin:body.heure_fin,nb_personnes:body.nb_personnes,statut_reservation:'envoyee',message_envoye_le:new Date().toISOString()})});
   await marquerActionFaite(tacheId);
   toast('Configuration email manquante — SMS ouvert à la place');
  }else{
   toast('Échec de l’envoi : '+(data.error||'erreur inconnue'));
  }
  render();
 };
}

/* La liste dérive des BONS DE CE BLOC (bons_attributions), pas de
   plans_repas comme admin.html : deux sources différentes pour deux
   circuits différents, ce n'est pas dupliquer un calcul existant. */
async function actionListeCourses(tacheId){
 const t=S.taches.find(x=>x.id===tacheId);if(!t)return;
 const bons=await sbTry('bons_commande?bloc_id=eq.'+t.bloc_id+'&select=id');
 const bonIds=(bons.ok?bons.data:[]).map(b=>b.id);
 if(!bonIds.length){modal(`<h2>Liste de courses</h2><div class="empty">Aucun bon de commande pour ce bloc — attribuez d'abord les recettes.</div><div class="foot"><button class="btn" type="button" data-close>Fermer</button></div>`);return}
 const attrs=await sbTry('bons_attributions?bon_id=in.('+bonIds.join(',')+')&select=recette_id,nb_portions');
 const parRecette={};(attrs.ok?attrs.data:[]).forEach(a=>{parRecette[a.recette_id]=(parRecette[a.recette_id]||0)+a.nb_portions});
 const recIds=Object.keys(parRecette);
 if(!recIds.length){modal(`<h2>Liste de courses</h2><div class="empty">Aucune attribution encore faite (voir « Gérer les bons »).</div><div class="foot"><button class="btn" type="button" data-close>Fermer</button></div>`);return}
 const ing=await sbTry('recettes_ingredients?recette_id=in.('+recIds.join(',')+')&select=recette_id,ingredient_nom,quantite_g,unite');
 const recBase=await sbTry('recettes?id=in.('+recIds.join(',')+')&select=id,nb_portions');
 const nbPortionsBase={};(recBase.ok?recBase.data:[]).forEach(r=>nbPortionsBase[r.id]=r.nb_portions||1);
 const total={};
 (ing.ok?ing.data:[]).forEach(i=>{

 });
 const lignes=Object.entries(total).sort((a,b)=>b[1]-a[1]);
 modal(`<h2>Liste de courses — ${esc(t.titre)}</h2>
  <div class="list">${lignes.map(([nom,qte])=>`<div class="li"><div class="grow">${esc(nom)}</div><span class="num">${Math.round(qte)}</span></div>`).join('')||'<div class="empty">Rien à calculer.</div>'}</div>

 $('#btnValiderCourses').onclick=async()=>{closeAll();await marquerActionFaite(tacheId);toast('Marqué fait');render()};

/* ---- Règles (§3.3) — un seul déclencheur existe réellement dans ce
   chantier : toutes les tâches d'un bloc sont faites. Suggère, n'agit
   pas toute seule — la spec dit « déterministe », pas « automatique sans
   validation ». ---- */
async function evaluerReglesApresBascule(tacheId){
 const t=S.taches.find(x=>x.id===tacheId);
 if(!t||!t.bloc_id)return;
 const ts=tachesDuBloc(t.bloc_id);

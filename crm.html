/* Glisser-déposer générique : sert au schéma (blocs) ET au mapping général
   (projets). Le seuil de 4 px distingue un clic d'un vrai déplacement ; le
   timestamp posé ici est relu par les gestionnaires de clic pour ignorer
   le clic fantôme qui suit un relâchement de glissement. */
function attacherDragPositionnable(wrap,selector,onDrop){
 wrap.addEventListener('pointerdown',e=>{
  if(LINK_MODE)return;
  const bl=e.target.closest(selector);
  if(!bl||e.target.closest('[data-del-bloc]'))return;
  const wrapRect=wrap.getBoundingClientRect();
  const blRect=bl.getBoundingClientRect();
  const startLeft=blRect.left-wrapRect.left,startTop=blRect.top-wrapRect.top;
  const startX=e.clientX,startY=e.clientY;
  let moved=false;
  function onMove(ev){
   const dx=ev.clientX-startX,dy=ev.clientY-startY;
   if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
   const nl=Math.max(0,Math.min(wrapRect.width-40,startLeft+dx));
   const nt=Math.max(0,Math.min(wrapRect.height-40,startTop+dy));
   bl.style.left=nl+'px';bl.style.top=nt+'px';
   if(wrap.id==='schemaWrap')dessinerLiens(wrap);
  }
  function onUp(){
   document.removeEventListener('pointermove',onMove);
   document.removeEventListener('pointerup',onUp);
   if(!moved)return;
   DERNIER_DRAG_TS=Date.now();
   const rect=bl.getBoundingClientRect();
   const wr=wrap.getBoundingClientRect();
   const xPct=Math.max(0,Math.min(92,((rect.left-wr.left)/wr.width)*100));
   const yPct=Math.max(0,Math.min(92,((rect.top-wr.top)/wr.height)*100));
   onDrop(bl,xPct,yPct);
  }
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',onUp);
 });
}
async function sauverPositionBloc(id,x,y){
 const portee=Object.keys(SCHEMA_CACHE).find(c=>(SCHEMA_CACHE[c].blocs||[]).some(b=>b.id===id));
 if(portee){const b=SCHEMA_CACHE[portee].blocs.find(b=>b.id===id);if(b){b.x=x;b.y=y}}
 await sb('crm_schema_blocs?id=eq.'+id,{method:'PATCH',body:JSON.stringify({x,y})});
}
function dessinerLiens(wrap){
 const svg=wrap.querySelector('#schemaSvg')||wrap.querySelector('.schema-svg');if(!svg)return;
 const portee=wrap.dataset.portee;const liens=(SCHEMA_CACHE[portee]||{}).liens||[];
 const wr=wrap.getBoundingClientRect();
 svg.innerHTML=liens.map(l=>{
  const a=wrap.querySelector(`[data-bloc="${l.bloc_source}"]`),b=wrap.querySelector(`[data-bloc="${l.bloc_cible}"]`);
  if(!a||!b)return'';
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  const x1=ra.left-wr.left+ra.width/2,y1=ra.top-wr.top+ra.height/2;
  const x2=rb.left-wr.left+rb.width/2,y2=rb.top-wr.top+rb.height/2;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="lienhit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" data-del-lien="${l.id}"/>`;
 }).join('');
 svg.querySelectorAll('[data-del-lien]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();supprimerLien(el.dataset.delLien)}));
}

   collaborateur et une catégorie, sinon on ne pourrait plus jamais les
   corriger sans supprimer/recréer. Le statut du bloc et celui de sa tâche
   auto-créée restent synchronisés : deux vérités qui divergent, c'est le

const opt=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
function openForm(k,ctx){
 const d=F[k](ctx||{});
 modal(`<h2>${d.t}</h2><p class="muted" style="margin:0;font-size:13px">Tracé au nom de ${esc(STAFF_NOM)}.</p><form class="form" id="mf">${d.f}<div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
 $('#mf').onsubmit=async e=>{e.preventDefault();closeAll();await d.ok()};
 // F.projet seul porte #wrapCommercial (fiche client §4.3) — générique
 // plutôt que d'apprendre à openForm() le détail d'un formulaire précis :
 // no-op pour tout autre appel de F[k] qui n'a pas ce bloc.
 const wc=$('#wrapCommercial');
 if(wc){
  const suivre=()=>wc.classList.toggle('hide',$('#f1').value!=='commercial');
  $('#f1').addEventListener('change',suivre);suivre();
 }
}
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-new]');
 if(n){e.preventDefault();closeAll();openForm(n.dataset.new,{activite:n.dataset.activite,projet:n.dataset.projet,tache:n.dataset.tache})}
 const g=e.target.closest('[data-go]');
 if(g){e.preventDefault();closeAll();go(g.dataset.go)}
 const mb=e.target.closest('[data-modele-bloc]');
 if(mb){e.preventDefault();closeAll();ouvrirNouveauBloc({activite:mb.dataset.activite,projet:mb.dataset.projet||null})}
 // Bascule Lien / Fichier du formulaire « Livrable »
 const m=e.target.closest('#modeDoc button');
 if(m){
  [...m.parentElement.children].forEach(b=>b.setAttribute('aria-pressed',b===m));
  $('#wrapLien').classList.toggle('hide',m.dataset.mode!=='lien');
  $('#wrapFichier').classList.toggle('hide',m.dataset.mode!=='fichier');
 }
 // Bascule Récurrente / Ponctuelle du formulaire « Indisponibilité »
 const ti=e.target.closest('#typeIndispo button');
 if(ti){
  [...ti.parentElement.children].forEach(b=>b.setAttribute('aria-pressed',b===ti));
  $('#wrapRecurrente').classList.toggle('hide',ti.dataset.mode!=='recurrente');
  $('#wrapPonctuelle').classList.toggle('hide',ti.dataset.mode!=='ponctuelle');
 }

/* ============ DRAWER / MODALE / PALETTE ============ */
function drawer(h){$('#drawer').innerHTML=h;$('#drawer').classList.add('on');$('#scrim').classList.add('on');$('#drawer').setAttribute('aria-hidden','false')}
function modal(h){$('#modal').innerHTML=h;$('#modal').classList.add('on');$('#scrim').classList.add('on');const f=$('#modal').querySelector('input,select,textarea');if(f)setTimeout(()=>f.focus(),50)}
function closeAll(){['#drawer','#modal','#pal','#pop'].forEach(s=>$(s).classList.remove('on'));$('#scrim').classList.remove('on');$('#side').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true')}
$('#scrim').onclick=closeAll;
document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeAll()});
function pop(anchor,html){const p=$('#pop');p.innerHTML=html;p.classList.add('on');const r=anchor.getBoundingClientRect();const w=Math.max(200,p.offsetWidth);p.style.top=(r.bottom+8)+'px';p.style.left=Math.max(12,Math.min(window.innerWidth-w-12,r.right-w))+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('#createBtn'))$('#pop').classList.remove('on')});
$('#createBtn').onclick=e=>{
 e.stopPropagation();closeAll();
 const activite=can(CUR)&&ACT_BY_CLE[CUR]?CUR:(CUR.startsWith('projet:')?(S.projets.find(p=>p.id===CUR.slice(7))||{}).activite:null);
 pop(e.currentTarget,[['projet','Projet'],['tache','Tâche'],['document','Document']].map(([k,l])=>`<button data-new="${k}" ${activite?`data-activite="${activite}"`:''}>+ ${l}</button>`).join(''));
};

let palSel=0,palItems=[];
function palRender(q){
 q=(q||'').toLowerCase();const it=[];
 [['dash','Accueil'],['taches','Toutes les tâches']].filter(([id])=>can(id)).forEach(([id,l])=>it.push({g:'Pages',l,s:'',fn:()=>go(id)}));
 ACTIVITES.filter(a=>can(a.cle)).forEach(a=>it.push({g:'Activités',l:a.nom,s:'',fn:()=>go(a.cle)}));
 S.taches.forEach(t=>it.push({g:'Tâches',l:t.titre,s:own(t.porteur).replace(/<[^>]+>/g,''),fn:()=>openTache(t.id)}));
 S.projets.forEach(p=>it.push({g:'Projets',l:p.nom,s:(ACT_BY_CLE[p.activite]||{}).nom||'',fn:()=>go('projet:'+p.id)}));
 palItems=it.filter(i=>!q||(i.l+' '+i.s).toLowerCase().includes(q)).slice(0,30);palSel=0;let last='';
 $('#palRes').innerHTML=palItems.map((i,k)=>{const h=i.g!==last?`<div class="gh">${i.g}</div>`:'';last=i.g;return h+`<div class="r ${k===0?'sel':''}" data-pi="${k}">${esc(i.l)}<small>${esc(i.s)}</small></div>`}).join('')||'<div class="empty" style="margin:10px">Rien trouvé</div>';
}
function openPal(){closeAll();$('#pal').classList.add('on');$('#scrim').classList.add('on');$('#palIn').value='';palRender('');setTimeout(()=>$('#palIn').focus(),30)}
$('#openPal').onclick=openPal;
$('#palIn').addEventListener('input',e=>palRender(e.target.value));
$('#palIn').addEventListener('keydown',e=>{
 const rs=[...document.querySelectorAll('#palRes .r')];
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,Math.min(rs.length-1,palSel+(e.key==='ArrowDown'?1:-1)));rs.forEach((r,i)=>r.classList.toggle('sel',i===palSel));rs[palSel]?.scrollIntoView({block:'nearest'})}
 if(e.key==='Enter'&&palItems[palSel]){const f=palItems[palSel].fn;closeAll();f()}
});
$('#palRes').addEventListener('click',e=>{const r=e.target.closest('[data-pi]');if(r){const f=palItems[+r.dataset.pi].fn;closeAll();f()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape')closeAll()});
$('#menuBtn').onclick=()=>{$('#side').classList.add('on');$('#scrim').classList.add('on')};

/* ============ FINANCE — Opérationnel (26/09/2026, refondu le même jour) ============
   Deux écrans :
   • LE TABLEAU — toutes les sessions de production (ou toutes les
     commandes rattachées à une session, selon le filtre), une ligne
     chacune avec son résultat en vert ou en rouge et une pastille vert
     foncé quand les trois pièces sont reliées (achats MP, cuisine, vente).
     Au-dessus, en héros : le résultat moyen des lignes affichées et la
     marge par produit.
   • LA PAGE D'UNE LIGNE — prévisionnel à gauche, réel à droite, équipe de
     cuisine, pièces justificatives (plusieurs, analysables par l'IA),
     facteurs ajustables, surplus de matières et plats réalisables en plus,
     puis l'analytique des charges et du poids de chaque aliment.
   Détail et raisonnement dans docs/crm-journal.md.

   Architecture inchangée dans son principe : UNE passe réseau
   (`chargerFinanceGlobal`), puis des fonctions PURES (`calculerFinance`,
   `rapprochementFacture`, `bilanSession`, `bilanCommande`) rappelées à
   chaque frappe, sans requête. Aucun chiffre n'est inventé : un prix
   inconnu, une pièce manquante, un réel non saisi sont annoncés comme tels,
   et un réel absent retombe sur le prévisionnel EN LE DISANT. */
let FIN_GLOBAL=null;                 // {sessions, rawParSession:{id:raw}}
let FIN_FILTRE='session';            // 'session' | 'commande'
let FIN_DETAIL=null;                 // null | {kind:'session'|'commande', id}
let FIN_SESSION=null, FIN_DONNEES=null;
let FIN_EDIT={heures:null,nbUnite:null,facteurs:{},equipe:{}};
let FIN_ANA_REC='tout', FIN_SURPLUS_REC='tout';
const CATEGORIES_PIECE={mp:'Achats matières premières',cuisine:'Cuisine (location, équipe)',vente:'Vente'};
function editVide(){return{heures:null,nbUnite:null,facteurs:{},equipe:{}}}

function fmtEur(n){return(Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function fmtQte(kg){if(kg==null)return'—';return kg<1?Math.round(kg*1000)+' g':(Math.round(kg*100)/100).toLocaleString('fr-FR')+' kg'}
function signeEur(n){return(n>=0?'+':'−')+fmtEur(Math.abs(n))}
function couleurRes(n){return n>=0?'var(--green)':'var(--red)'}

/* ---- 1. Chargement réseau : UNE passe pour toutes les sessions ---- */
async function chargerFinanceGlobal(){
 const sessR=await sbTry('crm_sessions?select=*&order=jour.desc');
 const sessions=sessR.ok?sessR.data:[];
 if(!sessions.length)return{sessions:[],rawParSession:{}};
 const sIds=sessions.map(s=>s.id);
 const blocIds=sessions.map(s=>s.bloc_id).filter(Boolean);
 const filtres=['session_id.in.('+sIds.join(',')+')'];
 if(blocIds.length)filtres.push('bloc_id.in.('+blocIds.join(',')+')');
 const bonsR=await sbTry('bons_commande?or=('+filtres.join(',')+')&statut=neq.annule&select=id,type,nb_repas,bloc_id,session_id,contact_nom,user_id,jour_livraison,statut');
 const bons=bonsR.ok?bonsR.data:[];
 const bonIds=bons.map(b=>b.id);
 const attrsR=bonIds.length?await sbTry('bons_attributions?bon_id=in.('+bonIds.join(',')+')&select=bon_id,recette_id,nb_portions,facteur,kcal_portion'):{ok:true,data:[]};
 const attrs=attrsR.ok?attrsR.data:[];
 const recIds=[...new Set(attrs.map(a=>a.recette_id))];
 const vide=Promise.resolve({ok:true,data:[]});
 const [ingR,recR,ingBaseR,etR,eqR,factR]=await Promise.all([
  recIds.length?sbTry('recettes_ingredients?recette_id=in.('+recIds.join(',')+')&select=recette_id,ingredient_nom,quantite_g,unite'):vide,
  recIds.length?sbTry('recettes?id=in.('+recIds.join(',')+')&select=id,nom,nb_portions,calories_portion'):vide,
  sbTry('ingredients_base?select=nom,prix_kg_moyen,prix_achat_ht,poids_colis_kg'),
  sbTry('crm_session_etapes?session_id=in.('+sIds.join(',')+')&phase=eq.production&select=session_id,poste,duree_prevue_min,duree_reelle_min'),
  sbTry('crm_session_equipe?session_id=in.('+sIds.join(',')+')&select=*&order=created_at.asc'),
  sbTry('factures_fournisseur?session_id=in.('+sIds.join(',')+')&select=*&order=date_facture.desc')
 ]);
 const factures=factR.ok?factR.data:[];
 const fIds=factures.map(f=>f.id);
 const lignesR=fIds.length?await sbTry('lignes_facture?facture_id=in.('+fIds.join(',')+')&select=*'):{ok:true,data:[]};
 const lignes=lignesR.ok?lignesR.data:[];
 const recettesById={};(recR.ok?recR.data:[]).forEach(r=>recettesById[r.id]=r);
 const ingredientsIndex=indexPrixIngredients(ingBaseR.ok?ingBaseR.data:[]);
 const recIngredients=ingR.ok?ingR.data:[];
 const etapes=etR.ok?etR.data:[];
 const equipe=eqR.ok?eqR.data:[];
 const rawParSession={};
 sessions.forEach(s=>{
  const bonsS=bons.filter(b=>(s.bloc_id&&b.bloc_id===s.bloc_id)||b.session_id===s.id);
  const bIds=new Set(bonsS.map(b=>b.id));
  const attrsS=attrs.filter(a=>bIds.has(a.bon_id));
  const recS=new Set(attrsS.map(a=>a.recette_id));
  const facturesS=factures.filter(f=>f.session_id===s.id);
  const fS=new Set(facturesS.map(f=>f.id));
  rawParSession[s.id]={
   session:s,bons:bonsS,attrs:attrsS,recettesById,
   recIngredients:recIngredients.filter(i=>recS.has(i.recette_id)),
   ingredientsIndex,
   minutesMapping:minutesDepuisEtapes(etapes.filter(e=>e.session_id===s.id)),
   equipe:equipe.filter(e=>e.session_id===s.id),
   factures:facturesS,
   lignes:lignes.filter(l=>fS.has(l.facture_id))
  };
 });
 return{sessions,rawParSession,equipeManquante:!eqR.ok&&eqR.manque};
}
/* Prix au kg : prix_kg_moyen s'il existe, sinon prix_achat_ht (au COLIS)
   ÷ poids_colis_kg. Sans les deux, prix inconnu — jamais une valeur devinée. */
function indexPrixIngredients(rows){
 const idx={};
 rows.forEach(x=>{
  const cle=String(x.nom||'').trim().toLowerCase();
  idx[cle]=x.prix_kg_moyen!=null?+x.prix_kg_moyen:(x.prix_achat_ht!=null&&x.poids_colis_kg?+x.prix_achat_ht/+x.poids_colis_kg:null);
 });
 return idx;
}

/* ---- 2. Calcul pur — aucun accès réseau, appelé à chaque frappe ---- */
function qteKg(q,unite){const u=(unite||'').trim().toLowerCase();return u==='kg'?q:u==='g'?q/1000:null}
function calculerFinance(raw,edit){
 if(!raw)return null;
 edit=edit||editVide();
 const {session:s,bons,attrs,recettesById,recIngredients,ingredientsIndex,minutesMapping}=raw;
 // Portions équivalentes par recette = Σ(nb_portions × facteur), le
 // facteur ÉDITÉ localement l'emportant sur celui réellement en base —
 // exactement le calcul de listeCoursesJours (§06), avec l'override en plus.
 const portionsEq={},nbPortionsTotal={},facteurBasePondere={},kcalPondere={};
 attrs.forEach(a=>{
  const nb=a.nb_portions||0,facteurBase=+a.facteur||1;
  const facteurUtilise=edit.facteurs[a.recette_id]!=null?edit.facteurs[a.recette_id]:facteurBase;
  portionsEq[a.recette_id]=(portionsEq[a.recette_id]||0)+nb*facteurUtilise;
  nbPortionsTotal[a.recette_id]=(nbPortionsTotal[a.recette_id]||0)+nb;
  facteurBasePondere[a.recette_id]=(facteurBasePondere[a.recette_id]||0)+nb*facteurBase;
  kcalPondere[a.recette_id]=(kcalPondere[a.recette_id]||0)+nb*(+a.kcal_portion||0);
 });
 // Ingrédients : agrégés pour TOUTE la session, et détaillés par recette
 // (chiffrés — pour l'analytique « poids de chaque aliment par recette »).
 const total={},ingredientsParRecette={},detailParRecette={},coutMatiereParRecette={};
 recIngredients.forEach(i=>{
  const rec=recettesById[i.recette_id];if(!rec)return;
  const base=rec.nb_portions||1;
  const unite=(i.unite||'g').trim().toLowerCase();
  const nom=String(i.ingredient_nom||'').trim();
  const cle=nom.toLowerCase();
  const q=(+i.quantite_g||0)*(portionsEq[i.recette_id]||0)/base;
  if(!total[cle])total[cle]={nom,unite,q:0,parRecette:{}};
  total[cle].q+=q;
  total[cle].parRecette[i.recette_id]=(total[cle].parRecette[i.recette_id]||0)+q;
  (ingredientsParRecette[i.recette_id]||(ingredientsParRecette[i.recette_id]=[])).push({nom,unite,gPerPortion:(+i.quantite_g||0)/base});
  const qKg=qteKg(q,unite);
  const prixKg=qKg!=null?ingredientsIndex[cle]:null;
  const cout=(qKg!=null&&prixKg!=null)?qKg*prixKg:null;
  (detailParRecette[i.recette_id]||(detailParRecette[i.recette_id]=[])).push({nom,unite,q,qKg,prixKg,cout});
  if(cout!=null)coutMatiereParRecette[i.recette_id]=(coutMatiereParRecette[i.recette_id]||0)+cout;
 });
 // Coût matière : seulement g/kg convertis en kg — même restriction que
 // listeCoursesJours (§06), un ml ou une pièce ne se compare pas à un prix
 // au kg sans inventer une conversion.
 let coutMatiere=0,ingConnus=0,ingInconnus=0;
 const lignesIngredients=Object.values(total).map(l=>{
  const qKg=qteKg(l.q,l.unite);
  const prixKg=qKg!=null?ingredientsIndex[l.nom.toLowerCase()]:null;
  const cout=(qKg!=null&&prixKg!=null)?qKg*prixKg:null;
  if(cout!=null){coutMatiere+=cout;ingConnus++}else ingInconnus++;
  return {...l,qKg,prixKg,cout};
 }).sort((a,b)=>(b.cout||0)-(a.cout||0));
 const parRecette=Object.keys(nbPortionsTotal).map(id=>{
  const nb=nbPortionsTotal[id];
  const facteurBaseMoyen=nb?facteurBasePondere[id]/nb:1;
  return {
   id,nom:(recettesById[id]||{}).nom||'Recette supprimée',nbPortions:nb,portionsEq:portionsEq[id]||0,
   facteurBaseMoyen,facteurUtilise:edit.facteurs[id]!=null?edit.facteurs[id]:facteurBaseMoyen,
   kcalPortionRecette:(recettesById[id]||{}).calories_portion??null,
   kcalMoyenAttribue:nb&&kcalPondere[id]?kcalPondere[id]/nb:null,
   coutMatiere:coutMatiereParRecette[id]||0
  };
 }).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
 // Heures de cuisine : édition locale > override enregistré en session >
 // calcul depuis le mapping (le MÊME calcul qu'actionReserverCuisine).
 const tarifCuisineH=tarif('tarif_cuisine_h',30);
 let heures=null,sourceHeures='override';
 if(edit.heures!=null)heures=edit.heures;
 else if(s.heures_cuisine_override!=null)heures=+s.heures_cuisine_override;
 else if(minutesMapping!=null){heures=heuresDepuisMinutes(minutesMapping);sourceHeures='mapping'}
 else sourceHeures='inconnu';
 const coutLocation=heures!=null?heures*tarifCuisineH:0;
 // Équipe de cuisine : nb × taux × heures prévues (les heures de la
 // session par défaut). L'édition locale d'une ligne l'emporte sur la base.
 const equipe=(raw.equipe||[]).map(e=>ligneEquipe(e,edit.equipe[e.id],heures));
 const coutEquipe=equipe.reduce((t,e)=>t+(e.coutPrevu||0),0);
 const coutCuisine=coutLocation+coutEquipe;
 // Revenu : nb de repas commandés × répartition éditable entre les deux
 // tarifs — par défaut, les bons hors abonnement comptent à l'unité.
 const totalRepas=bons.reduce((sum,b)=>sum+(b.nb_repas||0),0);
 let nbUnite;
 if(edit.nbUnite!=null)nbUnite=edit.nbUnite;
 else if(s.nb_repas_unite_override!=null)nbUnite=s.nb_repas_unite_override;
 else nbUnite=bons.filter(b=>b.type!=='abonnement').reduce((sum,b)=>sum+(b.nb_repas||0),0);
 nbUnite=Math.max(0,Math.min(totalRepas,nbUnite));
 const nbAbo=totalRepas-nbUnite;
 const prixAbo=tarif('prix_repas_abo',9),prixUnite=tarif('prix_repas_unite',10.5);
 const ca=nbAbo*prixAbo+nbUnite*prixUnite;
 const coutTotal=coutMatiere+coutCuisine;
 const bonsNonAttribues=bons.filter(b=>!attrs.some(a=>a.bon_id===b.id));
 return {
  session:s,totalRepas,nbAbo,nbUnite,prixAbo,prixUnite,ca,
  coutMatiere,lignesIngredients,ingConnus,ingInconnus,ingredientsParRecette,detailParRecette,portionsEq,
  heures,sourceHeures,tarifCuisineH,coutLocation,equipe,coutEquipe,coutCuisine,coutTotal,gain:ca-coutTotal,
  parRecette,bonsNonAttribues
 };
}
/* Une ligne d'équipe, avec les valeurs éditées localement par-dessus.
   Le réel retombe sur le prévu champ par champ — et le dit (`reelComplet`). */
function ligneEquipe(e,ed,heuresSession){
 const v=Object.assign({},e,ed||{});
 const num=x=>x===''||x==null?null:+x;
 const nb=num(v.nb)??1,tauxP=num(v.taux_horaire_prevu),hP=num(v.heures_prevues)??heuresSession;
 const tauxR=num(v.taux_horaire_reel),hR=num(v.heures_reelles);
 const coutPrevu=(tauxP!=null&&hP!=null)?nb*tauxP*hP:null;
 const reelComplet=tauxR!=null&&hR!=null;
 const coutReel=(tauxR??tauxP)!=null&&(hR??hP)!=null?nb*(tauxR??tauxP)*(hR??hP):null;
 return{id:e.id,poste:v.poste||'',nb,tauxP,hP,tauxR,hR,coutPrevu,coutReel,reelComplet};
}

/* ---- 3. Rapprochement avec les achats réels (pure aussi) ---- */
function rapprochementFacture(calc,lignesFacture){
 if(!lignesFacture||!lignesFacture.length)return null;
 // Regroupe les lignes par nom exact insensible à la casse — pas de
 // correspondance approximative, elle ferait disparaître un écart à tort.
 const achatParIngredient={};
 lignesFacture.forEach(l=>{
  const nom=(l.ingredient_match||l.designation||'').trim();if(!nom)return;
  const cle=nom.toLowerCase();
  if(!achatParIngredient[cle])achatParIngredient[cle]={nom,qKg:0,prixTotal:0,prixKgConnu:0};
  const qte=+l.quantite||0;
  const prixTot=l.prix_total!=null?+l.prix_total:(l.prix_unitaire!=null?+l.prix_unitaire*qte:0);
  achatParIngredient[cle].prixTotal+=prixTot;
  const k=qteKg(qte,l.unite);
  if(k!=null){achatParIngredient[cle].qKg+=k;achatParIngredient[cle].prixKgConnu+=prixTot}
 });
 const prixKgReelDe=cle=>{const a=achatParIngredient[cle];return a&&a.qKg>0?a.prixKgConnu/a.qKg:null};
 const ecarts=calc.lignesIngredients.filter(l=>l.qKg!=null&&l.prixKg!=null).map(l=>{
  const pr=prixKgReelDe(l.nom.toLowerCase());if(pr==null)return null;
  return {nom:l.nom,prixKgPrevu:l.prixKg,prixKgReel:pr,ecart:pr-l.prixKg,ecartPct:l.prixKg?(pr-l.prixKg)/l.prixKg*100:null};
 }).filter(Boolean).sort((a,b)=>Math.abs(b.ecart)-Math.abs(a.ecart));
 // Coût matière CONSOMMÉE au prix réel : le besoin de la session au prix
 // facturé là où on l'a, prévisionnel en repli (compté, jamais silencieux).
 // Le surplus acheté n'y entre pas : c'est du stock, qui profitera à une
 // autre session ou aux plats en plus ci-dessous.
 let coutMatiereReel=0,ingReelConnus=0;
 const coutReelParRecette={};
 calc.lignesIngredients.forEach(l=>{
  const pr=prixKgReelDe(l.nom.toLowerCase());
  const prix=(pr!=null&&l.qKg!=null)?pr:l.prixKg;
  if(pr!=null&&l.qKg!=null)ingReelConnus++;
  if(l.qKg!=null&&prix!=null){
   coutMatiereReel+=l.qKg*prix;
   Object.entries(l.parRecette||{}).forEach(([rid,q])=>{const k=qteKg(q,l.unite);if(k!=null)coutReelParRecette[rid]=(coutReelParRecette[rid]||0)+k*prix});
  }
 });
 const achatsFactures=Object.values(achatParIngredient).reduce((t,a)=>t+a.prixTotal,0);
 // Surplus acheté au-delà du besoin de la session, en grammes.
 const surplusG={};
 Object.entries(achatParIngredient).forEach(([cle,achat])=>{
  const requis=calc.lignesIngredients.find(l=>l.nom.toLowerCase()===cle);
  const s=achat.qKg-((requis&&requis.qKg)||0);
  if(s>0.001)surplusG[cle]=s*1000;
 });
 // Plats en plus par recette : le goulot parmi SES ingrédients, à la
 // quantité MOYENNE réellement produite (grammage de fiche × facteur
 // moyen de la session). Un ingrédient sans donnée d'achat annule le
 // bonus — une estimation à moitié fondée n'est pas une estimation.
 const recettesBonus=Object.entries(calc.ingredientsParRecette).map(([recId,ings])=>{
  const rec=calc.parRecette.find(r=>r.id===recId);
  const facteur=rec?(rec.facteurUtilise||1):1;
  let bonus=Infinity,limitant=null,connu=ings.length>0,manquant=null;
  ings.forEach(ing=>{
   const g=qteKg(ing.gPerPortion*facteur,ing.unite);
   if(g==null||g<=0){connu=false;manquant=manquant||ing.nom;return}
   const surplus=surplusG[ing.nom.toLowerCase()];
   if(surplus==null){connu=false;manquant=manquant||ing.nom;return}
   const possible=Math.floor(surplus/(g*1000));
   if(possible<bonus){bonus=possible;limitant=ing.nom}
  });
  if(!connu||!isFinite(bonus))bonus=0;
  return {recId,nom:rec?rec.nom:'?',bonus,limitant,manquant,gPortion:ings.reduce((t,i)=>t+(qteKg(i.gPerPortion*facteur,i.unite)||0),0)};
 }).sort((a,b)=>b.bonus-a.bonus);
 return {ecarts,achatParIngredient,coutMatiereReel,ingReelConnus,coutReelParRecette,achatsFactures,ecartMargeMatiere:coutMatiereReel-calc.coutMatiere,recettesBonus,surplusG};
}

/* ---- 4. Bilan d'une session : prévu, réel, pièces reliées ---- */
function montantPieces(factures,cat){
 const ps=factures.filter(f=>(f.categorie||'mp')===cat);
 const avecMontant=ps.filter(f=>f.montant_total!=null);
 return{nb:ps.length,nbAvecMontant:avecMontant.length,total:avecMontant.reduce((t,f)=>t+(+f.montant_total||0),0)};
}
function bilanSession(raw,edit){
 const calc=calculerFinance(raw,edit);
 if(!calc)return null;
 const factures=raw.factures||[];
 const lignesMp=(raw.lignes||[]).filter(l=>{const f=factures.find(x=>x.id===l.facture_id);return f&&(f.categorie||'mp')==='mp'});
 const rappro=rapprochementFacture(calc,lignesMp);
 const pMp=montantPieces(factures,'mp'),pCui=montantPieces(factures,'cuisine'),pVen=montantPieces(factures,'vente');
 // Les trois liens — la pastille vert foncé ne s'allume que si les trois
 // pièces existent ET portent un chiffre exploitable.
 const liens={mp:lignesMp.length>0,cuisine:pCui.nbAvecMontant>0,vente:pVen.nbAvecMontant>0};
 liens.nb=(liens.mp?1:0)+(liens.cuisine?1:0)+(liens.vente?1:0);
 liens.complet=liens.nb===3;
 const equipeReel=calc.equipe.reduce((t,e)=>t+(e.coutReel||0),0);
 const reel={
  matiere:rappro?rappro.coutMatiereReel:calc.coutMatiere,sourceMatiere:rappro?'facture':'prevu',
  achatsMp:rappro?rappro.achatsFactures:(pMp.nbAvecMontant?pMp.total:null),
  // La facture de cuisine REMPLACE la location prévue (elle en est la
  // version réelle) ; l'équipe réelle vient des taux/heures réels saisis.
  location:pCui.nbAvecMontant?pCui.total:calc.coutLocation,sourceLocation:pCui.nbAvecMontant?'facture':'prevu',
  equipe:equipeReel,sourceEquipe:calc.equipe.length&&calc.equipe.every(e=>e.reelComplet)?'saisi':calc.equipe.length?'partiel':'aucune',
  ca:pVen.nbAvecMontant?pVen.total:calc.ca,sourceCa:pVen.nbAvecMontant?'facture':'prevu'
 };
 reel.cuisine=reel.location+reel.equipe;
 reel.cout=reel.matiere+reel.cuisine;
 reel.resultat=reel.ca-reel.cout;
 // Le résultat qui représente la ligne dans le tableau : le réel dès que
 // les trois pièces sont reliées, le prévisionnel sinon (et c'est écrit).
 const affiche=liens.complet?{res:reel.resultat,ca:reel.ca,cout:reel.cout,nature:'réel'}:{res:calc.gain,ca:calc.ca,cout:calc.coutTotal,nature:'prévu'};
 // Répartition par commande : CA au tarif de son type, recalé sur le CA de
 // la session (qui porte la répartition 9 €/10,50 € éditable) ; matière
 // selon SES recettes ; cuisine au prorata des portions équivalentes.
 const bonsDet=raw.bons.map(b=>{
  const as=raw.attrs.filter(a=>a.bon_id===b.id);
  const eq={};let pEq=0;
  as.forEach(a=>{const f=edit&&edit.facteurs&&edit.facteurs[a.recette_id]!=null?edit.facteurs[a.recette_id]:(+a.facteur||1);const v=(a.nb_portions||0)*f;eq[a.recette_id]=(eq[a.recette_id]||0)+v;pEq+=v});
  let mat=0,matR=0;
  Object.entries(eq).forEach(([rid,v])=>{
   const tot=calc.portionsEq[rid]||0;if(!tot)return;
   mat+=(calc.detailParRecette[rid]||[]).reduce((t,l)=>t+(l.cout||0),0)*v/tot;
   matR+=((rappro&&rappro.coutReelParRecette[rid])||(calc.detailParRecette[rid]||[]).reduce((t,l)=>t+(l.cout||0),0))*v/tot;
  });
  return{bon:b,attrs:as,portionsEq:pEq,caBrut:(b.nb_repas||0)*(b.type==='abonnement'?calc.prixAbo:calc.prixUnite),matiere:mat,matiereReel:matR};
 });
 const caBrutTot=bonsDet.reduce((t,d)=>t+d.caBrut,0)||1;
 const pEqTot=bonsDet.reduce((t,d)=>t+d.portionsEq,0);
 const repasTot=bonsDet.reduce((t,d)=>t+(d.bon.nb_repas||0),0)||1;
 bonsDet.forEach(d=>{
  d.part=pEqTot?d.portionsEq/pEqTot:(d.bon.nb_repas||0)/repasTot;
  d.partCa=d.caBrut/caBrutTot;
  d.ca=calc.ca*d.partCa;
  d.cuisine=calc.coutCuisine*d.part;
  d.cout=d.matiere+d.cuisine;d.resultat=d.ca-d.cout;
  d.caReel=reel.ca*d.partCa;d.cuisineReel=reel.cuisine*d.part;
  d.coutReel=d.matiereReel+d.cuisineReel;d.resultatReel=d.caReel-d.coutReel;
  d.affiche=liens.complet?{res:d.resultatReel,ca:d.caReel,cout:d.coutReel,nature:'réel'}:{res:d.resultat,ca:d.ca,cout:d.cout,nature:'prévu'};
 });
 // Marge par produit (recette) : CA des portions de cette recette dans
 // chaque commande, moins sa matière et sa part de cuisine.
 const parProduit={};
 bonsDet.forEach(d=>{
  const nbP=d.attrs.reduce((t,a)=>t+(a.nb_portions||0),0)||1;
  d.attrs.forEach(a=>{
   const p=parProduit[a.recette_id]||(parProduit[a.recette_id]={id:a.recette_id,nom:(raw.recettesById[a.recette_id]||{}).nom||'?',ca:0,caReel:0,cout:0,coutReel:0});
   p.ca+=d.ca*(a.nb_portions||0)/nbP;p.caReel+=d.caReel*(a.nb_portions||0)/nbP;
  });
 });
 Object.values(parProduit).forEach(p=>{
  const tot=calc.portionsEq[p.id]||0,part=pEqTot?tot/pEqTot:0;
  const mat=(calc.detailParRecette[p.id]||[]).reduce((t,l)=>t+(l.cout||0),0);
  p.cout=mat+calc.coutCuisine*part;
  p.coutReel=((rappro&&rappro.coutReelParRecette[p.id])||mat)+reel.cuisine*part;
 });
 return{calc,rappro,reel,liens,affiche,bonsDet,parProduit,pieces:{mp:pMp,cuisine:pCui,vente:pVen}};
}

/* ---- 5. Lignes du tableau + héros, selon le filtre ---- */
function lignesTableauFinance(global,filtre){
 const lignes=[],produits={};
 global.sessions.forEach(s=>{
  const raw=global.rawParSession[s.id];if(!raw)return;
  const b=bilanSession(raw,s.id===FIN_SESSION?FIN_EDIT:editVide());
  const reelOk=b.liens.complet;
  Object.values(b.parProduit).forEach(p=>{
   const q=produits[p.id]||(produits[p.id]={nom:p.nom,ca:0,cout:0});
   if(filtre==='session'){q.ca+=reelOk?p.caReel:p.ca;q.cout+=reelOk?p.coutReel:p.cout}
  });
  if(filtre==='session')lignes.push({kind:'session',id:s.id,session:s,repas:b.calc.totalRepas,...b.affiche,liens:b.liens});
  else b.bonsDet.forEach(d=>{
   lignes.push({kind:'commande',id:d.bon.id,session:s,bon:d.bon,repas:d.bon.nb_repas||0,...d.affiche,liens:b.liens});
   const nbP=d.attrs.reduce((t,a)=>t+(a.nb_portions||0),0)||1;
   d.attrs.forEach(a=>{
    const p=b.parProduit[a.recette_id];if(!p)return;
    const q=produits[a.recette_id]||(produits[a.recette_id]={nom:p.nom,ca:0,cout:0});
    const partCa=p.ca?d.ca*(a.nb_portions||0)/nbP/p.ca:0;
    q.ca+=(reelOk?p.caReel:p.ca)*partCa;q.cout+=(reelOk?p.coutReel:p.cout)*partCa;
   });
  });
 });
 const n=lignes.length;
 const total=lignes.reduce((t,l)=>t+l.res,0),caTot=lignes.reduce((t,l)=>t+l.ca,0);
 const marges=Object.values(produits).filter(p=>p.ca>0).map(p=>({nom:p.nom,marge:(p.ca-p.cout)/p.ca*100,res:p.ca-p.cout})).sort((a,b)=>b.marge-a.marge);
 return{lignes,moyenne:n?total/n:0,total,margeGlobale:caTot?total/caTot*100:null,marges};
}

/* ---- Pièces : plusieurs à la fois, analysables par l'IA ---- */
function compresserImage(file,max=1600){
 return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82).split(',')[1])};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image illisible'))};
  img.src=url;
 });
}
/* L'IA lit la pièce et rend du JSON. Pour les achats de matières, elle
   doit rattacher chaque ligne à un ingrédient de la session par son nom
   EXACT (liste fournie) — c'est ce qui permet le rapprochement, qui
   n'accepte que des noms exacts. Un produit hors liste reste non rattaché
   plutôt que rattaché au hasard. */
async function analyserPieceIA(blobOuFile,categorie,nomsIngredients){
 const image=await compresserImage(blobOuFile);
 const consigne=categorie==='mp'
  ?`C'est une facture d'achat de matières premières (fournisseur type Metro). Relève chaque ligne de produit alimentaire.
Pour "ingredient", recopie EXACTEMENT un nom de cette liste s'il désigne le même produit, sinon null :
${nomsIngredients.map(n=>'- '+n).join('\n')||'(liste vide)'}
"quantite" est la quantité NETTE achetée dans l'unité "unite" (kg, g, L, ml ou pièce) — convertis les colis en kg quand le poids est indiqué. "prix_total" est le montant HT de la ligne.`
  :categorie==='cuisine'?`C'est une facture de cuisine (location de cuisine professionnelle ou main-d'œuvre). Relève le montant total HT.`
  :`C'est un justificatif de vente (facture client, relevé de paiements). Relève le montant total HT des ventes.`;
 const prompt=`${consigne}
Réponds UNIQUEMENT avec un objet JSON, sans texte autour :
{"fournisseur":"string|null","date":"YYYY-MM-DD|null","numero":"string|null","montant_ht":number|null,"lignes":[{"designation":"string","ingredient":"string|null","quantite":number|null,"unite":"kg|g|L|ml|pièce|null","prix_total":number|null}]}
Pour une pièce qui n'est pas un achat de matières, laisse "lignes" vide.`;
 const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+jetonStaff()},body:JSON.stringify({prompt,image,media_type:'image/jpeg',max_tokens:3000})});
 const data=await r.json().catch(()=>({}));
 if(!r.ok||!data.text)throw new Error(data.error||'réponse vide');
 const m=data.text.match(/\{[\s\S]*\}/);if(!m)throw new Error('réponse illisible');
 return JSON.parse(m[0]);
}
async function appliquerAnalysePiece(factureId,categorie,a){
 const patch={statut:'traite'};
 if(a.fournisseur)patch.fournisseur=a.fournisseur;
 if(a.date&&/^\d{4}-\d{2}-\d{2}$/.test(a.date))patch.date_facture=a.date;
 if(a.numero)patch.numero_facture=a.numero;
 if(categorie!=='mp'&&a.montant_ht!=null)patch.montant_total=Math.round(+a.montant_ht*100)/100;
 await sb('factures_fournisseur?id=eq.'+factureId,{method:'PATCH',body:JSON.stringify(patch)});
 if(categorie==='mp'){
  const lignes=(a.lignes||[]).filter(l=>l&&l.designation).map(l=>{
   const q=l.quantite!=null?+l.quantite:null,pt=l.prix_total!=null?+l.prix_total:null;
   return{facture_id:factureId,designation:String(l.designation),ingredient_match:l.ingredient||null,quantite:q,unite:l.unite||null,prix_total:pt,prix_unitaire:q&&pt!=null?Math.round(pt/q*10000)/10000:null};
  });
  if(lignes.length)await sb('lignes_facture',{method:'POST',body:JSON.stringify(lignes)});
  await recalculerTotauxFacture(factureId,a.montant_ht);
 }
}

function ouvrirAjoutPieces(sessionId){
 modal(`<h2>Ajouter des pièces</h2><form class="form" id="piecesForm">
  <label>Catégorie<select id="pc1">${Object.entries(CATEGORIES_PIECE).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
  <label>Fichiers (plusieurs possibles — photos, scans, PDF)<input class="inp" id="pc2" type="file" multiple accept="image/*,.pdf"></label>
  <div class="two"><label>Date<input class="inp" id="pc3" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Montant HT (si une seule pièce)<input class="inp" id="pc4" type="number" step="0.01" min="0" placeholder="laisser vide pour l'IA"></label></div>
  <label style="flex-direction:row;align-items:center;gap:8px;display:flex"><input type="checkbox" id="pc5" checked> Analyser les photos avec l'IA (lignes d'achat, montant, date)</label>
  <p class="muted" style="font-size:12px;margin:0">Une pièce par fichier. Les PDF sont joints mais pas analysés — saisis leurs lignes ou leur montant dans la pièce, ou joins une photo.</p>
  <div id="pcEtat" class="muted" style="font-size:12.5px"></div>

 </form>`);
 $('#piecesForm').onsubmit=async e=>{
  e.preventDefault();
  const cat=$('#pc1').value,files=[...$('#pc2').files],date=$('#pc3').value,montant=$('#pc4').value,ia=$('#pc5').checked;
  const etat=m=>{const el=$('#pcEtat');if(el)el.textContent=m};
  $('#pcOk').disabled=true;
  const noms=nomsIngredientsSession();
  const liste=files.length?files:[null];
  let erreurs=0;
  for(let i=0;i<liste.length;i++){
   const file=liste[i];
   etat(`Pièce ${i+1}/${liste.length}${file?' — '+file.name:''}…`);
   let url=null;

    const fdat=new FormData();fdat.append('file',file);fdat.append('upload_preset',CLOUDINARY_PRESET);
    const up=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/auto/upload',{method:'POST',body:fdat});
    const upJ=await up.json().catch(()=>({}));
    if(up.ok&&upJ.secure_url)url=upJ.secure_url;else erreurs++;
   }
   const body={session_id:sessionId,categorie:cat,date_facture:date||null,fichier_url:url,fichier_nom:file?file.name:null,statut:'a_traiter',
    montant_total:liste.length===1&&montant!==''?+montant:null};
   const r=await sb('factures_fournisseur',{method:'POST',body:JSON.stringify(body)});
   const fid=r&&r[0]&&r[0].id;

  }

async function recalculerTotauxFacture(factureId,montantLu){
 const fr=await sbTry('factures_fournisseur?id=eq.'+factureId+'&select=categorie');
 const cat=((fr.ok?fr.data:[])[0]||{}).categorie||'mp';
 if(cat!=='mp')return;
 const lr=await sbTry('lignes_facture?facture_id=eq.'+factureId+'&select=prix_total');
 const lignes=lr.ok?lr.data:[];
 const total=lignes.reduce((s,l)=>s+(+l.prix_total||0),0);
 const patch={lignes_importees:lignes.length,statut:lignes.length?'traite':'a_traiter'};
 // Sans ligne, on ne touche au montant que si l'IA vient d'en lire un :
 // retirer la dernière ligne ne doit pas effacer un montant saisi à la main.
 if(lignes.length)patch.montant_total=Math.round(total*100)/100;
 else if(montantLu!=null)patch.montant_total=+montantLu;
 await sb('factures_fournisseur?id=eq.'+factureId,{method:'PATCH',body:JSON.stringify(patch)});
}
async function ouvrirFactureDetail(factureId){
 await chargerIngredients();
 const fr=await sbTry('factures_fournisseur?id=eq.'+factureId+'&select=*');
 const f=(fr.ok?fr.data:[])[0];if(!f){toast('Pièce introuvable');return}
 const cat=f.categorie||'mp';
 const lr=await sbTry('lignes_facture?facture_id=eq.'+factureId+'&select=*&order=created_at.asc');
 const lignes=lr.ok?lr.data:[];
 const nomsSession=nomsIngredientsSession();
 const noms=[...new Set([...nomsSession,...(INGREDIENTS_CACHE||[])])];
 drawer(`<div class="dh"><div class="av lg dk">🧾</div><div><h2>${fd(f.date_facture)}${f.numero_facture?' · '+esc(f.numero_facture):''}</h2><p class="sub" style="margin:2px 0 0">${CATEGORIES_PIECE[cat]}${f.fournisseur?' · '+esc(f.fournisseur):''}</p></div><button class="x" data-close aria-label="Fermer">×</button></div>
 ${f.fichier_url?`<p style="margin:0 0 12px"><a href="${esc(f.fichier_url)}" target="_blank" rel="noopener">📎 ${esc(f.fichier_nom||'Voir la pièce')}</a>${/\.(jpe?g|png|webp|gif|heic)(\?|$)/i.test(f.fichier_url)?` · <button class="btn sm" type="button" id="pieceAnalyser">✦ Analyser avec l'IA</button>`:''}</p>`:''}
 <form class="form" id="pieceMeta" style="margin-bottom:14px">
  <div class="two"><label>Catégorie<select id="pm1">${Object.entries(CATEGORIES_PIECE).map(([k,l])=>`<option value="${k}"${k===cat?' selected':''}>${l}</option>`).join('')}</select></label><label>Montant HT${cat==='mp'&&lignes.length?' (somme des lignes)':''}<input class="inp" id="pm2" type="number" step="0.01" min="0" value="${f.montant_total??''}"${cat==='mp'&&lignes.length?' disabled':''}></label></div>
  <div class="foot"><button class="btn sm" type="submit">Enregistrer</button></div>
 </form>
 ${cat==='mp'?`<div class="list" style="margin-bottom:14px">${lignes.map(l=>`<div class="li"><div class="grow">${esc(l.designation||'')}<div class="meta">${l.ingredient_match?'→ '+esc(l.ingredient_match):'<span style="color:var(--amber)">non rattaché</span>'} · ${l.quantite??'?'} ${esc(l.unite||'')}${l.prix_unitaire!=null?' × '+fmtEur(l.prix_unitaire):''}</div></div><span class="num">${l.prix_total!=null?fmtEur(l.prix_total):''}</span><button class="btn sm ghost" type="button" data-del-ligne-facture="${l.id}" style="margin-left:6px">×</button></div>`).join('')||'<div class="empty">Aucune ligne — analyse la photo ou ajoute-en une ci-dessous.</div>'}</div>
 <form class="form" id="ligneForm">
  <label>Désignation<input class="inp" id="lf1" placeholder="ex. Filet de Poulet 1.5kg FR" required></label>
  <label>Ingrédient de la session (pour le rapprochement)<input class="inp" id="lf5" list="ingListe" placeholder="nom exact"></label>
  <datalist id="ingListe">${noms.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="two"><label>Quantité<input class="inp" id="lf2" type="number" step="0.001" min="0" required></label><label>Unité<select id="lf3">${opt(['kg','g','L','ml','pièce','colis'],'kg')}</select></label></div>
  <label>Prix unitaire HT (par unité ci-dessus)<input class="inp" id="lf4" type="number" step="0.01" min="0" required></label>
  <div class="foot"><button class="btn sm primary" type="submit">+ Ajouter la ligne</button></div>
 </form>`:''}
 <div class="foot" style="margin-top:14px"><button type="button" class="btn danger sm" data-del-facture="${f.id}">Supprimer la pièce</button></div>`);
 $('#pieceMeta').onsubmit=async e=>{
  e.preventDefault();
  const patch={categorie:$('#pm1').value};
  if(!$('#pm2').disabled)patch.montant_total=$('#pm2').value===''?null:+$('#pm2').value;
  await sb('factures_fournisseur?id=eq.'+factureId,{method:'PATCH',body:JSON.stringify(patch)});
  toast('Pièce enregistrée');ouvrirFactureDetail(factureId);render();
 };
 const an=$('#pieceAnalyser');
 if(an)an.onclick=async()=>{
  an.disabled=true;an.textContent='Analyse…';
  try{const blob=await (await fetch(f.fichier_url)).blob();const a=await analyserPieceIA(blob,cat,nomsSession);
   if(cat==='mp'&&lignes.length&&!confirm('Remplacer les '+lignes.length+' ligne(s) existantes par celles lues ?')){an.disabled=false;an.textContent='✦ Analyser avec l\'IA';return}
   if(cat==='mp')await sb('lignes_facture?facture_id=eq.'+factureId,{method:'DELETE'});
   await appliquerAnalysePiece(factureId,cat,a);toast('Pièce analysée');ouvrirFactureDetail(factureId);render();
  }catch(err){toast('Analyse impossible : '+(err.message||err));an.disabled=false;an.textContent='✦ Analyser avec l\'IA'}
 };
 const lf=$('#ligneForm');
 if(lf)lf.onsubmit=async e=>{
  e.preventDefault();
  const qte=+$('#lf2').value,prixU=+$('#lf4').value;
  await sb('lignes_facture',{method:'POST',body:JSON.stringify({facture_id:factureId,designation:$('#lf1').value,ingredient_match:$('#lf5').value||null,quantite:qte,unite:$('#lf3').value,prix_unitaire:prixU,prix_total:Math.round(qte*prixU*100)/100})});
  await recalculerTotauxFacture(factureId);
  ouvrirFactureDetail(factureId);render();
 };
 $('#drawer').querySelectorAll('[data-del-ligne-facture]').forEach(btn=>btn.onclick=async()=>{
  await sb('lignes_facture?id=eq.'+btn.dataset.delLigneFacture,{method:'DELETE'});
  await recalculerTotauxFacture(factureId);
  ouvrirFactureDetail(factureId);render();
 });
 const delFacture=$('[data-del-facture]');
 if(delFacture)delFacture.onclick=async()=>{
  if(!confirm('Supprimer cette pièce et ses lignes ?'))return;
  await sb('lignes_facture?facture_id=eq.'+factureId,{method:'DELETE'});
  await sb('factures_fournisseur?id=eq.'+factureId,{method:'DELETE'});
  closeAll();toast('Pièce supprimée');render();
 };
}

function wireFinanceIfPresent(){
 const root=$('#finRoot');if(!root)return;
 root.addEventListener('click',async e=>{
  const f=e.target.closest('[data-fin-filtre]');if(f){FIN_FILTRE=f.dataset.finFiltre;render();return}
  const o=e.target.closest('[data-fin-open]');if(o){const [kind,id]=o.dataset.finOpen.split(':');FIN_DETAIL={kind,id};render();return}
  if(e.target.closest('[data-fin-retour]')){FIN_DETAIL=null;render();return}
  const d=e.target.closest('[data-del-eq]');
  if(d){if(!confirm('Retirer ce poste de l’équipe ?'))return;await sb('crm_session_equipe?id=eq.'+d.dataset.delEq,{method:'DELETE'});delete FIN_EDIT.equipe[d.dataset.delEq];render();return}
  const of=e.target.closest('[data-ouvrir-facture]');if(of){ouvrirFactureDetail(of.dataset.ouvrirFacture);return}
 });
 root.addEventListener('input',e=>{if(e.target.matches('#finHeuresInput,#finNbUniteInput,.fin-facteur,.fin-eq'))recalculerFinanceLive()});
 root.addEventListener('change',e=>{
  if(e.target.matches('.fin-eq'))enregistrerChampEquipe(e.target);
  if(e.target.matches('[data-fin-rec]')){if(e.target.dataset.finRec==='ana')FIN_ANA_REC=e.target.value;else FIN_SURPLUS_REC=e.target.value;
   if(FIN_DETAIL&&FIN_DETAIL.kind==='session')recalculerFinanceLive();else render()}
 });
 const reset=$('#finReset');if(reset)reset.onclick=reinitialiserFacteursFinance;
 const valider=$('#finValider');if(valider)valider.onclick=validerFacteursFinance;
 const ajouter=$('#finAjouterPieces');if(ajouter)ajouter.onclick=()=>ouvrirAjoutPieces(FIN_SESSION);
 const ajC=$('#finAjoutCuisinier');
 if(ajC)ajC.onclick=async()=>{
  const r=await sbTry('crm_session_equipe',{method:'POST',body:JSON.stringify({session_id:FIN_SESSION,poste:'Cuisinier',nb:1})});
  if(!r.ok){toast(r.manque?'Table crm_session_equipe absente — exécuter la migration 0017':'Échec de l’ajout');return}
  render();
 };
}

/* ============ AUTH ============ */
async function connexionSupabase(email,pwd){
 const res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
 const d=await res.json().catch(()=>null);
 if(!res.ok||!d||!d.access_token)return null;
 return{access_token:d.access_token,refresh_token:d.refresh_token||'',user_id:(d.user&&d.user.id)||''};
}
window.login=async function(){
 const pwd=$('#pwdInput').value,email=$('#emailInput').value.trim();
 const errEl=$('#loginErr');errEl.textContent='';
 if(!email||!pwd){errEl.textContent='Email et mot de passe requis';return}
 const session=await connexionSupabase(email,pwd);
 if(!session){errEl.textContent='Email ou mot de passe incorrect';return}
 ecrireStaffSession(session);
 let ligne=null;
 try{ligne=(await sb('staff?user_id=eq.'+session.user_id+'&select=*&limit=1'))[0]||null}catch(e){}
 if(!ligne||!ligne.actif){ecrireStaffSession(null);errEl.textContent="Ce compte n'a pas de rôle d'équipe actif (voir natty_staff.sql).";return}
 STAFF_ROLE=ligne.role;STAFF_NOM=ligne.nom||email.split('@')[0];STAFF_DOMAINES=ligne.domaines||[];
 await demarrerApp();
};
function logout(){clearInterval(notifsTimer);ecrireStaffSession(null);STAFF_ROLE=null;$('#mainApp').classList.add('hide');$('#loginScreen').style.display='flex';$('#pwdInput').value='';$('#emailInput').value=''}
document.addEventListener('DOMContentLoaded',()=>{
 $('#loginBtn').addEventListener('click',window.login);
 $('#pwdInput').addEventListener('keydown',e=>{if(e.key==='Enter')window.login()});
 $('#logoutBtn').addEventListener('click',logout);
 if(STAFF_SESSION&&STAFF_SESSION.user_id){
  sb('staff?user_id=eq.'+STAFF_SESSION.user_id+'&select=*&limit=1').then(async r=>{
   const ligne=r&&r[0];
   if(!ligne||!ligne.actif){ecrireStaffSession(null);return}
   STAFF_ROLE=ligne.role;STAFF_NOM=ligne.nom||'Équipe';STAFF_DOMAINES=ligne.domaines||[];
   await demarrerApp();
  }).catch(()=>ecrireStaffSession(null));
 }
});
async function demarrerApp(){
 $('#loginScreen').style.display='none';
 $('#mainApp').classList.remove('hide');
 $('#meAv').textContent=ini(STAFF_NOM);
 $('#meNom').textContent=STAFF_NOM;
 $('#meRole').textContent=(ROLES[STAFF_ROLE]||{}).l||STAFF_ROLE;
 await chargerBase();
 try{const c=localStorage.getItem('natty_crm_cur');if(c&&can(c))CUR=c;else CUR='dash'}catch(e){CUR='dash'}
 renderNav();
 await render();
 demarrerSondageNotifs();
}
</script>

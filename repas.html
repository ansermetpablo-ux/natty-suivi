<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Aucun zoom : ni pincée, ni double-tap (le <meta viewport> ne suffit pas,
     iOS l'ignore). Synchrone et dans le <head>, comme theme.js. -->
<script src="/assets/zoom.js"></script>
<title>Natty · Repas</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/natty-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/style.css">
<style>
.top button{background:none;border:none;display:flex;align-items:center;justify-content:center;color:var(--icon-mut);cursor:pointer;padding:0}
body{overflow-x:hidden}

/* ══ HERO : le plat déborde au-dessus de la carte ══ */
.hero{position:relative;margin-top:88px;background:var(--metal-white);border-radius:var(--r-xl);
  box-shadow:var(--sh-metal-light);padding:96px 20px 20px;overflow:visible}
.hero-dish{position:absolute;top:-104px;left:50%;transform:translateX(-50%);
  z-index:3;line-height:1;font-size:172px;
  filter:drop-shadow(0 22px 26px rgba(16,16,18,.28));animation:floatDish 6s ease-in-out infinite}
/* Photo détourée (PNG transparent) : même débordement que l'emoji */
.hero-dish img{display:block;width:190px;height:190px;object-fit:contain}
/* Repli sans détourage : la photo est cadrée, elle ne déborde plus mais la
   mise en page reste identique. */
.hero-dish.framed img{width:170px;height:170px;object-fit:cover;border-radius:50%;
  border:5px solid var(--bg);box-shadow:0 14px 30px rgba(16,16,18,.22)}
.hero-dish.framed{filter:none}
/* L'illustration d'un plat sans photo, au même encombrement que la photo.
   ⚠️ `stroke-width` redéclaré : la boîte du SVG fait 24 unités, donc à 190 px
   le trait de plats-illu.js se peindrait en 11 px. */
.hero-dish.illu{filter:none;color:var(--ink)}
.hero-dish.illu svg{display:block;width:180px;height:180px;stroke-width:.7}
.week-dish .wi{display:block;width:54px;height:54px;color:#fff}
.week-dish .wi svg{width:100%;height:100%;stroke-width:1.2}
@keyframes floatDish{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
.leaf{position:absolute;z-index:5;font-size:32px;filter:drop-shadow(0 8px 10px rgba(16,16,18,.2));
  animation:floatLeaf 5.4s ease-in-out infinite}
.leaf.l1{top:-44px;left:-10px;transform:rotate(-24deg)}
.leaf.l2{top:56px;right:-14px;transform:rotate(18deg);animation-delay:.6s}
.leaf.l3{top:-6px;right:34px;font-size:23px;transform:rotate(-8deg);animation-delay:.3s}
@keyframes floatLeaf{0%,100%{translate:0 0}50%{translate:0 -8px}}

.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-title{font-size:23px;font-weight:900;line-height:1.14;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-time{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  color:var(--muted);white-space:nowrap;margin-top:3px}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px}
.hero-macros{display:flex;gap:8px;margin-top:14px}
.hero-macros .mp{flex:1;background:var(--card);border-radius:16px;padding:9px 0;
  text-align:center;font-weight:800;font-size:13px;box-shadow:var(--nm-in)}
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:12px}
.hero-kcal{flex-shrink:0}
.hero-kcal .k{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hero-kcal .v{font-size:21px;font-weight:900;margin-top:2px;white-space:nowrap}
.hero-act{display:flex;align-items:center;gap:8px;flex-shrink:0}
.heart-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:none;
  box-shadow:var(--nm-so),var(--nm-bright);font-size:17px;cursor:pointer;flex-shrink:0}
/* Bouton noir plein : la pastille blanche avec le « + » a été retirée (demande
   de Pablo) — elle donnait à un bouton d'action l'air d'un bouton d'ajout. */
.cta{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--on-ink);
  border:none;border-radius:26px;padding:13px 26px;font-family:inherit;font-weight:800;
  font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:4px 6px 14px rgba(20,20,22,.28)}
.cta:active{transform:scale(.97)}

/* ══ Ma semaine : carte noire métallisée ══ */
.week-panel{background:var(--metal-black);border-radius:var(--r-lg);box-shadow:var(--sh-metal);
  padding:18px 16px 16px;margin-top:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px}
.sec-head .sec-title{margin:0;color:#fff}
.sec-note{font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.45)}
.week-row{display:flex;gap:9px}
.week-card{flex:1;position:relative;background:rgba(255,255,255,0.06);border-radius:18px;
  padding:32px 5px 11px;text-align:center;overflow:visible;cursor:pointer;transition:transform .18s ease}
.week-card.on{transform:translateY(-3px)}
.week-dish{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:46px;line-height:1;
  filter:drop-shadow(0 9px 11px rgba(0,0,0,.4))}
.week-dish img{display:block;width:54px;height:54px;object-fit:cover;border-radius:50%;border:3px solid #1c1d21}
.week-name{font-size:9.5px;font-weight:800;line-height:1.25;min-height:23px;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.week-kcal{font-size:8.5px;font-weight:600;color:rgba(255,255,255,0.45);margin-top:5px}
.week-check{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;font-size:9px;display:none;align-items:center;
  justify-content:center;font-weight:800}
.week-card.on .week-check{display:flex}

/* ══ Panneaux ingrédients / préparation ══ */
.panel{background:var(--metal-white);border-radius:var(--r-lg);box-shadow:var(--sh-metal-light);padding:18px;margin-top:16px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.panel-title{font-size:15.5px;font-weight:900}
.panel-title span{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:6px}
.panel-link{font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}
.ingr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ingr{position:relative;background:var(--card);border-radius:15px;padding:12px 4px 9px;
  text-align:center;cursor:pointer;transition:opacity .18s ease;box-shadow:var(--nm-in)}
.ingr .em{font-size:25px;line-height:1}
.ingr .nm{font-size:8.5px;font-weight:700;line-height:1.2;margin-top:6px}
.ingr .qt{font-size:8px;color:var(--muted);margin-top:2px}
.ingr .tick{position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;font-size:9px;display:flex;align-items:center;
  justify-content:center;font-weight:800}
.ingr.off{opacity:.4}
.ingr.off .tick{background:#d3d3d8}
/* ══ Détails : ingrédients + préparation, replies ══ */
.det-h{width:100%;background:none;border:none;color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:18px 0 6px}
.det-c{font-size:14px;transition:transform .2s ease}
/* `display:none` plutôt qu'une hauteur animée : la préparation contient des SVG
   et des minuteurs, une transition sur `height` obligerait à mesurer un contenu
   qui bouge — pour un gain que personne ne remarque. */
.det-body{display:none}
.det-body.on{display:block;animation:detIn .24s cubic-bezier(.22,1,.36,1)}
@keyframes detIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ══ Découvrir ══ */
.discover-row{display:flex;gap:12px}
.discover-card{flex:1;background:var(--metal-white);box-shadow:var(--sh-metal-light);border-radius:var(--r-lg);
  padding:18px 10px 22px;text-align:center;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:14px}
.discover-card .em{font-size:34px}
.discover-card .t{font-weight:700;font-size:11.5px;line-height:1.25}

.toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,14px);background:var(--ink);
  color:var(--on-ink);border-radius:18px;padding:12px 20px;font-size:12.5px;font-weight:700;opacity:0;
  transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:600;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 0}

/* Croix de retrait sur une pastille du garde-manger */
.ingr .del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--bg);
  border:none;color:var(--muted);font-size:9px;line-height:1;cursor:pointer;box-shadow:var(--nm-soft);
  display:flex;align-items:center;justify-content:center;padding:0}
/* Ingrédient de recette absent du garde-manger : à acheter */
.ingr.buy .tick{background:var(--amber)}

/* Réglage du nombre de repas voulus pour la semaine. Masqué tant que la page
   n'a pas confirmé qu'elle affiche bien la semaine (et non un repas précis
   ouvert via ?id=). */
.nbbar{display:none;align-items:center;justify-content:space-between;margin:4px 0 18px}
.nbbar-lbl{font-size:14px;font-weight:600;color:var(--muted)}
.nbbar-ctl{display:flex;align-items:center;gap:6px;background:var(--card);
  border-radius:var(--r-full);padding:4px}
.nbbar-ctl button{width:32px;height:32px;border:none;border-radius:50%;
  background:var(--bg);color:var(--ink);font-size:19px;font-weight:600;line-height:1;
  cursor:pointer;box-shadow:var(--nm-soft)}
.nbbar-ctl button:active{transform:scale(.94)}
.nbbar-ctl button:disabled{opacity:.35;cursor:default;box-shadow:none}
.nbbar-ctl span{min-width:24px;text-align:center;font-size:16px;font-weight:700}
</style>
</head>
<body>

<div class="top">
  <button id="backBtn" aria-label="Retour">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a href="profil.html" aria-label="Profil">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</div>

<!-- Le réglage 1-7 a disparu : la génération hebdomadaire produit 2 recettes. Le compteur reste affiché, en lecture seule. -->
<div class="wrap">
  <div class="nbbar" id="nbbar">
    <span class="nbbar-lbl">Repas de la semaine</span>
    <div class="nbbar-ctl"><span id="nbVal">2</span></div>
  </div>
</div>

<!-- Le panneau « Mon garde-manger » a quitté cet écran (demande de Pablo) :
     il se remplit maintenant au moment qui compte, juste avant la génération
     de la semaine — question plein écran d'assets/generation.js.
     ⚠️ `assets/garde-manger.js` reste chargé : render() s'en sert pour
     marquer « à acheter » les ingrédients qu'on n'a pas. -->

<!-- « Ma semaine » — le calendrier issu de la planification. Il vit hors de
     `#content`, que render() remplace entièrement à chaque changement de
     recette : à l'intérieur, il disparaîtrait au premier tap sur une vignette.
     Et il est AU-DESSUS du repas du jour, comme demandé — on lit d'abord sa
     semaine, ensuite le plat qu'on va faire. -->
<div class="wrap" id="planWrap"></div>

<div class="wrap" id="content">
  <div class="empty">Chargement…</div>
</div>

<!-- « Mes préférences » — allergies, goûts, envies de découverte. Hors de
     `#content` pour la même raison que le calendrier : render() le remplace
     en entier à chaque changement de recette, le panneau disparaîtrait au
     premier tap sur une vignette.
     Sa place ici est voulue : il suit « Découvrir », et c'est exactement ce
     que ces réglages pilotent. -->
<div class="wrap" id="prefWrap"></div>

<!-- « Mon matériel » — ce avec quoi il peut cuisiner. Hors de `#content`
     pour la même raison que ses deux voisins : render() le remplace en
     entier à chaque changement de recette.
     ⚠️ Sa présence ici n'est pas décorative : la question n'est posée
     QU'UNE FOIS, avant la première génération. Sans ce panneau, un « je
     n'ai pas de four » répondu un jour serait un verrou à vie. -->
<div class="wrap" id="matWrap"></div>

<div class="toast" id="toast"></div>

<script src="/assets/core.js"></script>
<script src="/assets/reco.js"></script>
<!-- La génération de la semaine part sur le serveur ; ce module en montre
     l'attente et la reprend d'un écran à l'autre. Chargé AVANT garde-manger.js
     n'aurait pas suffi : il va le chercher au moment de l'envoi. -->
<script src="/assets/generation.js"></script>
<!-- Le calendrier de « Ma semaine » et, au besoin, la séquence de
     replanification (bouton « Replanifier » du panneau). -->
<!-- Le catalogue des plats et leurs illustrations : depuis que la génération
     choisit ses recettes DEDANS (api/_generation.js, règle 0), c'est lui qui
     donne sa photo à chaque plat de la semaine. Sans ces deux fichiers, le
     héros et le calendrier retombent sur les deux photos de démonstration —
     l'ancien défaut, en silence. -->
<script src="/assets/plats-illu.js"></script>
<script src="/assets/decouverte.js"></script>
<script src="/assets/planning.js"></script>
<!-- Le matériel de cuisine : la question posée une seule fois, avant la
     première génération. Chargé partout où generation.js l'est — c'est lui
     qui pose la question, depuis n'importe lequel de ces écrans. -->
<script src="/assets/materiel.js"></script>
<script src="/assets/garde-manger.js"></script>
<!-- Préférences alimentaires : ce que reco.js injecte dans le prompt de la
     génération. Modifiables ici, plutôt que figées au questionnaire. -->
<script src="/assets/preferences.js"></script>
<script src="/assets/minijeux.js"></script>
<!-- Suivre une recette retire ses ingrédients du garde-manger (voir brancher()). -->
<script src="/assets/recette.js"></script>
<script>
/* ═══ État ═══ */
var PLATS = [];        // plats affichés (recommandations, ou repas ciblé par ?id=)
var actif = 0;         // index du plat au hero
var suivies = {};      // recettes que l'utilisateur a choisi de suivre
var ingrOff = {};      // ingrédients décochés du plat courant
var SEMAINE = [];      // recettes de la semaine, telles que reco.js les rend
/* Ingrédients et préparation sont replies par défaut : le hero, les macros
   et « Démarrer » suffisent à décider. On garde le choix pendant la session
   — refermer le bloc à chaque changement de recette forcerait à le rouvrir
   à chaque comparaison. */
var detailsOuverts = false;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ⚠️ `afficherNb()` et `rendreSemaine()` étaient APPELÉES en bas de page et
   définies NULLE PART : une seule occurrence de chaque dans tout le fichier,
   celle de l'appel. La ReferenceError partait dans le `catch` du bloc de
   chargement, qui affichait « Impossible de charger les recettes » — un
   message d'erreur réseau pour un défaut de code. L'écran Repas ne montrait
   donc jamais les recettes de la semaine, quel que soit l'état du cache. */
function afficherNb(n){
  var el = document.getElementById('nbVal');
  if (el) el.textContent = n;
}

/* Le cache hebdomadaire ne se génère qu'une fois par semaine, et depuis
   `suivi.html`. Quand il est vide, cet écran n'avait rien à dire : il propose
   maintenant la génération, une seule fois, et bascule ensuite en affichage —
   c'est exactement ce que le commentaire de `recettesDeLaSemaine()` dans
   assets/reco.js demandait aux pages de faire. */
function rendreSemaine(){
  if (SEMAINE && SEMAINE.length){
    PLATS = SEMAINE.map(depuisRecette);
    actif = 0;
    render();
    return;
  }
  document.getElementById('content').innerHTML =
      '<div class="empty" style="text-align:center">'
    + '<div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;">Vos recettes de la semaine</div>'
    + '<div style="font-size:13px;margin-bottom:16px;">Elles se composent à partir de votre profil, de vos repas récents et de votre garde-manger. Une génération par semaine.</div>'
    + '<button id="btnGenSemaine" style="width:100%;padding:15px;background:var(--ink);color:var(--bg);border:none;border-radius:16px;font-family:Inter,sans-serif;font-size:15px;font-weight:700;cursor:pointer;">✨ Générer mes conseils repas</button>'
    + '<div id="genSemaineEtat" style="font-size:12px;color:var(--muted);margin-top:10px;"></div>'
    + '</div>' + blocDecouvrir();
  brancherDecouvrir();
  var b = document.getElementById('btnGenSemaine');
  if (b) b.addEventListener('click', genererSemaineMaintenant);
}

/* La génération n'a plus lieu ici. Elle part sur le serveur
   (/api/generer-conseils, via NattyGeneration) et produit d'un coup les
   conseils, les recettes et la liste de courses. Cet écran déclenche, puis
   relit le cache.

   ⚠️ Pourquoi ce n'est plus `NattyReco.genererSemaine()` : mesuré le 2026-08-04,
   son budget de jetons (1300 par recette) coupait la réponse en plein milieu du
   JSON pour deux recettes détaillées. `extraireJson` renvoyait alors null,
   `recommander()` renvoyait [], et le seul mot qui arrivait à l'utilisateur
   était « Échec — vérifiez votre connexion » : une histoire de longueur de
   réponse déguisée en panne de réseau. Il fallait 8000 jetons (vérifié :
   JSON complet, 2 recettes de 10 étapes) — et 71 s, soit au-delà de ce qu'une
   WebView laisse à une requête. D'où le serveur. */
var _genSemaineOccupe = false;
async function genererSemaineMaintenant(){
  if (_genSemaineOccupe) return;
  if (!window.NattyGeneration){ toast('Module de génération absent'); return; }
  _genSemaineOccupe = true;
  var b = document.getElementById('btnGenSemaine');
  var e = document.getElementById('genSemaineEtat');
  if (b){ b.disabled = true; b.textContent = '⏳ Composition en cours…'; }
  if (e) e.textContent = 'Environ une minute. Vous pouvez quitter cet écran.';
  try{
    var row = await NattyGeneration.lancer();
    if (!row) throw new Error('non aboutie');
    await chargerSemaineDepuisCache();
    if (!SEMAINE || !SEMAINE.length) throw new Error('vide');
    rendreSemaine();          // repasse en affichage, sans nouvel appel
    toast('Vos recettes sont prêtes');
  }catch(err){
    if (b){ b.disabled = false; b.textContent = '✨ Générer mes conseils repas'; }
    if (e) e.textContent = 'La préparation n’a pas abouti. Réessayez dans un moment.';
  }
  _genSemaineOccupe = false;
}

/* Lecture pure du cache hebdomadaire — aucun appel à l'IA, jamais. */
async function chargerSemaineDepuisCache(){
  try { SEMAINE = await NattyReco.recettesDeLaSemaine(NattyReco.NB_MAX) || []; }
  catch(e){ SEMAINE = []; }
  return SEMAINE;
}

/* Terminé pendant qu'on était ailleurs (autre écran, ou « continuer en
   arrière-plan ») : les recettes apparaissent sans que l'utilisateur ait à
   revenir sur le bouton. */
document.addEventListener('natty:conseils-prets', function(){
  // Seulement si l'écran est encore sur l'état vide (le bouton « Générer » est
  // à l'écran) : sinon on remplacerait sous les yeux de l'utilisateur le repas
  // précis qu'il est venu voir avec ?id=.
  if (!document.getElementById('btnGenSemaine')) return;
  chargerSemaineDepuisCache().then(function(){
    if (SEMAINE && SEMAINE.length) rendreSemaine();
  });
});

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

/* ═══ Normalisation ═══
   Deux origines possibles pour un plat :
   - une recette recommandée par NattyReco   {nom, pourquoi, temps_min, macros, ingredients, steps}
   - un repas réel de la table meals         {name, photo_url, meal_ingredients}
   On les ramène à une forme unique pour que le rendu n'ait qu'un seul cas. */

var EMOJIS = ['🍛','🐟','🍲','🥗','🍝','🍜'];
// Les recettes conseillées par NattyReco n'ont pas de vraie photo (pas encore
// photographiées). En attendant, on fait tourner quelques photos de plats
// réelles et détourées plutôt que de retomber sur un simple emoji.
var DEMO_PHOTOS = [
  { hero:'/assets/img/plat-demo1-hero.png', week:'/assets/img/plat-demo1-week.png' },
  { hero:'/assets/img/plat-demo2-hero.png', week:'/assets/img/plat-demo2-week.png' }
];

/* La photo d'une recette de la semaine, ou son illustration.
   ⚠️ C'ÉTAIT LE DÉFAUT SIGNALÉ PAR PABLO : `DEMO_PHOTOS[i % 2]` faisait
   tourner DEUX photos de démonstration, donc la même image revenait tous les
   deux plats — alors que 93 vraies photos dorment dans le catalogue. Depuis
   que la génération choisit ses plats DANS le catalogue (`api/_generation.js`,
   règle 0), chaque recette porte une `cle` et donc son image.
   Repli, dans l'ordre : la photo du catalogue, l'illustration au trait pour
   les plats jamais photographiés, et seulement en dernier les deux photos de
   démonstration — pour les lignes générées AVANT ce changement, qui n'ont pas
   de clé et qu'on ne va pas régénérer pour une image. */
function visuelRecette(r, i){
  var p = (r && r.cle && window.NattyDecouverte)
    ? NattyDecouverte.platParCle(r.cle) : null;
  if (p) {
    var ph = NattyDecouverte.img(p);
    if (ph) return { photo: ph, photoWeek: NattyDecouverte.vignette(p), illu: null };
    return { photo: null, photoWeek: null, illu: NattyDecouverte.illu(p, { trait: .9 }) };
  }
  return { photo: DEMO_PHOTOS[i % DEMO_PHOTOS.length].hero,
           photoWeek: DEMO_PHOTOS[i % DEMO_PHOTOS.length].week, illu: null };
}

function depuisRecette(r, i){
  var m = r.macros || {};
  var v = visuelRecette(r, i);
  return {
    cle: r.cle || null,
    nom: r.nom || 'Recette',
    desc: r.pourquoi || '',
    temps: r.temps_min ? r.temps_min + ' min' : '',
    kcal: Math.round(m.kcal || 0),
    p: Math.round(m.p || 0), g: Math.round(m.g || 0), l: Math.round(m.l || 0),
    emoji: EMOJIS[i % EMOJIS.length],
    photo: v.photo,
    photoWeek: v.photoWeek,
    illu: v.illu,
    ingr: (r.ingredients || []).map(function(x){ return { em:x.em||'🥄', nm:x.nom||'', qt:x.qte||'' }; }),
    steps: (r.steps || []).map(function(s){ return { em:s.em||'👉', t:s.t||'', tip:s.tip||'' }; }),
    // La recette d'origine, telle que NattyReco l'a produite : NattyRecette
    // en a besoin (illu/durée/température/quantités par étape) et la forme
    // aplatie ci-dessus les a perdues.
    src: r
  };
}

function depuisRepas(meal){
  var mac = Natty.calcMac(meal.meal_ingredients);
  return {
    nom: meal.name || 'Repas',
    desc: '',
    temps: '',
    kcal: mac.c || 0, p: mac.p || 0, g: mac.g || 0, l: mac.l || 0,
    emoji: '🍽️',
    photo: meal.photo_url || null,
    ingr: (meal.meal_ingredients || []).map(function(x){
      return { em:'🥄', nm:x.name||'', qt:x.quantity_g ? x.quantity_g+' g' : '' };
    }),
    steps: []
  };
}

/* ═══ Rendu ═══ */

// Une photo n'est utilisable en débordement que si elle est détourée (PNG
// transparent). Sinon on la cadre : la mise en page tient toujours.
function estDetouree(url){ return /\.png($|\?)/i.test(url || ''); }

function heroVisuel(d){
  if (d.photo){
    var framed = estDetouree(d.photo) ? '' : ' framed';
    return '<div class="hero-dish'+framed+'"><img src="'+esc(d.photo)+'" alt=""></div>';
  }
  /* Le plat existe au catalogue mais personne ne l'a photographié : son
     illustration au trait, plutôt que l'emoji. Elle passe AVANT l'emoji pour
     la même raison que dans la visionneuse — à 190 px, un emoji est une
     vignette d'application, pas une image de plat. */
  if (d.illu) return '<div class="hero-dish illu">'+d.illu+'</div>';
  return '<div class="hero-dish">'+d.emoji+'</div>';
}

function render(){
  var d = PLATS[actif];
  if (!d){
    document.getElementById('content').innerHTML =
      '<div class="empty">Aucune recette à afficher pour le moment.</div>' + blocDecouvrir();
    brancherDecouvrir();
    return;
  }

  var suivie = !!suivies[actif];
  var html = ''
    + '<div class="hero">'
      + heroVisuel(d)
      + '<span class="leaf l1">🌿</span><span class="leaf l2">🌿</span><span class="leaf l3">🌶️</span>'
      + '<div class="hero-head">'
        + '<div class="hero-title">'+esc(d.nom)+'</div>'
        + (d.temps ? '<div class="hero-time">🕐 '+esc(d.temps)+'</div>' : '')
      + '</div>'
      + (d.desc ? '<div class="hero-desc">'+esc(d.desc)+'</div>' : '')
      + '<div class="hero-macros">'
        + '<div class="mp">🥩 '+(d.p||'–')+'g</div>'
        + '<div class="mp">🌾 '+(d.g||'–')+'g</div>'
        + '<div class="mp">🥑 '+(d.l||'–')+'g</div>'
      + '</div>'
      + '<div class="hero-foot">'
        + '<div class="hero-kcal"><div class="k">Total</div><div class="v">'+(d.kcal||'–')+' Kcal</div></div>'
        + '<div class="hero-act">'
          + '<button class="heart-btn" id="heartBtn">🤍</button>'
          + (suivie ? '<button class="heart-btn" id="unfollowBtn" aria-label="Retirer la recette">✓</button>' : '')
          + '<button class="cta" id="ctaBtn">'+(suivie?'Revoir les étapes':'Démarrer')+'</button>'
        + '</div>'
      + '</div>'
    + '</div>';

  if (PLATS.length > 1){
    html += '<div class="week-panel">'
         /* « Ma semaine » nomme désormais le CALENDRIER, en haut de l'écran.
            Ce panneau-ci n'a jamais montré une semaine : il montre les
            recettes conseillées. Deux titres identiques pour deux contenus
            différents auraient fait passer l'un pour l'autre. */
         +  '<div class="sec-head"><span class="sec-title">Recettes conseillées</span>'
         +  '<span class="sec-note">'+PLATS.length+' cette semaine</span></div>'
         +  '<div class="week-row">' + PLATS.map(function(x,i){
              var weekImg = x.photoWeek || x.photo;
              var vis = weekImg ? '<img src="'+esc(weekImg)+'" alt="">'
                      : (x.illu ? '<span class="wi">'+x.illu+'</span>' : x.emoji);
              return '<div class="week-card'+(i===actif?' on':'')+'" data-i="'+i+'">'
                + '<div class="week-check">✓</div>'
                + '<div class="week-dish">'+vis+'</div>'
                + '<div class="week-name">'+esc(x.nom)+'</div>'
                + '<div class="week-kcal">'+(x.kcal||'–')+' kcal</div>'
                + '</div>';
            }).join('') + '</div>'
         +  '</div>';
  }

  // Tout ce qui suit va dans le dépliant « Détails ».
  var detail = '';
  if (d.ingr.length){
    var actifs = d.ingr.length - Object.keys(ingrOff).length;
    // Quand le garde-manger est rempli, on distingue ce qu'il faut acheter.
    // Le test est fait ici plutôt qu'en se fiant au champ "dispo" renvoyé par
    // l'IA : la liste a pu changer depuis la génération.
    var gmOn = typeof NattyGardeManger !== 'undefined' && NattyGardeManger.nbItems() > 0;
    var manque = d.ingr.map(function(x){ return gmOn && !NattyGardeManger.contient(x.nm); });
    var nbAchat = manque.filter(Boolean).length;
    detail += '<div class="panel">'
      + '<div class="panel-head"><div class="panel-title">Ingrédients <span>('+actifs+'/'+d.ingr.length
      + (nbAchat ? ' · '+nbAchat+' à acheter' : '')+')</span></div>'
      + '<div class="panel-link" id="ingrEdit">Modifier</div></div>'
      + '<div class="ingr-grid">' + d.ingr.map(function(x,i){
          return '<div class="ingr'+(ingrOff[i]?' off':'')+(manque[i]?' buy':'')+'" data-i="'+i+'">'
            + '<div class="tick">'+(manque[i]?'+':'✓')+'</div><div class="em">'+x.em+'</div>'
            + '<div class="nm">'+esc(x.nm)+'</div>'
            + (x.qt ? '<div class="qt">'+esc(x.qt)+'</div>' : '')
            + '</div>';
        }).join('') + '</div></div>';
  }

  // Préparation détaillée : rendue seulement s'il y a des étapes (un repas
  // venu de `meals` n'en a pas, la fonction renvoie alors une chaîne vide).
  if (d.src && window.NattyRecette) detail += NattyRecette.fiche(d.src, { bouton:false });

  if (detail){
    html += '<button class="det-h" id="detH" aria-expanded="' + (detailsOuverts?'true':'false') + '">'
         +   'Détails <span class="det-c">' + (detailsOuverts?'▴':'▾') + '</span>'
         + '</button>'
         + '<div class="det-body' + (detailsOuverts?' on':'') + '" id="detB">' + detail + '</div>';
  }

  html += blocDecouvrir();
  document.getElementById('content').innerHTML = html;
  brancher();
}

function blocDecouvrir(){
  return '<div class="sec-title">Découvrir</div>'
    + '<div class="discover-row">'
      + '<div class="discover-card" data-jeu="monde"><div class="t">Recettes du Monde</div><div class="em">🌍</div></div>'
      + '<div class="discover-card" data-jeu="potager"><div class="t">Ingrédients</div><div class="em">🌱</div></div>'
      + '<div class="discover-card" data-jeu="aleatoire"><div class="t">Aléatoire</div><div class="em">🎲</div></div>'
    + '</div>';
}

function brancherDecouvrir(){
  document.querySelectorAll('.discover-card').forEach(function(c){
    c.addEventListener('click', function(){ NattyMiniJeux.ouvrir(c.dataset.jeu); });
  });
}

// Une recette choisie à la fin d'un mini-jeu remonte ici : elle prend la
// tête de la liste et s'affiche dans le hero.
window.NattyOnRecetteSuivie = async function(r){
  if (!r) return;
  var d = depuisRecette(r, PLATS.length);
  PLATS.unshift(d);
  actif = 0; ingrOff = {};
  suivies = {}; suivies[0] = true;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
  // Suivie depuis un mini-jeu : même geste, donc même consommation
  // du garde-manger que par le bouton du hero.
  var retires = [];
  if (window.NattyGardeManger) {
    try {
      await NattyGardeManger.charger();
      retires = await NattyGardeManger.consommer(d.ingr);
    } catch (e) {}
  }
  toast(retires.length
    ? '✓ ' + d.nom + ' — ' + retires.length + (retires.length > 1 ? ' ingrédients retirés' : ' ingrédient retiré') + ' du garde-manger'
    : '✓ ' + d.nom + ' — recette suivie');
};

function brancher(){
  var dh = document.getElementById('detH');
  if (dh) dh.addEventListener('click', function(){
    detailsOuverts = !detailsOuverts;
    var b = document.getElementById('detB'), c = dh.querySelector('.det-c');
    if (b) b.classList.toggle('on', detailsOuverts);
    if (c) c.textContent = detailsOuverts ? '▴' : '▾';
    dh.setAttribute('aria-expanded', detailsOuverts ? 'true' : 'false');
  });

  /* « Suivre cette recette » ouvre la cinématique des étapes. C'est le geste
     qui déclenche la cuisine, donc l'écran qui doit suivre est celui qui
     guide — pas un toast. Le retrait, lui, part sur son propre bouton : il
     partageait celui-ci, et le tap aurait fini par vouloir dire deux choses. */
  var cta = document.getElementById('ctaBtn');
  if (cta) cta.addEventListener('click', async function(){
    var d = PLATS[actif];
    var dejaSuivie = !!suivies[actif];

    function guider(){
      if (!window.NattyRecette || !NattyRecette.suivre(d.src || {})) {
        // Un repas venu de `meals` n'a pas d'étapes : rien à guider.
        toast('Aucune étape détaillée pour ce plat');
      }
    }

    if (dejaSuivie) { guider(); return; }

    suivies[actif] = true;
    render();

    /* Suivre une recette consomme ses ingrédients : ils sortent du
       garde-manger, sinon les recommandations suivantes repartiraient
       d'un stock déjà cuisiné. charger() est idempotent, on ne paie la
       lecture que si l'utilisateur suit vraiment une recette.
       Le garde-manger n'est jamais bloquant : si le module manque ou
       échoue, la recette est suivie quand même. */
    var retires = [];
    if (window.NattyGardeManger) {
      try {
        await NattyGardeManger.charger();
        retires = await NattyGardeManger.consommer(d.ingr);
      } catch (e) {}
    }
    if (retires.length) {
      toast('✓ ' + retires.length + (retires.length > 1 ? ' ingrédients retirés' : ' ingrédient retiré') + ' du garde-manger');
    }
    guider();
  });

  var unfollow = document.getElementById('unfollowBtn');
  if (unfollow) unfollow.addEventListener('click', function(){
    suivies[actif] = false;
    render();
    toast('Recette retirée');
  });

  var heart = document.getElementById('heartBtn');
  if (heart) heart.addEventListener('click', function(){
    var on = this.textContent.trim() === '❤️';
    this.textContent = on ? '🤍' : '❤️';
    toast(on ? 'Retiré des favoris' : '❤️ Ajouté aux favoris');
  });

  document.querySelectorAll('.week-card').forEach(function(el){
    el.addEventListener('click', function(){
      actif = +el.dataset.i; ingrOff = {}; render();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });

  document.querySelectorAll('.ingr').forEach(function(el){
    el.addEventListener('click', function(){
      var i = +el.dataset.i;
      if (ingrOff[i]) delete ingrOff[i]; else ingrOff[i] = 1;
      render();
    });
  });

  var edit = document.getElementById('ingrEdit');
  if (edit) edit.addEventListener('click', function(){ toast('Touche un ingrédient pour le retirer'); });

  brancherDecouvrir();
}

/* ═══ Garde-manger ═══
   Le panneau a été retiré de cet écran. Scan (courses, ticket, photo), saisie
   et génération sont passés dans la question plein écran qui PRÉCÈDE la
   génération de la semaine — assets/generation.js → demanderGardeManger().
   Il n'y a donc plus deux endroits pour remplir le même stock, et la question
   arrive au seul moment où la réponse change quelque chose.
   Ce qui reste utilisé ici de NattyGardeManger : `contient()`, pour marquer
   « à acheter » les ingrédients d'une recette (voir render()). */


/* ═══ « Ma semaine » ═══
   Le calendrier de la planification, au-dessus du repas du jour.

   Taper une case pleine ouvre le repas qui y est placé. Deux cas, et un seul
   comportement juste pour chacun : une RECETTE de la semaine est déjà dans
   `PLATS`, on la remonte donc au hero (c'est l'écran qui sait la cuisiner) ;
   un plat MACRO n'existe nulle part ailleurs — il est né de la planification —
   donc c'est la fiche du module qui le montre. Renvoyer les deux vers le hero
   aurait affiché une recette au hasard à la place du plat demandé. */
async function monterMaSemaine(){
  var el = document.getElementById('planWrap');
  if (!el || !window.NattyPlanning) return;
  await NattyPlanning.monterFiche(el, function(repas){
    if (repas.type === 'recette'){
      var i = -1;
      PLATS.forEach(function(p, k){ if (i < 0 && p.nom === repas.nom) i = k; });
      if (i >= 0){
        actif = i; ingrOff = {}; render();
        window.scrollTo({ top:0, behavior:'smooth' });
        return;
      }
    }
    NattyPlanning.detail(repas);
  });
}

/* La séquence vient de se terminer sur un autre écran, ou ici même via
   « Replanifier » : le calendrier se repeint sans recharger la page. */
document.addEventListener('natty:planning-pret', function(){ monterMaSemaine(); });

(async function(){
  if (!Natty.requireAuth()) return;

  // Chargé pour une seule chose désormais : marquer les ingrédients « à
  // acheter » dans les recettes affichées.
  await NattyGardeManger.charger();

  // Sans `await` : le calendrier fait sa propre lecture, et les recettes ne
  // doivent pas attendre après elle pour s'afficher.
  monterMaSemaine();

  /* Idem pour les préférences : leur lecture est indépendante, et le panneau
     vit en bas de l'écran — le faire attendre retarderait le hero pour un
     contenu qu'on ne voit qu'après avoir défilé. Monté AVANT le `try` qui
     suit : celui-ci rend la main plus haut quand la page est ouverte sur un
     repas précis (?id=), et le panneau ne serait alors jamais peint. */
  if (window.NattyPreferences) NattyPreferences.monter(document.getElementById('prefWrap'));
  if (window.NattyMateriel) NattyMateriel.monter(document.getElementById('matWrap'));

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');

  try{
    // ?id= : on affiche ce repas précis (comportement historique conservé).
    if (id){
      var raw = await Natty.sbFetch('meals?id=eq.'+id+'&select=*');
      if (raw && raw.length){
        var meal = raw[0];
        meal.meal_ingredients = await Natty.sbFetch('meal_ingredients?meal_id=eq.'+meal.id+'&select=*');
        PLATS = [depuisRepas(meal)];
        render();
        return;
      }
    }

    await NattyReco.chargerNbRepas();   // préférence partagée entre appareils
    var barre = document.getElementById('nbbar');
    if (barre) barre.style.display = 'flex';
    afficherNb(NattyReco.nbRepas());

    await chargerSemaineDepuisCache();
    rendreSemaine();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">Impossible de charger les recettes.</div>';
  }
})();
</script>
<!-- Les créneaux de repas (combien, lequel maintenant, ce qui y est déjà
     noté) : `assets/ajout.js` en a besoin pour dire ce qu'il RESTE sur le
     repas en cours, et non « la journée divisée par le nombre de repas ». -->
<script src="/assets/creneaux.js"></script>
<!-- Unites de saisie (g / ml / piece) : lu par ajout.js. -->
<script src="/assets/unites.js"></script>
<script src="/assets/ajout.js"></script>
<!-- Le guide « Ma journée ». Le module choisit lui-même sa version : longue si
     c'est la première ouverture de la JOURNÉE — ce qui peut très bien arriver
     ici — courte si le jour a déjà été salué et qu'un nouveau créneau commence.
     C'est aussi l'écran des recettes, donc celui où « Suivre la recette » mène. -->
<script src="/assets/journee.js"></script>
<script>
  if (window.NattyJournee) NattyJournee.proposerSiNecessaire();
</script>
<script src="/assets/bilan.js"></script>
<script>
  /* Le bilan du soir, et celui de la semaine le samedi. Il attend plus
     longtemps que le guide du jour (9 s contre 6,5) : quand les deux sont dus,
     c'est le guide qui doit s'ouvrir, et le bilan renonce en le voyant. */
  if (window.NattyBilan) NattyBilan.proposerSiNecessaire();
</script>
<script src="/assets/notifs.js"></script>
<script src="/assets/push.js"></script>
<script src="/assets/nav.js"></script>
</body>

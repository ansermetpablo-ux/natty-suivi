<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Aucun zoom : ni pincée, ni double-tap (le <meta viewport> ne suffit pas,
     iOS l'ignore). Synchrone et dans le <head>, comme theme.js. -->
<script src="/assets/zoom.js"></script>
<title>Natty · Repas</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/natty-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/assets/theme.js"></script>
<!-- L'écran « on prépare la cuisine », qui couvre le trajet entre le guide du
     jour et la première étape de la recette. Chargé DANS le <head> et en
     synchrone, comme theme.js : il doit pouvoir se peindre AVANT que la page ne
     compose ses recettes, son calendrier et ses panneaux — c'est tout son
     intérêt. -->
<script src="/assets/prechauffe.js"></script>
<link rel="stylesheet" href="/assets/style.css">
<style>
.top button{background:none;border:none;display:flex;align-items:center;justify-content:center;color:var(--icon-mut);cursor:pointer;padding:0}
body{overflow-x:hidden}

/* ══ HERO : le plat déborde au-dessus de la carte ══ */
.hero{position:relative;margin-top:88px;background:var(--metal-white);border-radius:var(--r-xl);
  box-shadow:var(--sh-metal-light);padding:96px 20px 20px;overflow:visible}
.hero-dish{position:absolute;top:-104px;left:50%;transform:translateX(-50%);
  z-index:3;line-height:1;font-size:172px;
  filter:drop-shadow(0 22px 26px rgba(16,16,18,.28));animation:floatDish 6s ease-in-out infinite}
/* Photo détourée (PNG transparent) : même débordement que l'emoji */
.hero-dish img{display:block;width:190px;height:190px;object-fit:contain}
/* Repli sans détourage : la photo est cadrée, elle ne déborde plus mais la
   mise en page reste identique. */
.hero-dish.framed img{width:170px;height:170px;object-fit:cover;border-radius:50%;
  border:5px solid var(--bg);box-shadow:0 14px 30px rgba(16,16,18,.22)}
.hero-dish.framed{filter:none}
/* L'illustration d'un plat sans photo, au même encombrement que la photo.
   ⚠️ `stroke-width` redéclaré : la boîte du SVG fait 24 unités, donc à 190 px
   le trait de plats-illu.js se peindrait en 11 px. */
.hero-dish.illu{filter:none;color:var(--ink)}
.hero-dish.illu svg{display:block;width:180px;height:180px;stroke-width:.7}
.week-dish .wi{display:block;width:54px;height:54px;color:#fff}
.week-dish .wi svg{width:100%;height:100%;stroke-width:1.2}
@keyframes floatDish{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
.leaf{position:absolute;z-index:5;font-size:32px;filter:drop-shadow(0 8px 10px rgba(16,16,18,.2));
  animation:floatLeaf 5.4s ease-in-out infinite}
.leaf.l1{top:-44px;left:-10px;transform:rotate(-24deg)}
.leaf.l2{top:56px;right:-14px;transform:rotate(18deg);animation-delay:.6s}
.leaf.l3{top:-6px;right:34px;font-size:23px;transform:rotate(-8deg);animation-delay:.3s}
@keyframes floatLeaf{0%,100%{translate:0 0}50%{translate:0 -8px}}

/* Pastille « quand ». Elle explique POURQUOI c'est ce plat-là qui est en
   héros : sans elle, un dîner de jeudi affiché un lundi matin ressemble à un
   tirage au hasard. Verte quand c'est le repas du créneau courant, sourde
   quand c'est le prochain à venir — deux situations, deux lectures. */
.hero-when{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.hero-when span{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
  letter-spacing:.35px;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-full);
  background:var(--card);color:var(--muted);box-shadow:var(--nm-in)}
.hero-when span.now{background:var(--green);color:#fff;box-shadow:none}
.hero-when span.done{background:var(--green);color:#fff;box-shadow:none}
.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-title{font-size:23px;font-weight:900;line-height:1.14;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-time{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  color:var(--muted);white-space:nowrap;margin-top:3px}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px}
.hero-macros{display:flex;gap:8px;margin-top:14px}
.hero-macros .mp{flex:1;background:var(--card);border-radius:16px;padding:9px 0;
  text-align:center;font-weight:800;font-size:13px;box-shadow:var(--nm-in)}
/* ⚠️ `flex-wrap` OBLIGATOIRE, et ce n'était pas un luxe : mesuré à 375 px, la
   ligne « 430 Kcal + ♡ + ✓ + bouton » débordait la fenêtre de 45 px dès que le
   bouton disait « Revoir les étapes » — la page partait alors en défilement
   HORIZONTAL. Le défaut préexistait ; les libellés qui disent où l'on en est
   (« Reprendre · étape 3/4 », 202 px) le rendaient systématique. Les deux
   parties ne peuvent pas rétrécir — un nombre de calories tronqué ou un bouton
   coupé seraient pires —, donc c'est la LIGNE qui cède : le bouton passe
   dessous, calé à droite par sa marge automatique. */
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;
  gap:12px;flex-wrap:wrap}
.hero-kcal{flex-shrink:0}
.hero-act{margin-left:auto}
.hero-kcal .k{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hero-kcal .v{font-size:21px;font-weight:900;margin-top:2px;white-space:nowrap}
.hero-act{display:flex;align-items:center;gap:8px;flex-shrink:0}
.heart-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:none;
  box-shadow:var(--nm-so),var(--nm-bright);font-size:17px;cursor:pointer;flex-shrink:0}
/* Bouton noir plein : la pastille blanche avec le « + » a été retirée (demande
   de Pablo) — elle donnait à un bouton d'action l'air d'un bouton d'ajout. */
.cta{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--on-ink);
  border:none;border-radius:26px;padding:13px 26px;font-family:inherit;font-weight:800;
  font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:4px 6px 14px rgba(20,20,22,.28)}
.cta:active{transform:scale(.97)}

/* ══ Le héros se fait défiler au doigt ══
   Entrée par la gauche ou par la droite selon le sens du geste : sans elle, le
   plat suivant apparaît d'un coup et on ne sait pas de quel côté on est allé. */
@keyframes heroInD{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes heroInG{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
/* ⚠️ RIEN NE DOIT DÉPENDRE DE CETTE ANIMATION POUR SON ÉTAT FINAL. Sur une
   page qui ne peint pas (app en arrière-plan, onglet caché), l'animation est
   bien « running » mais son horloge reste à 0 : mesuré au banc, le héros tient
   alors sa première image — opacité 0, décalé de 28 px, et 28 px de débordement
   horizontal. Le forcer à `finish()` rend `transform:none`, `opacity:1`,
   `scrollWidth:375`. C'est donc l'état NATUREL qui doit être le bon, et
   l'animation ne fait que le rejoindre — d'où l'absence de `fill-mode`, et
   d'où le fait qu'aucune donnée ne se lit ici (piège §7, même famille que le
   compteur d'XP d'assets/recette.js). */
.hero.inD{animation:heroInD .28s cubic-bezier(.22,1,.36,1)}
.hero.inG{animation:heroInG .28s cubic-bezier(.22,1,.36,1)}
.hero.sort{opacity:.3;transition:opacity .13s ease,transform .13s ease}
@media (prefers-reduced-motion:reduce){
  .hero.inD,.hero.inG{animation:none}
  .hero.sort{transition:none;opacity:1;transform:none!important}
}

/* Les points. Ils sont l'affordance du geste : un carrousel sans repère de
   position ne se devine pas. La zone tactile fait 22 px de haut, le point 6 —
   viser un point de 6 px au doigt est une promesse qu'on ne tient pas. */
.hero-dots{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:14px}
.hero-dots b{display:flex;align-items:center;justify-content:center;width:20px;height:22px;cursor:pointer}
.hero-dots b::before{content:'';width:6px;height:6px;border-radius:var(--r-full);
  background:var(--muted);opacity:.32;transition:width .22s ease,opacity .22s ease,background .22s ease}
.hero-dots b.on::before{width:18px;opacity:1;background:var(--ink)}
.hero-hint{text-align:center;font-size:11px;font-weight:700;color:var(--muted);margin-top:6px}

/* ══ Ma semaine : carte noire métallisée ══ */
.week-panel{background:var(--metal-black);border-radius:var(--r-lg);box-shadow:var(--sh-metal);
  padding:18px 16px 16px;margin-top:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px}
.sec-head .sec-title{margin:0;color:#fff}
.sec-note{font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.45)}
.week-row{display:flex;gap:9px}
.week-card{flex:1;position:relative;background:rgba(255,255,255,0.06);border-radius:18px;
  padding:32px 5px 11px;text-align:center;overflow:visible;cursor:pointer;transition:transform .18s ease}
.week-card.on{transform:translateY(-3px)}
.week-dish{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:46px;line-height:1;
  filter:drop-shadow(0 9px 11px rgba(0,0,0,.4))}
.week-dish img{display:block;width:54px;height:54px;object-fit:cover;border-radius:50%;border:3px solid #1c1d21}
.week-name{font-size:9.5px;font-weight:800;line-height:1.25;min-height:23px;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.week-kcal{font-size:8.5px;font-weight:600;color:rgba(255,255,255,0.45);margin-top:5px}
.week-check{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;font-size:9px;display:none;align-items:center;
  justify-content:center;font-weight:800}
/* ⚠️ La coche disait « carte sélectionnée » (`.on`), ce qui n'apprenait rien —
   la carte active se voit déjà, elle est soulevée. Elle dit maintenant
   « recette cuisinée et validée », la seule chose qu'on ne peut pas deviner. */
.week-card.faite .week-check{display:flex}
.week-card.faite{box-shadow:inset 0 0 0 1.5px var(--green)}

/* ══ Panneaux ingrédients / préparation ══ */
.panel{background:var(--metal-white);border-radius:var(--r-lg);box-shadow:var(--sh-metal-light);padding:18px;margin-top:16px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.panel-title{font-size:15.5px;font-weight:900}
.panel-title span{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:6px}
.panel-link{font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}
.ingr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ingr{position:relative;background:var(--card);border-radius:15px;padding:12px 4px 9px;
  text-align:center;cursor:pointer;transition:opacity .18s ease;box-shadow:var(--nm-in)}
.ingr .em{font-size:25px;line-height:1}
.ingr .nm{font-size:8.5px;font-weight:700;line-height:1.2;margin-top:6px}
.ingr .qt{font-size:8px;color:var(--muted);margin-top:2px}
.ingr .tick{position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;font-size:9px;display:flex;align-items:center;
  justify-content:center;font-weight:800}
.ingr.off{opacity:.4}
.ingr.off .tick{background:#d3d3d8}
/* ══ Détails : ingrédients + préparation, replies ══ */
.det-h{width:100%;background:none;border:none;color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:18px 0 6px}
.det-c{font-size:14px;transition:transform .2s ease}
/* `display:none` plutôt qu'une hauteur animée : la préparation contient des SVG
   et des minuteurs, une transition sur `height` obligerait à mesurer un contenu
   qui bouge — pour un gain que personne ne remarque. */
.det-body{display:none}
.det-body.on{display:block;animation:detIn .24s cubic-bezier(.22,1,.36,1)}
@keyframes detIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ══ Découvrir ══
   Plus une ligne de style ici : les trois rangées viennent d'
   `assets/decouverte.js` (`NattyDecouverte.monter`), qui porte son propre
   habillage. C'est le MÊME « Découvrir » que le fil social, et c'est la
   demande — l'ancienne version (trois cartes vers les mini-jeux) n'avait de
   commun avec lui que le titre. */

.toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,14px);background:var(--ink);
  color:var(--on-ink);border-radius:18px;padding:12px 20px;font-size:12.5px;font-weight:700;opacity:0;
  transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:600;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 0}

/* Croix de retrait sur une pastille du garde-manger */
.ingr .del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--bg);
  border:none;color:var(--muted);font-size:9px;line-height:1;cursor:pointer;box-shadow:var(--nm-soft);
  display:flex;align-items:center;justify-content:center;padding:0}
/* Ingrédient de recette absent du garde-manger : à acheter */
.ingr.buy .tick{background:var(--amber)}

/* Réglage du nombre de repas voulus pour la semaine. Masqué tant que la page
   n'a pas confirmé qu'elle affiche bien la semaine (et non un repas précis
   ouvert via ?id=). */
.nbbar{display:none;align-items:center;justify-content:space-between;margin:4px 0 18px}
.nbbar-lbl{font-size:14px;font-weight:600;color:var(--muted)}
.nbbar-ctl{display:flex;align-items:center;gap:6px;background:var(--card);
  border-radius:var(--r-full);padding:4px}
.nbbar-ctl button{width:32px;height:32px;border:none;border-radius:50%;
  background:var(--bg);color:var(--ink);font-size:19px;font-weight:600;line-height:1;
  cursor:pointer;box-shadow:var(--nm-soft)}
.nbbar-ctl button:active{transform:scale(.94)}
.nbbar-ctl button:disabled{opacity:.35;cursor:default;box-shadow:none}
.nbbar-ctl span{min-width:24px;text-align:center;font-size:16px;font-weight:700}
</style>
</head>
<body>

<script>
/* ⚠️ EN TÊTE DE <body>, ET C'EST LE POINT. On vient de « Suivre la recette » :
   l'écran de pré-chauffage doit se peindre AVANT la première ligne de l'écran
   Repas, sinon on voit le hero, le calendrier et les panneaux se composer une
   seconde avant que la préparation ne s'ouvre par-dessus — les trois images
   sans rapport que Pablo a décrites. Lancé ici, il n'y a rien à voir entre le
   guide et l'étape 1. `preparerSiDemande()` le referme. */
(function () {
  try {
    var p = new URLSearchParams(window.location.search);
    if (p.get('preparer') === '1' && window.NattyPrechauffe) {
      NattyPrechauffe.ouvrir({ sous: p.get('plat') || 'On prépare la cuisine…' });
    }
  } catch (e) {}
})();
</script>

<div class="top">
  <button id="backBtn" aria-label="Retour">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a href="profil.html" aria-label="Profil">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</div>

<!-- Le réglage 1-7 a disparu : la génération hebdomadaire produit 2 recettes. Le compteur reste affiché, en lecture seule. -->
<div class="wrap">
  <div class="nbbar" id="nbbar">
    <span class="nbbar-lbl">Repas de la semaine</span>
    <div class="nbbar-ctl"><span id="nbVal">2</span></div>
  </div>
</div>

<!-- Le panneau « Mon garde-manger » a quitté cet écran (demande de Pablo) :
     il se remplit maintenant au moment qui compte, juste avant la génération
     de la semaine — question plein écran d'assets/generation.js.
     ⚠️ `assets/garde-manger.js` reste chargé : render() s'en sert pour
     marquer « à acheter » les ingrédients qu'on n'a pas. -->

<!-- « Ma semaine » — le calendrier issu de la planification. Il vit hors de
     `#content`, que render() remplace entièrement à chaque changement de
     recette : à l'intérieur, il disparaîtrait au premier tap sur une vignette.
     Et il est AU-DESSUS du repas du jour, comme demandé — on lit d'abord sa
     semaine, ensuite le plat qu'on va faire. -->
<div class="wrap" id="planWrap"></div>

<div class="wrap" id="content">
  <div class="empty">Chargement…</div>
</div>

<!-- « Découvrir » — les plats du monde du catalogue, en trois rangées : les
     cuisines, les envies, la sélection du jour. Hors de `#content` pour la
     même raison que ses voisins : render() le remplace en entier à chaque
     changement de recette, et les rangées disparaîtraient au premier tap sur
     une vignette.
     ⚠️ Le rendu appartient au module, pas à cette page — voir l'encadré de
     `assets/decouverte.js`. Deux copies du même contenu, c'est deux qui
     divergent. -->
<div class="wrap" id="decouvWrap"></div>

<!-- « Mes préférences » — allergies, goûts, envies de découverte. Hors de
     `#content` pour la même raison que le calendrier : render() le remplace
     en entier à chaque changement de recette, le panneau disparaîtrait au
     premier tap sur une vignette.
     Sa place ici est voulue : il suit « Découvrir », et c'est exactement ce
     que ces réglages pilotent. -->
<div class="wrap" id="prefWrap"></div>

<!-- « Mon matériel » — ce avec quoi il peut cuisiner. Hors de `#content`
     pour la même raison que ses deux voisins : render() le remplace en
     entier à chaque changement de recette.
     ⚠️ Sa présence ici n'est pas décorative : la question n'est posée
     QU'UNE FOIS, avant la première génération. Sans ce panneau, un « je
     n'ai pas de four » répondu un jour serait un verrou à vie. -->
<div class="wrap" id="matWrap"></div>

<div class="toast" id="toast"></div>

<script src="/assets/core.js"></script>
<script src="/assets/reco.js"></script>
<!-- La génération de la semaine part sur le serveur ; ce module en montre
     l'attente et la reprend d'un écran à l'autre. Chargé AVANT garde-manger.js
     n'aurait pas suffi : il va le chercher au moment de l'envoi. -->
<script src="/assets/generation.js"></script>
<!-- Le calendrier de « Ma semaine » et, au besoin, la séquence de
     replanification (bouton « Replanifier » du panneau). -->
<!-- Le catalogue des plats et leurs illustrations : depuis que la génération
     choisit ses recettes DEDANS (api/_generation.js, règle 0), c'est lui qui
     donne sa photo à chaque plat de la semaine. Sans ces deux fichiers, le
     héros et le calendrier retombent sur les deux photos de démonstration —
     l'ancien défaut, en silence. -->
<script src="/assets/plats-illu.js"></script>
<script src="/assets/decouverte.js"></script>
<script src="/assets/planning.js"></script>
<!-- Le matériel de cuisine : la question posée une seule fois, avant la
     première génération. Chargé partout où generation.js l'est — c'est lui
     qui pose la question, depuis n'importe lequel de ces écrans. -->
<script src="/assets/materiel.js"></script>
<script src="/assets/garde-manger.js"></script>
<!-- Préférences alimentaires : ce que reco.js injecte dans le prompt de la
     génération. Modifiables ici, plutôt que figées au questionnaire. -->
<script src="/assets/preferences.js"></script>
<!-- `assets/minijeux.js` n'est PLUS chargé : ses trois cartes (Monde,
     Ingrédients, Aléatoire) étaient l'ancien « Découvrir » de cet écran, que
     les rangées du catalogue remplacent. Le fichier reste au dépôt et le point
     d'entrée `window.NattyOnRecetteSuivie` aussi : le relier de nouveau ne
     tient qu'à cette ligne. -->
<!-- Suivre une recette retire ses ingrédients du garde-manger (voir brancher()). -->
<script src="/assets/recette.js"></script>
<script>
/* ═══ État ═══ */
var PLATS = [];        // plats affichés (recommandations, ou repas ciblé par ?id=)
var actif = 0;         // index du plat au hero
var suivies = {};      // recettes que l'utilisateur a choisi de suivre
var ingrOff = {};      // ingrédients décochés du plat courant
var SEMAINE = [];      // recettes de la semaine, telles que reco.js les rend
/* Le repas que la planification prévoit MAINTENANT, et sa place dans PLATS.
   C'est lui le héros — pas la première recette de la liste. `idxMoment` sert à
   n'afficher la pastille « quand » que sur ce plat-là : on peut taper une autre
   carte, et il ne faut pas qu'elle hérite du créneau d'un plat qu'on a quitté. */
var MOMENT = null, idxMoment = -1;
/* Le plan de la semaine, gardé sous la main : c'est lui qui dit quelle case du
   calendrier correspond au plat affiché. `SEL_SEMAINE` est cette case. */
var PLAN = null, SEL_SEMAINE = null;
/* Ingrédients et préparation sont replies par défaut : le hero, les macros
   et « Démarrer » suffisent à décider. On garde le choix pendant la session
   — refermer le bloc à chaque changement de recette forcerait à le rouvrir
   à chaque comparaison. */
var detailsOuverts = false;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ⚠️ `afficherNb()` et `rendreSemaine()` étaient APPELÉES en bas de page et
   définies NULLE PART : une seule occurrence de chaque dans tout le fichier,
   celle de l'appel. La ReferenceError partait dans le `catch` du bloc de
   chargement, qui affichait « Impossible de charger les recettes » — un
   message d'erreur réseau pour un défaut de code. L'écran Repas ne montrait
   donc jamais les recettes de la semaine, quel que soit l'état du cache. */
function afficherNb(n){
  var el = document.getElementById('nbVal');
  if (el) el.textContent = n;
}

/* Le cache hebdomadaire ne se génère qu'une fois par semaine, et depuis
   `suivi.html`. Quand il est vide, cet écran n'avait rien à dire : il propose
   maintenant la génération, une seule fois, et bascule ensuite en affichage —
   c'est exactement ce que le commentaire de `recettesDeLaSemaine()` dans
   assets/reco.js demandait aux pages de faire. */
/* ⚠️ `?plat=<nom>` — ARRIVER SUR LE PLAT QU'ON EST VENU PRÉPARER.
   Le guide du jour propose « Suivre la recette » sur le repas prévu à ce
   créneau, puis appelait `repas.html` tout court : on atterrissait donc sur
   PLATS[0], la première recette de la semaine, qui n'a aucune raison d'être
   celle du dîner. Le bouton menait quelque part, mais pas là où il disait.
   Le rapprochement se fait par NOM, comme le tap sur une case du calendrier
   (`monterMaSemaine`) — un seul critère pour un seul geste.
   ⚠️ Rend -1, et non 0, quand il n'y a rien à demander : `0` est un index
   valide, donc le confondre avec « aucune demande » rendait `?plat=` inopérant
   sur la première recette — et empêchait le repas du moment de prendre la main
   quand le nom demandé est introuvable. */
function indexDemande(){
  var n = new URLSearchParams(window.location.search).get('plat');
  if (!n) return -1;
  n = n.trim().toLowerCase();
  for (var i = 0; i < PLATS.length; i++){
    if ((PLATS[i].nom || '').trim().toLowerCase() === n) return i;
  }
  return -1;
}

async function rendreSemaine(){
  if (SEMAINE && SEMAINE.length){
    PLATS = SEMAINE.map(depuisRecette);
    /* Deux façons de choisir ce qu'on regarde, et l'ordre compte. `choisirHero()`
       passe TOUJOURS en premier — c'est lui qui arme la pastille « quand » et qui
       fait entrer un plat macro dans PLATS —, mais une demande EXPLICITE
       l'emporte : quelqu'un qui a tapé « Suivre la recette » sur son dîner ne
       doit pas atterrir sur le déjeuner parce qu'il est midi.
       Le paramètre n'est PAS retiré de l'URL, contrairement au `?repas=` de
       `suivi.html` : celui-là rouvrait un éditeur à chaque passage, celui-ci ne
       fait que choisir ce qu'on regarde. Le nettoyer ferait revenir la page sur
       un autre plat au moindre rechargement. */
    var moment = await choisirHero();
    var demande = indexDemande();
    /* ⚠️ `poserActif` et non `actif = …; render();` : c'est lui qui pose
       l'anneau sur la case du calendrier. Sans ça, le repas du moment était
       bien en héros mais SA case n'était pas marquée — l'anneau n'apparaissait
       qu'au premier tap, donc jamais au bon moment. `monterMaSemaine()` tourne
       en parallèle, sans await : `selectionner()` retient la sélection même
       avant que le calendrier soit monté, et `fiche()` l'applique en arrivant. */
    poserActif(demande >= 0 ? demande : moment);
    return;
  }
  document.getElementById('content').innerHTML =
      '<div class="empty" style="text-align:center">'
    + '<div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;">Vos recettes de la semaine</div>'
    + '<div style="font-size:13px;margin-bottom:16px;">Elles se composent à partir de votre profil, de vos repas récents et de votre garde-manger. Une génération par semaine.</div>'
    + '<button id="btnGenSemaine" style="width:100%;padding:15px;background:var(--ink);color:var(--bg);border:none;border-radius:16px;font-family:Inter,sans-serif;font-size:15px;font-weight:700;cursor:pointer;">✨ Générer mes conseils repas</button>'
    + '<div id="genSemaineEtat" style="font-size:12px;color:var(--muted);margin-top:10px;"></div>'
    + '</div>';
  var b = document.getElementById('btnGenSemaine');
  if (b) b.addEventListener('click', genererSemaineMaintenant);
}

/* La génération n'a plus lieu ici. Elle part sur le serveur
   (/api/generer-conseils, via NattyGeneration) et produit d'un coup les
   conseils, les recettes et la liste de courses. Cet écran déclenche, puis
   relit le cache.

   ⚠️ Pourquoi ce n'est plus `NattyReco.genererSemaine()` : mesuré le 2026-08-04,
   son budget de jetons (1300 par recette) coupait la réponse en plein milieu du
   JSON pour deux recettes détaillées. `extraireJson` renvoyait alors null,
   `recommander()` renvoyait [], et le seul mot qui arrivait à l'utilisateur
   était « Échec — vérifiez votre connexion » : une histoire de longueur de
   réponse déguisée en panne de réseau. Il fallait 8000 jetons (vérifié :
   JSON complet, 2 recettes de 10 étapes) — et 71 s, soit au-delà de ce qu'une
   WebView laisse à une requête. D'où le serveur. */
var _genSemaineOccupe = false;
async function genererSemaineMaintenant(){
  if (_genSemaineOccupe) return;
  if (!window.NattyGeneration){ toast('Module de génération absent'); return; }
  _genSemaineOccupe = true;
  var b = document.getElementById('btnGenSemaine');
  var e = document.getElementById('genSemaineEtat');
  if (b){ b.disabled = true; b.textContent = '⏳ Composition en cours…'; }
  if (e) e.textContent = 'Environ une minute. Vous pouvez quitter cet écran.';
  try{
    var row = await NattyGeneration.lancer();
    if (!row) throw new Error('non aboutie');
    await chargerSemaineDepuisCache();
    if (!SEMAINE || !SEMAINE.length) throw new Error('vide');
    await rendreSemaine();    // repasse en affichage, sans nouvel appel
    toast('Vos recettes sont prêtes');
  }catch(err){
    if (b){ b.disabled = false; b.textContent = '✨ Générer mes conseils repas'; }
    if (e) e.textContent = 'La préparation n’a pas abouti. Réessayez dans un moment.';
  }
  _genSemaineOccupe = false;
}

/* Lecture pure du cache hebdomadaire — aucun appel à l'IA, jamais. */
async function chargerSemaineDepuisCache(){
  try { SEMAINE = filtrerAvecPhoto(await NattyReco.recettesDeLaSemaine(NattyReco.NB_MAX)); }
  catch(e){ SEMAINE = []; }
  return SEMAINE;
}

/* Terminé pendant qu'on était ailleurs (autre écran, ou « continuer en
   arrière-plan ») : les recettes apparaissent sans que l'utilisateur ait à
   revenir sur le bouton. */
document.addEventListener('natty:conseils-prets', function(){
  // Seulement si l'écran est encore sur l'état vide (le bouton « Générer » est
  // à l'écran) : sinon on remplacerait sous les yeux de l'utilisateur le repas
  // précis qu'il est venu voir avec ?id=.
  if (!document.getElementById('btnGenSemaine')) return;
  chargerSemaineDepuisCache().then(function(){
    if (SEMAINE && SEMAINE.length) rendreSemaine();
  });
});

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

/* ═══ Normalisation ═══
   Deux origines possibles pour un plat :
   - une recette recommandée par NattyReco   {nom, pourquoi, temps_min, macros, ingredients, steps}
   - un repas réel de la table meals         {name, photo_url, meal_ingredients}
   On les ramène à une forme unique pour que le rendu n'ait qu'un seul cas. */

var EMOJIS = ['🍛','🐟','🍲','🥗','🍝','🍜'];

/* ⚠️ LES DEUX PHOTOS DE DÉMONSTRATION ONT DISPARU D'ICI (2026-08-31, demande de
   Pablo : « pour toute l'application supprimer absolument les repas qui n'ont
   pas d'image »). `DEMO_PHOTOS[i % 2]` les faisait tourner sur les recettes
   sans clé : la même image revenait tous les deux plats, et surtout c'était
   l'assiette d'un AUTRE plat que celui annoncé. Un écran qui a l'air complet en
   montrant autre chose que ce qu'il nomme est pire qu'un écran qui manque.

   La photo d'une recette a donc exactement deux sources, et plus aucun repli :
   celle du catalogue quand la recette porte une `cle` (c'est le cas depuis que
   la génération y choisit ses plats — `api/_generation.js`, règle 0), et celle
   que la recette porte en propre. Sinon `null`, et `filtrerAvecPhoto()` ci-
   dessous l'écarte de la liste. */
function visuelRecette(r, i){
  var p = (r && r.cle && window.NattyDecouverte)
    ? NattyDecouverte.platParCle(r.cle) : null;
  if (p) {
    var ph = NattyDecouverte.img(p);
    if (ph) return { photo: ph, photoWeek: NattyDecouverte.vignette(p), illu: null };
    /* Le plat existe au catalogue mais n'a jamais été photographié (les 20
       plats du quotidien). Son illustration au trait est rendue pour les
       appelants qui savent s'en servir, mais elle ne vaut PAS une photo : la
       recette n'entrera pas dans la liste. */
    return { photo: null, photoWeek: null, illu: NattyDecouverte.illu(p, { trait: .9 }) };
  }
  /* La recette porte SA photo — un plat hors catalogue mais photographié, comme
     le tzatziki de courgettes ajouté à la main en août 2026. */
  if (r && r.photo) return { photo: r.photo, photoWeek: r.photoWeek || r.photo, illu: null };
  return { photo: null, photoWeek: null, illu: null };
}

/* ⚠️ LE FILTRE EST APPLIQUÉ À `SEMAINE`, PAS AU RENDU. Masquer une carte à
   l'affichage laisserait les index de `PLATS` décalés de ceux du carrousel, et
   c'est `data-i` qui les relie — le héros aurait fini par montrer le voisin du
   plat tapé. On écarte donc en amont, une fois, et tout ce qui suit compte
   juste : le compteur, les points du carrousel, le geste de glissement.

   ⚠️ Conséquence assumée : une semaine peut afficher moins de recettes que la
   génération n'en a produit — et zéro, sur une ligne générée avant que les
   plats ne soient choisis dans le catalogue. L'écran propose alors de générer,
   ce qui est la seule chose à faire. */
function filtrerAvecPhoto(recettes){
  return (recettes || []).filter(function(r){
    return !!visuelRecette(r, 0).photo;
  });
}

function depuisRecette(r, i){
  var m = r.macros || {};
  var v = visuelRecette(r, i);
  return {
    cle: r.cle || null,
    nom: r.nom || 'Recette',
    desc: r.pourquoi || '',
    temps: r.temps_min ? r.temps_min + ' min' : '',
    kcal: Math.round(m.kcal || 0),
    p: Math.round(m.p || 0), g: Math.round(m.g || 0), l: Math.round(m.l || 0),
    emoji: EMOJIS[i % EMOJIS.length],
    photo: v.photo,
    photoWeek: v.photoWeek,
    illu: v.illu,
    ingr: (r.ingredients || []).map(function(x){ return { em:x.em||'🥄', nm:x.nom||'', qt:x.qte||'' }; }),
    steps: (r.steps || []).map(function(s){ return { em:s.em||'👉', t:s.t||'', tip:s.tip||'' }; }),
    // La recette d'origine, telle que NattyReco l'a produite : NattyRecette
    // en a besoin (illu/durée/température/quantités par étape) et la forme
    // aplatie ci-dessus les a perdues.
    src: r
  };
}

/* ═══ Le héros = ce que la semaine prévoit maintenant ═══
   Demande de Pablo : « si lundi 12 h 30 dans sa semaine c'est un buddha bowl,
   alors héros = buddha bowl, même s'il ne l'a pas validé ». L'écran s'ouvrait
   sur `PLATS[0]` — la première recette générée, sans rapport avec l'heure. */

function normNom(s){
  var t = String(s == null ? '' : s).toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae');
  try { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g,''); } catch(e){}
  return t.replace(/[^a-z0-9]+/g,' ').trim();
}

/* Un plat placé par la planification qui n'est PAS une recette de la semaine —
   les trois plats macro. Il n'existe nulle part ailleurs dans l'app : sans
   cette conversion, le créneau de midi n'aurait tout simplement pas de héros
   trois fois sur cinq. Il porte `plan` : c'est ce qui le distingue d'une
   recette (pas d'étapes à suivre, une fiche à ouvrir). */
function depuisPlanRepas(r){
  // `visuelRecette` sait déjà tout faire : la photo du catalogue, celle que la
  // recette porte en propre, l'illustration au trait. Une seule voie, donc pas
  // de second endroit à mettre à jour le jour où elle en apprend une de plus.
  var v = visuelRecette({ cle:r.cle, photo:r.photo, photoWeek:r.photo }, 0);
  /* Le garde-fou qui neutralisait ici les deux photos de démonstration n'a plus
     d'objet : `visuelRecette` ne les rend plus (voir son encadré). L'illustration
     que porte le repas reste le dernier recours d'affichage — et un repas sans
     image n'arrive de toute façon plus jusqu'ici, `nettoyerPlan()`
     (assets/planning.js) l'ayant écarté du plan à la lecture. */
  if (!v.photo && !v.illu && r.illu) v = { photo:null, photoWeek:null, illu:r.illu };
  /* 🔴 ⚠️ LA RECETTE COMPLÈTE EST DANS `r.src`, ET ELLE ÉTAIT JETÉE.
     `placer()` (assets/planning.js) range la recette entière sous `src` pour
     les entrées de type « recette ». Ce `steps: []` écrit en dur la perdait :
     une recette placée dans la semaine mais absente de la liste courante —
     parce que la génération a été refaite depuis, ou parce qu'elle dépasse
     `NB_MAX` — arrivait au héros SANS étapes. Le bouton disait alors
     « Réaliser ce repas » et menait droit à la photo : impossible de lancer la
     recette. C'est exactement ce que Pablo a constaté le 2026-08-16. */
  var src = r.src || null;
  return {
    cle: r.cle || null,
    nom: r.nom || 'Repas',
    desc: r.pourquoi || (src && src.pourquoi) || '',
    temps: (src && src.temps_min) ? src.temps_min + ' min' : '',
    kcal: Math.round(r.kcal||0),
    p: Math.round(r.p||0), g: Math.round(r.g||0), l: Math.round(r.l||0),
    emoji: r.em || '🍽️',
    photo: v.photo, photoWeek: v.photoWeek, illu: v.illu,
    ingr: ((r.ingredients && r.ingredients.length ? r.ingredients : (src && src.ingredients)) || [])
      .map(function(x){ return { em:x.em||'🥄', nm:x.nom||'', qt:x.qte||'' }; }),
    steps: ((src && src.steps) || []).map(function(s){
      return { em:s.em||'👉', t:s.t||'', tip:s.tip||'' };
    }),
    src: src,
    plan: r
  };
}

/* L'index d'un repas du plan dans PLATS — la `cle` du catalogue d'abord, le nom
   seulement ensuite : deux plats peuvent porter des noms voisins, jamais la même
   clé. Rend -1 si le plat n'y est pas encore. */
function indexPlat(r){
  var i = -1;
  if (r.cle) PLATS.forEach(function(p,k){ if (i<0 && p.cle && p.cle === r.cle) i = k; });
  if (i < 0) PLATS.forEach(function(p,k){ if (i<0 && normNom(p.nom) === normNom(r.nom)) i = k; });
  return i;
}

/* Le repas du plan entre dans PLATS s'il n'y est pas, et rend sa place. C'est
   ce qui permet de taper N'IMPORTE QUELLE case de la semaine et de voir son
   repas en héros — y compris les trois plats macro, qui n'existent nulle part
   ailleurs dans l'app. */
function accueillirPlanRepas(r){
  var i = indexPlat(r);
  if (i < 0){ PLATS.push(depuisPlanRepas(r)); i = PLATS.length - 1; }
  return i;
}

/* La case du calendrier qui porte ce plat, s'il y en a une. Sert à garder
   l'anneau blanc du calendrier en face de ce qui est affiché en héros, quel que
   soit le chemin par lequel on y est arrivé. */
function caseDe(d){
  if (!PLAN || !PLAN.repas || !d) return null;
  var t = null;
  if (d.cle) PLAN.repas.forEach(function(r){ if (!t && r.cle && r.cle === d.cle) t = r; });
  if (!t) PLAN.repas.forEach(function(r){ if (!t && normNom(r.nom) === normNom(d.nom)) t = r; });
  return t ? { jour:t.jour, creneau:t.creneau } : null;
}

/* Un seul chemin pour changer de plat affiché : l'index, la case du calendrier
   qui va avec, le rendu. Il y avait trois endroits qui faisaient les deux
   premiers à leur façon — c'est comme ça qu'un anneau finit par désigner un
   plat qui n'est plus à l'écran. */
function poserActif(i, sens){
  if (i < 0 || i >= PLATS.length) return;
  actif = i; ingrOff = {};
  SENS_ENTREE = sens || 0;
  SEL_SEMAINE = caseDe(PLATS[i]);
  render();
  SENS_ENTREE = 0;
  if (window.NattyPlanning && NattyPlanning.selectionner) NattyPlanning.selectionner(SEL_SEMAINE);
}

/* ═══ Glisser d'un repas à l'autre ═══
   Demande de Pablo (2026-08-16) : « fais le héros swippable, sans devoir
   cliquer, comme ça on peut choisir le repas qu'on veut faire peu importe
   quand. » Le geste parcourt PLATS — les recettes conseillées ET les repas
   placés dans la semaine.

   ⚠️ DÉTECTION D'UN GESTE, PAS UN SUIVI DE POINTEUR. `narration.html` a coûté
   une session entière à `setPointerCapture` et ses gestes inachevés (§7) :
   ici on ne lit que le départ et l'arrivée, comme l'arc d'`assets/journee.js`.
   Rien à tenir entre les deux, donc rien à laisser dans un état bâtard. */
var SEUIL_GESTE = 42;   // px ; en dessous, c'est un tap qui a bougé
var SENS_ENTREE = 0;

function glisserVers(sens){
  if (PLATS.length < 2) return;
  oublierIndice();
  var i = (actif + sens + PLATS.length) % PLATS.length;
  var h = document.querySelector('.hero');
  if (h){
    h.classList.add('sort');
    h.style.transform = 'translateX(' + (sens > 0 ? -22 : 22) + 'px)';
  }
  // On laisse la sortie se jouer, puis on repeint : le plan suivant entre du
  // côté d'où vient le doigt. 130 ms — la transition en dure 130.
  setTimeout(function(){ poserActif(i, sens); }, 130);
}

function brancherGesteHero(el){
  if (!el) return;
  var x0 = 0, y0 = 0, arme = false;

  function debut(x, y){ x0 = x; y0 = y; arme = true; }
  function fin(x, y){
    if (!arme) return;
    arme = false;
    var dx = x - x0, dy = y - y0;
    /* ⚠️ L'axe le plus marqué gagne. Sans ce test, un défilement vertical un
       peu de travers changerait de plat — le piège déjà corrigé sur l'arc de
       `assets/journee.js`. */
    if (Math.abs(dx) < SEUIL_GESTE || Math.abs(dx) <= Math.abs(dy)) return;
    glisserVers(dx < 0 ? 1 : -1);
  }

  el.addEventListener('touchstart', function(e){
    // Deux doigts = un zoom ou un défilement, jamais un changement de plat.
    if (e.touches.length !== 1){ arme = false; return; }
    debut(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  el.addEventListener('touchend', function(e){
    var t = e.changedTouches && e.changedTouches[0];
    if (t) fin(t.clientX, t.clientY);
  }, { passive:true });
  // ⚠️ `touchcancel` : le système reprend le geste (défilement, appel entrant).
  // Sans ce désarmement, le `touchend` d'un geste suivant partirait d'un point
  // de départ périmé.
  el.addEventListener('touchcancel', function(){ arme = false; }, { passive:true });

  // Souris : gratuit sur ordinateur, et c'est ce qui rend le geste testable.
  el.addEventListener('mousedown', function(e){ debut(e.clientX, e.clientY); });
  el.addEventListener('mouseup', function(e){ fin(e.clientX, e.clientY); });
}

/* L'indice ne s'affiche qu'une fois — après, il n'apprend plus rien et occupe
   une ligne au-dessus du calendrier. Même parti pris que « Glissez → » de
   `assets/decouverte.js`. */
function cleIndice(){ return 'natty_repas_geste_' + ((window.Natty && Natty.USER_ID) || 'anon'); }
function indiceVu(){ try { return !!localStorage.getItem(cleIndice()); } catch(e){ return true; } }
function oublierIndice(){
  try { localStorage.setItem(cleIndice(), '1'); } catch(e){}
  var h = document.querySelector('.hero-hint');
  if (h && h.parentNode) h.parentNode.removeChild(h);
}

/* Rend l'index du plat à mettre en héros, et arme la pastille « quand ».
   Sans planification (ou sans plan pour cette semaine) : 0, comme avant. */
async function choisirHero(){
  MOMENT = null; idxMoment = -1; PLAN = null; SEL_SEMAINE = null;
  if (!window.NattyPlanning || !NattyPlanning.repasDuMoment) return 0;
  try { PLAN = await NattyPlanning.lire(); } catch(e){}
  if (!PLAN || !PLAN.repas || !PLAN.repas.length) return 0;

  /* ⚠️ TOUS les repas de la semaine entrent dans PLATS, pas seulement celui du
     moment. C'est ce qui permet de les faire défiler au doigt et d'en choisir
     un « peu importe quand » (demande de Pablo, 2026-08-16) : n'ajouter que le
     repas courant enfermait les quatre autres derrière un tap sur la bonne case
     du calendrier. Ils arrivent dans l'ordre du plan — jour puis créneau, déjà
     trié par `placer()` — donc glisser, c'est parcourir sa semaine. */
  PLAN.repas.forEach(function(r){ accueillirPlanRepas(r); });

  var r = NattyPlanning.repasDuMoment(PLAN);
  if (!r) return 0;

  var i = accueillirPlanRepas(r);
  MOMENT = r; idxMoment = i;
  SEL_SEMAINE = { jour:r.jour, creneau:r.creneau };
  return i;
}

/* La recette telle que NattyRecette la reconnaît. Un plat macro n'a pas de
   `src` : sa clé et son nom suffisent à l'IDENTIFIER, et ce sont exactement ceux
   que lit `assets/planning.js` pour cocher la case — donc une seule et même
   identité.
   ⚠️ Mais identifier ne suffit plus à l'AFFICHER : depuis que la cinématique
   s'ouvre sur une présentation du plat (et non plus sur « photographiez-le pour
   valider »), elle a besoin de quoi la remplir. Sans ces trois champs, l'écran
   d'accueil d'un plat macro serait un titre seul au milieu du vide. */
function refRecette(d){
  if (d && d.src) return d.src;
  return {
    cle: d && d.cle, nom: d && d.nom,
    em: d && d.emoji,
    pourquoi: (d && d.desc) || '',
    ingredients: ((d && d.ingr) || []).map(function(x){
      return { em:x.em, nom:x.nm, qte:x.qt };
    })
  };
}

function depuisRepas(meal){
  var mac = Natty.calcMac(meal.meal_ingredients);
  return {
    nom: meal.name || 'Repas',
    desc: '',
    temps: '',
    kcal: mac.c || 0, p: mac.p || 0, g: mac.g || 0, l: mac.l || 0,
    emoji: '🍽️',
    photo: meal.photo_url || null,
    ingr: (meal.meal_ingredients || []).map(function(x){
      return { em:'🥄', nm:x.name||'', qt:x.quantity_g ? x.quantity_g+' g' : '' };
    }),
    steps: []
  };
}

/* ═══ Rendu ═══ */

// Une photo n'est utilisable en débordement que si elle est détourée (PNG
// transparent). Sinon on la cadre : la mise en page tient toujours.
function estDetouree(url){ return /\.png($|\?)/i.test(url || ''); }

function heroVisuel(d){
  if (d.photo){
    var framed = estDetouree(d.photo) ? '' : ' framed';
    return '<div class="hero-dish'+framed+'"><img src="'+esc(d.photo)+'" alt=""></div>';
  }
  /* Le plat existe au catalogue mais personne ne l'a photographié : son
     illustration au trait, plutôt que l'emoji. Elle passe AVANT l'emoji pour
     la même raison que dans la visionneuse — à 190 px, un emoji est une
     vignette d'application, pas une image de plat. */
  if (d.illu) return '<div class="hero-dish illu">'+d.illu+'</div>';
  return '<div class="hero-dish">'+d.emoji+'</div>';
}

/* Cette recette a-t-elle été cuisinée et validée cette semaine ? Même clé que
   `assets/planning.js` : la coche de la carte et celle du calendrier ne peuvent
   donc pas se contredire. */
function estCuisinee(d){
  try { return !!(window.NattyRecette && NattyRecette.estValidee(refRecette(d))); }
  catch(e){ return false; }
}

/* Les pastilles au-dessus du titre : QUAND ce plat est prévu, et s'il est déjà
   cuisiné. Seul le plat du moment porte la première — les autres cartes de la
   rangée sont consultées, pas programmées. */
function pastillesHero(d){
  var p = [];
  if (MOMENT && actif === idxMoment && window.NattyPlanning){
    var cre = NattyPlanning.CRENEAUX[MOMENT.creneau];
    var auj = NattyPlanning.maintenant().jour;
    var jour = MOMENT.jour === auj ? 'Aujourd’hui' : NattyPlanning.JOURS[MOMENT.jour];
    p.push('<span class="'+(MOMENT.exact ? 'now' : '')+'">📅 '
      + esc(jour + ' · ' + (cre ? cre.court : '')) + '</span>');
  }
  if (estCuisinee(d)) p.push('<span class="done">✓ Cuisinée</span>');
  return p.length ? '<div class="hero-when">'+p.join('')+'</div>' : '';
}

/* Le bouton dit où l'on en est, au lieu de dire toujours « Démarrer ».
   Une recette entamée puis quittée est le cas le plus fréquent : on cuisine en
   vingt minutes, pendant lesquelles le téléphone se verrouille. */
function libelleCta(d, suivie){
  /* Un repas placé par la planification n'a pas d'étapes : on ne le « suit »
     pas, on le fait. Le bouton disait « Voir le détail » — donc trois repas de
     la semaine sur cinq n'étaient que consultables. */
  if (d.plan && !(d.steps && d.steps.length)) {
    return estCuisinee(d) ? 'Refaire ce repas' : 'Réaliser ce repas';
  }
  /* ⚠️ UN PLAT VALIDÉ SE REFAIT (2026-08-18). Le bouton disait « Repas validé ✓ »
     et « Revoir les étapes » — deux libellés qui annoncent une consultation
     alors que l'écran de fin sait désormais reprendre une photo et revalider.
     L'état, lui, n'est pas perdu : la pastille « ✓ Cuisinée » juste au-dessus
     le porte, et c'est sa place — un bouton dit ce qu'il fait, pas où l'on en
     est. */
  /* ⚠️ LA REPRISE PASSE AVANT « REFAIRE », ET L'ORDRE N'EST PAS COSMÉTIQUE
     (2026-08-19). Testée après, une recette validée puis relancée et quittée en
     cours de route annonçait « Refaire la recette » — donc « on repart de
     l'étape 1 » — pendant que `suivre()` reprenait à l'étape 6. Le bouton
     décrivait le contraire de ce qu'il faisait. */
  if (window.NattyRecette && d.src){
    var pr = NattyRecette.progres(d.src);
    if (pr) return 'Reprendre · étape ' + (pr.i + 1) + '/' + pr.total;
  }
  if (estCuisinee(d)) return 'Refaire la recette';
  return suivie ? 'Revoir les étapes' : 'Démarrer';
}

function render(){
  var d = PLATS[actif];
  if (!d){
    document.getElementById('content').innerHTML =
      '<div class="empty">Aucune recette à afficher pour le moment.</div>';
    return;
  }

  var suivie = !!suivies[actif];
  var entree = SENS_ENTREE > 0 ? ' inD' : (SENS_ENTREE < 0 ? ' inG' : '');
  var html = ''
    + '<div class="hero' + entree + '">'
      + heroVisuel(d)
      + '<span class="leaf l1">🌿</span><span class="leaf l2">🌿</span><span class="leaf l3">🌶️</span>'
      + pastillesHero(d)
      + '<div class="hero-head">'
        + '<div class="hero-title">'+esc(d.nom)+'</div>'
        + (d.temps ? '<div class="hero-time">🕐 '+esc(d.temps)+'</div>' : '')
      + '</div>'
      + (d.desc ? '<div class="hero-desc">'+esc(d.desc)+'</div>' : '')
      + '<div class="hero-macros">'
        + '<div class="mp">🥩 '+(d.p||'–')+'g</div>'
        + '<div class="mp">🌾 '+(d.g||'–')+'g</div>'
        + '<div class="mp">🥑 '+(d.l||'–')+'g</div>'
      + '</div>'
      + '<div class="hero-foot">'
        + '<div class="hero-kcal"><div class="k">Total</div><div class="v">'+(d.kcal||'–')+' Kcal</div></div>'
        + '<div class="hero-act">'
          + '<button class="heart-btn" id="heartBtn">🤍</button>'
          + (suivie ? '<button class="heart-btn" id="unfollowBtn" aria-label="Retirer la recette">✓</button>' : '')
          + '<button class="cta" id="ctaBtn">'+esc(libelleCta(d, suivie))+'</button>'
        + '</div>'
      + '</div>'
    + '</div>';

  /* Les points de position, juste sous le héros. Ils disent combien de repas
     on peut atteindre et où l'on est — c'est ce qui fait deviner le geste. */
  if (PLATS.length > 1){
    html += '<div class="hero-dots">' + PLATS.map(function(x,i){
              return '<b class="' + (i===actif?'on':'') + '" data-dot="' + i
                + '" title="' + esc(x.nom) + '"></b>';
            }).join('') + '</div>'
         + (indiceVu() ? '' : '<div class="hero-hint">← Glissez pour changer de repas →</div>');
  }

  /* ⚠️ Les plats venus de la planification (les trois plats macro) sont dans
     PLATS pour pouvoir être le héros du moment, mais PAS dans cette rangée :
     elle s'appelle « Recettes conseillées » et ne doit contenir que des
     recettes. On garde l'index réel — c'est lui que `data-i` porte. */
  var cartes = PLATS.map(function(x,i){ return { x:x, i:i }; })
                    .filter(function(o){ return !o.x.plan; });
  if (cartes.length > 1){
    html += '<div class="week-panel">'
         /* « Ma semaine » nomme désormais le CALENDRIER, en haut de l'écran.
            Ce panneau-ci n'a jamais montré une semaine : il montre les
            recettes conseillées. Deux titres identiques pour deux contenus
            différents auraient fait passer l'un pour l'autre. */
         +  '<div class="sec-head"><span class="sec-title">Recettes conseillées</span>'
         +  '<span class="sec-note">'+cartes.length+' cette semaine</span></div>'
         +  '<div class="week-row">' + cartes.map(function(o){
              var x = o.x, i = o.i;
              var weekImg = x.photoWeek || x.photo;
              var vis = weekImg ? '<img src="'+esc(weekImg)+'" alt="">'
                      : (x.illu ? '<span class="wi">'+x.illu+'</span>' : x.emoji);
              return '<div class="week-card'+(i===actif?' on':'')+(estCuisinee(x)?' faite':'')
                + '" data-i="'+i+'">'
                + '<div class="week-check">✓</div>'
                + '<div class="week-dish">'+vis+'</div>'
                + '<div class="week-name">'+esc(x.nom)+'</div>'
                + '<div class="week-kcal">'+(x.kcal||'–')+' kcal</div>'
                + '</div>';
            }).join('') + '</div>'
         +  '</div>';
  }

  // Tout ce qui suit va dans le dépliant « Détails ».
  var detail = '';
  if (d.ingr.length){
    var actifs = d.ingr.length - Object.keys(ingrOff).length;
    // Quand le garde-manger est rempli, on distingue ce qu'il faut acheter.
    // Le test est fait ici plutôt qu'en se fiant au champ "dispo" renvoyé par
    // l'IA : la liste a pu changer depuis la génération.
    var gmOn = typeof NattyGardeManger !== 'undefined' && NattyGardeManger.nbItems() > 0;
    var manque = d.ingr.map(function(x){ return gmOn && !NattyGardeManger.contient(x.nm); });
    var nbAchat = manque.filter(Boolean).length;
    detail += '<div class="panel">'
      + '<div class="panel-head"><div class="panel-title">Ingrédients <span>('+actifs+'/'+d.ingr.length
      + (nbAchat ? ' · '+nbAchat+' à acheter' : '')+')</span></div>'
      + '<div class="panel-link" id="ingrEdit">Modifier</div></div>'
      + '<div class="ingr-grid">' + d.ingr.map(function(x,i){
          return '<div class="ingr'+(ingrOff[i]?' off':'')+(manque[i]?' buy':'')+'" data-i="'+i+'">'
            + '<div class="tick">'+(manque[i]?'+':'✓')+'</div><div class="em">'+x.em+'</div>'
            + '<div class="nm">'+esc(x.nm)+'</div>'
            + (x.qt ? '<div class="qt">'+esc(x.qt)+'</div>' : '')
            + '</div>';
        }).join('') + '</div></div>';
  }

  // Préparation détaillée : rendue seulement s'il y a des étapes (un repas
  // venu de `meals` n'en a pas, la fonction renvoie alors une chaîne vide).
  if (d.src && window.NattyRecette) detail += NattyRecette.fiche(d.src, { bouton:false });

  if (detail){
    html += '<button class="det-h" id="detH" aria-expanded="' + (detailsOuverts?'true':'false') + '">'
         +   'Détails <span class="det-c">' + (detailsOuverts?'▴':'▾') + '</span>'
         + '</button>'
         + '<div class="det-body' + (detailsOuverts?' on':'') + '" id="detB">' + detail + '</div>';
  }

  document.getElementById('content').innerHTML = html;
  brancher();
}

/* « Découvrir » se monte UNE SEULE FOIS, dans son propre hôte, et pas à chaque
   render() : son contenu ne dépend ni de la recette affichée ni d'aucune
   requête. Le remonter à chaque tap sur une vignette relancerait le
   chargement de ses vignettes pour un contenu identique — et ferait sauter la
   position de défilement des deux rangées horizontales. */
function monterDecouvrir(){
  if (!window.NattyDecouverte || !NattyDecouverte.monter) return;
  var h = document.getElementById('decouvWrap');
  if (!h || h.getAttribute('data-pose')) return;
  h.setAttribute('data-pose', '1');
  NattyDecouverte.monter(h);
}

// Une recette choisie à la fin d'un mini-jeu remonte ici : elle prend la
// tête de la liste et s'affiche dans le hero.
window.NattyOnRecetteSuivie = async function(r){
  if (!r) return;
  var d = depuisRecette(r, PLATS.length);
  PLATS.unshift(d);
  // ⚠️ Tous les index glissent d'un cran : sans ça, la pastille « Aujourd'hui ·
  // Midi » se retrouverait sur le plat voisin de celui qu'elle décrit.
  if (idxMoment >= 0) idxMoment++;
  suivies = {}; suivies[0] = true;
  // Une recette venue d'un mini-jeu n'est pas dans le plan : `poserActif` le
  // constate et retire l'anneau du calendrier, au lieu de le laisser désigner
  // le plat précédent.
  poserActif(0);
  window.scrollTo({ top:0, behavior:'smooth' });
  // Suivie depuis un mini-jeu : même geste, donc même consommation
  // du garde-manger que par le bouton du hero.
  var retires = [];
  if (window.NattyGardeManger) {
    try {
      await NattyGardeManger.charger();
      retires = await NattyGardeManger.consommer(d.ingr);
    } catch (e) {}
  }
  toast(retires.length
    ? '✓ ' + d.nom + ' — ' + retires.length + (retires.length > 1 ? ' ingrédients retirés' : ' ingrédient retiré') + ' du garde-manger'
    : '✓ ' + d.nom + ' — recette suivie');
};

function brancher(){
  brancherGesteHero(document.querySelector('.hero'));
  document.querySelectorAll('[data-dot]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.dot;
      if (i === actif) return;
      oublierIndice();
      poserActif(i, i > actif ? 1 : -1);
    });
  });

  var dh = document.getElementById('detH');
  if (dh) dh.addEventListener('click', function(){
    detailsOuverts = !detailsOuverts;
    var b = document.getElementById('detB'), c = dh.querySelector('.det-c');
    if (b) b.classList.toggle('on', detailsOuverts);
    if (c) c.textContent = detailsOuverts ? '▴' : '▾';
    dh.setAttribute('aria-expanded', detailsOuverts ? 'true' : 'false');
  });

  /* « Suivre cette recette » ouvre la cinématique des étapes. C'est le geste
     qui déclenche la cuisine, donc l'écran qui doit suivre est celui qui
     guide — pas un toast. Le retrait, lui, part sur son propre bouton : il
     partageait celui-ci, et le tap aurait fini par vouloir dire deux choses. */
  var cta = document.getElementById('ctaBtn');
  if (cta) cta.addEventListener('click', async function(){
    var d = PLATS[actif];
    var dejaSuivie = !!suivies[actif];

    /* Un plat placé par la planification n'a pas d'étapes : il n'y a rien à
       guider, mais il y a tout à préparer. `realiser()` ouvre la présentation
       du plat — ce qu'il contient, et un bouton « Je l'ai préparé ✓ » qui mène
       à la photo. ⚠️ Elle ouvrait l'écran de validation DIRECTEMENT jusqu'au
       2026-08-19 : on tapait pour cuisiner, l'app demandait de certifier que
       c'était fait. Repli sur la fiche si le module n'est pas chargé. */
    if (d.plan && !(d.steps && d.steps.length)){
      if (window.NattyRecette && NattyRecette.realiser) NattyRecette.realiser(refRecette(d));
      else if (window.NattyPlanning) NattyPlanning.detail(d.plan);
      else toast('Aucune étape détaillée pour ce plat');
      return;
    }

    function guider(){
      if (!window.NattyRecette || !NattyRecette.suivre(d.src || {})) {
        // Un repas venu de `meals` n'a pas d'étapes : rien à guider.
        toast('Aucune étape détaillée pour ce plat');
      }
    }

    if (dejaSuivie) { guider(); return; }

    suivies[actif] = true;
    render();

    /* Suivre une recette consomme ses ingrédients : ils sortent du
       garde-manger, sinon les recommandations suivantes repartiraient
       d'un stock déjà cuisiné. charger() est idempotent, on ne paie la
       lecture que si l'utilisateur suit vraiment une recette.
       Le garde-manger n'est jamais bloquant : si le module manque ou
       échoue, la recette est suivie quand même. */
    var retires = [];
    if (window.NattyGardeManger) {
      try {
        await NattyGardeManger.charger();
        retires = await NattyGardeManger.consommer(d.ingr);
      } catch (e) {}
    }
    if (retires.length) {
      toast('✓ ' + retires.length + (retires.length > 1 ? ' ingrédients retirés' : ' ingrédient retiré') + ' du garde-manger');
    }
    guider();
  });

  var unfollow = document.getElementById('unfollowBtn');
  if (unfollow) unfollow.addEventListener('click', function(){
    suivies[actif] = false;
    render();
    toast('Recette retirée');
  });

  var heart = document.getElementById('heartBtn');
  if (heart) heart.addEventListener('click', function(){
    var on = this.textContent.trim() === '❤️';
    this.textContent = on ? '🤍' : '❤️';
    toast(on ? 'Retiré des favoris' : '❤️ Ajouté aux favoris');
  });

  document.querySelectorAll('.week-card').forEach(function(el){
    el.addEventListener('click', function(){
      // `poserActif` recale aussi l'anneau du calendrier : la recette qu'on
      // choisit ici est souvent placée dans la semaine, et les deux doivent
      // désigner le même plat.
      poserActif(+el.dataset.i);
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });

  document.querySelectorAll('.ingr').forEach(function(el){
    el.addEventListener('click', function(){
      var i = +el.dataset.i;
      if (ingrOff[i]) delete ingrOff[i]; else ingrOff[i] = 1;
      render();
    });
  });

  var edit = document.getElementById('ingrEdit');
  if (edit) edit.addEventListener('click', function(){ toast('Touche un ingrédient pour le retirer'); });
}

/* ═══ Garde-manger ═══
   Le panneau a été retiré de cet écran. Scan (courses, ticket, photo), saisie
   et génération sont passés dans la question plein écran qui PRÉCÈDE la
   génération de la semaine — assets/generation.js → demanderGardeManger().
   Il n'y a donc plus deux endroits pour remplir le même stock, et la question
   arrive au seul moment où la réponse change quelque chose.
   Ce qui reste utilisé ici de NattyGardeManger : `contient()`, pour marquer
   « à acheter » les ingrédients d'une recette (voir render()). */


/* ═══ « Ma semaine » ═══
   Le calendrier de la planification, au-dessus du repas du jour.

   Taper une case pleine ouvre le repas qui y est placé. Deux cas, et un seul
   comportement juste pour chacun : une RECETTE de la semaine est déjà dans
   `PLATS`, on la remonte donc au hero (c'est l'écran qui sait la cuisiner) ;
   un plat MACRO n'existe nulle part ailleurs — il est né de la planification —
   donc c'est la fiche du module qui le montre. Renvoyer les deux vers le hero
   aurait affiché une recette au hasard à la place du plat demandé. */
async function monterMaSemaine(){
  var el = document.getElementById('planWrap');
  if (!el || !window.NattyPlanning) return;
  await NattyPlanning.monterFiche(el, function(repas){
    /* ⚠️ TOUTE case pleine mène au héros, désormais — recette comme plat macro.
       Avant, un plat macro ouvrait une feuille du bas (`NattyPlanning.detail`) :
       on pouvait le lire, pas le faire. Or il n'y a aucune raison qu'un repas de
       la semaine soit consultable et un autre réalisable, et la feuille ne
       montrait rien que le héros ne montre déjà (macros, pourquoi, ingrédients
       dans « Détails »). Demande de Pablo, 2026-08-15. */
    poserActif(accueillirPlanRepas(repas));
    window.scrollTo({ top:0, behavior:'smooth' });
  }, SEL_SEMAINE);
}

/* La séquence vient de se terminer sur un autre écran, ou ici même via
   « Replanifier » : le calendrier se repeint sans recharger la page. */
document.addEventListener('natty:planning-pret', function(){ monterMaSemaine(); });

/* Une recette vient d'être validée (photo à l'appui) dans la cinématique : la
   carte se coche et le bouton change de libellé, sans recharger la page.
   Le calendrier « Ma semaine », lui, se repeint tout seul — `assets/planning.js`
   écoute le même événement, et il vaut mieux qu'il en soit responsable que de
   le lui demander d'ici. */
document.addEventListener('natty:recette-validee', function(e){
  render();
  var xp = e && e.detail ? e.detail.xp : 0;
  toast(xp ? '✓ Recette validée · +' + xp + ' XP' : '✓ Recette validée');
});

(async function(){
  if (!Natty.requireAuth()) return;

  /* « Découvrir » d'abord, et AVANT toute requête. Le catalogue est embarqué
     dans l'app : le faire patienter derrière la lecture du garde-manger et
     celle des recettes, c'est plusieurs secondes de vide sur un contenu déjà
     prêt — et c'est ce qui reste à regarder quand la génération de la semaine
     n'a pas encore eu lieu. Même parti pris que dans `social.html`. */
  monterDecouvrir();

  // Chargé pour une seule chose désormais : marquer les ingrédients « à
  // acheter » dans les recettes affichées.
  await NattyGardeManger.charger();

  // Sans `await` : le calendrier fait sa propre lecture, et les recettes ne
  // doivent pas attendre après elle pour s'afficher.
  monterMaSemaine();

  /* Idem pour les préférences : leur lecture est indépendante, et le panneau
     vit en bas de l'écran — le faire attendre retarderait le hero pour un
     contenu qu'on ne voit qu'après avoir défilé. Monté AVANT le `try` qui
     suit : celui-ci rend la main plus haut quand la page est ouverte sur un
     repas précis (?id=), et le panneau ne serait alors jamais peint. */
  if (window.NattyPreferences) NattyPreferences.monter(document.getElementById('prefWrap'));
  if (window.NattyMateriel) NattyMateriel.monter(document.getElementById('matWrap'));

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');

  try{
    // ?id= : on affiche ce repas précis (comportement historique conservé).
    if (id){
      var raw = await Natty.sbFetch('meals?id=eq.'+id+'&select=*');
      if (raw && raw.length){
        var meal = raw[0];
        meal.meal_ingredients = await Natty.sbFetch('meal_ingredients?meal_id=eq.'+meal.id+'&select=*');
        PLATS = [depuisRepas(meal)];
        render();
        return;
      }
    }

    await NattyReco.chargerNbRepas();   // préférence partagée entre appareils
    var barre = document.getElementById('nbbar');
    if (barre) barre.style.display = 'flex';
    afficherNb(NattyReco.nbRepas());

    await chargerSemaineDepuisCache();
    await rendreSemaine();
    preparerSiDemande();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">Impossible de charger les recettes.</div>';
  }finally{
    /* ⚠️ Le chemin `?id=` rend la main plus haut, et le `catch` ci-dessus ne
       passe jamais par `preparerSiDemande()` : sans ce `finally`, un échec de
       chargement laissait l'écran de pré-chauffage devant un message d'erreur
       que personne ne pouvait lire. */
    if (window.NattyPrechauffe && NattyPrechauffe.ouverte()) NattyPrechauffe.fermer();
  }
})();

/* ⚠️ `?preparer=1` — LE GUIDE ENVOIE CUISINER, PAS LIRE UNE FICHE.
   « Suivre la recette » (assets/journee.js) s'arrêtait sur la carte du plat :
   il fallait encore trouver « Démarrer » pour entrer dans la préparation. Le
   bouton annonçait un geste et en demandait un second. Il ouvre maintenant la
   cinématique directement. (Demande de Pablo, 2026-08-15.)

   Appelé UNIQUEMENT au chargement, jamais depuis `rendreSemaine()` : celle-ci
   tourne aussi quand la génération se termine en arrière-plan
   (`natty:conseils-prets`), et lancer une préparation plein écran sous les
   yeux de quelqu'un qui lisait autre chose serait un enlèvement.

   Le repli est le comportement d'avant — la fiche, avec son « Démarrer » : on
   ne rend pas la page inutilisable parce qu'une recette n'a pas d'étapes. */
function preparerSiDemande(){
  if (new URLSearchParams(window.location.search).get('preparer') !== '1') return;
  try{
    var d = PLATS[actif];
    if (!d || !window.NattyRecette) return;
    /* La cinématique s'ouvre SOUS l'écran de pré-chauffage, qui se retire
       ensuite en fondu : on passe donc du guide à l'étape 1 sans jamais voir
       l'écran Repas se composer entre les deux.
       `suivre()` rend `false` quand il n'y a aucune étape à jouer — on le laisse
       décider plutôt que de recompter nous-mêmes ce qu'il sait déjà compter ;
       un repas placé sans étapes s'ouvre alors sur sa présentation. */
    if (d.src && NattyRecette.suivre(d.src)) return;
    if (d.plan && NattyRecette.realiser) NattyRecette.realiser(refRecette(d));
  } finally {
    /* ⚠️ Dans un `finally` : une exception ici laisserait un plein écran
       définitif par-dessus une page parfaitement utilisable. Le module a bien
       son propre filet de sécurité, mais neuf secondes d'écran bloqué sont
       déjà neuf secondes de trop. */
    if (window.NattyPrechauffe) NattyPrechauffe.fermer();
  }
}
</script>
<!-- Les créneaux de repas (combien, lequel maintenant, ce qui y est déjà
     noté) : `assets/ajout.js` en a besoin pour dire ce qu'il RESTE sur le
     repas en cours, et non « la journée divisée par le nombre de repas ». -->
<script src="/assets/creneaux.js"></script>

<script src="/assets/unites.js"></script>
<script src="/assets/ajout.js"></script>

     ici — courte si le jour a déjà été salué et qu'un nouveau créneau commence.
     C'est aussi l'écran des recettes, donc celui où « Suivre la recette » mène. -->
<script src="/assets/journee.js"></script>
<script>
  if (window.NattyJournee) NattyJournee.proposerSiNecessaire();
</script>
<!-- Le journal des séances. Chargé AVANT `bilan.js`, et c'est la raison de
     cette ligne : le bilan du soir propose d'ajouter la séance du jour juste
     avant de montrer le muscle construit et la graisse puisée, et il saute

     déclenche le bilan mais ne charge pas seance.js, la question ne serait donc

<!-- La couche cinématique partagée : illustrations SVG, entrées échelonnées,

<script src="/assets/cine.js"></script>

     c'est le guide qui doit s'ouvrir, et le bilan renonce en le voyant. */
  if (window.NattyBilan) NattyBilan.proposerSiNecessaire();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Natty · Menu</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/natty-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/style.css">
<style>

.plate-banner{position:relative;background:var(--card);border-radius:var(--r-xl);padding:22px 14px 22px;margin-top:8px;overflow:hidden}
.plate-badge{display:inline-block;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:15px;letter-spacing:.4px;padding:10px 18px;border-radius:999px;text-transform:uppercase}
/* Vignettes plats : nettement plus grandes, presque jointives, et un arrondi
   de superellipse (carré très arrondi) plutôt qu'un cercle parfait. */
.plate-row{display:flex;justify-content:center;gap:4px;margin-top:20px}
.plate-circ{flex:1;min-width:0;aspect-ratio:1/1;border-radius:var(--r-plate);overflow:hidden;background:var(--card);box-shadow:var(--nm-soft)}
.plate-circ img{width:100%;height:100%;object-fit:cover}

.two-col{display:flex;gap:12px;margin-top:16px}
.big-card{flex:1;position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:3/4;background:#101014;cursor:pointer}
.big-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big-card .lbl{position:absolute;top:16px;left:16px;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:16px;letter-spacing:.4px;padding:9px 16px;border-radius:999px;text-transform:uppercase;z-index:2}

</style>
</head>
<body>

<div class="top">
  <!-- Retour, accueil, profil : les trois restent à l'écran pendant tout le
       scroll (.top est en position:sticky dans assets/style.css). Le retour est
       masqué quand il n'y a rien derrière — un bouton qui ne fait rien est pire
       qu'un bouton absent. -->
  <button id="btnRetour" aria-label="Retour" style="display:none">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a href="https://www.natty-nutrition.com" aria-label="Accueil">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
  </a>
  <a href="profil.html" aria-label="Profil">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5b5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</div>

<div class="wrap">
  <div class="plate-banner" id="plateBanner" style="cursor:pointer">
    <div class="plate-badge" id="formuleBadge">3 PLATS PAR SEMAINE</div>
    <div class="plate-row" id="plateRow">
      <div class="plate-circ"><img src="/assets/img/plate1.jpg" alt=""></div>
      <div class="plate-circ"><img src="/assets/img/plate2.jpg" alt=""></div>
      <div class="plate-circ"><img src="/assets/img/plate3.jpg" alt=""></div>
    </div>
  </div>

  <div class="two-col">
    <a class="big-card" href="coaching.html" style="text-decoration:none">
      <img src="/assets/img/coaching-hero.jpg" alt="">
      <div class="lbl">Coaching</div>
    </a>
    <a class="big-card" href="suivi.html" style="text-decoration:none;background:#0c0c10">
      <img src="/assets/img/suivi-hero.jpg" alt="">
      <div class="lbl">Suivi</div>
    </a>
  </div>
</div>

<script src="/assets/core.js"></script>
<script>
/* La bannière des plats mène à l'offre : c'est le seul endroit de l'app où l'on
   choisit sa formule, et elle en montre justement le contenu. */
(function(){
  var b = document.getElementById('plateBanner');
  if (b) b.addEventListener('click', function(){ Natty.goto('offre.html'); });
  // Retour : seulement s'il y a une page avant dans l'historique.
  var r = document.getElementById('btnRetour');
  if (r && window.history.length > 1) {
    r.style.display = 'flex';
    r.addEventListener('click', function(){ window.history.back(); });
  }
})();
</script>
<script>
async function loadFormule(){
  try{
    var a = await Natty.sbFetch('abonnements?user_id=eq.'+Natty.USER_ID+'&statut=eq.actif&order=date_debut.desc&limit=1&select=formule');
    if (a && a.length){
      var n = a[0].formule==='4_repas' ? 4 : 3;
      document.getElementById('formuleBadge').textContent = n + ' PLATS PAR SEMAINE';
    }
  }catch(e){}
}

(async function(){
  if (!Natty.requireAuth()) return;
  await loadFormule();
})();
</script>
<!-- Reprend l’écran d’attente si une génération de la semaine est en cours
     (elle tourne sur le serveur : elle survit au changement d’écran). -->
<script src="/assets/generation.js"></script>
<!-- La planification de la semaine s'invite ICI, et nulle part ailleurs :
     c'est l'écran d'arrivée de l'app, donc le seul endroit où « à la première
     ouverture de la semaine » veut dire quelque chose. Le module se tait de
     lui-même si la semaine est déjà planifiée, déjà ignorée, ou si une
     génération occupe déjà le plein écran. -->
<script src="/assets/planning.js"></script>
<script>
  if (window.NattyPlanning) NattyPlanning.proposerSiNecessaire();
</script>
<script src="/assets/ajout.js"></script>
<script src="/assets/notifs.js"></script>
<script src="/assets/push.js"></script>
<script src="/assets/nav.js"></script>
</body>
</html>

body { font-family:'Inter',-apple-system,sans-serif; background:#f0f0f3; min-height:100vh; display:flex; align-items:center; justify-content:center; }

<div class="spin"></div>
<script>
/*
  profil.html — page dédiée pas encore construite (mockup design/mockups/PROFIL.png

  vraie page et n'aura plus besoin de rediriger.

  Le "Score nutritionnel" (anneau global, ex-suivi.html) a été retiré de l'écran
  Suivi (demande Pablo) : il doit vivre ici, sous la forme d'un futur "Natty Score"
  / système de points — pas encore défini (voir mockup PROFIL.png : "NATTY SCORE
  96 Pts"). À construire quand ce système de points sera spécifié.
*/
var qs = new URLSearchParams(window.location.search);
qs.set('profil', '1');
window.location.replace('suivi.html?' + qs.toString());
</script>

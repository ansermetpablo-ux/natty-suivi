<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Natty · Suivi</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="/natty-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f4; --panel:#fbfbfc; --card:#ececef; --ink:#101014; --muted:#9d9da8; --icon-mut:#b5b5bd;
  --green:#34c759; --amber:#ff9f0a; --red:#ff3b30;
  --pink-bg:#ffe1e0; --pink-ink:#ff3b30;
  --r-xl:32px; --r-lg:26px; --r-md:20px; --r-full:999px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px}
.top a{display:flex;align-items:center;justify-content:center;color:var(--icon-mut)}
.top svg{width:26px;height:26px}

/* panel wrapping ring + macros + calories, distinct from page bg (matches mockup) */
.score-card{background:var(--panel);border-radius:36px;padding:20px 18px 18px;margin-top:6px;box-shadow:0 16px 34px rgba(20,20,30,.05)}

/* score ring */
.ring-sec{display:flex;flex-direction:column;align-items:center;padding:12px 0 4px;position:relative}
.ring-wrap{position:relative;width:264px;height:264px}
.ring-dot{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:var(--red);z-index:2}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring-pct{font-weight:900;font-size:60px;line-height:1;color:var(--ink);display:flex;align-items:flex-end;letter-spacing:-1px}
.ring-pct span{font-size:26px;font-weight:800;margin-left:2px;margin-bottom:6px}
.ring-lbl{font-size:15px;color:var(--muted)}
.ring-pill{margin-top:6px;padding:7px 18px;border-radius:var(--r-full);font-weight:700;font-size:14px}

/* macro cards */
.macro-row{display:flex;gap:10px;padding:20px 0 0}
.macro-card{flex:1;background:var(--card);border-radius:var(--r-lg);padding:16px 8px 12px;text-align:center}
.macro-em{font-size:24px;line-height:1}
.macro-val{font-weight:900;font-size:24px;margin-top:8px;letter-spacing:-.3px}
.macro-unit{font-size:12px;color:var(--muted);margin-top:1px}
.macro-lbl{font-size:10.5px;font-weight:800;letter-spacing:.3px;margin-top:8px;color:var(--ink)}
.macro-bar{height:3px;background:#dcdce1;border-radius:2px;margin-top:10px;overflow:hidden}
.macro-bar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.macro-obj{font-size:11px;color:var(--muted);margin-top:6px}

/* calories banner */
.cal-band{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r-lg);padding:16px 18px;margin-top:12px}
.cal-band .l{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.cal-band .r{font-weight:700;font-size:14px}
.cal-band .r b{font-weight:900;font-size:16px}

/* meals */
.sec-title{font-weight:900;font-size:25px;margin:28px 0 14px;letter-spacing:-.3px}
.meal-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-lg);padding:12px;margin-bottom:12px;cursor:pointer}
.meal-photo{width:56px;height:56px;border-radius:16px;overflow:hidden;flex:none;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.meal-photo img{width:100%;height:100%;object-fit:cover}
.meal-info{flex:1;min-width:0}
.meal-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:var(--green)}
.meal-right{text-align:right;flex:none}
.meal-date{font-size:11px;color:var(--muted)}
.meal-score{font-weight:900;font-size:19px;color:var(--green)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
</style>
</head>
<body>

<div class="top">
  <a href="https://www.natty-nutrition.com" aria-label="Accueil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
  </a>
  <a href="profil.html" aria-label="Profil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</div>

<div class="wrap">
  <div class="score-card">
    <div class="ring-sec">
      <div class="ring-wrap">
        <svg viewBox="0 0 280 280" width="280" height="280">
          <circle cx="140" cy="140" r="126" fill="none" stroke="#e4e4e8" stroke-width="14"/>
          <circle id="ringArc" cx="140" cy="140" r="126" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="0 791.7" transform="rotate(-90 140 140)"/>
        </svg>
        <div class="ring-dot"></div>
        <div class="ring-mid">
          <div class="ring-pct" id="scorePct">0<span>%</span></div>
          <div class="ring-lbl">Score nutritionnel</div>
          <div class="ring-pill" id="scorePill" style="background:var(--pink-bg);color:var(--pink-ink)">À revoir</div>
        </div>
      </div>
    </div>

    <div class="macro-row">
      <div class="macro-card">
        <div class="macro-em">🥩</div>
        <div class="macro-val"><span id="mProt">–</span></div>
        <div class="macro-unit">g</div>
        <div class="macro-lbl">PROTÉINES</div>
        <div class="macro-bar"><i id="bProt" style="width:0%"></i></div>
        <div class="macro-obj">Obj. <span id="oProt">–</span>g</div>
      </div>
      <div class="macro-card">
        <div class="macro-em">🌾</div>
        <div class="macro-val"><span id="mGluc">–</span></div>
        <div class="macro-unit">g</div>
        <div class="macro-lbl">GLUCIDES</div>
        <div class="macro-bar"><i id="bGluc" style="width:0%"></i></div>
        <div class="macro-obj">Obj. <span id="oGluc">–</span>g</div>
      </div>
      <div class="macro-card">
        <div class="macro-em">🥑</div>
        <div class="macro-val"><span id="mLip">–</span></div>
        <div class="macro-unit">g</div>
        <div class="macro-lbl">LIPIDES</div>
        <div class="macro-bar"><i id="bLip" style="width:0%"></i></div>
        <div class="macro-obj">Obj. <span id="oLip">–</span>g</div>
      </div>
    </div>

    <div class="cal-band">
      <div class="l">⚡ Calories aujourd'hui</div>
      <div class="r"><b id="mCal">–</b> / <span id="oCal">–</span> kcal</div>
    </div>
  </div>

  <div class="sec-title">Mes repas</div>
  <div id="mealsList"><div class="empty">Chargement…</div></div>
</div>

<script src="/assets/core.js"></script>
<script>
var macObj = {p:0,l:0,g:0,c:0}, macAuj = {p:0,l:0,g:0,c:0};

function tagForMeal(m){
  var mac = Natty.calcMac(m.meal_ingredients);
  if (mac.p>25) return {l:'Riche en protéines'};
  var ings=(m.meal_ingredients||[]).map(function(i){return i.name.toLowerCase();});
  if (ings.some(function(n){return /quinoa|lentille|pois chiches|boulgour/.test(n);})) return {l:'Bon équilibre'};
  if (ings.filter(function(n){return /brocoli|carotte|epinard|salade|courgette|poivron|tomate/.test(n);}).length>=2) return {l:'Riche en légumes'};
  return {l:'Très bon choix'};
}
function mealScore(m){
  var mac=Natty.calcMac(m.meal_ingredients), ings=(m.meal_ingredients||[]).length, s=50;
  if(mac.p>20)s+=15; if(ings>=3)s+=15; if(mac.c<600&&mac.c>200)s+=10; if(mac.g>0&&mac.p>0&&mac.l>0)s+=10;
  return Math.min(99,s);
}

function pillFor(pct){
  if (pct>=80) return {t:'Excellent', bg:'#d9f7e1', ink:'#1c9a44'};
  if (pct>=50) return {t:'Bien', bg:'#ffedd1', ink:'#c47600'};
  return {t:'À revoir', bg:'#ffe1e0', ink:'#ff3b30'};
}

function setRing(pct){
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  var circ = 2*Math.PI*126;
  document.getElementById('ringArc').setAttribute('stroke-dasharray', (pct/100*circ).toFixed(1)+' '+circ.toFixed(1));
  document.getElementById('scorePct').innerHTML = pct + '<span>%</span>';
  var p = pillFor(pct);
  var pill = document.getElementById('scorePill');
  pill.textContent = p.t; pill.style.background = p.bg; pill.style.color = p.ink;
}

function setBar(id, val, obj){
  var el = document.getElementById(id);
  if (!obj) { el.style.width='0%'; return; }
  el.style.width = Math.max(0, Math.min(100, Math.round(val/obj*100))) + '%';
}

async function loadOnboardingTargets(){
  // Les colonnes proteines/glucides/lipides/calories n'existent pas réellement dans
  // `onboarding` (malgré ce qu'indiquait la doc) : on calcule côté client depuis
  // poids/tdee, exactement comme index.html (calcMacros) pour rester cohérent.
  try{
    var o = await Natty.sbFetch('onboarding?user_id=eq.'+Natty.USER_ID+'&order=created_at.desc&limit=1&select=poids,tdee');
    if (o && o.length){
      var poids = o[0].poids, tdee = o[0].tdee;
      macObj.p = poids ? Math.round(poids*2) : 0;
      macObj.l = tdee ? Math.round(tdee*0.25/9) : 0;
      macObj.g = tdee ? Math.round(tdee*0.5/4) : 0;
      macObj.c = tdee ? Math.round(tdee) : 0;
    }
  }catch(e){}
}

async function loadTodayMeals(){
  var today = new Date().toISOString().split('T')[0];
  var meals = [];
  try{
    var raw = await Natty.sbFetch('meals?user_id=eq.'+Natty.USER_ID+'&order=created_at.desc&limit=30&select=*');
    meals = await Promise.all(raw.map(async function(m){
      try{ m.meal_ingredients = await Natty.sbFetch('meal_ingredients?meal_id=eq.'+m.id+'&select=*'); }
      catch(e){ m.meal_ingredients = []; }
      return m;
    }));
  }catch(e){}
  macAuj = {p:0,l:0,g:0,c:0};
  meals.filter(function(m){ return (m.meal_date===today) || (m.created_at||'').slice(0,10)===today; })
    .forEach(function(m){ var mac=Natty.calcMac(m.meal_ingredients); macAuj.p+=mac.p; macAuj.l+=mac.l; macAuj.g+=mac.g; macAuj.c+=mac.c; });
  return meals;
}

async function loadScorePct(){
  try{
    var s = await Natty.sbFetch('nutrition_scores?user_id=eq.'+Natty.USER_ID+'&order=calculated_at.desc&limit=1');
    if (s && s.length) return Math.round(((s[0].variety_score||0)+(s[0].quality_score||0)+(s[0].relevance_score||0))/3);
  }catch(e){}
  return 0;
}

function renderMeals(meals){
  var el = document.getElementById('mealsList');
  if (!meals.length){ el.innerHTML = '<div class="empty">Ajoute ton premier repas avec le bouton +</div>'; return; }
  el.innerHTML = meals.slice(0,15).map(function(m){
    var date = new Date(m.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    var tag = tagForMeal(m), sc = mealScore(m);
    var photo = m.photo_url ? '<img src="'+m.photo_url+'" alt="">' : '🍽️';
    return '<div class="meal-card" data-id="'+m.id+'">'
      + '<div class="meal-photo">'+photo+'</div>'
      + '<div class="meal-info"><div class="meal-name">'+m.name+'</div><div class="meal-tag">'+tag.l+'</div></div>'
      + '<div class="meal-right"><div class="meal-date">'+date+'</div><div class="meal-score">'+sc+'</div></div>'
      + '</div>';
  }).join('');
  el.querySelectorAll('.meal-card').forEach(function(card){
    card.addEventListener('click', function(){
      var qs = window.location.search ? window.location.search + '&id=' + card.dataset.id : '?id=' + card.dataset.id;
      window.location.href = 'repas.html' + qs;
    });
  });
}

(async function(){
  if (!Natty.requireAuth()) return;
  await loadOnboardingTargets();
  var meals = await loadTodayMeals();
  document.getElementById('mProt').textContent = macAuj.p||'–';
  document.getElementById('mGluc').textContent = macAuj.g||'–';
  document.getElementById('mLip').textContent = macAuj.l||'–';
  document.getElementById('mCal').textContent = macAuj.c||'–';
  document.getElementById('oProt').textContent = macObj.p||'–';
  document.getElementById('oGluc').textContent = macObj.g||'–';
  document.getElementById('oLip').textContent = macObj.l||'–';
  document.getElementById('oCal').textContent = macObj.c||'–';
  setBar('bProt', macAuj.p, macObj.p);
  setBar('bGluc', macAuj.g, macObj.g);
  setBar('bLip', macAuj.l, macObj.l);
  setRing(await loadScorePct());
  renderMeals(meals);
})();
</script>
<script src="/assets/nav.js"></script>
</body>
</html>
